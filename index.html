function sigmoid(z){return z>=0?1/(1+Math.exp(-z)):(function(e){return e/(1+e);})(Math.exp(z));}
// Standardize columns; returns {Z, mean, sd}. Constant columns get sd=1 (drop-through).
function standardize(X){
  var n=X.length, d=X[0].length, mean=[],sd=[];
  for(var j=0;j<d;j++){var m=0;for(var i=0;i<n;i++)m+=X[i][j];m/=n;mean.push(m);
    var v=0;for(i=0;i<n;i++){var e=X[i][j]-m;v+=e*e;}v=Math.sqrt(v/n)||1;sd.push(v);}
  var Z=X.map(function(row){return row.map(function(x,j){return (x-mean[j])/sd[j];});});
  return {Z:Z,mean:mean,sd:sd};
}
// Logistic regression via batch gradient descent + L2. Returns weights (incl. bias at [0]).
function logisticFit(Z,y,opts){
  opts=opts||{}; var iter=opts.iter||200, lr=opts.lr||0.4, l2=opts.l2||1.0; // 200 iters keeps background training fast
  var n=Z.length, d=Z[0].length, w=new Array(d+1).fill(0);
  for(var it=0;it<iter;it++){
    var g=new Array(d+1).fill(0);
    for(var i=0;i<n;i++){
      var z=w[0]; for(var j=0;j<d;j++)z+=w[j+1]*Z[i][j];
      var p=sigmoid(z), err=p-y[i];
      g[0]+=err; for(j=0;j<d;j++)g[j+1]+=err*Z[i][j];
    }
    w[0]-=lr*g[0]/n;
    for(j=0;j<d;j++)w[j+1]-=lr*(g[j+1]/n + l2*w[j+1]/n); // L2 not on bias
  }
  return w;
}
function logisticPredictRaw(w,x,mean,sd){ // x = raw feature row
  var z=w[0]; for(var j=0;j<x.length;j++)z+=w[j+1]*((x[j]-mean[j])/sd[j]); return sigmoid(z);
}
// Isotonic regression (Pool Adjacent Violators) on (pred,label) pairs -> monotone mapping.
function isotonic(pairs){ // pairs: [{x:pred, y:label}], returns sorted breakpoints {x,y}
  var a=pairs.slice().sort(function(p,q){return p.x-q.x;});
  var blocks=a.map(function(p){return {sumY:p.y,n:1,x:p.x,val:p.y};});
  var i=0;
  while(i<blocks.length-1){
    if(blocks[i].val>blocks[i+1].val){
      blocks[i].sumY+=blocks[i+1].n?blocks[i+1].sumY:0; blocks[i].n+=blocks[i+1].n;
      blocks[i].val=blocks[i].sumY/blocks[i].n; blocks[i].x=Math.max(blocks[i].x,blocks[i+1].x);
      blocks.splice(i+1,1); if(i>0)i--;
    } else i++;
  }
  return blocks.map(function(b){return {x:b.x,y:b.val};});
}
function applyIso(map,p){
  if(!map||!map.length)return p;
  if(p<=map[0].x)return map[0].y;
  if(p>=map[map.length-1].x)return map[map.length-1].y;
  for(var i=0;i<map.length-1;i++){ if(p>=map[i].x&&p<=map[i+1].x){
    var t=(p-map[i].x)/((map[i+1].x-map[i].x)||1); return map[i].y+t*(map[i+1].y-map[i].y);
  }}
  return p;
}
// 5-fold CV producing OUT-OF-FOLD predictions (never predict a bet with a model
// that trained on it). Deterministic fold assignment (index % k) ‚Äî no RNG needed.
function kFoldOOF(X,y,k){
  var n=X.length, oof=new Array(n).fill(null);
  for(var f=0;f<k;f++){
    var Xtr=[],ytr=[],idxTe=[];
    for(var i=0;i<n;i++){ if(i%k===f)idxTe.push(i); else {Xtr.push(X[i]);ytr.push(y[i]);} }
    if(Xtr.length<20||idxTe.length===0)continue;
    var st=standardize(Xtr), w=logisticFit(st.Z,ytr);
    idxTe.forEach(function(ix){ oof[ix]=logisticPredictRaw(w,X[ix],st.mean,st.sd); });
  }
  return oof;
}
// ¬ß2 gate: calibration (¬±4pp per bucket>=30), sample (>=300, train>=200), CLV backtest (>=0).
// Calibration is tested on the ISOTONIC-ADJUSTED out-of-fold predictions ‚Äî i.e. the exact
// probabilities we ship live ‚Äî not the raw logistic, so the gate validates the deliverable.
function moduleGate(recs,oof,iso){
  var y=recs.map(function(r){return r.result==='WIN'?1:0;});
  // calibration buckets on calibrated OOF
  var buck={}; var trainN=0;
  for(var i=0;i<oof.length;i++){ if(oof[i]==null)continue; trainN++;
    var cal=iso?applyIso(iso,oof[i]):oof[i];
    var b=Math.min(9,Math.floor(cal*10)); (buck[b]=buck[b]||{n:0,pred:0,hit:0});
    buck[b].n++; buck[b].pred+=cal; buck[b].hit+=y[i];
  }
  // v13.1 ¬ß2.1: predicted vs actual per bucket. Two deliberate, disclosed deviations from
  // the spec's literal "every bucket within +/-4pp", both to avoid FALSE NEGATIVES that
  // would trap a genuinely-calibrated model on paper (which defeats "come off paper"):
  //   (1) tolerance is +/-4pp WIDENED by the bucket's binomial SE (z=1.96) ‚Äî a flat 4pp at
  //       n=30 is ~half the ~9pp sampling-noise band and perversely passes always-50% noise
  //       while failing real signal (verified).
  //   (2) allow AT MOST ONE supported bucket to miss ‚Äî isotonic guarantees block-level, not
  //       decile-level, calibration, so one sparse middle decile is often just noise (a truly
  //       calibrated K-under model had 7/8 clean + one sparse miss). Two+ misses still FAIL ‚Äî
  //       that's real miscalibration, not noise. Require >=3 supported buckets to judge at all.
  var judged=0, fails=0;
  Object.keys(buck).forEach(function(b){ var c=buck[b]; if(c.n<CALIB_BUCKET_MINN)return; judged++;
    var act=c.hit/c.n, dev=Math.abs(c.pred/c.n - act);
    var se=1.96*Math.sqrt(act*(1-act)/c.n);
    if(dev > CALIB_BUCKET_TOL + se)fails++; });
  var calibOk = judged>=3 && fails<=1;
  // CLV backtest
  var clvs=recs.map(function(r){return r.clv;}).filter(function(v){return v!=null;});
  var clvAvg=clvs.length?clvs.reduce(function(a,b){return a+b;},0)/clvs.length:null;
  var clvPos=clvs.length?clvs.filter(function(v){return v>0;}).length/clvs.length:null;
  var clvOk=clvs.length>=CLV_KILL_N && clvAvg>=0 && clvPos>=0.5;
  var sampleOk=recs.length>=TRAIN_MIN_N && trainN>=MODEL_MIN_TRAIN;
  return {pass:sampleOk&&calibOk&&clvOk, sampleOk:sampleOk, calibOk:calibOk, clvOk:clvOk,
    n:recs.length, trainN:trainN, buckets:buck, clvAvg:clvAvg, clvPos:clvPos, clvN:clvs.length};
}
// Train every module with enough data; compute REAL_MONEY_MODULES from the gates.
// NON-BLOCKING: on the critical path (force falsy) this only LOADS the cache ‚Äî it never
// runs the logistic loops, so the page load can never hang on training. If the cache is
// cold/stale it schedules the heavy train in the BACKGROUND (see scheduleTrain) and
// returns immediately with whatever (possibly stale) cache exists.
var TRAINING=false;
function trainModels(force){
  var sig=getAllLoggedPicks().filter(function(r){return r.result==='WIN'||r.result==='LOSS';}).length;
  var cached=sg('models_cache',null);
  if(cached&&cached.models){ MODELS=cached.models; REAL_MONEY_MODULES=cached.real||[]; }
  if(!force){
    if(cached&&cached.sig===sig) return MODELS;   // warm cache -> instant, done
    scheduleTrain();                              // cold/stale -> train later, off the critical path
    return MODELS;                                // this load uses stale/empty cache (safe: paper)
  }
  return trainModelsNow(sig);
}
// The heavy work. Capped rows/iterations keep even a full retrain to ~1-2s in-browser.
function trainModelsNow(sig){
  var all=getAllLoggedPicks().filter(function(r){return r.result==='WIN'||r.result==='LOSS';});
  if(sig==null)sig=all.length;
  var byMod={};
  all.forEach(function(r){ var m=r.module||r.prop_type; if(!m)return; (byMod[m]=byMod[m]||[]).push(r); });
  MODELS={}; var passed=[];
  Object.keys(byMod).forEach(function(m){
    var recs=byMod[m];
    // cap to most-recent 2500 by date so a huge module can't blow up training time
    if(recs.length>2500){ recs=recs.slice().sort(function(a,b){return (a.date<b.date?1:-1);}).slice(0,2500); }
    if(recs.length<TRAIN_MIN_N){ MODELS[m]={gate:{pass:false,sampleOk:false,n:recs.length,reason:'n<'+TRAIN_MIN_N}}; return; }
    var X=recs.map(featRow), y=recs.map(function(r){return r.result==='WIN'?1:0;});
    var oof=kFoldOOF(X,y,5);
    var oofPairs=[]; for(var i=0;i<oof.length;i++)if(oof[i]!=null)oofPairs.push({x:oof[i],y:y[i]});
    var iso=isotonic(oofPairs);
    var gate=moduleGate(recs,oof,iso);
    var st=standardize(X), w=logisticFit(st.Z,y);
    MODELS[m]={weights:w,mean:st.mean,sd:st.sd,iso:iso,gate:gate,feats:FEAT_NAMES};
    if(gate.pass)passed.push(m);
  });
  REAL_MONEY_MODULES=passed;
  try{ss('models_cache',{sig:sig,models:MODELS,real:passed});}catch(e){}
  return MODELS;
}
// Run the heavy train after the current render, so the UI shows first. One at a time.
function scheduleTrain(){
  if(TRAINING)return; TRAINING=true;
  setTimeout(function(){
    try{ trainModelsNow(null); buildModelStats(); if(D)renderPicks(); if(typeof toast==='function')toast('Models trained'); }
    catch(e){ console.warn('bg train',e.message); }
    finally{ TRAINING=false; }
  }, 50);
}
// Calibrated p_model for a LIVE pick from its module model. null if no calibrated model.
function modelProb(moduleKey,featObj){
  var M=MODELS[moduleKey]; if(!M||!M.weights)return null;
  var raw=logisticPredictRaw(M.weights,featRow(featObj),M.mean,M.sd);
  return applyIso(M.iso,raw);
}
function moduleIsReal(moduleKey){ return REAL_MONEY_MODULES.indexOf(moduleKey)>=0; }
// v13.1 ¬ß4 daily loss-stop: realized P/L (units) on REAL settled picks dated today.
function dailyRealPL(){
  var t=todayStr(),pl=0;
  getAllLoggedPicks().forEach(function(r){
    if(r.paper!==false)return; if(r.date!==t)return;
    if(r.result==='WIN')pl+=americanProfit(r.odds); else if(r.result==='LOSS')pl-=1;
  });
  return pl;
}
function lossStopTripped(){ return dailyRealPL() <= -DAILY_LOSS_STOP; }

// v13.1 ¬ß0 FAILSAFE: rebuild settlement rows from a pasted SETTLEMENT LOG text block
// (columns: date|player|prop|line|side|odds|grade|result|graded_stat|closing_odds|clv).
// Only creates rows that don't already exist. Reconstructed rows are feature-THIN
// (label + CLV + line + side + odds) ‚Äî enough to train calibration + the CLV backtest,
// not the full feature model. Returns {added, skipped, bad}.
function ingestSettlementLog(text){
  var lines=(text||'').split(/\r?\n/), added=0,skipped=0,bad=0;
  lines.forEach(function(ln){
    if(!/\|/.test(ln))return;
    var c=ln.split('|').map(function(x){return x.trim();});
    if(c.length<8)return;
    if(/^date$/i.test(c[0])||!/^\d{4}-\d{2}-\d{2}$/.test(c[0]))return; // header/non-data
    var date=c[0],player=c[1],prop=c[2],line=parseFloat(c[3]),side=(c[4]||'').toLowerCase(),
        odds=parseInt(c[5],10),result=(c[7]||'').toUpperCase(),
        closing=c[9]!=null&&c[9]!==''&&c[9]!=='null'?parseInt(c[9],10):null,
        clv=c[10]!=null&&c[10]!==''&&c[10]!=='null'?parseFloat(c[10]):null;
    if(isNaN(line)||isNaN(odds)||!/(WIN|LOSS|PUSH|DNP|VOID)/.test(result)){bad++;return;}
    var dir=side.indexOf('under')>=0?'under':'over';
    var mod=(prop==='strikeouts')?('pitcher_strikeouts_'+(dir==='under'?'Under':'Over')):('batter_'+prop);
    var id='ingest_'+date+'_'+(player||'').replace(/\W+/g,'')+'_'+prop+'_'+line+'_'+dir;
    var key='he9_pick_'+id;
    if(localStorage.getItem(key)){skipped++;return;}
    if(clv==null&&closing!=null&&odds!=null)clv=Math.round((impliedProb(closing)-impliedProb(odds))*1000)/1000;
    var rec={id:id,date:date,player_name:player,prop_type:prop,line:line,direction:dir,
      odds:odds,grade:(c[6]||null),result:result,actual_stat:(c[8]!==''&&c[8]!=='null'?parseFloat(c[8]):null),
      closing_odds:closing,clv:clv,module:mod,paper:true,reingested:true,
      // thin features: only line known; others neutral so they don't bias the model
      game_total:null,iso:null,platoon_value:0,matchup_value:0,luck_gap:null,ten_game_trend:null};
    try{localStorage.setItem(key,JSON.stringify(rec));added++;}catch(e){bad++;}
  });
  if(added){trainModels(true);buildModelStats();if(D)renderPicks();} if(typeof updDataCount==="function")updDataCount();
  return {added:added,skipped:skipped,bad:bad};
}
function promptIngestLog(){
  var t=prompt('Paste a SETTLEMENT LOG block (the "date | player | prop | line | side | odds | grade | result | ..." lines from any prior report). Rows not already stored will be re-ingested.');
  if(!t)return;
  var r=ingestSettlementLog(t);
  toast('Re-ingest: +'+r.added+' rows ('+r.skipped+' existed, '+r.bad+' skipped)');
}
// v13.1: EXPORT the full settled-bet history to a JSON file. This is the snapshot the
// developer reads to verify/improve the model against REAL data, and a backup against a
// localStorage wipe. Live storage stays in localStorage ‚Äî this is a downloadable copy.
function exportData(){
  var picks=getAllLoggedPicks();
  var blob={app:'hitters-edge',version:'v13.1',exported_at:new Date().toISOString(),
    count:picks.length, picks:picks, model_stats:sg('model_stats',null),
    real_money_modules:(REAL_MONEY_MODULES||[])};
  var url=URL.createObjectURL(new Blob([JSON.stringify(blob)],{type:'application/json'}));
  var a=document.createElement('a'); a.href=url; a.download='hitters-edge-data_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast('Exported '+picks.length+' picks ‚Äî save it in your Hitters Edge folder');
}
// v13.1: IMPORT a previously-exported JSON (or another browser's) ‚Äî merges rows not
// already present, then retrains. Restores history after a wipe / moves it between devices.
function importDataFile(input){
  var f=input.files&&input.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result); var arr=d.picks||(Array.isArray(d)?d:[]); var added=0,skip=0,bad=0;
      arr.forEach(function(rec){ if(!rec||!rec.id){bad++;return;} var k='he9_pick_'+rec.id;
        if(localStorage.getItem(k)){skip++;return;} try{localStorage.setItem(k,JSON.stringify(rec));added++;}catch(e){bad++;} });
      if(added){trainModels(true);buildModelStats();if(D)renderPicks();} if(typeof updDataCount==="function")updDataCount();
      toast('Imported +'+added+' ('+skip+' existed, '+bad+' skipped)');
    }catch(e){toast('Import failed: '+e.message);}
    input.value='';
  };
  r.readAsText(f);
}

// Aggregate per bucket: w/t (settled, excl DNP+Push+Void), units P/L, and odds sum
// for ROI and average odds. ROI is the headline metric.
function buildModelStats(){
  var all=getAllLoggedPicks();
  var s={total_generated:all.length,total_resolved:0,total_pending:0,total_dnp:0,total_push:0,
    by_grade:{},by_score_bucket:{},by_prop_type:{},by_matchup_tag:{},by_platoon:{},
    by_regression_due:{},by_trend:{},by_direction:{},by_prop_dir:{},by_clv:{},by_event:{},by_odds_bucket:{},by_overall:{},
    by_grade_prop:{},clv_by_prop:{},
    by_module:{},clv_by_module:{},calib:{},calib_n:0,edge_sum:0,edge_n:0,fired_n:0,gated_n:0, // v13
    under_bt:{all:{w:0,t:0,p:0},by_grade:{},by_prop:{}},
    bench:{n:0,rec:0,blind_under:0,always_over:0,rec_over:0,rec_under:0,tcut:70},
    over_n:0,under_n:0,clv_sum:0,clv_n:0,clv_pos:0,clv_since:null,last_updated:new Date().toISOString()};
  function bump(o,key,p){
    if(key==null||key==='')return;
    if(!o[key])o[key]={w:0,t:0,u:0,os:0,on:0}; // w=wins, t=settled, u=unit P/L, os/on=odds avg
    o[key].t++;
    if(p.result==='WIN'){o[key].w++;o[key].u+=americanProfit(p.odds);}else{o[key].u+=-1;}
    if(p.odds!=null){o[key].os+=p.odds;o[key].on++;}
  }
  all.forEach(function(p){
    if(p.result==='PENDING'){s.total_pending++;return;}
    if(p.result==='DNP'||p.result==='VOID'){s.total_dnp++;return;} // excluded from denominators
    if(p.result==='PUSH'){s.total_push++;return;}                  // excluded from denominators
    s.total_resolved++; // WIN or LOSS only
    bump(s.by_grade,p.grade,p);
    bump(s.by_score_bucket,scoreBucket(p.score),p);
    bump(s.by_prop_type,p.prop_type,p);
    bump(s.by_matchup_tag,p.matchup_tag,p);
    bump(s.by_platoon,p.platoon,p);
    bump(s.by_regression_due,p.regression_due?'true':'false',p);
    bump(s.by_trend,p.ten_game_trend,p);
    var dir=p.direction||'over';
    bump(s.by_direction,dir,p); if(dir==='under')s.under_n++;else s.over_n++;
    bump(s.by_prop_dir,p.prop_type+'|'+dir,p);
    bump(s.by_event,eventClass(p.prop_type,p.line),p);
    bump(s.by_odds_bucket,oddsBucket(p.odds),p);
    bump(s.by_overall,'all',p);
    bump(s.by_grade_prop,p.grade+'|'+p.prop_type,p); // v12 P1: per grade-x-prop calibration
    // v13: per-module ROI/record (side-aware for strikeouts) + fire/gate counts
    bump(s.by_module,p.module||p.prop_type,p);
    if(p.fired)s.fired_n++;else s.gated_n++;
    if(p.edge!=null){s.edge_sum+=p.edge;s.edge_n++;}
    // v13 ¬ß3.2 calibration curve: predicted p_model vs actual hit, bucketed by 10%.
    if(p.p_model!=null){
      var cb=Math.min(9,Math.floor(p.p_model*10)); // 0..9 -> "0-10%".."90-100%"
      var c=s.calib[cb]=s.calib[cb]||{n:0,pred:0,hit:0};
      c.n++;c.pred+=p.p_model;if(p.result==='WIN')c.hit++;s.calib_n++;
    }
    if(p.clv!=null){
      s.clv_sum+=p.clv;s.clv_n++;if(p.clv>0)s.clv_pos++;bump(s.by_clv,p.clv>=0?'pos':'neg',p);
      if(!s.clv_since||p.date<s.clv_since)s.clv_since=p.date;
      var cp=s.clv_by_prop[p.prop_type]=s.clv_by_prop[p.prop_type]||{sum:0,n:0,pos:0}; // v12 P5
      cp.sum+=p.clv;cp.n++;if(p.clv>0)cp.pos++;
      var cm=s.clv_by_module[p.module||p.prop_type]=s.clv_by_module[p.module||p.prop_type]||{sum:0,n:0,pos:0}; // v13 ¬ß4
      cm.sum+=p.clv;cm.n++;if(p.clv>0)cm.pos++;
    }
    // UNDER backtest: would fading THIS Over (taking the Under) have hit? (hit-rate only ‚Äî no historical Under odds)
    if(dir==='over'&&p.actual_stat!=null){
      var uw=p.actual_stat<p.line, push=p.actual_stat===p.line;
      var uadd=function(o,k){if(k==null||k==='')return;if(!o[k])o[k]={w:0,t:0,p:0};if(push){o[k].p++;}else{o[k].t++;if(uw)o[k].w++;}};
      if(push)s.under_bt.all.p++;else{s.under_bt.all.t++;if(uw)s.under_bt.all.w++;}
      uadd(s.under_bt.by_grade,p.grade);
      uadd(s.under_bt.by_prop,p.prop_type);
      // Mirror-vs-prediction benchmark (excl push). Over legs use real odds; Under legs assume -120.
      if(!push){
        var UP=100/120, overWin=p.result==='WIN', b=s.bench; b.n++;
        b.always_over+=overWin?americanProfit(p.odds):-1;     // (c) always Over
        b.blind_under+=uw?UP:-1;                              // (b) blind Under @ -120
        if(p.score>=b.tcut){b.rec+=overWin?americanProfit(p.odds):-1;b.rec_over++;} // (a) score-driven side
        else{b.rec+=uw?UP:-1;b.rec_under++;}
      }
    }
  });
  try{localStorage.setItem('he9_model_stats',JSON.stringify(s));}catch(e){}
  MSTATS=s;return s;
}

// ‚îÄ‚îÄ MAIN LOADER ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
async function loadAll(){
  setP('Loading...');
  document.getElementById('pg-picks').innerHTML='<div class="load"><div class="spnr"></div>Loading props...</div>';

  // Step 1: Odds API
  setP('Fetching odds...');
  var creditsAtStart=ODDS_BUDGET.remaining; // v12: measure this load's credit cost
  var oddsGames=await loadOddsGames();
  if(!oddsGames||!oddsGames.length){
    document.getElementById('pg-picks').innerHTML='<div style="padding:10px"><div class="card" style="border-color:var(--red)"><div style="color:var(--red);font-weight:700;margin-bottom:8px">&#9888; Cannot reach The Odds API</div><button class="btn" onclick="loadAll()">Retry</button></div></div>';
    setP('Error');return;
  }

  var now=new Date();
  var oddsAsOf=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';
  var upcoming=[],live=[],finished=[];
  oddsGames.forEach(function(g){
    var ct=new Date(g.commence_time),el=now-ct;
    if(ct>now)upcoming.push(g);
    else if(el<4*60*60*1000)live.push(g);
    else finished.push(g);
  });

  // Totals
  var totals=[];
  oddsGames.forEach(function(g){
    var bk=(g.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(g.bookmakers||[])[0];
    if(!bk)return;
    var tot=(bk.markets||[]).find(function(m){return m.key==='totals';});
    if(!tot)return;
    var ov=(tot.outcomes||[]).find(function(o){return o.name==='Over';});
    var un=(tot.outcomes||[]).find(function(o){return o.name==='Under';});
    if(!ov||!un)return;
    totals.push({game:g.away_team+' @ '+g.home_team,time:fmtTime(g.commence_time),line:ov.point,overOdds:ov.price,underOdds:un.price,park:PARKS[g.home_team]||100,isUpcoming:new Date(g.commence_time)>now});
  });

  // Game total lookup (run-environment tag) ‚Äî 'away @ home' -> total line
  var totalMap={};
  totals.forEach(function(t){totalMap[t.game]=t.line;});
  // Moneyline lookup (pitcher exit-risk) ‚Äî team name -> american price. h2h already fetched.
  // Keyed on Odds API team names, same names used in og2.home_team/away_team below.
  var mlMap={};
  oddsGames.forEach(function(g){
    var bk=(g.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(g.bookmakers||[])[0];
    if(!bk)return;
    var h2h=(bk.markets||[]).find(function(m){return m.key==='h2h';});
    if(!h2h)return;
    (h2h.outcomes||[]).forEach(function(o){if(o.name&&o.price!=null)mlMap[o.name]=o.price;});
  });

  // Step 2: MLB schedule for pitchers + lineups
  setP('Checking pitchers and lineups...');
  var mlbGames=await loadMLBSchedule();

  // v12 P3: persist posted lineup spots (playerId -> {spot,date}) so early cards can
  // surface PROJECTED candidates for spot-gated props (RBI, runs) before lineups lock.
  var spotCache=sg('spots',{});
  mlbGames.forEach(function(mg){
    (mg.awayLineup||[]).concat(mg.homeLineup||[]).forEach(function(pl){
      if(pl.id&&pl.spot)spotCache[pl.id]={s:pl.spot,d:todayStr()};
    });
  });
  ss('spots',spotCache);

  // Statcast (Baseball Savant) ‚Äî cached once per day, keyed by MLB player_id
  setP('Loading Statcast profiles...');
  var statcast=await loadStatcast();

  // Weather (fail-safe ‚Äî empty map if the key is inactive or any call fails)
  setP('Loading weather...');
  var weather={};
  try{weather=await loadWeather(upcoming);}catch(e){weather={};}

  // Build lookup map: away_key+home_key -> mlb game
  var mlbMap={};
  mlbGames.forEach(function(mg){mlbMap[mg.awayKey+'_'+mg.homeKey]=mg;});

  // Load all pitcher stats + recent starts
  var pitcherStatCache={};
  var pitcherL3Cache={};
  var aceInfo={}; // eventId -> {homeIsAce, awayIsAce, ...}

  for(var gi=0;gi<upcoming.length;gi++){
    var og=upcoming[gi];
    var awayKey=og.away_team.split(' ').pop().toLowerCase();
    var homeKey=og.home_team.split(' ').pop().toLowerCase();
    var mg=mlbMap[awayKey+'_'+homeKey];
    if(!mg){aceInfo[og.id]={homeIsAce:false,awayIsAce:false};continue;}

    var homePid=mg.homePitcher.id,awayPid=mg.awayPitcher.id;
    if(homePid&&!pitcherStatCache[homePid]){
      pitcherStatCache[homePid]=await getPitcherStats(homePid);
      pitcherL3Cache[homePid]=await getPitcherRecentStarts(homePid,3);
      await slp(200);
    }
    if(awayPid&&!pitcherStatCache[awayPid]){
      pitcherStatCache[awayPid]=await getPitcherStats(awayPid);
      pitcherL3Cache[awayPid]=await getPitcherRecentStarts(awayPid,3);
      await slp(200);
    }
    var homePst=homePid?pitcherStatCache[homePid]:null;
    var awayPst=awayPid?pitcherStatCache[awayPid]:null;
    aceInfo[og.id]={
      homeIsAce:!!(homePst&&homePst.isAce),
      awayIsAce:!!(awayPst&&awayPst.isAce),
      homePitName:mg.homePitcher.name,awayPitName:mg.awayPitcher.name,
      homePitId:homePid,awayPitId:awayPid,
      homeERA:homePst&&homePst.era,awayERA:awayPst&&awayPst.era,
      homePitSt:homePst,awayPitSt:awayPst,
      homePitL3:homePid?pitcherL3Cache[homePid]:null,
      awayPitL3:awayPid?pitcherL3Cache[awayPid]:null,
      lineupPosted:mg.lineupPosted,
      awayLineup:mg.awayLineup,homeLineup:mg.homeLineup,
      awayTeam:mg.awayTeam,homeTeam:mg.homeTeam,venue:mg.venue,gamePk:mg.gamePk
    };
  }

  // Build ace notes
  var aceNotes=[];
  upcoming.forEach(function(og){
    var ai=aceInfo[og.id]||{};
    if(ai.homeIsAce)aceNotes.push({team:og.away_team,pitcher:ai.homePitName,era:ai.homeERA});
    if(ai.awayIsAce)aceNotes.push({team:og.home_team,pitcher:ai.awayPitName,era:ai.awayERA});
  });

  // v13.1: use CACHED models only on the critical path (instant ‚Äî never blocks the load).
  // If the cache is cold (first load after new bets settle), we skip live calibration THIS
  // load (picks fall back to the uncalibrated baseline = all paper, which is safe) and train
  // in the BACKGROUND after render, so the next load is fully calibrated. Training the
  // logistic on thousands of rows synchronously was what made the page hang.
  try{trainModels();}catch(e){console.warn('trainModels',e.message);} // returns instantly if cache warm; see cache-gate below
  // Step 3: Props per game
  setP('Loading props...');
  var rawPicks=[];
  var batterCache={};
  var h2hCache={}; // career batter-vs-pitcher, keyed by batterId_pitcherId
  var rbiDiag={cand:0,noSpot:0,badSpot:0,form:0,env:0,plat:0,pass:0}; // v12 P3: why-empty diagnostics
  // Line-movement store: first odds this app saw today for each pick (per browser).
  // The Odds API free tier has no true "opening line", so we anchor on first-seen.
  var openLines=sg('open_'+todayStr(),{});
  // Track pitcher K games for conflict check
  var kPickGames={}; // game string -> true if K over exists

  for(var gi2=0;gi2<upcoming.length;gi2++){
    var og2=upcoming[gi2];
    var park=PARKS[og2.home_team]||100;
    var ai2=aceInfo[og2.id]||{homeIsAce:false,awayIsAce:false};
    setP('Props '+(gi2+1)+'/'+upcoming.length+': '+og2.away_team.split(' ').pop()+' @ '+og2.home_team.split(' ').pop());

    var pd=await loadEventProps(og2.id);
    if(!pd||!pd.bookmakers||!pd.bookmakers.length){await slp(150);continue;}

    // v13 ¬ß3.1/¬ß5: keep EVERY book (regions=us returns ~8 at no extra credit cost),
    // grouped by player/market/line, so we can de-vig a consensus fair price and
    // line-shop the best number. raw[player][mkt] = { rows:[{book,line,over,under}] }
    var raw={};
    (pd.bookmakers||[]).forEach(function(b){
      (b.markets||[]).forEach(function(mkt){
        (mkt.outcomes||[]).forEach(function(o){
          if(!o.description)return;
          var n=o.description;
          if(!raw[n])raw[n]={};
          if(!raw[n][mkt.key])raw[n][mkt.key]={};
          var lk=String(o.point);
          var row=raw[n][mkt.key][b.key+'|'+lk] || (raw[n][mkt.key][b.key+'|'+lk]={book:b.key,line:o.point,over:null,under:null});
          if(o.name==='Over')row.over=o.price;
          if(o.name==='Under')row.under=o.price;
        });
      });
    });

    // Finalize: pick the PRIMARY line (most books quoting it two-way, else most-quoted),
    // compute p_market (de-vig consensus) + best line-shopped price per side.
    var pmap={};
    Object.keys(raw).forEach(function(n){
      pmap[n]={};
      Object.keys(raw[n]).forEach(function(mk){
        var rows=Object.keys(raw[n][mk]).map(function(kk){return raw[n][mk][kk];});
        var byLine={};
        rows.forEach(function(r){var lk=String(r.line);(byLine[lk]=byLine[lk]||[]).push(r);});
        var primary=null,bestTwoWay=-1,bestCount=-1;
        Object.keys(byLine).forEach(function(lk){
          var arr=byLine[lk];
          var tw=arr.filter(function(r){return r.over!=null&&r.under!=null;}).length;
          if(tw>bestTwoWay||(tw===bestTwoWay&&arr.length>bestCount)){bestTwoWay=tw;bestCount=arr.length;primary=lk;}
        });
        if(primary==null)return;
        var pRows=byLine[primary], line=pRows[0].line;
        var fair=marketFairOver(pRows,line);            // consensus no-vig fair prob of Over (or null)
        var bo=bestPrice(pRows,line,'Over'), bu=bestPrice(pRows,line,'Under');
        pmap[n][mk]={
          line:line,
          over:bo?bo.price:null, under:bu?bu.price:null,      // backward-compat: best available
          bestOver:bo, bestUnder:bu,
          pMarketOver:fair?fair.p_over:null, nBooks:fair?fair.nBooks:0,
          books:pRows
        };
      });
    });

    var gameStr=og2.away_team+' @ '+og2.home_team;
    var playerNames=Object.keys(pmap);

    for(var pi=0;pi<playerNames.length;pi++){
      var pName=playerNames[pi];
      var mkts=pmap[pName];
      var mktKeys=Object.keys(mkts);
      var isPitcher=mktKeys.length===1&&mktKeys[0]==='pitcher_strikeouts';

      // Load batter stats
      if(!isPitcher&&!batterCache.hasOwnProperty(pName)){
        batterCache[pName]=await getBatterStats(pName);
        await slp(150);
      }
      var bStats=isPitcher?null:(batterCache[pName]||null);

      // Get pitcher stats for K props
      var pitSt=null,pitL3=null;
      if(isPitcher){
        if(ai2.homePitName===pName){pitSt=ai2.homePitSt;pitL3=ai2.homePitL3;}
        else if(ai2.awayPitName===pName){pitSt=ai2.awayPitSt;pitL3=ai2.awayPitL3;}
      }

      // Resolve this batter's side + opposing probable pitcher.
      // Team match (from MLB currentTeam) is primary so this works pre-lineup;
      // lineup membership is the fallback and also gives the batting-order spot.
      var oppPit=null,oppPitL3=null,oppPitName='',oppPitId=null,batSide='';
      var lineupSpot=null;
      var lineupConfirmed=ai2.lineupPosted||false;
      if(!isPitcher&&bStats){
        var awaySpot=(ai2.awayLineup||[]).find(function(p){return p.name===pName;});
        var homeSpot=(ai2.homeLineup||[]).find(function(p){return p.name===pName;});
        if(bStats.team&&bStats.team===ai2.awayTeam)batSide='away';
        else if(bStats.team&&bStats.team===ai2.homeTeam)batSide='home';
        else if(awaySpot)batSide='away';
        else if(homeSpot)batSide='home';
        if(batSide==='away'){oppPit=ai2.homePitSt;oppPitL3=ai2.homePitL3;oppPitName=ai2.homePitName||'';oppPitId=ai2.homePitId;}
        else if(batSide==='home'){oppPit=ai2.awayPitSt;oppPitL3=ai2.awayPitL3;oppPitName=ai2.awayPitName||'';oppPitId=ai2.awayPitId;}
        if(awaySpot)lineupSpot=awaySpot.spot;
        else if(homeSpot)lineupSpot=homeSpot.spot;
      }
      // v12 P3: no posted lineup for this game yet -> use the player's last posted
      // spot (<= SPOT_CACHE_DAYS old) as a PROJECTED spot. Never overrides a posted
      // lineup: if lineups ARE posted and the player isn't in them, he stays spotless.
      var spotProjected=false;
      if(!isPitcher&&bStats&&!lineupConfirmed&&!lineupSpot&&bStats.playerId){
        var scv=spotCache[bStats.playerId];
        if(scv&&daysSince(scv.d)<=SPOT_CACHE_DAYS){lineupSpot=scv.s;spotProjected=true;}
      }

      // Ace filter for batters ‚Äî skip ONLY if THIS batter's opposing SP is an ace
      // (spec: the other team's batters in the same game stay eligible). If the
      // batter's side can't be resolved, fall back to the conservative game-level rule.
      if(!isPitcher&&bStats){
        if(oppPit){ if(oppPit.isAce) continue; }
        else if(ai2.homeIsAce||ai2.awayIsAce){ continue; }
      }

      // Platoon: split is keyed by the opposing pitcher's hand (vs LHP / vs RHP).
      // Computed once per batter ‚Äî same for all of that batter's props.
      var oppThrows=oppPit?(oppPit.throws||''):'';
      var pm=null;
      if(!isPitcher&&bStats&&bStats.splitVsL&&bStats.splitVsR&&(oppThrows==='L'||oppThrows==='R')){
        var tonSpl=(oppThrows==='L')?bStats.splitVsL:bStats.splitVsR;
        var othSpl=(oppThrows==='L')?bStats.splitVsR:bStats.splitVsL;
        pm=platoonMod(tonSpl,othSpl);
      }

      // Career head-to-head vs tonight's starter (one MLB call per batter+pitcher pair).
      var h2h=null;
      if(!isPitcher&&bStats&&bStats.playerId&&oppPitId){
        var hk=bStats.playerId+'_'+oppPitId;
        if(!h2hCache.hasOwnProperty(hk)){h2hCache[hk]=await getH2H(bStats.playerId,oppPitId);await slp(120);}
        h2h=h2hCache[hk];
      }
      var h2hFlag=getH2HFlag(h2h);

      // Tracking identity (for auto-logging + box-score resolution)
      var pickPid=isPitcher?((ai2.homePitName===pName)?ai2.homePitId:(ai2.awayPitName===pName?ai2.awayPitId:null)):(bStats?bStats.playerId:null);
      var teamFull='',oppFull='';
      if(isPitcher){var pIsHome=(ai2.homePitName===pName);teamFull=pIsHome?og2.home_team:og2.away_team;oppFull=pIsHome?og2.away_team:og2.home_team;}
      else{teamFull=(batSide==='away')?og2.away_team:(batSide==='home')?og2.home_team:'';oppFull=(batSide==='away')?og2.home_team:(batSide==='home')?og2.away_team:'';}
      var teamAbbr=TEAM_ABBR[teamFull]||'',oppAbbr=TEAM_ABBR[oppFull]||'';

      mktKeys.forEach(function(k){
        var mkt=mkts[k];
        if(!mkt)return;

        if(k==='batter_stolen_bases')return; // v11 kill-list (belt + suspenders)

        // v11 PLAYER-TYPE -> PROP matching (hard filter). Wrong profile = skip.
        var bKeyEarly=bStats?(batType(bStats.iso)||{}).key:null;
        var oppBB9=oppPit?(oppPit.bb9!=null?oppPit.bb9:null):null;
        if(!isPitcher){
          var mis=profileMismatch(k,bStats,bKeyEarly,lineupSpot,(totalMap[gameStr]!=null?totalMap[gameStr]:null),oppBB9);
          if(mis)return;
        }

        // Context as gentle multipliers on the event rate (not point adds).
        var mAdj=0,mTag='',wAdj=0,pAdj=(pm?pm.adj:0);
        if(!isPitcher){var mu=pitcherMatchupAdj(oppPit,oppPitL3,k);mAdj=mu.adj;mTag=mu.tag;wAdj=weatherMod(weather[gameStr]);}

        // v13: the model outputs p_model_over (prob the Over hits, 0-1). We then bet the
        // side we're MISPRICED on vs the de-vigged market ‚Äî not simply the likelier side.
        var score=0,sideOver='Over',recOdds=mkt.over,pModelOver=null;
        if(k==='pitcher_strikeouts'){
          var krate=((pitL3&&pitL3.avgK)||(pitSt&&pitSt.avgK)||0);
          pModelOver=poisAtLeast(krate,Math.ceil(mkt.line));
        }else if(bStats){
          var formMult=bStats.hotCold==='HOT'?1.08:bStats.hotCold==='Warming'?1.04:bStats.hotCold==='COLD'?0.88:bStats.hotCold==='Cooling'?0.94:1;
          var ctxMult=1+(mAdj+pAdj+wAdj)/200; // matchup+platoon+temp, gentle
          pModelOver=winProbOver(k,mkt.line,bStats,formMult*ctxMult);
        }else return;
        pModelOver=Math.max(0,Math.min(1,pModelOver));

        // v13 ¬ß3.1/¬ß3.3 VALUE: p_market = de-vig consensus fair prob (median across books).
        // edge = |p_model - p_market|; side = wherever the model sits ABOVE the market.
        var pMarketOver=mkt.pMarketOver, edge=null, pModel=null, pMarket=null;
        if(pMarketOver!=null){
          var eOver=pModelOver-pMarketOver;
          sideOver=eOver>=0?'Over':'Under';
          edge=Math.abs(eOver);
          pMarket=sideOver==='Over'?pMarketOver:(1-pMarketOver);
        }else{
          // one-way market: no de-vig, no edge. Take the side that actually has a price
          // (RBI/singles books quote Over only) ‚Äî never a null-priced side.
          var hasO=mkt.over!=null, hasU=mkt.under!=null;
          sideOver=(hasO&&!hasU)?'Over':(hasU&&!hasO)?'Under':(pModelOver>=0.5?'Over':'Under');
        }
        pModel=sideOver==='Over'?pModelOver:(1-pModelOver);
        recOdds=sideOver==='Over'?mkt.over:mkt.under;                 // best line-shopped price for the side
        var bestSel=sideOver==='Over'?mkt.bestOver:mkt.bestUnder;     // {price,book} for line-shop logging
        score=Math.round(Math.max(0,Math.min(100,pModel*100)));      // display only ‚Äî no longer gates bets
        // v12 P4: line at/below 4.5 means the market sees a weak K arm ‚Äî never take the K-OVER there.
        if(k==='pitcher_strikeouts'&&sideOver==='Over'&&mkt.line<K_OVER_MIN_LINE)return;
        var rawScore=score, propMax=100; // win-prob already cross-prop comparable

        // Recent-form prop-clear rate (L5/L10) on THIS exact line + inactivity (computed
        // BEFORE the gates so RBI can be gated on recent form, not season rate).
        var l5={c:0,n:0},l10={c:0,n:0},lastDt=null;
        if(isPitcher){
          var over=(sideOver==='Over');
          l5=recentK(pitL3?pitL3.kGames:null,mkt.line,over,5);
          l10=recentK(pitL3?pitL3.kGames:null,mkt.line,over,10);
          lastDt=pitL3?pitL3.lastDate:null;
        }else if(bStats){
          l5=recentRate(bStats.recentGames,k,mkt.line,5);
          l10=recentRate(bStats.recentGames,k,mkt.line,10);
          lastDt=bStats.lastGameDate;
        }
        var inactive=daysSince(lastDt)>INACTIVE_DAYS;

        // v12 RBI path: RBI Over 0.5 is a binary, lineup-dependent bet ‚Äî gate on
        // recent form + spot + run-environment, NOT season RBI/game. Projected spots
        // (v12 P3 cache) let candidates surface BEFORE lineups post, tagged PROJECTED.
        // Every gate failure is counted so the card can explain an empty RBI board.
        var accelerator=false;
        if(k==='batter_rbis'){
          if(!bStats)return;
          rbiDiag.cand++;
          var gt=(totalMap[gameStr]!=null?totalMap[gameStr]:null);
          var envOk=(gt!=null&&gt>=RBI_TOTAL_FLOOR)||park>=112;                    // run environment OR Coors
          var formOk=l5.n>=4&&l5.c>=RBI_L5_MIN;                                   // drove in a run in >=RBI_L5_MIN of last 5
          var platOk=!pm||pm.side!=='UNFAVORABLE';
          if(!lineupSpot){rbiDiag.noSpot++;return;}
          if(lineupSpot<3||lineupSpot>6){rbiDiag.badSpot++;return;}
          if(!formOk){rbiDiag.form++;return;}
          if(!envOk){rbiDiag.env++;return;}
          if(!platOk){rbiDiag.plat++;return;}
          rbiDiag.pass++;
          score=Math.round((l5.c/l5.n*0.6+(l10.n?l10.c/l10.n:l5.c/l5.n)*0.4)*100); // score = recent form, not season
          rawScore=score; accelerator=true;
        }

        // v11.2: full odds range ‚Äî the +130 cap was overfit to one losing day
        // (+131..+200 returned +65% on a full sample). Just require a price exists.
        if(recOdds==null)return;

        if(score<52)return; // below a coin flip = no edge (RBI gate already enforces form)

        // Grade off win probability (premium = high-probability common events)
        var rawGrade=score>=65?'A':score>=52?'B':'C';
        if(rawGrade==='C')return;

        // Track K picks for conflict check
        if(k==='pitcher_strikeouts'&&rawGrade==='A'&&recOdds===mkt.over){
          kPickGames[gameStr]=true;
        }

        // Build label (sideOver already set by the win-prob block above)
        var lmap={'batter_hits_runs_rbis':'H+R+RBI','batter_singles':'Singles','batter_hits':'Hits','batter_total_bases':'Total Bases','batter_home_runs':'HR','batter_rbis':'RBI','batter_runs_scored':'Runs Scored','batter_walks':'Walks','pitcher_strikeouts':'Strikeouts'};
        var propLabel=sideOver+' '+mkt.line+' '+(lmap[k]||k);

        // True opposing pitcher (this batter's side) ‚Äî used for display and the
        // per-team premium cap. Empty for pitcher K props.
        var oppPitcher=isPitcher?'':oppPitName;

        // ‚îÄ‚îÄ CONTEXT LAYERS (display only ‚Äî no scoring impact) ‚îÄ‚îÄ
        // Line movement: remember the first odds we saw for THIS pick+side today.
        var lkey=pName+'|'+k+'|'+mkt.line+'|'+sideOver;
        if(openLines[lkey]==null)openLines[lkey]=recOdds;
        var oddsOpen=openLines[lkey];
        // Exit risk (K props): the starting pitcher's own team moneyline.
        var pitTeam=null,pitML=null;
        if(isPitcher){
          if(ai2.homePitName===pName)pitTeam=og2.home_team;
          else if(ai2.awayPitName===pName)pitTeam=og2.away_team;
          if(pitTeam)pitML=mlMap[pitTeam];
        }

        // ‚îÄ‚îÄ STATCAST LAYERS (Wave 2, display only) ‚Äî hitter props ‚îÄ‚îÄ
        var bKey=(bStats?(batType(bStats.iso)||{}).key:null)||null;
        var bSav=(bStats&&statcast.bat)?statcast.bat[bStats.playerId]:null;
        var lg=(bStats&&!isPitcher)?luckGap(bStats,bSav):null;
        var pSav=(oppPitId&&statcast.pit)?statcast.pit[oppPitId]:null;
        var oppVuln=(!isPitcher)?classifyPitcher(oppPit,pSav):null;

        // v13.1: if this module has a CALIBRATED trained model, use it for p_model
        // (refines the Poisson baseline). Then clamp the edge and flag implausible ones.
        var modKeyLive=moduleKey(k,sideOver);
        var calibrated=false;
        var mp=modelProb(modKeyLive,{
          line:mkt.line, game_total:(totalMap[gameStr]!=null?totalMap[gameStr]:null),
          iso:(bStats?bStats.iso:null), platoon_value:(pm?pm.adj:0), matchup_value:mAdj,
          luck_gap:(lg?lg.sum:null), regression_due:(lg&&lg.sum>0.100),
          ten_game_trend:(bStats?bStats.hotCold:null),
          opp_era:(oppPit?oppPit.era:null), opp_k9:(oppPit?oppPit.k9:null),
          opp_whip:(oppPit?oppPit.whip:null), rate_pg:(isPitcher?krate:null)
        });
        if(mp!=null){ pModel=mp; calibrated=true; if(pMarket!=null)edge=Math.abs(pModel-pMarket); }
        // ¬ß1.5 sanity clamp: a >12pp edge vs a de-vig consensus is the model being wrong,
        // not the market. Flag + never fire. Fire only on a clamped edge (<=10pp).
        var edgeImplausible = (edge!=null && edge>EDGE_IMPLAUSIBLE);
        var edgeFire = (edge!=null) ? Math.min(edge, EDGE_CLAMP_MAX) : null;

        rawPicks.push({
          name:pName,game:gameStr,time:fmtTime(og2.commence_time),
          park,mktKey:k,propLabel,line:mkt.line,
          recOdds,overOdds:mkt.over,underOdds:mkt.under,

  }
  ss('open_'+todayStr(),openLines); // persist first-seen odds for line movement

  // Apply all spec filters
  var picks=[];
  var mismatchNotes=[]; // bat-type/prop mismatches eliminated (for transparency)
  rawPicks.forEach(function(p){
    // Conflict check: skip batter props in games with K over
    if(!p.isPitcher&&kPickGames[p.game]){
      // Per spec: flag conflict but don't exclude entirely ‚Äî just note it
      p.conflictFlag=true;
    }
    var result=applyFilters(p);
    if(!result.pass){
      if(result.reason&&result.reason.indexOf('Mismatch')===0)mismatchNotes.push({name:p.name,prop:p.propLabel,reason:result.reason});
      return;
    }
    p.grade=result.grade;
    p.filterNotes=result.filters;
    picks.push(p);
  });

  // Sort: A first then B, by score
  // v12 P2: within grade, rank by score ADJUSTED for the prop's realized ROI ‚Äî
  // an RBI pick (+ROI prop) outranks an equal-scored h_r_rbi pick (-ROI prop).
  picks.sort(function(a,b){
    if(a.grade!==b.grade)return a.grade<b.grade?-1:1;
    return (b.score+propRoiWeight(b))-(a.score+propRoiWeight(a));
  });

  // Same-team filter: max 1 premium pick per team per game
  // When 2+ picks from same team qualify, keep highest score only
  // Group by team+game, sort by score, push lower ones to Watch List
  var teamGameGroups={};
  picks.forEach(function(p){
    if(p.grade==='A'&&!p.isPitcher&&p.bStats){
      // Determine team from game string and pitcher
      // Use pitcher as proxy for team grouping ‚Äî same pitcher = same opposing team
      var teamKey=p.game+'|'+(p.pitcher||'unknown');
      if(!teamGameGroups[teamKey])teamGameGroups[teamKey]=[];
      teamGameGroups[teamKey].push(p);
    }
  });
  Object.values(teamGameGroups).forEach(function(group){
    if(group.length<=1)return;
    // Sort by score descending ‚Äî keep top 1, push rest to Watch List
    group.sort(function(a,b){return b.score-a.score;});
    for(var gi=1;gi<group.length;gi++){
      group[gi].grade='W';
      group[gi].isWatchList=true;
      if(!group[gi].filterNotes)group[gi].filterNotes=[];

  var byPlayer={};
  picks.forEach(function(p){

    arr.sort(function(a,b){

      if(ta!==tb)return ta-tb;
      return (b.score+propRoiWeight(b))-(a.score+propRoiWeight(a));
    });
    for(var di=1;di<arr.length;di++){
      arr[di].grade='W';arr[di].tier='WATCH';

  // All picks that clear every filter go on the premium card

  // Three tiers for display:
  // Premium: all A-grade picks that cleared every filter
  // Watch:   B-grade + overflow A (bonus bets only)
  // (Research tier is internal ‚Äî not shown)

  // Same-game indicator: flag picks that share a game (parlay-construction guard)
  var gameCounts={};
  picks.forEach(function(p){gameCounts[p.game]=(gameCounts[p.game]||0)+1;});
  picks.forEach(function(p){p.sameGame=gameCounts[p.game]>1;});

  // bat-vs-vulnerability match = a correlated same-game opportunity (build as an
  // SGP), which is the OPPOSITE of the cross-game "do not parlay" caution.
  function strongMatch(p){
    if(p.isPitcher||!p.bStats)return false;
    var ml=matchLevel(p.batKey,p.oppTypeKey);

  }

    var partner=picks.find(function(q){
      return q!==p&&q.name!==p.name&&!q.isPitcher&&q.game===p.game&&q.pitcher===p.pitcher&&strongMatch(q);
    });
    if(partner)p.sgpPartner=partner.name;
  });

  // Build best parlays from premium card
  var bestParlays=buildBestParlays(picks);

  D={picks,totals,aceNotes,bestParlays,mismatchNotes:mismatchNotes,
    sgps:buildSGPs(picks),
    rbiDiag:rbiDiag,
    lineupsPosted:upcoming.filter(function(og){return (aceInfo[og.id]||{}).lineupPosted;}).length,
    upcoming:upcoming.length,live:live.length,finished:finished.length,
    date:new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
    oddsAsOf:oddsAsOf,
    generatedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET',
    loadedAt:new Date().toLocaleTimeString()};

  if(creditsAtStart!=null&&ODDS_BUDGET.remaining!=null&&creditsAtStart>=ODDS_BUDGET.remaining){
    ODDS_BUDGET.loadCost=creditsAtStart-ODDS_BUDGET.remaining;ss('odds_budget',ODDS_BUDGET);
  }

  var coreCount=picks.filter(function(p){return p.grade==='A'&&p.tier!=='ACCEL';}).length;
  var accelCount=picks.filter(function(p){return p.tier==='ACCEL';}).length;
  var watchCount=picks.filter(function(p){return p.grade==='B'||p.grade==='W';}).length;
  setP('Updated '+D.loadedAt+' \u2022 '+coreCount+' core \u2022 '+accelCount+' accel \u2022 '+watchCount+' watch');
  renderPicks();renderTotals();updPnLHdr();
  if(!REFRESH_T)startAR();
  resolvePending(); // resolve any finished games (fire-and-forget; refreshes display when done)
}

// One bucket row: hit% (w/t) | avg odds | ROI. Calibrating below MODEL_MIN settled.
var MODEL_MIN=20;
function roiOf(o){return o&&o.t?o.u/o.t:null;}
function bucketRow(label,o){
  if(!o||o.t===0)return'';
  if(o.t<MODEL_MIN)return'<div style="font-size:11px;color:var(--mut)">'+label+': calibrating ('+o.t+'/'+MODEL_MIN+')</div>';
  var hr=Math.round(o.w/o.t*100),roi=Math.round(o.u/o.t*100),ao=o.on?Math.round(o.os/o.on):null;
  var c=roi>0?'var(--grn)':roi<0?'var(--red)':'var(--mut)';
  return '<div style="font-size:11px;color:'+c+'">'+label+': '+hr+'% ('+o.w+'/'+o.t+') | avg '+(ao==null?'--':(ao>0?'+':'')+ao)+' | ROI '+(roi>0?'+':'')+roi+'%</div>';
}
// Signal vs its opposite, with ROI delta. A flag only "works" if it beats its opposite.
function signalGroup(title,obj,sideKey,oppKey,others){
  var keys=[sideKey,oppKey].concat(others||[]).filter(function(k){return obj[k]&&obj[k].t>0;});
  if(!keys.length)return'';
  var html='<div style="font-size:10px;font-weight:700;color:var(--txt);margin:8px 0 2px">'+title+'</div>';
  keys.forEach(function(k){html+=bucketRow(k,obj[k]);});
  var a=obj[sideKey],b=obj[oppKey];
  if(a&&b&&a.t>=MODEL_MIN&&b.t>=MODEL_MIN){
    var d=Math.round((roiOf(a)-roiOf(b))*100), works=d>0;
    html+='<div style="font-size:10px;font-weight:700;color:'+(works?'var(--grn)':'var(--red)')+'">&Delta; '+sideKey+'&minus;'+oppKey+': '+(d>0?'+':'')+d+'% ROI '+(works?'&#9989; predictive':'&#10060; NOT predictive')+'</div>';
  }
  return html;
}

    asc.slice().reverse().forEach(function(k){h+=ladderRow('Score '+k,s.by_score_bucket[k]);});
    var rois=lad.map(function(k){return roiOf(s.by_score_bucket[k]);}); // ascending score order
    var spread=rois[rois.length-1]-rois[0], mono=true; for(var i=1;i<rois.length;i++){if(rois[i]<rois[i-1]-0.05)mono=false;}
    var verdict=spread>=0.10&&mono?'PREDICTIVE ‚Äî ROI rises with score':spread>=0.10?'PARTLY PREDICTIVE ‚Äî rises overall, not monotonic':spread<=-0.10?'INVERTED ‚Äî higher score = WORSE (ranking backwards)':'FLAT ‚Äî score is noise (no signal)';
    var vc=spread>=0.10?'var(--grn)':spread<=-0.10?'var(--red)':'var(--amb)';
    h+='<div style="font-size:10px;font-weight:700;color:'+vc+';margin-top:2px">Verdict: '+verdict+' (spread '+(spread>0?'+':'')+Math.round(spread*100)+'% ROI top vs bottom)</div>';
    h+='<div style="font-size:9px;color:var(--mut)">* = bucket under '+MODEL_MIN+' settled; read as directional only.</div>';
  }
  // MIRROR vs PREDICTION benchmark ‚Äî does using the SCORE beat blindly fading?
  if(s.bench.n>=MODEL_MIN){
    var b=s.bench, rRec=Math.round(b.rec/b.n*100), rBlind=Math.round(b.blind_under/b.n*100), rOver=Math.round(b.always_over/b.n*100);
    var rowB=function(label,roi){var c=roi>0?'var(--grn)':roi<0?'var(--red)':'var(--mut)';return '<div style="font-size:11px;color:'+c+'">'+label+': ROI '+(roi>0?'+':'')+roi+'%</div>';};
    h+='<div style="font-size:10px;font-weight:700;color:var(--txt);margin:8px 0 2px">Mirror vs prediction (n='+b.n+')</div>';
    h+=rowB('(a) Score-driven side (Over if score&ge;'+b.tcut+', else Under)',rRec)+'<div style="font-size:9px;color:var(--mut);margin:-2px 0 2px 8px">'+b.rec_over+' Overs / '+b.rec_under+' Unders</div>';
    h+=rowB('(b) Blind fade ‚Äî always Under',rBlind);
    h+=rowB('(c) Always Over (today)',rOver);
    var adds=rRec>rBlind+2;
    h+='<div style="font-size:10px;font-weight:700;color:'+(adds?'var(--grn)':'var(--red)')+';margin-top:2px">Score adds value over blind fade: '+(adds?'YES (+'+(rRec-rBlind)+'% vs blind)':'NO ‚Äî only riding the mirror')+'</div>';
    h+='<div style="font-size:9px;color:var(--mut)">Over legs use real odds; Under legs assume -120 (no historical Under odds).</div>';
  }
  // Closing line value (forward-only)
  if(s.clv_n>0){
    var avgClv=Math.round(s.clv_sum/s.clv_n*1000)/10, posPct=Math.round(s.clv_pos/s.clv_n*100);
    h+='<div style="font-size:10px;font-weight:700;color:var(--txt);margin:8px 0 2px">Closing line value'+(s.clv_since?' (since '+s.clv_since+')':'')+'</div>';
    h+='<div style="font-size:11px;color:'+(avgClv>=0?'var(--grn)':'var(--red)')+'">Avg CLV '+(avgClv>0?'+':'')+avgClv+' pts &middot; '+posPct+'% beat the close ('+s.clv_n+')</div>';
    h+=bucketRow('+CLV picks',s.by_clv.pos)+bucketRow('-CLV picks',s.by_clv.neg);
    // v12 P5: CLV by prop + divergence flag (+ROI without CLV = variance, don't upsize)
    Object.keys(s.clv_by_prop||{}).sort().forEach(function(cpk){
      var cp=s.clv_by_prop[cpk], cAvg=Math.round(cp.sum/cp.n*1000)/10;
      var pRoi=s.by_prop_type[cpk]&&s.by_prop_type[cpk].t?s.by_prop_type[cpk].u/s.by_prop_type[cpk].t*100:null;
      var diverge=pRoi!=null&&pRoi>=10&&s.by_prop_type[cpk].t>=30&&cAvg<=0.5&&cp.n>=20;
      h+='<div style="font-size:11px;color:'+(cAvg>0?'var(--grn)':'var(--mut)')+'">'+cpk+': avg '+(cAvg>0?'+':'')+cAvg+' pts &middot; '+Math.round(cp.pos/cp.n*100)+'% pos (n='+cp.n+')'+(diverge?' <span style="color:var(--amb);font-weight:700">&#9888; +ROI without CLV ‚Äî variance-driven; do not upsize</span>':'')+'</div>';
    });
  }else{
    h+='<div style="font-size:10px;color:var(--mut);margin:8px 0 2px">Closing line value: capturing from today forward (resolved picks will show CLV once games finish).</div>';
  }
  // Signals with their control/opposite side + ROI delta
  h+=signalGroup('Matchup tag',s.by_matchup_tag,'JUICY','TOUGH',['SOFT','FIRM','EVEN']);
  h+=signalGroup('Platoon',s.by_platoon,'FAVORABLE','UNFAVORABLE',['NEUTRAL']);
  h+=signalGroup('10-game trend',s.by_trend,'HOT','COLD',['Warming','Neutral','Cooling']);
  h+=signalGroup('Regression due',s.by_regression_due,'true','false',[]);
  h+='<div style="font-size:9px;color:var(--mut);margin-top:6px">Note: ROI uses each pick&rsquo;s own odds, so a bucket&rsquo;s ROI can differ from hit%&times;avg-odds when winners skew to longer prices (e.g. JUICY). Avg odds and ROI are computed over the same settled set.</div>';
  h+='</div>';return h;
}

function pickCard(p){
  var cid='c'+Math.random().toString(36).substr(2,8);
  window['_d'+cid]={player:p.name,market:p.propLabel,game:p.game,time:p.time,score:(p.score!=null?p.score:null),mktKey:p.mktKey};

  var isA=p.grade==='A';

  var col=isA?'var(--grn)':isW?'var(--org)':'var(--amb)';
  var cls=isA?'pick-a':isW?'pick-w':'pick-b';

  var h='<div class="pick '+cls+'">';
  h+='<div class="prow"><div>';
  h+='<div class="pname">'+p.name+(p.bStats?hotBadge(p.bStats.hotCold,p.bStats&&p.bStats.games):'')+'</div>';
  // Lineup + confirmed status
  var spotTxt=p.lineupSpot?((p.spotProjected?'~#':'#')+p.lineupSpot+' '):' '; // ~ = projected from last posted lineup
  var confTag=p.lineupConfirmed?'<span class="conf-badge conf-yes">&#10003; CONFIRMED</span>':'<span class="conf-badge conf-proj">&#8987; PROJECTED</span>';
  h+='<div class="pgame">'+spotTxt+p.game+' &middot; '+p.time+confTag+'</div>';
  h+='</div>';
  h+='<span class="pbadge '+(isA?'ba':isW?'bw':'bb')+'">'+(isA?'&#9733; A':isW?'&#9873; WATCH':'&#9889; B')+'</span></div>';

  // v13 VALUE LINE ‚Äî the headline: our probability vs the market's, and the edge.
  if(p.pModel!=null){
    var pm=(p.pModel*100).toFixed(0), mm=(p.pMarket!=null?(p.pMarket*100).toFixed(0):null);
    if(p.edge!=null){
      var edgePct=(p.edge*100).toFixed(1), fired=p.fire;
      var ecol=fired?'var(--grn)':'var(--mut)';
      h+='<div style="font-size:11px;font-weight:700;color:'+ecol+';margin-bottom:4px">'+(fired?'&#128293; FIRES':'&#8226; no-fire')+' &middot; EDGE '+(p.pModel>=p.pMarket?'+':'')+edgePct+'pp <span style="font-weight:600;color:var(--mut)">(p_model '+pm+'% vs market '+mm+'%, '+p.nBooks+' books)</span></div>';
    }else{
      h+='<div style="font-size:11px;color:var(--mut);margin-bottom:4px">p_model '+pm+'% &middot; <span style="color:var(--amb)">one-way market ‚Äî no de-vig / no edge (paper)</span></div>';
    }
  }
  // Line-shopping: best price + book, flag if the taken price isn't the best.
  if(p.bestPrice!=null){
    h+='<div style="font-size:10px;color:var(--mut);margin-bottom:4px">Best price: '+(p.bestPrice>0?'+':'')+p.bestPrice+' @ '+(p.bestBook||'?')+(p.priceTaken!=null&&p.priceTaken<p.bestPrice?' <span style="color:var(--red)">&#9888; taken '+p.priceTaken+' &lt; best</span>':'')+'</div>';
  }
  // Score bar (display only in v13 ‚Äî does NOT decide bets)
  h+='<div class="sbar"><div class="sbar-fill" style="width:'+p.score+'%;background:'+col+'"></div></div>';
  h+='<div style="font-size:10px;color:'+col+';font-weight:700;margin-bottom:5px">Score: '+p.score+'/100 <span style="color:var(--mut);font-weight:600">(likelihood only ‚Äî not the bet signal)</span></div>';
  // Recent form: how often THIS line cleared in the player's last 5/10 appearances
  if(p.l5n||p.l10n){
    var rfc=(p.l5n>=4)?((p.l5c/p.l5n>=0.6)?'var(--grn)':(p.l5c/p.l5n<=0.4)?'var(--red)':'var(--amb)'):'var(--mut)';
    h+='<div style="font-size:10px;color:'+rfc+';font-weight:700;margin-bottom:5px">Recent form: L5 '+p.l5c+'/'+p.l5n+' &middot; L10 '+p.l10c+'/'+p.l10n+' on this line'+(p.inactive?' &middot; <span style="color:var(--red)">&#9888; INACTIVE/RETURNING</span>':'')+'</div>';
  } else if(p.inactive){
    h+='<div style="font-size:10px;color:var(--red);font-weight:700;margin-bottom:5px">&#9888; INACTIVE/RETURNING ‚Äî no recent games</div>';
  }
  if(p.accelerator)h+='<div style="font-size:10px;color:var(--pur);font-weight:700;margin-bottom:5px">&#128640; ACCELERATOR ‚Äî plus-money flier (recent-form + 3-6 spot); stake small, not a core single</div>';

  // Line movement (first-seen odds -> current, for the recommended side)
  if(p.oddsOpen!=null){
    var mv=p.oddsMove||0;
    var lmc=mv>0?'var(--grn)':mv<0?'var(--red)':'var(--mut)';
    var lml=mv>0?'in your favor':mv<0?'against you ‚Äî sharp money':'no move';
    h+='<div style="font-size:10px;color:var(--mut);margin-bottom:4px">&#128201; Open '+fmtOdds(p.oddsOpen)+' &rarr; now '+fmtOdds(p.recOdds)+' <span style="color:'+lmc+';font-weight:700">('+(mv>0?'+':'')+mv+' &middot; '+lml+')</span></div>';
  }

  // Value indicator ‚Äî book-implied % vs the model's REAL tracked hit% + ROI (auto-resolved)
  if(p.recOdds!=null){
    var vrow='&#128202; Book '+(impliedProb(p.recOdds)*100).toFixed(1)+'%';
    // v12 P1: the ONLY honest calibration for this pick is its own grade-x-prop
    // bucket's realized record. n<30 = UNCALIBRATED, printed plainly. A letter grade
    // whose own bucket is -ROI gets flagged rather than presented as confidence.
    var seg=MSTATS&&MSTATS.by_grade_prop&&MSTATS.by_grade_prop[p.grade+'|'+propShort(p.mktKey)];
    if(seg&&seg.t>=30){
      var segRoi=Math.round(seg.u/seg.t*100);
      vrow+=' &middot; this grade+prop: '+Math.round(seg.w/seg.t*100)+'% (ROI '+(segRoi>=0?'+':'')+segRoi+'%, n='+seg.t+')'+(segRoi<0?' <span style="color:var(--red);font-weight:700">&#9660; grade not ROI-backed</span>':' <span style="color:var(--grn)">&#10003;</span>');
    }else{
      vrow+=' &middot; <span style="color:var(--amb)">UNCALIBRATED ('+(seg?seg.t:0)+'/30 settled for Grade '+p.grade+' &times; '+propShort(p.mktKey)+')</span>';
    }
    h+='<div style="font-size:10px;color:var(--mut);margin-bottom:4px">'+vrow+'</div>';
  }

  // Same-game guard (do not parlay two picks from one game)
  if(p.sgpPartner)h+='<div style="font-size:10px;color:var(--tel);font-weight:700;margin-bottom:4px">&#128279; CORRELATED SGP OPPORTUNITY &mdash; pairs with '+p.sgpPartner+' vs '+p.pitcher+' (same vulnerability) &mdash; build as a same-game parlay</div>';
  else if(p.sameGame)h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#128279; Same game as another pick &mdash; do NOT combine in a CROSS-game parlay</div>';

  // Conflict flag
  if(p.conflictFlag)h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9888; Same game has a pitcher K over ‚Äî structurally opposed</div>';

  // Filter notes
  if(p.filterNotes&&p.filterNotes.length){
    p.filterNotes.forEach(function(n){h+='<div style="font-size:10px;color:var(--amb);margin-bottom:3px">&#9679; '+n+'</div>';});
  }

  // Stat grid ‚Äî prop specific
  if(p.bStats){
    var b=p.bStats;
    var bt=batType(b.iso);
    if(bt)h+='<div style="font-size:11px;font-weight:700;margin-bottom:5px">BAT TYPE: '+bt.dot+' '+bt.label+' <span style="color:var(--mut);font-weight:600">(ISO '+fmt3(b.iso)+')</span></div>';
    // Platoon split vs tonight's starter's hand
    if(p.splitVsL&&p.splitVsR&&(p.oppThrows==='L'||p.oppThrows==='R')){
      var pcol=p.platoonSide==='FAVORABLE'?'var(--grn)':p.platoonSide==='UNFAVORABLE'?'var(--red)':'var(--mut)';
      var picon=p.platoonSide==='FAVORABLE'?'&#9989;':p.platoonSide==='UNFAVORABLE'?'&#9888;':'&#9898;';
      h+='<div style="font-size:10px;color:var(--mut);margin-bottom:3px">&#9918; Platoon: vs RHP '+fmt3(p.splitVsR.avg)+'/'+fmt3(p.splitVsR.ops)+' OPS &middot; vs LHP '+fmt3(p.splitVsL.avg)+'/'+fmt3(p.splitVsL.ops)+' OPS</div>';
      h+='<div style="font-size:10px;font-weight:700;color:'+pcol+';margin-bottom:5px">Tonight vs '+p.oppThrows+'HP'+(p.oppPitName?' ('+p.oppPitName+')':'')+': '+(p.platoonSide||'NEUTRAL')+' '+picon+(p.platoonAdj?' ('+(p.platoonAdj>0?'+':'')+p.platoonAdj+')':'')+'</div>';
    }
    // Career head-to-head vs tonight's starter (only when 10+ career AB)
    if(p.h2h&&p.h2h.ab>=10){
      var hh=p.h2h, hflagTxt=p.h2hFlag==='OWNS'?' &#9989; OWNS HIM':p.h2hFlag==='STRUGGLES'?' &#10060; STRUGGLES':'';
      var hcol=p.h2hFlag==='OWNS'?'var(--grn)':p.h2hFlag==='STRUGGLES'?'var(--red)':'var(--mut)';
      h+='<div style="font-size:10px;color:'+hcol+';margin-bottom:5px">&#9918; Career vs '+(p.oppPitName||'SP')+': '+hh.ab+' AB &middot; '+fmt3(hh.avg)+' AVG &middot; '+hh.hr+' HR &middot; '+fmt3(hh.ops)+' OPS'+hflagTxt+'</div>';
    }
    // Park factor (display only; base score already includes park)
    if(p.park!=null){
      var pk=parkInfo(p.homeTeam,p.park), pkc=parkColor(pk.tier);
      h+='<div style="font-size:10px;color:'+pkc+';margin-bottom:5px">&#127967; Park: '+(p.parkVenue||p.homeTeam||'')+(pk.abbr?' ('+pk.abbr+')':'')+' &middot; '+parkLabel(pk.tier)+' &middot; '+(pk.rich?'Runs '+pk.runs.toFixed(2)+' HR '+pk.hr.toFixed(2):'factor '+pk.factor)+'</div>';
    }
    // Weather (outdoor only; neutral for dome/roof). Temperature is scored; wind shown raw.
    if(p.wx){
      if(p.wx.neutral)h+='<div style="font-size:10px;color:var(--mut);margin-bottom:5px">&#127780; Weather: roof/dome ‚Äî weather neutral</div>';
      else if(p.wx.temp!=null){
        var tnote=p.wx.temp>85?' &#9889; hot, ball carries (+1)':p.wx.temp<50?' &#10052; cold, ball dies (-2)':'';
        var tcol=p.wx.temp>85?'var(--grn)':p.wx.temp<50?'var(--red)':'var(--mut)';
        h+='<div style="font-size:10px;color:'+tcol+';margin-bottom:5px">&#127780; Weather: '+p.wx.temp+'&deg;F &middot; Wind '+p.wx.windSpeed+'mph'+(p.wx.windDeg!=null?' from '+windCardinal(p.wx.windDeg):'')+' &middot; Hum '+p.wx.humidity+'%'+tnote+'</div>';
      }
    }
    h+='<div class="pgrid">';
    if(p.mktKey==='batter_singles')
      h+=sg4(b.rawRoll10avg||b.roll10avg,'10G AVG','var(--grn)')+sg4(b.avg,'AVG','var(--tel)')+sg4(b.sngpg,'1B/G','var(--tel)')+sg4(b.hrpg,'HR/G','var(--mut)');
    else if(p.mktKey==='batter_hits_runs_rbis')
      h+=sg4(b.rawRoll10obp||b.roll10obp,'10G OBP','var(--grn)')+sg4(b.obp,'OBP','var(--blu)')+sg4(b.runspg,'R/G','var(--grn)')+sg4(b.rbipg,'RBI/G','var(--red)');
    else if(p.mktKey==='batter_hits')
      h+=sg4(b.rawRoll10avg||b.roll10avg,'10G AVG','var(--grn)')+sg4(b.avg,'AVG','var(--tel)')+sg4(b.hpg,'H/G','var(--amb)')+sg4(b.bbRate,'Walk%','var(--mut)');
    else if(p.mktKey==='batter_total_bases')
      h+=sg4(b.slg,'SLG','var(--nvy)')+sg4(b.tbpg,'TB/G','var(--nvy)')+sg4(b.avg,'AVG','var(--tel)')+sg4(b.bbRate,'Walk%','var(--amb)');
    else if(p.mktKey==='batter_home_runs')
      h+=sg4(b.hrpg,'HR/G','var(--pur)')+sg4(b.slg,'SLG','var(--nvy)')+sg4(b.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else if(p.mktKey==='batter_stolen_bases')
      h+=sg4(b.sbpg,'SB/G','var(--tel)')+sg4(b.obp,'OBP','var(--blu)')+sg4(b.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else if(p.mktKey==='batter_walks')
      h+=sg4(b.bbRate,'Walk%','var(--blu)')+sg4(b.obp,'OBP','var(--blu)')+sg4(b.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else
      h+=sg4(b.avg,'AVG','var(--tel)')+sg4(b.obp,'OBP','var(--blu)')+sg4(b.hpg,'H/G','var(--amb)')+sg4(b.bbRate,'Walk%','var(--mut)');
    h+='</div>';
    // Opposing-pitcher matchup
    if(p.oppPitName&&p.oppERA!=null){
      var mc=p.matchupAdj>=2?'var(--grn)':p.matchupAdj<=-2?'var(--red)':'var(--mut)';
      var ms=(p.matchupAdj>0?'+':'')+p.matchupAdj;
      var mtag=p.matchupTag?' '+p.matchupTag.toUpperCase():'';
      h+='<div style="font-size:10px;color:'+mc+';margin-bottom:4px">&#9918; vs '+p.oppPitName+' &middot; '+p.oppERA.toFixed(2)+' ERA, '+(p.oppWHIP!=null?p.oppWHIP.toFixed(2):'--')+' WHIP, '+(p.oppK9!=null?p.oppK9:'--')+' K/9 &middot; matchup '+ms+mtag+'</div>';
      // Opposing starter's recent form ‚Äî last-3-start ERA vs season ERA
      if(p.oppL3era!=null){
        var tougher=p.oppL3era>p.oppERA+0.30, softer=p.oppL3era<p.oppERA-0.30;
        var l3c=tougher?'var(--red)':softer?'var(--grn)':'var(--mut)';
        h+='<div style="font-size:10px;color:'+l3c+';margin-bottom:4px">&nbsp;&nbsp;&#8627; Last-3 ERA '+p.oppL3era.toFixed(2)+(tougher?' &#9888; trending tougher':softer?' &#9989; softening':'')+'</div>';
      }
      // Statcast batted-ball profile of the opposing starter
      if(p.oppStat){
        var ss=p.oppStat, parts=[];
        if(ss.hard_hit_percent!=null)parts.push(ss.hard_hit_percent+'% HardHit');
        if(ss.barrel_batted_rate!=null)parts.push(ss.barrel_batted_rate+'% Barrel');
        if(ss.whiff_percent!=null)parts.push(ss.whiff_percent+'% Whiff');
        if(parts.length)h+='<div style="font-size:10px;color:var(--mut);margin-bottom:4px">&nbsp;&nbsp;&#128202; Statcast: '+parts.join(' &middot; ')+'</div>';
      }
    }
    // Pitcher vulnerability type + bat-type match
    if(p.oppTypeKey){
      var ml=matchLevel(p.batKey,p.oppTypeKey);
      var tcol=p.oppTypeKey==='TYPE4'?'var(--red)':'var(--grn)';
      var tnum=p.oppTypeKey.replace('TYPE','TYPE ');
      var mtxt=ml?(' &middot; '+ml.icon+' '+ml.label):'';
      h+='<div style="font-size:10px;font-weight:700;color:'+tcol+';margin-bottom:4px">VULNERABILITY: '+tnum+' &mdash; '+p.oppTypeLabel+mtxt+'</div>';
    }
    // Luck-gap / regression flag (Statcast expected vs actual)
    if(p.luckSum!=null&&p.luckSum>0.100){
      var slgPart=(p.luckParts||[]).filter(function(x){return x.k==='xSLG';})[0];
      h+='<div style="font-size:10px;font-weight:700;color:var(--grn);margin-bottom:4px">&#9889; REGRESSION DUE: composite +'+fmt3(p.luckSum)+(slgPart?' &middot; xSLG '+fmt3(slgPart.x)+' vs SLG '+fmt3(slgPart.a):'')+' &mdash; book pricing below contact quality</div>';
    }
    // Game run-environment (from game total)
    if(p.gameTotal!=null){
      var hi=p.gameTotal>=9, lo=p.gameTotal<=7.5;
      var gec=hi?'var(--grn)':lo?'var(--amb)':'var(--mut)';
      var gel=hi?'high run environment &#9989;':lo?'low run environment &#9888;':'neutral run environment';
      h+='<div style="font-size:10px;color:'+gec+';margin-bottom:4px">&#127919; Game total '+p.gameTotal+' &middot; '+gel+'</div>';
    }
    // Batting order + estimated plate appearances (floor context)
    if(p.lineupSpot){
      h+='<div style="font-size:10px;color:var(--mut);margin-bottom:4px">&#9876;&#65039; Batting '+ordinal(p.lineupSpot)+' &middot; est. '+paEstimate(p.lineupSpot)+' PA tonight</div>';
    }
    // Warnings
    if(b.hotCold==='COLD'||b.hotCold==='Cooling')h+='<div style="font-size:10px;color:var(--red);margin-bottom:4px">&#129704; '+b.hotCold+' last 14 days</div>';
    // Regression note: 10-game window below season baseline (drives the trend penalty)
    if(p.mktKey==='batter_singles'||p.mktKey==='batter_hits'||p.mktKey==='batter_hits_runs_rbis'){
      var trIsObp=(p.mktKey==='batter_hits_runs_rbis');
      var trRoll=trIsObp?b.roll10obp:b.roll10avg, trSeas=trIsObp?b.obp:b.avg;
      if(trRoll!=null&&trSeas!=null&&(trRoll-trSeas)<=-0.015)
        h+='<div style="font-size:10px;color:var(--red);margin-bottom:4px">&#128317; 10G '+(trIsObp?'OBP':'avg')+' '+fmt3(trRoll)+' below season '+fmt3(trSeas)+' &mdash; regression, score penalized</div>';
    }
    if(b.bbRate>=0.09&&(p.mktKey==='batter_hits'||p.mktKey==='batter_total_bases'))h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9888; High walk rate hurts this prop</div>';
    // Prop mismatch: bat type vs prop type
    if(bt&&bt.key==='POWER'&&p.mktKey==='batter_singles')h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9888; PROP MISMATCH: power bat on a singles prop &mdash; consider H+R+RBI or Total Bases instead</div>';
    if(bt&&bt.key==='CONTACT'&&p.mktKey==='batter_hits_runs_rbis')h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9888; PROP MISMATCH: contact bat on a multi-path prop &mdash; consider Singles or Hits instead</div>';
    if(b.games<CAREER_GAME_MIN)h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9675; Career sample: '+b.games+' games ‚Äî rolling avg blended with season avg</div>';
    if(b.avg<CAREER_AVG_FLOOR)h+='<div style="font-size:10px;color:var(--red);margin-bottom:4px">&#9888; Career avg '+b.avg+' below .220 floor ‚Äî score penalized</div>';
    if(b.games<ROOKIE_GAME_GATE)h+='<div style="font-size:10px;color:var(--amb);margin-bottom:4px">&#9675; Rookie ('+b.games+' games) ‚Äî multi-path props capped at B</div>';
  }

  // Pitcher K stats
  if(p.pitSt){
    h+='<div class="pgrid">'+sg4(p.pitSt.era,'ERA','var(--red)')+sg4(p.pitSt.k9,'K/9','var(--blu)')+sg4(p.pitSt.avgK,'Season K/G','var(--grn)')+sg4(p.pitSt.gs,'GS','var(--mut)')+'</div>';
    if(p.pitL3)h+='<div style="font-size:11px;color:'+(p.pitL3.avgK>p.line?'var(--grn)':'var(--red)')+';margin-bottom:4px">Last 3 starts: '+p.pitL3.avgK+' K/start avg vs '+p.line+' line</div>';
    // Exit risk ‚Äî a trailing pitcher gets pulled regardless of K count
    if(p.pitML!=null){
      var fav=p.pitML<0;
      var erisk=fav?(p.pitML<=-130?'LOW':'MODERATE'):'MODERATE';
      var erc=fav?'var(--grn)':'var(--amb)';
      h+='<div style="font-size:10px;color:'+erc+';margin-bottom:4px">&#9201;&#65039; Exit risk '+erisk+' &middot; '+p.pitTeam+' '+fmtOdds(p.pitML)+(fav?' favorite ‚Äî likely goes deep':' underdog ‚Äî monitor game score')+'</div>';
    }
  }

  // Bet line + real odds
  h+='<div class="pline"><div><div style="font-size:10px;color:var(--mut)">Recommended Bet</div><div style="font-size:13px;font-weight:700;color:var(--gld)">'+p.propLabel+'</div></div><div style="text-align:right"><div style="font-size:10px;color:var(--mut)">Odds</div><div style="font-size:15px;font-weight:700;color:var(--grn)">'+fmtOdds(p.recOdds)+'</div></div></div>';

  h+='<button class="btn" onclick="logFromPick(\''+cid+'\')">+ Log This Bet</button>';
  h+='<button class="btn-s" onclick="addLeg(\''+cid+'\')">+ Add to Parlay</button>';
  h+='</div>';return h;
}

// ‚îÄ‚îÄ RENDER TOTALS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function renderTotals(){
  if(!D)return;
  var h='<div style="font-size:11px;color:var(--mut);margin-bottom:8px">Game over/under from DraftKings</div>';
  if(!D.totals.length)h+='<div class="empty">No totals yet.</div>';
  else D.totals.forEach(function(t){
    var pn=t.park>=108?'&#128293; Hitter park':t.park<=96?'&#129704; Pitcher park':'';
    h+='<div class="tot-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px"><div><div style="font-size:14px;font-weight:700">'+t.game+'</div><div style="font-size:11px;color:var(--mut)">'+t.time+(pn?' &middot; '+pn:'')+'</div></div><div style="font-size:18px;font-weight:700;color:var(--gld)">'+t.line+'</div></div>';
    h+='<div style="display:flex;gap:8px"><div style="flex:1;background:var(--gbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Over</div><div style="font-size:17px;font-weight:700;color:var(--grn)">'+fmtOdds(t.overOdds)+'</div></div><div style="flex:1;background:var(--bbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Under</div><div style="font-size:17px;font-weight:700;color:var(--blu)">'+fmtOdds(t.underOdds)+'</div></div></div>';

// ‚îÄ‚îÄ BET LOG MANAGEMENT ‚Äî void / cashout / undo / remove (stake & odds never change) ‚îÄ‚îÄ
function voidBet(id){
  var b=BETS.find(function(x){return x.id===id;});if(!b)return;

function undoBet(id){
