<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hitters Edge v10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--sur:#111827;--sur2:#1a2235;--bdr:#1e2d45;
  --txt:#e2e8f0;--mut:#64748b;
  --grn:#22c55e;--gbg:#052e16;
  --amb:#f59e0b;--abg:#2d1a00;
  --red:#ef4444;--rbg:#2d0a0a;
  --blu:#3b82f6;--bbg:#0a1929;
  --pur:#a855f7;--tel:#14b8a6;--nvy:#6366f1;
  --gld:#fbbf24;--org:#ff9800;
}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:72px;max-width:640px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:var(--gld)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 6px;background:none;border:none;color:var(--mut);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb.on{color:var(--gld)}
.pg{display:none;padding:10px 10px 0}
.pg.on{display:block}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:8px}
.btn{background:var(--gld);color:#000;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn-s{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--gld)}
select.inp option{background:var(--sur2)}
.lbl{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.spnr{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.load{text-align:center;padding:40px 16px;color:var(--mut)}
.toast-el{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast-el.show{opacity:1}
/* SECTIONS */
.sect{border:1px solid var(--bdr);border-radius:11px;overflow:hidden;margin-bottom:8px}
.sect-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;user-select:none}
.sect-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.sect-arr{font-size:11px;color:var(--mut);transition:transform .25s;display:inline-block}
.sect-arr.open{transform:rotate(180deg)}
.sect-body{display:none;padding:8px}
.sect-body.open{display:block}
/* PICK CARDS */
.pick{border-radius:10px;padding:11px;margin-bottom:7px;border-left:4px solid}
.pick-a{background:#071a07;border-color:var(--grn)}
.pick-b{background:#1a1400;border-color:var(--amb)}
.pick-w{background:#1a1000;border-color:var(--org)}
.prow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.pname{font-size:15px;font-weight:700}
.pgame{font-size:11px;color:var(--mut);margin-top:2px}
.pbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0}
.ba{background:var(--gbg);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.bb{background:var(--abg);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
.bw{background:#1a1000;color:var(--org);border:1px solid rgba(255,152,0,.3)}
.sbar{height:5px;background:var(--sur2);border-radius:3px;margin:6px 0;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.pgrid-box{background:rgba(0,0,0,.3);border-radius:7px;padding:5px;text-align:center}
.pgrid-val{font-size:13px;font-weight:700}
.pgrid-lbl{font-size:8px;color:var(--mut);margin-top:1px;text-transform:uppercase}
.pline{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.tier-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
.tier-1{background:var(--gbg);color:var(--grn)}
.tier-2{background:var(--bbg);color:var(--blu)}
.tier-3{background:var(--abg);color:var(--amb)}
.conf-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px}
.conf-yes{background:var(--gbg);color:var(--grn)}
.conf-proj{background:var(--abg);color:var(--amb)}
/* STATUS */
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stpill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.st-up{background:var(--gbg);color:var(--grn)}
.st-lv{background:#1a0a00;color:var(--org)}
.st-fn{background:var(--sur2);color:var(--mut)}
.st-ace{background:var(--rbg);color:var(--red)}
/* TOTALS */
.tot-card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:11px;margin-bottom:8px}
/* P&L */
.pnlg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pnlb{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.bet-row{background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rbtns{display:flex;gap:5px;margin-top:6px}
.bwin{background:var(--gbg);color:var(--grn);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.blos{background:var(--rbg);color:var(--red);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
/* LOG */
.tabrow{display:flex;gap:5px;margin-bottom:10px}
.tabb{flex:1;padding:7px;background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;text-align:center;font-weight:600}
.tabb.on{background:var(--gld);color:#000;border-color:var(--gld)}
.leg{background:var(--sur2);border-radius:8px;padding:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.leg-rm{background:var(--rbg);color:var(--red);border:1px solid var(--red);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer}
.stl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.stl::after{content:"";flex:1;height:1px;background:var(--bdr)}
.empty{text-align:center;padding:24px;color:var(--mut);font-size:13px;line-height:1.6}
.rbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer}
.ace-note{background:var(--rbg);border:1px solid rgba(239,68,68,.3);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:11px}
.filter-note{background:var(--abg);border:1px solid rgba(245,158,11,.3);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:11px}
.ptype-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.ptype-box{background:var(--sur2);border:1px solid var(--bdr);border-radius:9px;padding:8px;text-align:center}
.ptype-val{font-size:18px;font-weight:700}
.ptype-lbl{font-size:9px;color:var(--mut);margin-top:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="logo">&#9918; Hitters Edge v10</div>
    <div style="font-size:9px;color:var(--mut)" id="lu">Loading...</div>
    <div style="font-size:9px;color:var(--mut)" id="rtimer"></div>
  </div>
  <div style="text-align:right">
    <div style="font-size:16px;font-weight:700" id="pnl-hdr">$0.00</div>
    <div style="font-size:9px;color:var(--mut)">All Time P&L</div>
  </div>
</div>
<div id="pg-picks"  class="pg on"><div class="load"><div class="spnr"></div>Loading...</div></div>
<div id="pg-totals" class="pg"><div class="load"><div class="spnr"></div>Loading...</div></div>
<div id="pg-pnl"    class="pg"></div>
<div id="pg-log"    class="pg"></div>
<nav class="nav">
  <button class="nb on" id="nb-picks"  onclick="nav('picks')"> <span style="font-size:17px">&#9918;</span>Picks</button>
  <button class="nb"    id="nb-totals" onclick="nav('totals')"><span style="font-size:17px">&#127967;</span>Totals</button>
  <button class="nb"    id="nb-pnl"    onclick="nav('pnl')">   <span style="font-size:17px">&#128176;</span>P&amp;L</button>
  <button class="nb"    id="nb-log"    onclick="nav('log')">   <span style="font-size:17px">&#10133;</span>Log</button>
</nav>
<div class="toast-el" id="toast"></div>
<script>
'use strict';
// ‚îÄ‚îÄ CONFIG ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var ODDS_KEY  = 'c662d3af7ba8e40cddf08b0fca0684a9';
var ODDS_BASE = 'https://api.the-odds-api.com/v4';
var MLB       = 'https://statsapi.mlb.com/api/v1';
var OWM_KEY   = '6a060c8de21d6f1a5cd9d6fed2b7a53b'; // OpenWeatherMap ‚Äî weather is fail-safe; if the key/call fails the card just omits weather
var SEASON    = 2026;

// ‚îÄ‚îÄ SPEC CONSTANTS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var ACE_ERA_THRESHOLD    = 2.80;  // ERA at or below = ace
var ACE_MIN_STARTS       = 6;     // minimum GS to be considered ace
var MAX_A_PICKS          = 5;     // hard cap on premium card
var MIN_ODDS             = -140;  // worst odds we accept
var ROOKIE_GAME_GATE     = 50;    // under this = rookie restrictions
var K_LINE_MAX           = 7.0;   // 7.5+ K lines excluded from card
var HRI_25_LINE          = 2.5;   // 2.5 H+R+RBI hard capped at B
var CAREER_GAME_MIN      = 30;    // under 30 games = capped at Watch List
var CAREER_AVG_FLOOR     = 0.220; // career avg below .220 = score penalty applied
var MATCHUP_MAX_ADJ      = 14;    // max +/- points the opposing-pitcher matchup can move a hitter score
// Realistic ceiling of each scoring model (best-case stats + best-case matchup).
// The displayed score is normalized to these so a 90 reads the same across props.
// IMPORTANT: if you change any score*() model, re-check its ceiling and update here.
var PROP_MAX={
  batter_singles:100, batter_hits_runs_rbis:100, batter_hits:90,
  pitcher_strikeouts:83, batter_home_runs:81, batter_total_bases:77,
  batter_rbis:76, batter_runs_scored:68, batter_stolen_bases:64, batter_walks:52
};
var TRACK_DAYS           = 30;    // rolling window for the paper-trading track record
var MIN_VALUE_SAMPLE     = 10;    // settled bets in a score range before a model win% is shown (else "calibrating")
var PLATOON_MIN_AB       = 20;    // min AB in EACH platoon split before the platoon modifier applies

// ‚îÄ‚îÄ STATE ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var D=null,BETS=[],LEGS=[],LOG_MODE='single',TOAST_T=null;
var REFRESH_T=null,COUNTDOWN_T=null,NEXT_R=null;
var SECT_OPEN={};
var LF={player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:'',score:null,mktKey:null};
var CALIB=null; // score-bucket hit-rate table, rebuilt each render from settled bets
var PF={odds:'',stake:'25',result:'PENDING'};
var ML_player='',ML_market='Over 0.5 Hits';

// ‚îÄ‚îÄ STORAGE ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function sg(k,d){try{var v=localStorage.getItem('he9_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem('he9_'+k,JSON.stringify(v));}catch(e){}}
BETS=sg('bets',[]);

// ‚îÄ‚îÄ PARKS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var PARKS={'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,'Dodger Stadium':101,'T-Mobile Park':100,'Progressive Field':100,'Nationals Park':100,'Daikin Park':98,'Minute Maid Park':98,'Angel Stadium':99,'Chase Field':99,'loanDepot park':98,'Oracle Park':97,'Citi Field':97,'Comerica Park':97,'Petco Park':96,'Target Field':96,'PNC Park':96,'Busch Stadium':95,'Kauffman Stadium':95,'Tropicana Field':97,'Sutter Health Park':98};

// Park factors by category (display-only ‚Äî base scoring already uses PARKS above).
// Only the teams below have multi-category data; others fall back to the single factor.
var PARK_FACTORS={
  'COL':{runs:1.31,hr:1.22,hits:1.15,tier:'extreme'},'TEX':{runs:1.12,hr:1.18,hits:1.06,tier:'hitter'},
  'CIN':{runs:1.08,hr:1.10,hits:1.05,tier:'hitter'},'PHI':{runs:1.07,hr:1.14,hits:1.04,tier:'hitter'},
  'MIL':{runs:1.01,hr:0.99,hits:1.01,tier:'neutral'},'NYM':{runs:0.98,hr:0.95,hits:0.99,tier:'neutral'},
  'MIN':{runs:0.97,hr:1.02,hits:0.98,tier:'neutral'},'LAD':{runs:0.96,hr:0.94,hits:0.97,tier:'pitcher'},
  'SD':{runs:0.92,hr:0.87,hits:0.94,tier:'pitcher'},'SF':{runs:0.91,hr:0.82,hits:0.93,tier:'pitcher'},
  'MIA':{runs:0.89,hr:0.81,hits:0.92,tier:'pitcher'}
};
var TEAM_ABBR={'Arizona Diamondbacks':'AZ','Atlanta Braves':'ATL','Baltimore Orioles':'BAL','Boston Red Sox':'BOS','Chicago Cubs':'CHC','Chicago White Sox':'CWS','Cincinnati Reds':'CIN','Cleveland Guardians':'CLE','Colorado Rockies':'COL','Detroit Tigers':'DET','Houston Astros':'HOU','Kansas City Royals':'KC','Los Angeles Angels':'LAA','Los Angeles Dodgers':'LAD','Miami Marlins':'MIA','Milwaukee Brewers':'MIL','Minnesota Twins':'MIN','New York Mets':'NYM','New York Yankees':'NYY','Philadelphia Phillies':'PHI','Pittsburgh Pirates':'PIT','San Diego Padres':'SD','San Francisco Giants':'SF','Seattle Mariners':'SEA','St. Louis Cardinals':'STL','Tampa Bay Rays':'TB','Texas Rangers':'TEX','Toronto Blue Jays':'TOR','Washington Nationals':'WSH','Athletics':'ATH','Oakland Athletics':'ATH'};
function parkLabel(tier){return tier==='extreme'?"EXTREME HITTER'S PARK":tier==='hitter'?"HITTER'S PARK":tier==='pitcher'?"PITCHER'S PARK":'NEUTRAL';}
function parkColor(tier){return (tier==='extreme'||tier==='hitter')?'var(--grn)':tier==='pitcher'?'var(--red)':'var(--mut)';}
// Resolve a park profile for the HOME team; rich multi-category if available, else
// derive a tier from the single PARKS factor already on the pick.
function parkInfo(homeTeam, factor){
  var abbr=TEAM_ABBR[homeTeam]||'', pf=abbr&&PARK_FACTORS[abbr];
  if(pf)return{abbr:abbr,tier:pf.tier,runs:pf.runs,hr:pf.hr,hits:pf.hits,rich:true};
  var f=factor||100, tier=f>=108?'extreme':f>=104?'hitter':f>=96?'neutral':'pitcher';
  return{abbr:abbr,tier:tier,factor:f,rich:false};
}
// Weather (Addition 4): retractable/dome parks are treated weather-neutral (no call,
// roof assumed closed when unknown); everything else is outdoor. Cities feed OpenWeatherMap.
var STADIUM_TYPE={'AZ':'retractable','HOU':'retractable','SEA':'retractable','MIA':'retractable','MIL':'retractable','TEX':'retractable','TOR':'retractable'};
var CITY_BY_ABBR={'AZ':'Phoenix,US','ATL':'Atlanta,US','BAL':'Baltimore,US','BOS':'Boston,US','CHC':'Chicago,US','CWS':'Chicago,US','CIN':'Cincinnati,US','CLE':'Cleveland,US','COL':'Denver,US','DET':'Detroit,US','HOU':'Houston,US','KC':'Kansas City,US','LAA':'Anaheim,US','LAD':'Los Angeles,US','MIA':'Miami,US','MIL':'Milwaukee,US','MIN':'Minneapolis,US','NYM':'New York,US','NYY':'New York,US','PHI':'Philadelphia,US','PIT':'Pittsburgh,US','SD':'San Diego,US','SF':'San Francisco,US','SEA':'Seattle,US','STL':'St. Louis,US','TB':'St. Petersburg,US','TEX':'Arlington,US','TOR':'Toronto,CA','WSH':'Washington,US','ATH':'Sacramento,US'};
function windCardinal(deg){if(deg==null)return'';return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
// Temperature modifier only (orientation-independent). Wind OUT/IN needs per-park
// field-orientation data we don't have yet, so wind is displayed but not scored.
function weatherMod(w){
  if(!w||w.neutral||w.temp==null)return 0;
  if(w.temp>85)return 1;
  if(w.temp<50)return -2;
  return 0;
}

// ‚îÄ‚îÄ PROP SECTIONS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Ordered by Tier (best edge first)
var SECTIONS=[
  // Tier 1 ‚Äî core edge

// ‚îÄ‚îÄ STATCAST-DRIVEN TYPING (Wave 2) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Classify the opposing starter into a vulnerability type. Statcast metrics
// (hard-hit%, barrel%, whiff%) come from Baseball Savant; ERA/WHIP/K9 from MLB.
// Returns null when there isn't enough data to type the pitcher (honest fallback).
function classifyPitcher(pm, ps){
  if(!pm)return null;
  var era=pm.era,whip=pm.whip,k9=pm.k9,bb9=pm.bb9;
  var hh=ps?ps.hard_hit_percent:null, br=ps?ps.barrel_batted_rate:null, wh=ps?ps.whiff_percent:null, bb=ps?ps.bb_percent:null;
  var walkHi=(bb!=null)?bb>8:(bb9!=null&&bb9>3.0); // Savant BB% preferred, BB/9 proxy when absent
  if(era>5.00&&whip>1.50&&hh!=null&&hh>40) return{key:'TYPE3',label:'UNIVERSAL TARGET',best:'all bats ‚Äî Singles & H+R+RBI'};
  if(hh!=null&&br!=null&&wh!=null&&hh>40&&br>8&&wh<22) return{key:'TYPE1',label:'POWER TARGET',best:'power bats ‚Äî H+R+RBI & TB'};
  if(whip>1.40&&walkHi&&k9<7.0) return{key:'TYPE2',label:'CONTACT TARGET',best:'contact bats ‚Äî Singles & Hits'};
  if(era<3.00&&k9>9.0&&hh!=null&&hh<30) return{key:'TYPE4',label:'AVOID',best:'no edge ‚Äî fade'};
  return null;
}
// Bat type vs pitcher vulnerability type -> match strength
function matchLevel(batKey, typeKey){
  if(!typeKey||!batKey)return null;
  if(typeKey==='TYPE4')return{label:'AVOID',cls:'red',icon:'&#10060;'};
  if(batKey==='CONTACT'&&typeKey==='TYPE2')return{label:'PERFECT MATCH',cls:'grn',icon:'&#9989;'};
  if(batKey==='POWER'&&typeKey==='TYPE1')return{label:'PERFECT MATCH',cls:'grn',icon:'&#9989;'};
  if(typeKey==='TYPE3'&&(batKey==='POWER'||batKey==='CONTACT'||batKey==='HYBRID'))return{label:'STRONG MATCH',cls:'grn',icon:'&#9989;'};
  if(batKey==='POWER'&&typeKey==='TYPE2')return{label:'PARTIAL MATCH',cls:'amb',icon:'&#9888;'};
  if(batKey==='CONTACT'&&typeKey==='TYPE1')return{label:'PARTIAL MATCH',cls:'amb',icon:'&#9888;'};
  if(batKey==='HYBRID'&&(typeKey==='TYPE1'||typeKey==='TYPE2'))return{label:'PARTIAL MATCH',cls:'amb',icon:'&#9888;'};
  return null;
}
// Composite luck gap: expected (Savant) minus actual. Positive = under-rewarded so far.
function luckGap(b, bs){
  if(!bs||!b)return null;
  var sum=0,parts=[];
  if(bs.xba!=null&&b.avg!=null){sum+=bs.xba-b.avg;parts.push({k:'xBA',x:bs.xba,a:b.avg});}
  if(bs.xslg!=null&&b.slg!=null){sum+=bs.xslg-b.slg;parts.push({k:'xSLG',x:bs.xslg,a:b.slg});}
  if(bs.xwoba!=null&&bs.woba!=null){sum+=bs.xwoba-bs.woba;parts.push({k:'xwOBA',x:bs.xwoba,a:bs.woba});}
  if(!parts.length)return null;
  return{sum:Math.round(sum*1000)/1000,parts:parts};
}
// Estimated plate appearances tonight by batting-order spot (top of order sees more PA)
function paEstimate(spot){if(!spot)return'';var m={1:'4-5',2:'4-5',3:'4',4:'4',5:'3-4',6:'3-4',7:'3-4',8:'3',9:'3'};return m[spot]||'3-4';}
// Platoon modifier (Addition 1): compare tonight's split (vs the SP's hand) to the
// other split. Favorable = tonight is the batter's stronger side. Switch hitters are
// handled automatically since their vs-RHP split already reflects batting lefty.
function platoonMod(tonight, other){
  if(!tonight||!other||tonight.ab<PLATOON_MIN_AB||other.ab<PLATOON_MIN_AB)return null;
  var diff=Math.round((tonight.ops-other.ops)*1000)/1000, mag=Math.abs(diff), adj=0;
  if(diff>0)adj=mag>0.100?4:(mag>=0.050?2:0);
  else if(diff<0)adj=mag>0.100?-4:(mag>=0.050?-2:0);
  return{adj:adj,side:diff>0?'FAVORABLE':(diff<0?'UNFAVORABLE':'NEUTRAL'),diff:diff};
}

async function getBatterStats(name){
  var s=await apiFetch(MLB+'/people/search?names='+encodeURIComponent(name)+'&sportId=1');
  var person=s&&s.people&&s.people[0];
  var pid=person&&person.id;
  if(!pid)return null;
  var d=await apiFetch(MLB+'/people/'+pid+'?hydrate=stats(group=hitting,type=season,season='+SEASON+'),currentTeam&sportId=1');
  var splits=d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length)return null;
  var team=d&&d.people&&d.people[0]&&d.people[0].currentTeam&&d.people[0].currentTeam.name||'';
  var batSide=d&&d.people&&d.people[0]&&d.people[0].batSide&&d.people[0].batSide.code||''; // L/R/S

  // Platoon splits (vs LHP / vs RHP) ‚Äî one extra call per batter
  var splitVsL=null,splitVsR=null;
  var psp=await apiFetch(MLB+'/people/'+pid+'/stats?stats=statSplits&group=hitting&season='+SEASON+'&sitCodes=vl,vr');
  var psps=psp&&psp.stats&&psp.stats[0]&&psp.stats[0].splits||[];
  psps.forEach(function(x){
    var code=x.split&&x.split.code, o={avg:parseFloat(x.stat.avg)||0,obp:parseFloat(x.stat.obp)||0,slg:parseFloat(x.stat.slg)||0,ops:parseFloat(x.stat.ops)||0,ab:parseInt(x.stat.atBats)||0};
    if(code==='vl')splitVsL=o;else if(code==='vr')splitVsR=o;
  });
  var st=splits[0].stat;
  var g=Math.max(parseInt(st.gamesPlayed)||1,1);
  var hits=parseInt(st.hits)||0,hrs=parseInt(st.homeRuns)||0,tb=parseInt(st.totalBases)||0;
  var runs=parseInt(st.runs)||0,rbi=parseInt(st.rbi)||0;
  var dbl=parseInt(st.doubles)||0,tri=parseInt(st.triples)||0,sb=parseInt(st.stolenBases)||0;
  var avg=parseFloat(st.avg)||0,obp=parseFloat(st.obp)||0,slg=parseFloat(st.slg)||0;
  var sng=Math.max(hits-hrs-tri-dbl,0);

  // Rolling 10-game stats (more predictive than season per spec)
  var gl=await apiFetch(MLB+'/people/'+pid+'/stats?stats=gameLog&group=hitting&season='+SEASON+'&sportId=1');
  var gls=gl&&gl.stats&&gl.stats[0]&&gl.stats[0].splits||[];
  var recent10=gls.slice(-10);
  var r10H=0,r10AB=0,r10BB=0,r10sng=0;
  recent10.forEach(function(r){
    var rh=parseInt(r.stat.hits)||0,rab=parseInt(r.stat.atBats)||0;
    var rhr=parseInt(r.stat.homeRuns)||0,rdbl=parseInt(r.stat.doubles)||0,rtri=parseInt(r.stat.triples)||0;
    r10H+=rh;r10AB+=rab;r10BB+=parseInt(r.stat.baseOnBalls)||0;
    r10sng+=Math.max(rh-rhr-rdbl-rtri,0);
  });
  var roll10avg=r10AB>0?Math.round(r10H/r10AB*1000)/1000:avg;
  var roll10obp=r10AB>0?Math.round((r10H+r10BB)/(r10AB+r10BB)*1000)/1000:obp;

  // Last 14 days for hot/cold
  // Last 7 days for hot/cold ‚Äî streaks come and go week to week
  var cut=new Date();cut.setDate(cut.getDate()-7);
  var tH=0,tAB=0;
  for(var i=gls.length-1;i>=0;i--){if(new Date(gls[i].date)<cut)break;tH+=parseInt(gls[i].stat.hits)||0;tAB+=parseInt(gls[i].stat.atBats)||0;}
  var l7=tAB>0?Math.round(tH/tAB*1000)/1000:0;
  var diff=tAB>=10?l7-avg:0; // need at least 10 ABs in window to call a streak
  var hotCold=diff>=0.050?'HOT':diff>=0.020?'Warming':diff<=-0.050?'COLD':diff<=-0.020?'Cooling':'Neutral';

  // Career floor penalty applied to rolling avg if career context is weak
  // Prevents rolling window from overriding thin career sample
  var adjRoll10avg = roll10avg;
  var adjRoll10obp = roll10obp;
  if(g < CAREER_GAME_MIN || avg < CAREER_AVG_FLOOR){
    // Blend rolling avg with career avg (60/40) to prevent pure hot-streak inflation
    adjRoll10avg = Math.round((roll10avg*0.4 + avg*0.6)*1000)/1000;
    adjRoll10obp = Math.round((roll10obp*0.4 + obp*0.6)*1000)/1000;
  }

  return{
    playerId:pid,
    team:team,
    batSide:batSide, splitVsL:splitVsL, splitVsR:splitVsR,
    games:g,
    avg,obp,slg,
    iso:Math.round(Math.max(slg-avg,0)*1000)/1000, // Isolated Power = SLG - AVG (bat-type input)
    roll10avg:adjRoll10avg,
    roll10obp:adjRoll10obp,
    rawRoll10avg:roll10avg,  // keep original for display
    rawRoll10obp:roll10obp,
    hotCold,
    bbRate:Math.round(Math.max(obp-avg,0)*1000)/1000,
    hpg:Math.round(hits/g*100)/100,
    hrpg:Math.round(hrs/g*100)/100,
    tbpg:Math.round(tb/g*100)/100,
    runspg:Math.round(runs/g*100)/100,
    rbipg:Math.round(rbi/g*100)/100,
    sbpg:Math.round(sb/g*100)/100,
    sngpg:Math.round(sng/g*100)/100
  };
}

// Parse one CSV line honoring quoted fields (Savant quotes the name + some values).
function parseCSVLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){var c=line[i];
    if(c==='"'){q=!q;}
    else if(c===','&&!q){out.push(cur);cur='';}
    else cur+=c;}
  out.push(cur);return out;
}
// CSV -> { player_id : {metric:number,...} }
function parseSavant(txt){
  var map={};if(!txt)return map;
  var lines=txt.split('\n').filter(function(l){return l.trim();});
  if(lines.length<2)return map;
  var hdr=parseCSVLine(lines[0].replace(/^Ôªø/,''));
  var idx={};hdr.forEach(function(h,i){idx[h.trim()]=i;});
  var pidI=idx['player_id'];if(pidI==null)return map;
  for(var r=1;r<lines.length;r++){
    var f=parseCSVLine(lines[r]);var pid=parseInt(f[pidI]);if(!pid)continue;
    var o={};
    for(var key in idx){
      if(key==='player_id'||key==='year'||key.indexOf('last_name')===0)continue;
      var v=f[idx[key]];o[key]=(v==null||v==='')?null:parseFloat(v);
    }
    map[pid]=o;
  }
  return map;
}
// Batter + pitcher Statcast leaderboards (keyed by MLB player_id), cached once/day.
async function loadStatcast(){
  var ck='sc_'+todayStr();var cached=sg(ck,null);
  if(cached&&cached.bat&&cached.pit&&(Object.keys(cached.bat).length||Object.keys(cached.pit).length))return cached;
  var base='https://baseballsavant.mlb.com/leaderboard/custom?year='+SEASON+'&filter=&min=1&sort=4&sortDir=desc&csv=true&type=';
  var bsel='&selections=xba,xslg,xwoba,woba';
  var psel='&selections=whiff_percent,barrel_batted_rate,hard_hit_percent,k_percent,bb_percent,xslg,woba,xwoba';
  var bat={},pit={};
  try{var br=await fetch(base+'batter'+bsel);if(br.ok)bat=parseSavant(await br.text());}catch(e){console.warn('savant batter',e.message);}
  try{var pr=await fetch(base+'pitcher'+psel);if(pr.ok)pit=parseSavant(await pr.text());}catch(e){console.warn('savant pitcher',e.message);}
  var out={bat:bat,pit:pit};
  if(Object.keys(bat).length||Object.keys(pit).length)ss(ck,out);
  return out;
}

// Weather per game (OpenWeatherMap). FAIL-SAFE: any error / dead key -> that game's
// weather is null and the rest of the app proceeds. Cached for the day only once a
// real reading comes back, so an inactive key keeps retrying until it works.
async function loadWeather(oddsGames){
  var ck='wx_'+todayStr(), cached=sg(ck,null);
  if(cached)return cached;
  var out={};
  for(var i=0;i<oddsGames.length;i++){
    var g=oddsGames[i], gameStr=g.away_team+' @ '+g.home_team;
    var abbr=TEAM_ABBR[g.home_team]||'', type=STADIUM_TYPE[abbr]||'outdoor';
    if(type!=='outdoor'){out[gameStr]={neutral:true,type:type};continue;}
    var city=CITY_BY_ABBR[abbr];
    if(!city){out[gameStr]=null;continue;}
    var w=null;
    try{w=await apiFetch('https://api.openweathermap.org/data/2.5/weather?q='+encodeURIComponent(city)+'&appid='+OWM_KEY+'&units=imperial');}catch(e){w=null;}
    if(w&&w.main){
      out[gameStr]={temp:Math.round(w.main.temp),humidity:w.main.humidity,
        windSpeed:Math.round((w.wind&&w.wind.speed)||0),windDeg:(w.wind&&w.wind.deg!=null?w.wind.deg:null),
        desc:(w.weather&&w.weather[0]&&w.weather[0].main)||''};
    }else{out[gameStr]=null;} // dead key or error ‚Äî move on, no weather for this game
    await slp(120);
  }
  var any=Object.keys(out).some(function(k){return out[k]&&out[k].temp!=null;});
  if(any)ss(ck,out); // only cache once weather actually came back (so a 401 keeps retrying)
  return out;
}

// ‚îÄ‚îÄ SCORING MODELS (split by prop type per spec) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ

// Regression guard (v10): the 10-game window must cut BOTH ways. A rolling
// avg/obp BELOW the season baseline is decline, not edge ‚Äî penalize it so a high
// H/G can't float a cooling bat onto the premium card. Returns a score delta.
function trendPenalty(roll, season){
  if(roll==null||season==null)return 0;
  var gap=roll-season;
  if(gap<=-0.050)return -16;
  if(gap<=-0.035)return -11;
  if(gap<=-0.025)return -7;
  if(gap<=-0.015)return -3;
  return 0;
}

// TIER 1: Singles model ‚Äî floor prop, highest confidence
// Inputs: rolling AVG, H/G, contact profile, park
function scoreSingles(b, park){
  var s=0;
  // Rolling 10-game avg gets more weight than season (spec)
  if(b.roll10avg>=0.320)s+=28;else if(b.roll10avg>=0.290)s+=20;else if(b.roll10avg>=0.260)s+=12;else if(b.roll10avg>=0.240)s+=5;
  // Season avg as secondary
  if(b.avg>=0.300)s+=12;else if(b.avg>=0.270)s+=7;else if(b.avg>=0.250)s+=3;
  // Singles per game
  if(b.sngpg>=0.80)s+=20;else if(b.sngpg>=0.60)s+=13;else if(b.sngpg>=0.40)s+=7;
  // Low HR rate = contact hitter
  if(b.hrpg<=0.05)s+=15;else if(b.hrpg<=0.08)s+=8;else if(b.hrpg>=0.22)s-=15;
  // Low walk rate = putting ball in play
  if(b.bbRate<=0.04)s+=12;else if(b.bbRate<=0.07)s+=6;else if(b.bbRate>=0.12)s-=10;
  // Park (not park-dependent but slight edge in hitter parks)
  if(park>=108)s+=5;else if(park<96)s-=3;
  // Hot/cold (only counts with 100+ games per spec)
  if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;
  else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;
  // Regression guard: 10G avg below season avg = penalize (decline, not edge)
  s+=trendPenalty(b.roll10avg,b.avg);
  return Math.max(0,Math.min(100,Math.round(s)));
}

// TIER 2: Pitcher K model ‚Äî last-3-start avg vs line is KEY
function scorePitcherK(p, l3, line){
  var s=0;
  if(!p||!l3)return 0;
  // CRITICAL: last-3-start avg must clearly beat the line (spec)
  var l3beat=l3.avgK-line;
  if(l3beat>=2.0)s+=35;else if(l3beat>=1.0)s+=22;else if(l3beat>=0.5)s+=12;else if(l3beat>=0.0)s+=3;else s-=20; // last 3 below line = penalty
  // Season K/9
  if(p.k9>=9.5)s+=20;else if(p.k9>=8.5)s+=14;else if(p.k9>=7.5)s+=8;else if(p.k9<7.0)s-=10;
  // Season avgK as context
  if(p.avgK>=7.5)s+=12;else if(p.avgK>=6.5)s+=7;
  // Control (walks hurt deep starts)
  if(p.bb9<=2.0)s+=8;else if(p.bb9>=4.0)s-=10;
  // GS sample
  if(p.gs>=12)s+=8;else if(p.gs>=6)s+=4;else if(p.gs<4)s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

// TIER 2: H+R+RBI model ‚Äî lineup position weighted heavily
function scoreHRI(b, spot, park, line){
  var s=0;
  // Lineup position (spec: leadoff/2-hole get more PA and run opportunities)
  if(spot&&spot<=2)s+=25;else if(spot&&spot<=4)s+=15;else if(spot&&spot<=6)s+=7;else if(!spot)s+=5; // unknown spot small bonus
  // Rolling OBP (more predictive)
  if(b.roll10obp>=0.400)s+=20;else if(b.roll10obp>=0.370)s+=14;else if(b.roll10obp>=0.340)s+=8;else if(b.roll10obp>=0.310)s+=3;
  // Season OBP
  if(b.obp>=0.370)s+=10;else if(b.obp>=0.340)s+=6;else if(b.obp>=0.310)s+=3;
  // H/G
  if(b.hpg>=1.2)s+=12;else if(b.hpg>=1.0)s+=8;else if(b.hpg>=0.8)s+=4;
  // Run production
  var rprod=(b.runspg||0)+(b.rbipg||0);
  if(rprod>=1.5)s+=15;else if(rprod>=1.1)s+=10;else if(rprod>=0.8)s+=5;
  // Park factor
  if(park>=108)s+=8;else if(park>=104)s+=4;else if(park<96)s-=6;
  // 2.5 line is harder (spec says always B-grade ‚Äî handled in filter)
  if(line>=2.5)s-=15;
  // Hot/cold (100+ games only)
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;
  else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=8;
  // Regression guard: 10G OBP below season OBP = penalize (decline, not edge)
  s+=trendPenalty(b.roll10obp,b.obp);
  return Math.max(0,Math.min(100,Math.round(s)));
}

// Hits model ‚Äî rolling avg primary input
function scoreHits(b, park){
  var s=0;
  // Rolling 10-game avg is primary (spec)
  if(b.roll10avg>=0.330)s+=30;else if(b.roll10avg>=0.300)s+=22;else if(b.roll10avg>=0.270)s+=14;else if(b.roll10avg>=0.250)s+=7;else if(b.roll10avg>=0.230)s+=2;
  // Season avg secondary
  if(b.avg>=0.300)s+=10;else if(b.avg>=0.270)s+=6;else if(b.avg>=0.250)s+=2;
  // H/G
  if(b.hpg>=1.3)s+=16;else if(b.hpg>=1.1)s+=10;else if(b.hpg>=0.9)s+=5;
  // Walk rate penalty (walks = 0 hits)
  if(b.bbRate>=0.12)s-=14;else if(b.bbRate>=0.09)s-=7;else if(b.bbRate>=0.06)s-=2;else if(b.bbRate<=0.03)s+=5;
  if(park>=108)s+=5;else if(park<96)s-=4;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;
  else if(b.hotCold==='COLD')s-=14;else if(b.hotCold==='Cooling')s-=7;
  // Regression guard: 10G avg below season avg = penalize (decline, not edge)
  s+=trendPenalty(b.roll10avg,b.avg);
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreTB(b,park){var s=0;if(b.slg>=0.500)s+=22;else if(b.slg>=0.450)s+=15;else if(b.slg>=0.400)s+=8;if(b.tbpg>=1.8)s+=18;else if(b.tbpg>=1.5)s+=12;else if(b.tbpg>=1.2)s+=6;if(b.bbRate>=0.12)s-=16;else if(b.bbRate>=0.09)s-=8;else if(b.bbRate>=0.06)s-=3;else if(b.bbRate<=0.03)s+=5;if(park>=108)s+=10;else if(park>=104)s+=6;else if(park>=100)s+=2;else if(park<96)s-=8;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreHR(b,park){var s=0;if(b.hrpg>=0.25)s+=32;else if(b.hrpg>=0.18)s+=22;else if(b.hrpg>=0.12)s+=13;else if(b.hrpg>=0.07)s+=5;if(b.slg>=0.500)s+=10;else if(b.slg>=0.450)s+=6;if(park>=112)s+=18;else if(park>=108)s+=12;else if(park>=104)s+=6;else if(park<96)s-=12;if(b.hotCold==='HOT')s+=7;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreRBI(b){var s=0;if(b.rbipg>=0.80)s+=28;else if(b.rbipg>=0.60)s+=18;else if(b.rbipg>=0.45)s+=9;if(b.slg>=0.500)s+=16;else if(b.slg>=0.450)s+=10;if(b.avg>=0.300)s+=9;else if(b.avg>=0.270)s+=5;if(b.hotCold==='HOT')s+=9;else if(b.hotCold==='COLD')s-=12;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreRuns(b){var s=0;if(b.runspg>=0.80)s+=28;else if(b.runspg>=0.60)s+=18;else if(b.runspg>=0.45)s+=9;if(b.obp>=0.380)s+=18;else if(b.obp>=0.350)s+=12;else if(b.obp>=0.320)s+=6;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreSB(b){var s=0;if(b.sbpg>=0.25)s+=42;else if(b.sbpg>=0.15)s+=28;else if(b.sbpg>=0.08)s+=14;else if(b.sbpg>=0.04)s+=5;if(b.obp>=0.370)s+=12;else if(b.obp>=0.340)s+=7;if(b.hotCold==='HOT')s+=7;else if(b.hotCold==='COLD')s-=14;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreWlk(b){var s=0;if(b.bbRate>=0.15)s+=33;else if(b.bbRate>=0.12)s+=22;else if(b.bbRate>=0.09)s+=13;else if(b.bbRate>=0.06)s+=6;if(b.hotCold==='HOT')s+=5;else if(b.hotCold==='COLD')s-=7;return Math.max(0,Math.min(100,Math.round(s)));}

// Opposing-pitcher matchup adjustment for hitter props.
// Returns a score delta in [-MATCHUP_MAX_ADJ, +MATCHUP_MAX_ADJ]: positive = favorable
// for the hitter (weak / hittable SP), negative = tough draw. Blends season ERA with
// last-3-start ERA so a slumping or locked-in starter actually moves the number.
function pitcherMatchupAdj(p, l3, key){
  if(!p||!p.era)return{adj:0,tag:''};
  var era=(l3&&l3.era>0)?Math.round((p.era*0.5+l3.era*0.5)*100)/100:p.era;
  var whip=p.whip||0, k9=p.k9||0, bb9=p.bb9||0;

  // Run-environment channel (ERA + WHIP) ‚Äî helps every hitter prop
  var env=0;
  if(era>=5.50)env+=10;else if(era>=4.75)env+=7;else if(era>=4.20)env+=4;
  else if(era>=3.60)env+=0;else if(era>=3.00)env-=5;else env-=9;
  if(whip>=1.45)env+=6;else if(whip>=1.32)env+=3;else if(whip>=1.20)env+=0;
  else if(whip>=1.10)env-=3;else env-=6;

  // Strikeout-suppression channel ‚Äî a high-K starter smothers contact props
  var kSup=0;
  if(k9>=10.5)kSup-=8;else if(k9>=9.3)kSup-=5;else if(k9>=8.3)kSup-=2;
  else if(k9>=7.2)kSup+=2;else kSup+=5;

  var adj=0;
  if(key==='batter_singles'||key==='batter_hits'||key==='batter_total_bases'){
    adj=env*0.8+kSup*1.0;                 // contact: K-rate matters most
  }else if(key==='batter_hits_runs_rbis'||key==='batter_rbis'||key==='batter_runs_scored'){
    adj=env*1.0+kSup*0.5;                 // run production: baserunners / run environment
  }else if(key==='batter_home_runs'){
    adj=env*0.9+kSup*0.2;                 // power: leans on hittability, K-rate less relevant
  }else if(key==='batter_walks'){
    var bbAdj=0;                          // walks: driven by the starter's own control
    if(bb9>=4.2)bbAdj+=10;else if(bb9>=3.5)bbAdj+=6;else if(bb9>=2.8)bbAdj+=2;else if(bb9<=2.0)bbAdj-=5;
    adj=bbAdj+env*0.3;
  }else if(key==='batter_stolen_bases'){
    adj=env*0.2;                          // steals are ~starter-independent in our data
  }else{
    adj=env*0.6+kSup*0.4;
  }

  adj=Math.max(-MATCHUP_MAX_ADJ,Math.min(MATCHUP_MAX_ADJ,Math.round(adj)));
  var tag=adj>=6?'JUICY':adj>=2?'soft':adj<=-6?'TOUGH':adj<=-2?'firm':'even';
  return{adj:adj,tag:tag};
}

// ‚îÄ‚îÄ APPLY ALL FILTERS AND GRADE (spec) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function applyFilters(pick){
  var k=pick.mktKey, b=pick.bStats, p=pick.pitSt, l3=pick.l3, line=pick.line;
  var grade=pick.rawGrade;
  var filters=[]; // list of applied filter notes

  // 1. Odds gate: -140 or better (already applied before this)
  // 2. K line max: 7.5+ excluded entirely per spec
  if(k==='pitcher_strikeouts'&&line>=7.5){
    return{pass:false,reason:'K line 7.5+ excluded'};
  }

  // Prop mismatch ‚Äî ELIMINATE entirely (bat type vs prop type):
  //  power bat on a singles prop, or contact bat on a multi-path H+R+RBI prop.
  if(pick.batKey==='POWER'&&k==='batter_singles')        return{pass:false,reason:'Mismatch: power bat on singles prop'};
  if(pick.batKey==='CONTACT'&&k==='batter_hits_runs_rbis')return{pass:false,reason:'Mismatch: contact bat on multi-path prop'};

  // Define hitter prop types ‚Äî H/G and career filters only apply to these
  var hitterProps=['batter_singles','batter_hits','batter_hits_runs_rbis',
    'batter_total_bases','batter_home_runs','batter_rbis',
    'batter_runs_scored','batter_stolen_bases','batter_walks'];
  var isHitterProp=hitterProps.indexOf(k)>-1;

  // 1b. Career floor filters ‚Äî hitter props only, NOT pitcher props
  if(b&&isHitterProp){

    // Hard exclude: season avg below .200 ‚Äî excluded from everything
    // This catches career backup types like Jackson (.153) from ever appearing
    if(b.avg<0.200){
      return{pass:false,reason:'Excluded: avg '+b.avg+' below .200 minimum'};
    }


    // FIX 1 & 2: H/G floor ‚Äî only for hitter props, correct operator
    // Players with H/G below 1.0 ‚Üí Watch List max
    // Only applies to hitter props (NOT pitcher Ks)
    if(b.hpg<1.0){
      if(grade==='A'){
        grade='B';
        filters.push('H/G '+b.hpg+' below 1.0 floor ‚Äî Watch List');
      }
    }

    // Career avg floor: below .220 ‚Üí Watch List max (soft penalty)
    if(b.avg<CAREER_AVG_FLOOR){
      if(grade==='A'){
        grade='B';
        filters.push('Career avg '+b.avg+' below .220 ‚Äî Watch List max');
      }
    }
  }
  // 3. Doubles excluded entirely
  if(k==='batter_doubles'){return{pass:false,reason:'Doubles excluded'};}

  // 4. 2.5 H+R+RBI hard capped at B per spec
  if(k==='batter_hits_runs_rbis'&&line>=HRI_25_LINE){
    grade='B';
    filters.push('2.5 line capped at B');
  }

  // 5. Rookie gate: under 50 games ‚Üí multi-path props capped at B
  if(b&&b.games<ROOKIE_GAME_GATE){
    if(k==='batter_hits_runs_rbis'||k==='batter_home_runs'||k==='batter_rbis'||k==='batter_runs_scored'){
      grade='B';
      filters.push('Rookie gate ('+b.games+' games) ‚Äî B max');
    }
  }

  // 6. K over: last-3-start requirement (spec)
  if(k==='pitcher_strikeouts'&&l3&&grade==='A'){
    if(l3.avgK<=line){
      grade='B';
      filters.push('Last-3 avg ('+l3.avgK+') does not beat line ('+line+')');
    }
  }

  // 7. Conflict check: if same game has pitcher K over AND hitter props, flag
  // (handled at game level below)

  return{pass:true,grade:grade,filters:filters};
}

// ‚îÄ‚îÄ CALIBRATION / TRACK RECORD ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Map a displayed (normalized) score to a bucket. Because scores are normalized
// to be comparable across props, one table works for every prop type.
var CALIB_BUCKETS=['90-100','80-89','70-79','65-69','50-64'];
function bucketOf(s){if(s>=90)return'90-100';if(s>=80)return'80-89';if(s>=70)return'70-79';if(s>=65)return'65-69';if(s>=50)return'50-64';return'<50';}
// Empirical hit rate of settled single bets in the last TRACK_DAYS, by score bucket.
// This IS the model's win probability ‚Äî measured from real results, never assumed.
function calibration(){
  var cut=Date.now()-TRACK_DAYS*86400000;
  var bk={};CALIB_BUCKETS.forEach(function(o){bk[o]={w:0,l:0,profit:0,staked:0};});
  BETS.forEach(function(b){
    if(!b.id||b.id<cut)return;                         // outside 30-day window
    if(b.score==null)return;                           // manual/parlay bet w/o a model score
    if(b.result!=='WIN'&&b.result!=='LOSS')return;     // unsettled
    var o=bucketOf(b.score);if(!bk[o])return;
    if(b.result==='WIN')bk[o].w++;else bk[o].l++;
    bk[o].profit+=(b.profit||0);bk[o].staked+=(b.stake||0);
  });
  var out={};CALIB_BUCKETS.forEach(function(o){
    var n=bk[o].w+bk[o].l;
    out[o]={w:bk[o].w,l:bk[o].l,n:n,rate:n>0?bk[o].w/n:null,roi:bk[o].staked>0?bk[o].profit/bk[o].staked:null};
  });
  return out;
}

// ‚îÄ‚îÄ PARLAY BUILDER ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function impliedProb(odds){
  // Convert American odds to implied probability
  if(odds<0)return Math.abs(odds)/(Math.abs(odds)+100);
  return 100/(odds+100);
}
function americanToDecimal(odds){
  if(odds>0)return 1+(odds/100);
  return 1+(100/Math.abs(odds));
}
function decimalToAmerican(dec){
  if(dec>=2.0)return Math.round((dec-1)*100);
  return Math.round(-100/(dec-1));
}
function parlayOdds(legs){
  var dec=legs.reduce(function(a,l){return a*americanToDecimal(l.odds);},1);
  return decimalToAmerican(dec);
}

function buildBestParlays(picks){
  var premium=picks.filter(function(p){return p.grade==='A';});
  if(premium.length<2)return null;

  // Rank every premium pick by implied probability descending
  // Higher implied prob = more likely to hit = better parlay leg
  var ranked=premium.map(function(p){
    return{
      name:p.name,
      prop:p.propLabel,
      odds:p.recOdds,
      game:p.game,
      team:p.pitcher||p.game, // use pitcher as team proxy
      isPitcher:p.isPitcher,
      prob:impliedProb(p.recOdds)
    };
  });
  ranked.sort(function(a,b){return b.prob-a.prob;});

  // Validation: no same game, no same team, no K over + hitter same game
  function valid(a,b){
    if(a.game===b.game)return false;
    if(a.team&&b.team&&a.team===b.team)return false;
    return true;
  }

  // Select top pick per game by implied probability
  var byGame={};
  ranked.forEach(function(p){
    if(!byGame[p.game]||p.prob>byGame[p.game].prob)byGame[p.game]=p;
  });
  var candidates=Object.values(byGame).sort(function(a,b){return b.prob-a.prob;});

  // Build best 2-leg: top 2 by implied prob from different games
  var best2=null;
  for(var i=0;i<candidates.length;i++){
    for(var j=i+1;j<candidates.length;j++){
      if(!valid(candidates[i],candidates[j]))continue;
      if(!best2){
        best2=[candidates[i],candidates[j]];
      }
      break; // already sorted by prob so first valid pair is best
    }
    if(best2)break;
  }

  // Build best 3-leg: top 3 by implied prob from different games
  var best3=null;
  for(var i=0;i<candidates.length;i++){
    for(var j=i+1;j<candidates.length;j++){
      if(!valid(candidates[i],candidates[j]))continue;
      for(var k=j+1;k<candidates.length;k++){
        if(!valid(candidates[i],candidates[k]))continue;
        if(!valid(candidates[j],candidates[k]))continue;
        if(!best3){
          best3=[candidates[i],candidates[j],candidates[k]];
        }
        break;
      }
      if(best3)break;
    }
    if(best3)break;
  }

  function makeParlay(legs){
    if(!legs)return null;
    var combined=parlayOdds(legs);
    return{
      legs:legs.map(function(l){return{name:l.name,prop:l.prop,odds:l.odds,game:l.game,prob:Math.round(l.prob*1000)/10};}),
      odds:combined
    };
  }

  return{two:makeParlay(best2),three:makeParlay(best3)};
}

// ‚îÄ‚îÄ CORRELATED SGP IDENTIFIER (Wave 2) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// A contact bat (batting 1-2) getting on base + a power bat (batting 3-5) driving
// in runs, vs a TYPE 2/3 hittable starter. One sequence can cash both legs.
function buildSGPs(picks){
  var prem=picks.filter(function(p){return p.grade==='A'&&!p.isPitcher&&p.bStats&&p.pitcher;});
  var byPit={}; // group by opposing pitcher = same opposing lineup
  prem.forEach(function(p){
    if(p.oppTypeKey!=='TYPE2'&&p.oppTypeKey!=='TYPE3')return;
    (byPit[p.pitcher]=byPit[p.pitcher]||[]).push(p);
  });
  var out=[];
  Object.keys(byPit).forEach(function(pit){
    var arr=byPit[pit];
    var contact=arr.filter(function(p){return p.batKey==='CONTACT'&&p.lineupSpot&&p.lineupSpot<=2;}).sort(function(a,b){return b.score-a.score;})[0];
    var power=arr.filter(function(p){return p.batKey==='POWER'&&p.lineupSpot>=3&&p.lineupSpot<=5;}).sort(function(a,b){return b.score-a.score;})[0];
    if(contact&&power){
      out.push({
        game:contact.game,time:contact.time,pitcher:pit,
        typeKey:contact.oppTypeKey,typeLabel:contact.oppTypeLabel,matchupTag:contact.matchupTag,
        legs:[
          {name:contact.name,prop:contact.propLabel,odds:contact.recOdds,spot:contact.lineupSpot,bat:'CONTACT'},
          {name:power.name,prop:power.propLabel,odds:power.recOdds,spot:power.lineupSpot,bat:'POWER'}
        ],
        combined:parlayOdds([{odds:contact.recOdds},{odds:power.recOdds}])
      });
    }
  });
  return out;
}

// ‚îÄ‚îÄ AUTOMATIC PICK OUTCOME TRACKING ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Purely additive: logs every generated pick, resolves it from box scores after the
// game ends, and aggregates real win rates. Uses he9_pick_* and he9_model_stats keys
// (separate from the manual bet log). Does NOT touch scoring/discovery/filters.
var MSTATS=null; // cached aggregated model stats, refreshed on render
function propShort(mktKey){return {batter_singles:'singles',batter_hits:'hits',batter_runs_scored:'runs',batter_rbis:'rbi',batter_total_bases:'total_bases',batter_hits_runs_rbis:'h_r_rbi',batter_walks:'walks',batter_stolen_bases:'stolen_bases',batter_home_runs:'home_runs',pitcher_strikeouts:'strikeouts'}[mktKey]||mktKey;}
function scoreBucket(s){return s>=90?'90-100':s>=80?'80-89':s>=70?'70-79':s>=60?'60-69':s>=50?'50-59':'<50';}
function pct(w,t,m){m=m||20;if(t<m)return'calibrating ('+t+'/'+m+')';return Math.round(w/t*100)+'% ('+w+'/'+t+')';}

// Immutable point-in-time snapshot ‚Äî never overwrite an already-logged pick.
function logPick(p){

    grade:p.grade,score:p.score,odds:p.recOdds,implied_prob:Math.round(impliedProb(p.recOdds)*1000)/1000,
    matchup_tag:((p.matchupTag||'').toUpperCase())||null,matchup_value:p.matchupAdj||0,
    platoon:p.platoonSide||null,platoon_value:p.platoonAdj||0,game_total:(p.gameTotal!=null?p.gameTotal:null),

    luck_gap:(p.luckSum!=null?p.luckSum:null),regression_due:(p.luckSum!=null&&p.luckSum>0.100),
    ten_game_trend:(p.bStats?p.bStats.hotCold:null),result:'PENDING',actual_stat:null,resolved_at:null};
  try{localStorage.setItem(key,JSON.stringify(rec));}catch(e){}
}
function logAllPicks(){ if(!D||!D.picks)return; D.picks.forEach(logPick); } // parlay legs are individual picks, already logged

function getAllLoggedPicks(){var a=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('he9_pick_')===0){try{a.push(JSON.parse(localStorage.getItem(k)));}catch(e){}}}return a;}
function statForProp(prop,b){
  var h=parseInt(b.hits)||0,d=parseInt(b.doubles)||0,t=parseInt(b.triples)||0,hr=parseInt(b.homeRuns)||0;
  if(prop==='singles')return Math.max(h-d-t-hr,0);
  if(prop==='hits')return h;
  if(prop==='runs')return parseInt(b.runs)||0;
  if(prop==='rbi')return parseInt(b.rbi)||0;
  if(prop==='total_bases')return parseInt(b.totalBases)||0;
  if(prop==='home_runs')return hr;
  if(prop==='walks')return parseInt(b.baseOnBalls)||0;
  if(prop==='stolen_bases')return parseInt(b.stolenBases)||0;
  if(prop==='h_r_rbi')return h+(parseInt(b.runs)||0)+(parseInt(b.rbi)||0);
  return 0;
}
function saveResolved(p,result,actual){p.actual_stat=actual;p.result=result;p.resolved_at=new Date().toISOString();try{localStorage.setItem('he9_pick_'+p.id,JSON.stringify(p));}catch(e){}}
function resolveOne(p,box){
  var pl=(box.teams.home.players&&box.teams.home.players['ID'+p.player_id])||(box.teams.away.players&&box.teams.away.players['ID'+p.player_id])||null;
  if(!pl){saveResolved(p,'DNP',null);return;} // not in box score = did not dress
  if(p.prop_type==='strikeouts'){
    var ps=(pl.stats&&pl.stats.pitching)||{};
    if(ps.inningsPitched==null){saveResolved(p,'DNP',null);return;}
    var k=parseInt(ps.strikeOuts)||0;
    saveResolved(p,(p.direction==='under'?k<p.line:k>p.line)?'WIN':'LOSS',k);return;
  }
  var b=(pl.stats&&pl.stats.batting)||{};
  var ab=parseInt(b.atBats)||0,bb=parseInt(b.baseOnBalls)||0;
  if(ab===0&&bb===0){saveResolved(p,'DNP',null);return;} // scratched / pinch role with no PA
  var actual=statForProp(p.prop_type,b);
  saveResolved(p,(p.direction==='under'?actual<p.line:actual>p.line)?'WIN':'LOSS',actual);
}
function yestStr(){var n=new Date();n.setDate(n.getDate()-1);return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
// Resolution pass: check schedule for Final games, then pull box scores once per game.
async function resolvePending(){
  var pend=getAllLoggedPicks().filter(function(p){return p.result==='PENDING'&&p.game_pk&&(p.date===todayStr()||p.date===yestStr());});
  if(!pend.length){buildModelStats();return;}
  var byDate={};pend.forEach(function(p){(byDate[p.date]=byDate[p.date]||{})[p.game_pk]=true;});
  var finalGames={};
  for(var dt in byDate){
    var sd=await apiFetch(MLB+'/schedule?sportId=1&date='+dt);
    var games=(sd&&sd.dates&&sd.dates[0]&&sd.dates[0].games)||[];
    games.forEach(function(g){var st=g.status&&(g.status.abstractGameState||g.status.codedGameState);if(st==='Final'||st==='F')finalGames[g.gamePk]=true;});
    await slp(150);
  }
  var byGame={};pend.forEach(function(p){if(finalGames[p.game_pk])(byGame[p.game_pk]=byGame[p.game_pk]||[]).push(p);});
  for(var gp in byGame){
    var box=await apiFetch(MLB+'/game/'+gp+'/boxscore');
    if(box&&box.teams&&box.teams.home&&box.teams.away){byGame[gp].forEach(function(p){resolveOne(p,box);});}
    await slp(200);
  }
  buildModelStats();
  if(D)renderPicks(); // refresh display with freshly resolved results
}
// Aggregate win rates across segments. DNP excluded from all rates.
function buildModelStats(){
  var all=getAllLoggedPicks();
  var s={total_generated:all.length,total_resolved:0,total_pending:0,total_dnp:0,
    by_grade:{},by_score_bucket:{},by_prop_type:{},by_matchup_tag:{},by_platoon:{},
    by_regression_due:{'true':{w:0,t:0},'false':{w:0,t:0}},by_trend:{},last_updated:new Date().toISOString()};
  function bump(o,key,won){if(key==null||key==='')return;if(!o[key])o[key]={w:0,t:0};o[key].t++;if(won)o[key].w++;}
  all.forEach(function(p){
    if(p.result==='PENDING'){s.total_pending++;return;}
    if(p.result==='DNP'){s.total_dnp++;return;}
    var won=p.result==='WIN';s.total_resolved++;
    bump(s.by_grade,p.grade,won);
    bump(s.by_score_bucket,scoreBucket(p.score),won);
    bump(s.by_prop_type,p.prop_type,won);
    bump(s.by_matchup_tag,p.matchup_tag,won);
    bump(s.by_platoon,p.platoon,won);
    bump(s.by_regression_due,p.regression_due?'true':'false',won);
    bump(s.by_trend,p.ten_game_trend,won);
  });
  try{localStorage.setItem('he9_model_stats',JSON.stringify(s));}catch(e){}
  MSTATS=s;return s;
}

        await slp(150);
      }
      var bStats=isPitcher?null:(batterCache[pName]||null);

      // Get pitcher stats for K props
      var pitSt=null,pitL3=null;
      if(isPitcher){
        if(ai2.homePitName===pName){pitSt=ai2.homePitSt;pitL3=ai2.homePitL3;}
        else if(ai2.awayPitName===pName){pitSt=ai2.awayPitSt;pitL3=ai2.awayPitL3;}
      }

      // Resolve this batter's side + opposing probable pitcher.
      // Team match (from MLB currentTeam) is primary so this works pre-lineup;
      // lineup membership is the fallback and also gives the batting-order spot.
      var oppPit=null,oppPitL3=null,oppPitName='',oppPitId=null,batSide='';
      var lineupSpot=null;
      var lineupConfirmed=ai2.lineupPosted||false;
      if(!isPitcher&&bStats){
        var awaySpot=(ai2.awayLineup||[]).find(function(p){return p.name===pName;});
        var homeSpot=(ai2.homeLineup||[]).find(function(p){return p.name===pName;});
        if(bStats.team&&bStats.team===ai2.awayTeam)batSide='away';
        else if(bStats.team&&bStats.team===ai2.homeTeam)batSide='home';
        else if(awaySpot)batSide='away';
        else if(homeSpot)batSide='home';
        if(batSide==='away'){oppPit=ai2.homePitSt;oppPitL3=ai2.homePitL3;oppPitName=ai2.homePitName||'';oppPitId=ai2.homePitId;}
        else if(batSide==='home'){oppPit=ai2.awayPitSt;oppPitL3=ai2.awayPitL3;oppPitName=ai2.awayPitName||'';oppPitId=ai2.awayPitId;}
        if(awaySpot)lineupSpot=awaySpot.spot;
        else if(homeSpot)lineupSpot=homeSpot.spot;
      }

      // Ace filter for batters ‚Äî skip ONLY if THIS batter's opposing SP is an ace
      // (spec: the other team's batters in the same game stay eligible). If the
      // batter's side can't be resolved, fall back to the conservative game-level rule.
      if(!isPitcher&&bStats){
        if(oppPit){ if(oppPit.isAce) continue; }
        else if(ai2.homeIsAce||ai2.awayIsAce){ continue; }
      }

      // Platoon: split is keyed by the opposing pitcher's hand (vs LHP / vs RHP).
      // Computed once per batter ‚Äî same for all of that batter's props.
      var oppThrows=oppPit?(oppPit.throws||''):'';
      var pm=null;
      if(!isPitcher&&bStats&&bStats.splitVsL&&bStats.splitVsR&&(oppThrows==='L'||oppThrows==='R')){
        var tonSpl=(oppThrows==='L')?bStats.splitVsL:bStats.splitVsR;
        var othSpl=(oppThrows==='L')?bStats.splitVsR:bStats.splitVsL;
        pm=platoonMod(tonSpl,othSpl);
      }

      // Career head-to-head vs tonight's starter (one MLB call per batter+pitcher pair).
      var h2h=null;
      if(!isPitcher&&bStats&&bStats.playerId&&oppPitId){
        var hk=bStats.playerId+'_'+oppPitId;
        if(!h2hCache.hasOwnProperty(hk)){h2hCache[hk]=await getH2H(bStats.playerId,oppPitId);await slp(120);}
        h2h=h2hCache[hk];
      }
      var h2hFlag=getH2HFlag(h2h);

      // Tracking identity (for auto-logging + box-score resolution)
      var pickPid=isPitcher?((ai2.homePitName===pName)?ai2.homePitId:(ai2.awayPitName===pName?ai2.awayPitId:null)):(bStats?bStats.playerId:null);
      var teamFull='',oppFull='';
      if(isPitcher){var pIsHome=(ai2.homePitName===pName);teamFull=pIsHome?og2.home_team:og2.away_team;oppFull=pIsHome?og2.away_team:og2.home_team;}
      else{teamFull=(batSide==='away')?og2.away_team:(batSide==='home')?og2.home_team:'';oppFull=(batSide==='away')?og2.home_team:(batSide==='home')?og2.away_team:'';}
      var teamAbbr=TEAM_ABBR[teamFull]||'',oppAbbr=TEAM_ABBR[oppFull]||'';

      mktKeys.forEach(function(k){
        var mkt=mkts[k];
        if(!mkt)return;

        // FIX 3: Score FIRST using pure stats ‚Äî no odds involved
        // recOdds derived from score after, not before
        var score=0;
        if(k==='batter_singles')            score=scoreSingles(bStats||{},park);
        else if(k==='pitcher_strikeouts')   score=scorePitcherK(pitSt,pitL3,mkt.line);
        else if(k==='batter_hits_runs_rbis')score=scoreHRI(bStats||{},lineupSpot,park,mkt.line);
        else if(k==='batter_hits')          score=scoreHits(bStats||{},park);
        else if(k==='batter_total_bases')   score=scoreTB(bStats||{},park);
        else if(k==='batter_home_runs')     score=scoreHR(bStats||{},park);
        else if(k==='batter_rbis')          score=scoreRBI(bStats||{});
        else if(k==='batter_runs_scored')   score=scoreRuns(bStats||{});
        else if(k==='batter_stolen_bases')  score=scoreSB(bStats||{});
        else if(k==='batter_walks')         score=scoreWlk(bStats||{});
        else return;

        // Opposing-pitcher matchup adjustment ‚Äî hitter props only, graded on a
        // spectrum (the binary ace skip above only removes the extreme tail).
        var mAdj=0,mTag='';
        if(!isPitcher){
          var mu=pitcherMatchupAdj(oppPit,oppPitL3,k);
          mAdj=mu.adj;mTag=mu.tag;
          score=Math.max(0,Math.min(100,score+mAdj));
          // Platoon modifier (favorable/unfavorable handedness)
          if(pm)score=Math.max(0,Math.min(100,score+pm.adj));
          // Weather: temperature modifier only (wind shown but not scored yet)
          var wAdj=weatherMod(weather[gameStr]);
          if(wAdj)score=Math.max(0,Math.min(100,score+wAdj));
        }

        // rawScore = internal model points. Each model has a different ceiling
        // (see PROP_MAX), so raw points are NOT comparable across props.
        var rawScore=score;
        // Normalize to a common 0-100 scale: 100 = the best this prop can
        // realistically score. Now the displayed number reads the same everywhere
        // ‚Äî a 90 Singles and a 90 Walks are equally strong FOR THEIR prop.
        var propMax=PROP_MAX[k]||100;
        score=Math.max(0,Math.min(100,Math.round(rawScore/propMax*100)));

        // Recommended side comes from the RAW model signal (tuned on raw points),
        // never from odds and never from the normalized display number.
        var recOdds=(k==='pitcher_strikeouts'&&rawScore<55)?mkt.under:mkt.over;
        if(!recOdds||recOdds<MIN_ODDS)return;

        if(score<40)return;

        // Grade off the normalized score so the badge always matches the number.
        var rawGrade=score>=65?'A':score>=50?'B':'C';
        if(rawGrade==='C')return;

        // Track K picks for conflict check
        if(k==='pitcher_strikeouts'&&rawGrade==='A'&&recOdds===mkt.over){
          kPickGames[gameStr]=true;
        }

        // Build label
        var sideOver=(k==='pitcher_strikeouts'&&rawScore<55)?'Under':'Over';
        var lmap={'batter_hits_runs_rbis':'H+R+RBI','batter_singles':'Singles','batter_hits':'Hits','batter_total_bases':'Total Bases','batter_home_runs':'HR','batter_rbis':'RBI','batter_runs_scored':'Runs Scored','batter_stolen_bases':'SB','batter_walks':'Walks','pitcher_strikeouts':'Strikeouts'};
        var propLabel=sideOver+' '+mkt.line+' '+(lmap[k]||k);

        // True opposing pitcher (this batter's side) ‚Äî used for display and the
        // per-team premium cap. Empty for pitcher K props.
        var oppPitcher=isPitcher?'':oppPitName;

        // ‚îÄ‚îÄ CONTEXT LAYERS (display only ‚Äî no scoring impact) ‚îÄ‚îÄ
        // Line movement: remember the first odds we saw for THIS pick+side today.
        var lkey=pName+'|'+k+'|'+mkt.line+'|'+sideOver;
        if(openLines[lkey]==null)openLines[lkey]=recOdds;
        var oddsOpen=openLines[lkey];
        // Exit risk (K props): the starting pitcher's own team moneyline.
        var pitTeam=null,pitML=null;
        if(isPitcher){
          if(ai2.homePitName===pName)pitTeam=og2.home_team;
          else if(ai2.awayPitName===pName)pitTeam=og2.away_team;
          if(pitTeam)pitML=mlMap[pitTeam];
        }

        // ‚îÄ‚îÄ STATCAST LAYERS (Wave 2, display only) ‚Äî hitter props ‚îÄ‚îÄ
        var bKey=(bStats?(batType(bStats.iso)||{}).key:null)||null;
        var bSav=(bStats&&statcast.bat)?statcast.bat[bStats.playerId]:null;
        var lg=(bStats&&!isPitcher)?luckGap(bStats,bSav):null;
        var pSav=(oppPitId&&statcast.pit)?statcast.pit[oppPitId]:null;
        var oppVuln=(!isPitcher)?classifyPitcher(oppPit,pSav):null;

        rawPicks.push({
          name:pName,game:gameStr,time:fmtTime(og2.commence_time),
          park,mktKey:k,propLabel,line:mkt.line,
          recOdds,overOdds:mkt.over,underOdds:mkt.under,
          score,rawScore:rawScore,propMax:propMax,rawGrade,bStats,pitSt,pitL3,
          lineupSpot,lineupConfirmed,
          isPitcher,
          pitcher:oppPitcher,
          matchupAdj:isPitcher?0:Math.round(mAdj/propMax*100), matchupTag:isPitcher?'':mTag,
          oppPitName:oppPitcher,
          oppERA:oppPit&&oppPit.era, oppWHIP:oppPit&&oppPit.whip, oppK9:oppPit&&oppPit.k9,
          oppL3era:(oppPitL3&&oppPitL3.era)||null,
          gameTotal:(totalMap[gameStr]!=null?totalMap[gameStr]:null),
          oddsOpen:oddsOpen, oddsMove:recOdds-oddsOpen,
          pitTeam:pitTeam, pitML:(pitML!=null?pitML:null),
          batKey:bKey,
          luckSum:lg?lg.sum:null, luckParts:lg?lg.parts:null,
          hitStat:bSav||null, oppStat:pSav||null,
          oppThrows:oppThrows, batSide:(bStats?bStats.batSide:''),
          splitVsL:(bStats?bStats.splitVsL:null), splitVsR:(bStats?bStats.splitVsR:null),
          platoonAdj:pm?pm.adj:0, platoonSide:pm?pm.side:null, platoonDiff:pm?pm.diff:null,
          h2h:h2h||null, h2hFlag:h2hFlag,
          homeTeam:og2.home_team, parkVenue:(ai2.venue||''),
          wx:(weather[gameStr]||null),
          pid:pickPid, teamAbbr:teamAbbr, oppAbbr:oppAbbr, gamePk:(ai2.gamePk||null),
          direction:(sideOver==='Under'?'under':'over'),
          oppTypeKey:oppVuln?oppVuln.key:null, oppTypeLabel:oppVuln?oppVuln.label:null, oppTypeBest:oppVuln?oppVuln.best:null
        });
      });
    }
    await slp(150);
  }
  ss('open_'+todayStr(),openLines); // persist first-seen odds for line movement

  // Apply all spec filters
  var picks=[];
  var mismatchNotes=[]; // bat-type/prop mismatches eliminated (for transparency)
  rawPicks.forEach(function(p){
    // Conflict check: skip batter props in games with K over
    if(!p.isPitcher&&kPickGames[p.game]){
      // Per spec: flag conflict but don't exclude entirely ‚Äî just note it
      p.conflictFlag=true;
    }
    var result=applyFilters(p);
    if(!result.pass){
      if(result.reason&&result.reason.indexOf('Mismatch')===0)mismatchNotes.push({name:p.name,prop:p.propLabel,reason:result.reason});
      return;
    }
    p.grade=result.grade;
    p.filterNotes=result.filters;
    picks.push(p);
  });

  // Sort: A first then B, by score
  picks.sort(function(a,b){
    if(a.grade!==b.grade)return a.grade<b.grade?-1:1;
    return b.score-a.score;
  });

  // Same-team filter: max 1 premium pick per team per game
  // When 2+ picks from same team qualify, keep highest score only
  // Group by team+game, sort by score, push lower ones to Watch List
  var teamGameGroups={};
  picks.forEach(function(p){
    if(p.grade==='A'&&!p.isPitcher&&p.bStats){
      // Determine team from game string and pitcher
      // Use pitcher as proxy for team grouping ‚Äî same pitcher = same opposing team
      var teamKey=p.game+'|'+(p.pitcher||'unknown');
      if(!teamGameGroups[teamKey])teamGameGroups[teamKey]=[];
      teamGameGroups[teamKey].push(p);
    }
  });
  Object.values(teamGameGroups).forEach(function(group){
    if(group.length<=1)return;
    // Sort by score descending ‚Äî keep top 1, push rest to Watch List
    group.sort(function(a,b){return b.score-a.score;});
    for(var gi=1;gi<group.length;gi++){
      group[gi].grade='W';
      group[gi].isWatchList=true;
      if(!group[gi].filterNotes)group[gi].filterNotes=[];
      group[gi].filterNotes.push('Same-team filter: kept '+group[0].name+' ('+group[0].score+') over this pick');
    }
  });

  // 5-pick cap removed ‚Äî quality filters do the job now
  // All picks that clear every filter go on the premium card

  // Three tiers for display:
  // Premium: all A-grade picks that cleared every filter
  // Watch:   B-grade + overflow A (bonus bets only)
  // (Research tier is internal ‚Äî not shown)

  // Same-game indicator: flag picks that share a game (parlay-construction guard)
  var gameCounts={};
  picks.forEach(function(p){gameCounts[p.game]=(gameCounts[p.game]||0)+1;});
  picks.forEach(function(p){p.sameGame=gameCounts[p.game]>1;});

  // Correlated-SGP signal: two picks vs the SAME pitcher, BOTH a STRONG/PERFECT
  // bat-vs-vulnerability match = a correlated same-game opportunity (build as an
  // SGP), which is the OPPOSITE of the cross-game "do not parlay" caution.
  function strongMatch(p){
    if(p.isPitcher||!p.bStats)return false;
    var ml=matchLevel(p.batKey,p.oppTypeKey);
    return !!ml&&(ml.label==='PERFECT MATCH'||ml.label==='STRONG MATCH');
  }
  picks.forEach(function(p){
    p.sgpPartner=null;
    if(!p.pitcher||!strongMatch(p))return;
    var partner=picks.find(function(q){
      return q!==p&&q.name!==p.name&&!q.isPitcher&&q.game===p.game&&q.pitcher===p.pitcher&&strongMatch(q);
    });
    if(partner)p.sgpPartner=partner.name;
  });

  // Build best parlays from premium card
  var bestParlays=buildBestParlays(picks);

  D={picks,totals,aceNotes,bestParlays,mismatchNotes:mismatchNotes,
    sgps:buildSGPs(picks),
    upcoming:upcoming.length,live:live.length,finished:finished.length,
    date:new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
    oddsAsOf:oddsAsOf,
    generatedAt:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET',
    loadedAt:new Date().toLocaleTimeString()};

  logAllPicks();      // snapshot every pick (immutable) before rendering
  buildModelStats();  // refresh aggregate win rates from whatever has resolved so far

  var premCount=picks.filter(function(p){return p.grade==='A';}).length;
  var watchCount=picks.filter(function(p){return p.grade==='B'||p.grade==='W';}).length;
  setP('Updated '+D.loadedAt+' \u2022 '+premCount+' premium \u2022 '+watchCount+' watch');
  renderPicks();renderTotals();updPnLHdr();
  if(!REFRESH_T)startAR();
  resolvePending(); // resolve any finished games (fire-and-forget; refreshes display when done)
}

// Model Performance header ‚Äî only segments with 20+ resolved picks (proof-of-model).
function modelPerfBlock(){
  var s=MSTATS||sg('model_stats',null); if(!s)return'';
  var h='<div class="card" style="border-color:var(--gld);background:var(--sur)">';
  h+='<div style="font-size:13px;font-weight:700;color:var(--gld);margin-bottom:2px">&#128202; Model Performance (all-time)</div>';
  h+='<div style="font-size:10px;color:var(--mut);margin-bottom:8px">Tracked '+s.total_generated+' &middot; Resolved '+s.total_resolved+' &middot; Pending '+s.total_pending+(s.total_dnp?' &middot; DNP '+s.total_dnp:'')+'</div>';
  if(s.total_resolved<20){
    h+='<div style="font-size:11px;color:var(--mut)">Calibrating ‚Äî win rates appear once 20+ picks resolve ('+s.total_resolved+'/20). Picks auto-resolve from box scores as games finish.</div></div>';
    return h;
  }
  function seg(title,obj,order){
    var keys=(order||Object.keys(obj)).filter(function(k){return obj[k]&&obj[k].t>=20;});
    if(!keys.length)return'';
    var html='<div style="font-size:10px;font-weight:700;color:var(--txt);margin:7px 0 2px">'+title+'</div>';
    keys.forEach(function(k){var o=obj[k],r=Math.round(o.w/o.t*100),c=r>=60?'var(--grn)':r<48?'var(--red)':'var(--mut)',ic=r>=60?' &#9989;':r<40?' &#10060;':'';html+='<div style="font-size:11px;color:'+c+'">'+k+': '+r+'% ('+o.w+'/'+o.t+')'+ic+'</div>';});
    return html;
  }
  h+=seg('By grade',s.by_grade,['A','W','B']);
  h+=seg('By prop',s.by_prop_type);
  h+=seg('By matchup tag',s.by_matchup_tag,['JUICY','SOFT','EVEN','FIRM','TOUGH']);
  h+=seg('By platoon',s.by_platoon,['FAVORABLE','NEUTRAL','UNFAVORABLE']);
  h+=seg('Regression due',s.by_regression_due,['true','false']);
  h+=seg('By 10-game trend',s.by_trend,['HOT','Warming','Neutral','Cooling','COLD']);
  h+='</div>';return h;
}

// ‚îÄ‚îÄ RENDER PICKS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function renderPicks(){
  if(!D)return;
  CALIB=calibration(); // rebuild the score‚Üíhit-rate table from settled bets
  var premium=D.picks.filter(function(p){return p.grade==='A';});
  var watchlist=D.picks.filter(function(p){return p.grade==='B'||p.grade==='W';});

  var h='';
  // Status pills
  h+='<div class="stbar">';
  if(D.upcoming>0)h+='<span class="stpill st-up">&#9200; '+D.upcoming+' upcoming</span>';
  if(D.live>0)    h+='<span class="stpill st-lv">&#128308; '+D.live+' live</span>';
  if(D.finished>0)h+='<span class="stpill st-fn">&#10003; '+D.finished+' final</span>';
  if(D.aceNotes&&D.aceNotes.length)h+='<span class="stpill st-ace">&#9940; '+D.aceNotes.length+' ace filtered</span>';
  if(D.mismatchNotes&&D.mismatchNotes.length)h+='<span class="stpill st-ace">&#9940; '+D.mismatchNotes.length+' mismatch removed</span>';
  h+='</div>';
  // Eliminated bat-type/prop mismatches
  if(D.mismatchNotes&&D.mismatchNotes.length){
    h+='<div class="filter-note"><div style="font-size:11px;font-weight:700;color:var(--amb);margin-bottom:3px">&#9940; PROP MISMATCHES REMOVED</div>';
    D.mismatchNotes.forEach(function(m){h+='<div style="font-size:10px;color:var(--mut)"><span style="color:var(--txt)">'+m.name+'</span> &mdash; '+m.prop+' ('+m.reason.replace('Mismatch: ','')+')</div>';});
    h+='</div>';
  }

  // Card timestamp / odds-lock
  if(D.generatedAt||D.oddsAsOf){
    h+='<div style="font-size:10px;color:var(--mut);margin-bottom:8px">&#128197; Card generated '+(D.generatedAt||'--')+' &middot; odds current as of '+(D.oddsAsOf||'--')+' &middot; <span style="color:var(--amb)">bet early ‚Äî lines move</span></div>';
  }

  // Ace notes
  if(D.aceNotes&&D.aceNotes.length){
    h+='<div class="ace-note"><div style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px">&#9940; ACE PITCHERS ‚Äî BATTERS SKIPPED</div>';
    D.aceNotes.forEach(function(n){h+='<div style="font-size:11px;color:var(--mut)"><span style="color:var(--txt)">'+n.team+'</span> vs <span style="color:var(--amb)">'+n.pitcher+' ('+n.era+' ERA)</span> ‚Äî skipped</div>';});
    h+='<div style="font-size:10px;color:var(--mut);margin-top:4px">Other team\'s batters in these games may still appear.</div></div>';
  }

  if(D.upcoming===0&&D.live===0)h+='<div class="card" style="text-align:center;color:var(--mut);padding:20px">All games finished. Check back tomorrow.</div>';

  // How-to-read-the-score legend
  h+=modelPerfBlock();
