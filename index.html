<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hitters Edge v8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--sur:#111827;--sur2:#1a2235;--bdr:#1e2d45;
  --txt:#e2e8f0;--mut:#64748b;
  --grn:#22c55e;--gbg:#052e16;
  --amb:#f59e0b;--abg:#2d1a00;
  --red:#ef4444;--rbg:#2d0a0a;
  --blu:#3b82f6;--bbg:#0a1929;
  --pur:#a855f7;--pbg:#1e0a2d;
  --tel:#14b8a6;--tbg:#021a18;
  --nvy:#6366f1;--nbg:#0d0e2a;
  --gld:#fbbf24;--org:#ff9800;
}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:72px;max-width:640px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:var(--gld)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 6px;background:none;border:none;color:var(--mut);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb.on{color:var(--gld)}
.pg{display:none;padding:10px 10px 0}
.pg.on{display:block}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:8px}
.btn{background:var(--gld);color:#000;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn-s{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--gld)}
select.inp option{background:var(--sur2)}
.lbl{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.spnr{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.load{text-align:center;padding:50px 16px;color:var(--mut)}
.toast-el{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast-el.show{opacity:1}
/* SECTION COLLAPSE */
.sect{border:1px solid var(--bdr);border-radius:11px;overflow:hidden;margin-bottom:8px}
.sect-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;user-select:none}
.sect-hdr:active{opacity:.8}
.sect-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.sect-arr{font-size:11px;color:var(--mut);transition:transform .25s;display:inline-block}
.sect-arr.open{transform:rotate(180deg)}
.sect-body{display:none;padding:8px}
.sect-body.open{display:block}
/* PICK CARD */
.pick{border-radius:10px;padding:11px;margin-bottom:7px;border-left:4px solid}
.pick-a{background:#071a07;border-color:var(--grn)}
.pick-b{background:#1a1400;border-color:var(--amb)}
.prow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.pname{font-size:15px;font-weight:700}
.pgame{font-size:11px;color:var(--mut);margin-top:2px}
.pbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0}
.ba{background:var(--gbg);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.bb{background:var(--abg);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
.sbar{height:5px;background:var(--sur2);border-radius:3px;margin:6px 0;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.pgrid-box{background:rgba(0,0,0,.3);border-radius:7px;padding:5px;text-align:center}
.pgrid-val{font-size:13px;font-weight:700}
.pgrid-lbl{font-size:8px;color:var(--mut);margin-top:1px;text-transform:uppercase}
.pline{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.pline-bet{font-size:13px;font-weight:700;color:var(--gld)}
.pline-odds{font-size:15px;font-weight:700;color:var(--grn)}
/* STATUS PILLS */
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stpill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.st-up{background:var(--gbg);color:var(--grn)}
.st-lv{background:#1a0a00;color:var(--org)}
.st-fn{background:var(--sur2);color:var(--mut)}
/* TOTALS */
.tot-card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:11px;margin-bottom:8px}
/* P&L */
.pnlg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pnlb{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.bet-row{background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rbtns{display:flex;gap:5px;margin-top:6px}
.bw{background:var(--gbg);color:var(--grn);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.bl{background:var(--rbg);color:var(--red);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
/* LOG */
.tabrow{display:flex;gap:5px;margin-bottom:10px}
.tabb{flex:1;padding:7px;background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;text-align:center;font-weight:600}
.tabb.on{background:var(--gld);color:#000;border-color:var(--gld)}
.leg{background:var(--sur2);border-radius:8px;padding:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.leg-rm{background:var(--rbg);color:var(--red);border:1px solid var(--red);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer}
.stl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.stl::after{content:"";flex:1;height:1px;background:var(--bdr)}
.empty{text-align:center;padding:24px;color:var(--mut);font-size:13px;line-height:1.6}
.rbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer}
.warn{background:#1a0a00;border:1px solid var(--org);border-radius:9px;padding:10px;margin-bottom:8px;font-size:12px;color:var(--org)}
</style>
</head>

  <div>

<script>
'use strict';

// ── CONFIG ────────────────────────────────────────────────────────────────────
var ODDS_KEY  = 'c662d3af7ba8e40cddf08b0fca0684a9';
var ODDS_BASE = 'https://api.the-odds-api.com/v4';
var MLB_BASE  = 'https://statsapi.mlb.com/api/v1';

// ── STATE ─────────────────────────────────────────────────────────────────────
var D = null, BETS = [], LEGS = [], LOG_MODE = 'single';
var REFRESH_T = null, COUNTDOWN_T = null, NEXT_R = null;
var TOAST_T = null;
var SECT_OPEN = {}; // tracks which sections are open

// ── LOG FORM STATE ────────────────────────────────────────────────────────────
var LF = {player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
var PF = {odds:'',stake:'25',result:'PENDING'};
var ML_player = '', ML_market = 'Over 0.5 Hits';

// ── STORAGE ───────────────────────────────────────────────────────────────────
function sg(k,d){try{var v=localStorage.getItem('he8_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem('he8_'+k,JSON.stringify(v));}catch(e){}}
BETS = sg('bets',[]);

// ── PARK FACTORS ──────────────────────────────────────────────────────────────
var PARKS = {
  'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,
  'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,
  'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,
  'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,
  'Dodger Stadium':101,'UNIQLO Field at Dodger Stadium':101,
  'T-Mobile Park':100,'Progressive Field':100,'Nationals Park':100,
  'Daikin Park':98,'Minute Maid Park':98,'Angel Stadium':99,
  'Chase Field':99,'loanDepot park':98,'Oracle Park':97,
  'Citi Field':97,'Comerica Park':97,'Petco Park':96,
  'Target Field':96,'PNC Park':96,'Busch Stadium':95,
  'Kauffman Stadium':95,'Tropicana Field':97,'Sutter Health Park':98
};

// ── PROP SECTIONS CONFIG ──────────────────────────────────────────────────────
var SECTIONS = [
  {key:'batter_hits_runs_rbis',label:'Hits + Runs + RBI', icon:'&#128994;', col:'var(--grn)'},
  {key:'batter_hits',          label:'Hits',               icon:'&#129337;', col:'var(--tel)'},
  {key:'batter_singles',       label:'Singles',            icon:'1&#65039;', col:'var(--tel)'},
  {key:'batter_total_bases',   label:'Total Bases',        icon:'&#128311;', col:'var(--nvy)'},
  {key:'batter_home_runs',     label:'Home Runs',          icon:'&#128165;', col:'var(--pur)'},
  {key:'batter_rbis',          label:'RBI',                icon:'&#128170;', col:'#e91e63'},
  {key:'batter_runs_scored',   label:'Runs Scored',        icon:'&#127939;', col:'var(--grn)'},
  {key:'batter_stolen_bases',  label:'Stolen Bases',       icon:'&#128168;', col:'var(--tel)'},
  {key:'batter_doubles',       label:'Doubles',            icon:'2&#65039;', col:'var(--nvy)'},
  {key:'batter_walks',         label:'Walks',              icon:'&#128065;', col:'var(--blu)'},
  {key:'pitcher_strikeouts',   label:'Strikeouts',         icon:'&#9917;',   col:'var(--red)'},
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
function nav(n){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('pg-'+n).classList.add('on');
  document.getElementById('nb-'+n).classList.add('on');
  if(n==='log') renderLog();
  if(n==='pnl') renderPnL();
}

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  if(TOAST_T) clearTimeout(TOAST_T);
  TOAST_T=setTimeout(function(){t.classList.remove('show');},2800);
}

function setP(m){document.getElementById('lu').textContent=m;}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}

function fmtTime(iso){
  if(!iso) return 'TBD';
  try{
    return new Date(iso).toLocaleTimeString('en-US',{
      hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true
    })+' ET';
  }catch(e){return 'TBD';}
}

function fmtOdds(o){
  if(o===null||o===undefined) return '--';
  return o>0?'+'+o:String(o);
}

function hotBadge(hc){
  if(!hc||hc==='Neutral') return '';
  if(hc==='HOT')     return ' &#128293;&#128293;&#128293;';
  if(hc==='Warming') return ' &#128293;&#128293;';
  if(hc==='COLD')    return ' &#129704;&#129704;&#129704;';
  if(hc==='Cooling') return ' &#129704;';
  return '';
}

function calcProfit(odds,stake,result){
  if(result==='WIN') return odds>0?Math.round(stake*odds/100*100)/100:Math.round(stake*100/Math.abs(odds)*100)/100;
  if(result==='LOSS') return -stake;
  return 0;
}

// ── SECTION TOGGLE ────────────────────────────────────────────────────────────
function toggleSection(key){
  SECT_OPEN[key] = !SECT_OPEN[key];
  var body = document.getElementById('sb-'+key);
  var arr  = document.getElementById('sa-'+key);
  if(body){
    if(SECT_OPEN[key]){body.classList.add('open');}
    else{body.classList.remove('open');}
  }
  if(arr){
    if(SECT_OPEN[key]){arr.classList.add('open');}
    else{arr.classList.remove('open');}
  }
}

// ── ODDS API FETCHERS ─────────────────────────────────────────────────────────
async function fetchGames(){
  var url = ODDS_BASE+'/sports/baseball_mlb/odds?regions=us&markets=h2h,totals&oddsFormat=american&apiKey='+ODDS_KEY;
  try{
    var r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.error('Games fetch:',e);return null;}
}

async function fetchProps(eventId){
  var mkts = 'batter_hits,batter_hits_runs_rbis,batter_singles,batter_total_bases,batter_home_runs,batter_rbis,batter_runs_scored,batter_stolen_bases,batter_doubles,batter_walks,pitcher_strikeouts';
  var url = ODDS_BASE+'/sports/baseball_mlb/events/'+eventId+'/odds?regions=us&markets='+mkts+'&oddsFormat=american&apiKey='+ODDS_KEY;
  try{
    var r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.error('Props fetch:',e);return null;}
}

// ── MLB STATS ─────────────────────────────────────────────────────────────────
async function mlbFetch(url){
  try{
    var r=await fetch(url);
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){return null;}
}

async function getBatterStats(name, season){
  var s = await mlbFetch(MLB_BASE+'/people/search?names='+encodeURIComponent(name)+'&sportId=1');
  var pid = s&&s.people&&s.people[0]&&s.people[0].id;
  if(!pid) return null;
  var d = await mlbFetch(MLB_BASE+'/people/'+pid+'?hydrate=stats(group=hitting,type=season,season='+season+')&sportId=1');
  var splits = d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length) return null;
  var st = splits[0].stat;
  var g  = Math.max(parseInt(st.gamesPlayed)||1,1);
  var hits=parseInt(st.hits)||0, hrs=parseInt(st.homeRuns)||0;
  var tb=parseInt(st.totalBases)||0, runs=parseInt(st.runs)||0;
  var rbi=parseInt(st.rbi)||0, bb=parseInt(st.baseOnBalls)||0;
  var dbl=parseInt(st.doubles)||0, sb=parseInt(st.stolenBases)||0;
  var avg=parseFloat(st.avg)||0, obp=parseFloat(st.obp)||0, slg=parseFloat(st.slg)||0;

  // Last 14 days hot/cold
  var gl = await mlbFetch(MLB_BASE+'/people/'+pid+'/stats?stats=gameLog&group=hitting&season='+season+'&sportId=1');
  var gls = gl&&gl.stats&&gl.stats[0]&&gl.stats[0].splits||[];
  var cut=new Date(); cut.setDate(cut.getDate()-14);
  var tH=0,tAB=0;
  for(var i=gls.length-1;i>=0;i--){
    if(new Date(gls[i].date)<cut) break;
    tH+=parseInt(gls[i].stat.hits)||0;
    tAB+=parseInt(gls[i].stat.atBats)||0;
  }
  var l14avg = tAB>0?Math.round(tH/tAB*1000)/1000:0;
  var diff = l14avg - avg;
  var hotCold = diff>=0.050?'HOT':diff>=0.020?'Warming':diff<=-0.050?'COLD':diff<=-0.020?'Cooling':'Neutral';

  return{
    avg,obp,slg,hotCold,
    bbRate:Math.round((obp-avg)*1000)/1000,
    hpg:Math.round(hits/g*100)/100,
    hrpg:Math.round(hrs/g*100)/100,
    tbpg:Math.round(tb/g*100)/100,
    runspg:Math.round(runs/g*100)/100,
    rbipg:Math.round(rbi/g*100)/100,
    sbpg:Math.round(sb/g*100)/100,
    dbpg:Math.round(dbl/g*100)/100
  };
}

async function getPitcherStats(name, season){
  var s = await mlbFetch(MLB_BASE+'/people/search?names='+encodeURIComponent(name)+'&sportId=1');
  var pid = s&&s.people&&s.people[0]&&s.people[0].id;
  if(!pid) return null;
  var d = await mlbFetch(MLB_BASE+'/people/'+pid+'?hydrate=stats(group=pitching,type=season,season='+season+')&sportId=1');
  var splits = d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length) return null;
  var st=splits[0].stat;
  var ip=Math.max(parseFloat(st.inningsPitched)||1,1);
  var gs=parseInt(st.gamesStarted)||0;
  var ks=parseInt(st.strikeOuts)||0;
  var bbs=parseInt(st.baseOnBalls)||0;
  var hits=parseInt(st.hits)||0;
  return{
    era:parseFloat(st.era)||0,
    whip:parseFloat(st.whip)||0,
    k9:Math.round(ks/ip*9*10)/10,
    bb9:Math.round(bbs/ip*9*10)/10,
    avgK:gs>0?Math.round(ks/gs*10)/10:0,
    avgH:gs>0?Math.round(hits/gs*10)/10:0,
    gs:gs
  };
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function scoreHRI(b, park){
  // H+R+RBI combined — best for spots 1-5, needs OBP + run production
  var s=0;
  if(b.avg>=0.310)s+=20;else if(b.avg>=0.290)s+=14;else if(b.avg>=0.270)s+=8;else if(b.avg>=0.250)s+=3;
  if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=14;else if(b.obp>=0.320)s+=8;else if(b.obp>=0.300)s+=3;
  if(b.hpg>=1.2)s+=15;else if(b.hpg>=1.0)s+=10;else if(b.hpg>=0.8)s+=5;
  // Run production — runs + RBI per game
  var rprod = (b.runspg||0)+(b.rbipg||0);
  if(rprod>=1.5)s+=18;else if(rprod>=1.0)s+=12;else if(rprod>=0.7)s+=6;
  if(park>=108)s+=8;else if(park>=104)s+=4;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;
  else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreSingles(b){
  // Singles — pure contact, low HR rate, low walk rate
  var s=0;
  if(b.avg>=0.310)s+=30;else if(b.avg>=0.290)s+=22;else if(b.avg>=0.270)s+=14;else if(b.avg>=0.250)s+=7;
  // Low HR rate = more singles (not hitting it over the fence)
  if(b.hrpg<=0.05)s+=18;else if(b.hrpg<=0.08)s+=10;else if(b.hrpg>=0.20)s-=12;
  // Low walk rate = more singles (putting ball in play)
  if(b.bbRate<=0.04)s+=12;else if(b.bbRate<=0.07)s+=6;else if(b.bbRate>=0.12)s-=10;
  if(b.hpg>=1.2)s+=15;else if(b.hpg>=1.0)s+=10;else if(b.hpg>=0.8)s+=5;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;
  else if(b.hotCold==='COLD')s-=12;else if(b.hotCold==='Cooling')s-=6;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreHits(b){
  var s=0;
  if(b.avg>=0.320)s+=32;else if(b.avg>=0.300)s+=24;else if(b.avg>=0.280)s+=16;else if(b.avg>=0.260)s+=8;else if(b.avg>=0.240)s+=3;
  if(b.hpg>=1.3)s+=20;else if(b.hpg>=1.1)s+=13;else if(b.hpg>=0.9)s+=7;
  if(b.bbRate>=0.12)s-=15;else if(b.bbRate>=0.09)s-=8;else if(b.bbRate>=0.06)s-=3;else if(b.bbRate<=0.03)s+=5;
  if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreTB(b,park){
  var s=0;
  if(b.slg>=0.500)s+=25;else if(b.slg>=0.450)s+=18;else if(b.slg>=0.400)s+=10;else if(b.slg>=0.350)s+=4;
  if(b.tbpg>=1.8)s+=20;else if(b.tbpg>=1.5)s+=14;else if(b.tbpg>=1.2)s+=8;
  if(b.bbRate>=0.12)s-=18;else if(b.bbRate>=0.09)s-=10;else if(b.bbRate>=0.06)s-=4;else if(b.bbRate<=0.03)s+=5;
  if(park>=108)s+=12;else if(park>=104)s+=7;else if(park>=100)s+=3;else if(park<96)s-=8;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreHR(b,park){
  var s=0;
  if(b.hrpg>=0.25)s+=35;else if(b.hrpg>=0.18)s+=25;else if(b.hrpg>=0.12)s+=15;else if(b.hrpg>=0.07)s+=6;
  if(b.slg>=0.500)s+=12;else if(b.slg>=0.450)s+=7;
  if(park>=112)s+=18;else if(park>=108)s+=12;else if(park>=104)s+=6;else if(park<96)s-=12;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreRBI(b){
  var s=0;
  if(b.rbipg>=0.80)s+=30;else if(b.rbipg>=0.60)s+=20;else if(b.rbipg>=0.45)s+=10;
  if(b.slg>=0.500)s+=18;else if(b.slg>=0.450)s+=12;else if(b.slg>=0.400)s+=6;
  if(b.avg>=0.300)s+=10;else if(b.avg>=0.275)s+=6;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreRuns(b){
  var s=0;
  if(b.runspg>=0.80)s+=30;else if(b.runspg>=0.60)s+=20;else if(b.runspg>=0.45)s+=10;
  if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=13;else if(b.obp>=0.320)s+=7;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreSB(b){
  var s=0;
  if(b.sbpg>=0.25)s+=45;else if(b.sbpg>=0.15)s+=30;else if(b.sbpg>=0.08)s+=15;else if(b.sbpg>=0.04)s+=5;
  if(b.obp>=0.370)s+=12;else if(b.obp>=0.340)s+=7;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=15;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreDoubles(b,park){
  var s=0;
  if(b.dbpg>=0.20)s+=35;else if(b.dbpg>=0.14)s+=25;else if(b.dbpg>=0.09)s+=15;else if(b.dbpg>=0.05)s+=5;
  if(b.avg>=0.300)s+=12;else if(b.avg>=0.270)s+=7;
  if(b.slg>=0.470)s+=12;else if(b.slg>=0.420)s+=7;
  if(park>=108)s+=10;else if(park>=104)s+=6;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreWalks(b){
  var s=0;
  if(b.bbRate>=0.15)s+=35;else if(b.bbRate>=0.12)s+=25;else if(b.bbRate>=0.09)s+=15;else if(b.bbRate>=0.06)s+=7;
  if(b.hotCold==='HOT')s+=5;else if(b.hotCold==='COLD')s-=8;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scorePitcherK(p){
  var s=0;
  if(p.avgK>=7.5)s+=35;else if(p.avgK>=6.0)s+=25;else if(p.avgK>=4.5)s+=10;
  if(p.k9>=9.0)s+=22;else if(p.k9>=7.5)s+=14;
  if(p.avgH<=5.0)s+=15;else if(p.avgH<=6.5)s+=8;
  if(p.gs>=8)s+=10;else if(p.gs>=4)s+=5;
  if(p.bb9<=2.5)s+=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function getScore(mktKey, bStats, pStats, park){
  if(!bStats&&mktKey!=='pitcher_strikeouts') return 0;
  if(mktKey==='batter_hits_runs_rbis') return scoreHRI(bStats,park);
  if(mktKey==='batter_singles')        return scoreSingles(bStats);
  if(mktKey==='batter_hits')           return scoreHits(bStats);
  if(mktKey==='batter_total_bases')    return scoreTB(bStats,park);
  if(mktKey==='batter_home_runs')    return scoreHR(bStats,park);
  if(mktKey==='batter_rbis')         return scoreRBI(bStats);
  if(mktKey==='batter_runs_scored')  return scoreRuns(bStats);
  if(mktKey==='batter_stolen_bases') return scoreSB(bStats);
  if(mktKey==='batter_doubles')      return scoreDoubles(bStats,park);
  if(mktKey==='batter_walks')        return scoreWalks(bStats);
  if(mktKey==='pitcher_strikeouts')  return pStats?scorePitcherK(pStats):0;
  return 0;
}

// ── MAIN LOADER ───────────────────────────────────────────────────────────────
async function loadAll(){
  var season = 2026;
  document.getElementById('pg-picks').innerHTML = '<div class="load"><div class="spnr"></div>Loading today\'s props from The Odds API...</div>';
  document.getElementById('pg-totals').innerHTML = '<div class="load"><div class="spnr"></div>Loading game totals...</div>';
  setP('Fetching games...');

  // Step 1: Get today's games + totals
  var gamesData = await fetchGames();
  if(!gamesData){
    document.getElementById('pg-picks').innerHTML = '<div style="padding:10px"><div class="warn">&#9888; Could not reach The Odds API. Check connection or API key.<br><br><button class="btn" onclick="loadAll()">Retry</button></div></div>';
    setP('Error loading data');
    return;
  }
  if(!gamesData.length){
    document.getElementById('pg-picks').innerHTML = '<div class="empty">No MLB games today.</div>';
    setP('No games today');
    return;
  }

  // Separate upcoming vs others
  var now = new Date();
  var upcoming=[], live=[], finished=[];
  gamesData.forEach(function(g){
    var ct = new Date(g.commence_time);
    var elapsed = now - ct;
    if(ct > now) upcoming.push(g);
    else if(elapsed < 4*60*60*1000) live.push(g);
    else finished.push(g);
  });

  // Build totals from all games
  var totals = [];
  gamesData.forEach(function(g){
    var bk = (g.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(g.bookmakers&&g.bookmakers[0]);
    if(!bk) return;
    var tot = (bk.markets||[]).find(function(m){return m.key==='totals';});
    if(!tot) return;
    var ov = (tot.outcomes||[]).find(function(o){return o.name==='Over';});
    var un = (tot.outcomes||[]).find(function(o){return o.name==='Under';});
    if(!ov||!un) return;
    totals.push({
      game: g.away_team+' @ '+g.home_team,
      time: fmtTime(g.commence_time),
      line: ov.point,
      overOdds: ov.price,
      underOdds: un.price,
      park: PARKS[g.home_team]||100,
      isUpcoming: new Date(g.commence_time) > now
    });
  });

  // Step 2: Load props for upcoming games only
  setP('Loading props (0/'+upcoming.length+')...');
  var picks = [];
  var bCache = {}, pCache = {};

  for(var gi=0; gi<upcoming.length; gi++){
    var game = upcoming[gi];
    var park = PARKS[game.home_team]||100;
    setP('Props '+gi+'/'+upcoming.length+': '+game.away_team.split(' ').pop()+' @ '+game.home_team.split(' ').pop());

    var pd = await fetchProps(game.id);
    if(!pd||!pd.bookmakers||!pd.bookmakers.length){await slp(300);continue;}

    // Pick best book: DraftKings > FanDuel > BetMGM > first available
    var bookOrder = ['draftkings','fanduel','betmgm','caesars','bovada','mybookieag'];
    var bestBook = null;
    for(var bi=0;bi<bookOrder.length;bi++){
      var bk = pd.bookmakers.find(function(b){return b.key===bookOrder[bi];});
      if(bk){bestBook=bk;break;}
    }
    if(!bestBook) bestBook = pd.bookmakers[0];
    if(!bestBook) continue;

    // Build player->market->odds map
    // outcomes have: description (player name), name (Over/Under), price, point
    var playerMap = {}; // playerName -> mktKey -> {line,over,under}
    (bestBook.markets||[]).forEach(function(mkt){
      (mkt.outcomes||[]).forEach(function(o){
        if(!o.description) return;
        var pn = o.description;
        if(!playerMap[pn]) playerMap[pn]={};
        if(!playerMap[pn][mkt.key]) playerMap[pn][mkt.key]={line:o.point,over:null,under:null};
        if(o.name==='Over')  playerMap[pn][mkt.key].over  = o.price;
        if(o.name==='Under') playerMap[pn][mkt.key].under = o.price;
      });
    });

    // Score each player x market combination
    var playerNames = Object.keys(playerMap);
    for(var pi=0; pi<playerNames.length; pi++){
      var pName = playerNames[pi];
      var mkts = playerMap[pName];
      var mktKeys = Object.keys(mkts);

      // Load batter stats if needed
      if(!bCache.hasOwnProperty(pName)){
        var isPitcherOnly = mktKeys.length===1&&mktKeys[0]==='pitcher_strikeouts';
        if(!isPitcherOnly){
          bCache[pName] = await getBatterStats(pName, season);
          await slp(200);
        } else {
          bCache[pName] = null;
        }
      }

      // Load pitcher stats if needed
      if(mktKeys.indexOf('pitcher_strikeouts')>-1 && !pCache.hasOwnProperty(pName)){
        pCache[pName] = await getPitcherStats(pName, season);
        await slp(200);
      }

      var bStats = bCache[pName]||null;
      var pStats = pCache[pName]||null;

      mktKeys.forEach(function(mktKey){
        var mkt = mkts[mktKey];
        var score = getScore(mktKey, bStats, pStats, park);
        if(score<40) return;

        // Determine recommendation side
        var recOdds = mkt.over; // default to over
        // For Ks: if pitcher score high = over, low = under
        if(mktKey==='pitcher_strikeouts'){
          if(score<55){recOdds=mkt.under;}
          else{recOdds=mkt.over;}
        }

        if(!recOdds) return;
        if(recOdds < -140) return; // must be -140 or better per protocol

        var grade = score>=65?'A':score>=50?'B':'C';
        if(grade==='C') return;

        var propLabel = buildLabel(mktKey, mkt.line, score);

        picks.push({
          name:     pName,
          game:     game.away_team+' @ '+game.home_team,
          time:     fmtTime(game.commence_time),
          park:     park,
          mktKey:   mktKey,
          propLabel:propLabel,
          line:     mkt.line,
          overOdds: mkt.over,
          underOdds:mkt.under,
          recOdds:  recOdds,
          score:    score,
          grade:    grade,
          bStats:   bStats,
          pStats:   pStats
        });
      });
    }
    await slp(300);
  }

  // Sort: A before B, then by score descending
  picks.sort(function(a,b){
    if(a.grade!==b.grade) return a.grade<b.grade?-1:1;
    return b.score-a.score;
  });

  D = {
    picks:    picks,
    totals:   totals,
    upcoming: upcoming.length,
    live:     live.length,
    finished: finished.length,
    date:     new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
    loadedAt: new Date().toLocaleTimeString()
  };

  setP('Updated '+D.loadedAt+' \u2022 '+picks.length+' props');
  renderPicks();
  renderTotals();
  updPnLHdr();
  if(!REFRESH_T) startAutoRefresh();
}

function buildLabel(mktKey, line, score){
  var side = 'Over';
  if(mktKey==='pitcher_strikeouts'&&score<55) side='Under';
  // H+R+RBI line is typically 1.5, Singles is 0.5
  // These are always Over bets
  var labels = {
    'batter_hits_runs_rbis':'H+R+RBI','batter_singles':'Singles',
    'batter_hits':'Hits','batter_total_bases':'Total Bases',
    'batter_home_runs':'HR','batter_rbis':'RBI',
    'batter_runs_scored':'Runs Scored','batter_stolen_bases':'Stolen Bases',
    'batter_doubles':'Doubles','batter_walks':'Walks',
    'pitcher_strikeouts':'Strikeouts'
  };
  return side+' '+line+' '+(labels[mktKey]||mktKey);
}

// ── RENDER PICKS ──────────────────────────────────────────────────────────────
function renderPicks(){
  if(!D){return;}
  var aCount = D.picks.filter(function(p){return p.grade==='A';}).length;

  var h = '';

  // Status pills
  h += '<div class="stbar">';
  if(D.upcoming>0) h += '<span class="stpill st-up">&#9200; '+D.upcoming+' upcoming</span>';
  if(D.live>0)     h += '<span class="stpill st-lv">&#128308; '+D.live+' live</span>';
  if(D.finished>0) h += '<span class="stpill st-fn">&#10003; '+D.finished+' final</span>';
  h += '</div>';

  if(D.upcoming===0&&D.live===0){
    h += '<div class="card" style="text-align:center;color:var(--mut);padding:20px">All games finished. Check back tomorrow.</div>';
  }

  // Protocol card
  h += '<div class="card" style="background:var(--gbg);border-color:rgba(34,197,94,.3)">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center">';
  h += '<div><div style="font-size:12px;font-weight:700;color:var(--grn)">&#9733; A-Grade = Real Money</div>';
  h += '<div style="font-size:11px;color:var(--mut);margin-top:2px">$25 max &middot; -140 or better &middot; confirm lineup</div></div>';
  h += '<div style="text-align:right"><div style="font-size:22px;font-weight:700;color:var(--grn)">'+aCount+'</div><div style="font-size:9px;color:var(--mut)">A-Grade</div></div>';
  h += '</div></div>';

  // Copy for Claude
  h += '<button class="btn-s" onclick="copyPicks()" style="margin-bottom:8px">&#129302; Copy Picks for Claude Analysis</button>';
  h += '<div id="copy-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;color:var(--grn)">&#10003; Copied! Paste into Claude chat.</div>';

  if(!D.picks.length){
    h += '<div class="empty">No props posted yet for today\'s games.<br>Props appear 2-3 hrs before first pitch.<br><br><button class="rbtn" onclick="loadAll()">&#8635; Refresh</button></div>';
    document.getElementById('pg-picks').innerHTML = h;
    return;
  }

  // One collapsible section per prop type
  SECTIONS.forEach(function(sect){
    var sectPicks = D.picks.filter(function(p){return p.mktKey===sect.key;});
    if(!sectPicks.length) return; // hide empty sections

    var aC = sectPicks.filter(function(p){return p.grade==='A';}).length;
    var bC = sectPicks.filter(function(p){return p.grade==='B';}).length;

    // Default: open if has A-grade picks, closed otherwise
    if(!SECT_OPEN.hasOwnProperty(sect.key)) SECT_OPEN[sect.key] = aC>0;
    var isOpen = SECT_OPEN[sect.key];

    var hdrBg = aC>0 ? '#071a07' : 'var(--sur2)';

    h += '<div class="sect">';

    // Header — uses onclick that calls toggleSection directly
    h += '<div class="sect-hdr" style="background:'+hdrBg+'" onclick="toggleSection(\''+sect.key+'\')">';
    h += '<div class="sect-title">';
    h += '<span style="font-size:16px">'+sect.icon+'</span>';
    h += '<span style="color:'+sect.col+'">'+sect.label+'</span>';
    if(aC>0) h += '<span style="background:var(--gbg);color:var(--grn);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid rgba(34,197,94,.3)">'+aC+' &#9733;</span>';
    if(bC>0) h += '<span style="background:var(--abg);color:var(--amb);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid rgba(245,158,11,.3)">'+bC+' &#9889;</span>';
    h += '<span style="font-size:10px;color:var(--mut)">'+(aC+bC)+' picks</span>';
    h += '</div>';
    h += '<span id="sa-'+sect.key+'" class="sect-arr'+(isOpen?' open':'')+'" style="font-size:13px">&#9660;</span>';
    h += '</div>';

    // Body
    h += '<div id="sb-'+sect.key+'" class="sect-body'+(isOpen?' open':'')+'">';

    // Sort: A first then B, by score
    var sorted = sectPicks.slice().sort(function(a,b){
      if(a.grade!==b.grade) return a.grade<b.grade?-1:1;
      return b.score-a.score;
    });
    sorted.forEach(function(p){ h += pickCard(p); });

    h += '</div></div>';
  });

  h += '<div style="text-align:center;margin:10px 0"><button class="rbtn" onclick="loadAll()">&#8635; Refresh</button></div>';

  document.getElementById('pg-picks').innerHTML = h;
}

      h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--grn)">'+p.bStats.hpg+'</div><div class="pgrid-lbl">H/G</div></div>';

    } else {

      h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--blu)">'+p.bStats.obp+'</div><div class="pgrid-lbl">OBP</div></div>';
      h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--pur)">'+p.bStats.slg+'</div><div class="pgrid-lbl">SLG</div></div>';
      h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--amb)">'+p.bStats.hpg+'</div><div class="pgrid-lbl">H/G</div></div>';
    }

    h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--blu)">'+p.pStats.k9+'</div><div class="pgrid-lbl">K/9</div></div>';
    h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--grn)">'+p.pStats.avgK+'</div><div class="pgrid-lbl">K/Start</div></div>';
    h += '<div class="pgrid-box"><div class="pgrid-val" style="color:var(--mut)">'+p.pStats.gs+'</div><div class="pgrid-lbl">GS</div></div>';
    h += '</div>';
  }

  // Bet line with real odds
  h += '<div class="pline">';
  h += '<div><div style="font-size:10px;color:var(--mut)">Recommended Bet</div>';
  h += '<div class="pline-bet">'+p.propLabel+'</div></div>';
  h += '<div style="text-align:right"><div style="font-size:10px;color:var(--mut)">Odds</div>';
  h += '<div class="pline-odds">'+fmtOdds(p.recOdds)+'</div></div>';
  h += '</div>';

  h += '<button class="btn" onclick="logFromPick(\''+cid+'\')">+ Log This Bet</button>';
  h += '<button class="btn-s" onclick="addLeg(\''+cid+'\')">+ Add to Parlay</button>';
  h += '</div>';
  return h;
}

// ── RENDER TOTALS ─────────────────────────────────────────────────────────────
function renderTotals(){
  if(!D){return;}
  var h = '<div style="font-size:11px;color:var(--mut);margin-bottom:8px">Game over/under lines &mdash; DraftKings</div>';
  if(!D.totals.length){
    h += '<div class="empty">No totals loaded yet.</div>';
  } else {
    D.totals.forEach(function(t){
      var parkNote = t.park>=108?'&#128293; Hitter park':t.park<=96?'&#129704; Pitcher park':'';
      h += '<div class="tot-card">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">';
      h += '<div><div style="font-size:14px;font-weight:700">'+t.game+'</div>';
      h += '<div style="font-size:11px;color:var(--mut)">'+t.time+(parkNote?' &middot; '+parkNote:'')+'</div></div>';
      h += '<div style="font-size:18px;font-weight:700;color:var(--gld)">'+t.line+'</div></div>';
      h += '<div style="display:flex;gap:8px">';
      h += '<div style="flex:1;background:var(--gbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Over</div><div style="font-size:17px;font-weight:700;color:var(--grn)">'+fmtOdds(t.overOdds)+'</div></div>';
      h += '<div style="flex:1;background:var(--bbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Under</div><div style="font-size:17px;font-weight:700;color:var(--blu)">'+fmtOdds(t.underOdds)+'</div></div>';
      h += '</div>';
      if(!t.isUpcoming) h += '<div style="font-size:10px;color:var(--mut);margin-top:6px;text-align:center">&#128308; Game in progress or finished</div>';
      h += '</div>';
    });
  }
  document.getElementById('pg-totals').innerHTML = h;
}

// ── RENDER P&L ────────────────────────────────────────────────────────────────
function updPnLHdr(){
  var tot = BETS.reduce(function(a,b){return a+(b.profit||0);},0);
  var el = document.getElementById('pnl-hdr');
  el.textContent = (tot>=0?'+$':'-$')+Math.abs(tot).toFixed(2);
  el.style.color = tot>=0?'var(--grn)':'var(--red)';
}

function renderPnL(){
  var today = new Date().toLocaleDateString();
  var stats = BETS.reduce(function(a,b){
    a.total+=(b.profit||0);
    a.staked+=(b.stake||0);
    if(b.dateStr===today) a.today+=(b.profit||0);
    if(b.result==='WIN')a.wins++;
    else if(b.result==='LOSS')a.losses++;
    else a.pend++;
    return a;
  },{total:0,today:0,staked:0,wins:0,losses:0,pend:0});
  var roi = stats.staked>0?Math.round(stats.total/stats.staked*100):0;

  var h = '<div class="pnlg">';
  h += '<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(stats.today>=0?'var(--grn)':'var(--red)')+'">'+(stats.today>=0?'+$':'-$')+Math.abs(stats.today).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">TODAY</div></div>';
  h += '<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(stats.total>=0?'var(--grn)':'var(--red)')+'">'+(stats.total>=0?'+$':'-$')+Math.abs(stats.total).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">ALL TIME</div></div>';
  h += '<div class="pnlb"><div style="font-size:18px;font-weight:700">'+stats.wins+'W / '+stats.losses+'L</div><div style="font-size:10px;color:var(--mut)">RECORD</div></div>';
  h += '<div class="pnlb"><div style="font-size:18px;font-weight:700;color:'+(roi>=0?'var(--grn)':'var(--red)')+'">'+roi+'%</div><div style="font-size:10px;color:var(--mut)">ROI</div></div>';
  h += '</div>';

  if(!BETS.length){
    h += '<div class="empty">No bets logged yet.</div>';
  } else {
    h += '<div class="stl">Bet History</div>';
    BETS.forEach(function(b){
      var pc = b.result==='WIN'?'var(--grn)':b.result==='LOSS'?'var(--red)':'var(--mut)';
      var pl = b.result==='WIN'?'+$'+b.profit.toFixed(2):b.result==='LOSS'?'-$'+Math.abs(b.profit||0).toFixed(2):'PENDING';
      h += '<div class="bet-row">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b.player+'</div>';
      h += '<div style="font-size:10px;color:var(--mut)">'+b.dateStr+' &middot; '+b.market+' &middot; $'+b.stake+' @ '+fmtOdds(parseInt(b.odds||0))+'</div>';
      if(!b.result||b.result==='PENDING'){
        h += '<div class="rbtns"><button class="bw" onclick="markResult('+b.id+',\'WIN\')">&#10003; Win</button><button class="bl" onclick="markResult('+b.id+',\'LOSS\')">&#10007; Loss</button></div>';
      }
      h += '</div>';
      h += '<div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:700;color:'+pc+'">'+pl+'</div><div style="font-size:10px;color:var(--mut)">'+b.result+'</div></div>';
      h += '</div>';
    });
  }

  document.getElementById('pg-pnl').innerHTML = h;
  updPnLHdr();
}

// ── LOG TAB ───────────────────────────────────────────────────────────────────
var MKTS = [
  'Over 1.5 H+R+RBI','Over 2.5 H+R+RBI','Over 0.5 Singles',
  'Over 0.5 Hits','Over 1.5 Hits','Over 1.5 Total Bases','Over 2.5 Total Bases',
  'Over 0.5 HR','Over 0.5 RBI','Over 1.5 RBI','Over 0.5 Runs Scored',
  'Over 0.5 Stolen Bases','Over 0.5 Doubles','Over 0.5 Walks',
  'Over 4.5 Strikeouts','Over 5.5 Strikeouts','Over 6.5 Strikeouts','Over 7.5 Strikeouts',
  'Under 3.5 Strikeouts','Under 4.5 Strikeouts',
  'Over Game Total','Under Game Total','Other'
];

function renderLog(){
  var tabs = '<div class="tabrow">';
  tabs += '<div class="tabb'+(LOG_MODE==='single'?' on':'')+'" onclick="setLogMode(\'single\')">Single Bet</div>';
  tabs += '<div class="tabb'+(LOG_MODE==='parlay'?' on':'')+'" onclick="setLogMode(\'parlay\')">Parlay</div>';
  tabs += '</div>';
  document.getElementById('pg-log').innerHTML = tabs + (LOG_MODE==='single'?renderSingle():renderParlay());
}

function setLogMode(m){LOG_MODE=m;renderLog();}

function renderSingle(){
  var h = '<div class="card">';
  h += '<label class="lbl">Player / Pitcher</label>';
  h += '<input class="inp" id="lf-player" value="'+LF.player+'" placeholder="e.g. Yordan Alvarez" oninput="LF.player=this.value">';
  h += '<label class="lbl">Market</label>';
  h += '<select class="inp" onchange="LF.market=this.value">';
  MKTS.forEach(function(m){h+='<option'+(m===LF.market?' selected':'')+'>'+m+'</option>';});
  h += '</select>';
  h += '<label class="lbl">Odds (American)</label>';
  h += '<input class="inp" type="number" value="'+LF.odds+'" placeholder="-115" oninput="LF.odds=this.value">';
  h += '<label class="lbl">Stake ($)</label>';
  h += '<input class="inp" type="number" value="'+LF.stake+'" oninput="LF.stake=this.value">';
  h += '<label class="lbl">Result</label>';
  h += '<select class="inp" onchange="LF.result=this.value">';
  ['PENDING','WIN','LOSS'].forEach(function(r){h+='<option'+(r===LF.result?' selected':'')+'>'+r+'</option>';});
  h += '</select>';
  h += '<label class="lbl">Notes (optional)</label>';
  h += '<input class="inp" value="'+LF.notes+'" placeholder="matchup notes..." oninput="LF.notes=this.value">';
  h += '<button class="btn" onclick="submitBet()">Save Bet</button>';
  h += '</div>';
  return h;
}

function renderParlay(){
  var h = '<div class="card">';
  h += '<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px">LEGS ('+LEGS.length+')</div>';
  if(!LEGS.length){
    h += '<div style="text-align:center;padding:14px;color:var(--mut);font-size:12px;border:1px dashed var(--bdr);border-radius:8px;margin-bottom:10px">Tap &ldquo;+ Add to Parlay&rdquo; on any pick</div>';
  } else {
    LEGS.forEach(function(l,i){
      h += '<div class="leg"><div><div style="font-size:10px;color:var(--mut)">Leg '+(i+1)+'</div>';
      h += '<div style="font-size:13px;font-weight:600">'+l.player+'</div>';
      h += '<div style="font-size:11px;color:var(--mut)">'+l.market+'</div></div>';
      h += '<button class="leg-rm" onclick="removeLeg('+i+')">&#10005;</button></div>';
    });
  }
  // Manual add
  h += '<div style="border:1px dashed var(--bdr);border-radius:8px;padding:10px;margin-bottom:10px">';
  h += '<div style="font-size:10px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Add Leg Manually</div>';
  h += '<input class="inp" placeholder="Player name" value="'+ML_player+'" oninput="ML_player=this.value" style="margin-bottom:6px">';
  h += '<select class="inp" onchange="ML_market=this.value" style="margin-bottom:0">';
  MKTS.forEach(function(m){h+='<option>'+m+'</option>';});
  h += '</select>';
  h += '<button class="btn-s" onclick="addManualLeg()" style="margin-top:6px">+ Add Leg</button>';
  h += '</div>';
  h += '<label class="lbl">Combined Odds</label><input class="inp" type="number" placeholder="+350" value="'+PF.odds+'" oninput="PF.odds=this.value">';
  h += '<label class="lbl">Stake ($)</label><input class="inp" type="number" value="'+PF.stake+'" oninput="PF.stake=this.value">';
  h += '<label class="lbl">Result</label>';
  h += '<select class="inp" onchange="PF.result=this.value">';
  ['PENDING','WIN','LOSS'].forEach(function(r){h+='<option'+(r===PF.result?' selected':'')+'>'+r+'</option>';});
  h += '</select>';
  if(LEGS.length>=2){
    h += '<button class="btn" onclick="submitParlay()">Save Parlay ('+LEGS.length+' legs)</button>';
    h += '<button class="btn-s" onclick="copyParlay()">&#129302; Analyze Parlay with Claude</button>';
    h += '<div id="parlay-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;color:var(--grn)">&#10003; Copied! Paste into Claude.</div>';
  } else {
    h += '<div style="text-align:center;padding:8px;color:var(--mut);font-size:12px">Need at least 2 legs</div>';
  }
  h += '<button class="btn-s" style="background:var(--rbg);color:var(--red);border-color:var(--red);margin-top:6px" onclick="clearLegs()">Clear All Legs</button>';
  h += '</div>';
  return h;
}

// ── BET ACTIONS ───────────────────────────────────────────────────────────────
function logFromPick(cid){
  var d = window['_d'+cid];
  if(!d){toast('Error');return;}
  LF.player = d.player;
  LF.market = d.market;
  LF.notes  = d.game+' | '+d.time;
  LOG_MODE  = 'single';
  nav('log');
  toast('Pre-filled — set odds then save');
}

function addLeg(cid){
  var d = window['_d'+cid];
  if(!d){toast('Error');return;}
  LEGS.push({player:d.player, market:d.market});
  toast('Leg '+(LEGS.length)+' added');
  if(LOG_MODE==='parlay') renderLog();
}

function addManualLeg(){
  if(!ML_player.trim()){toast('Enter player name');return;}
  LEGS.push({player:ML_player, market:ML_market});
  ML_player='';
  toast('Leg '+LEGS.length+' added');
  renderLog();
}

function removeLeg(i){LEGS.splice(i,1);renderLog();}
function clearLegs(){LEGS=[];renderLog();toast('Cleared');}

function submitBet(){
  if(!LF.player.trim()){toast('Enter a player name');return;}
  var stake  = parseFloat(LF.stake)||25;
  var odds   = parseInt(LF.odds)||(-115);
  var profit = calcProfit(odds, stake, LF.result);
  BETS.unshift({
    id:      Date.now(),
    dateStr: new Date().toLocaleDateString(),
    player:  LF.player,
    market:  LF.market,
    odds:    odds,
    stake:   stake,
    result:  LF.result,
    profit:  profit,
    notes:   LF.notes
  });
  ss('bets', BETS);
  LF = {player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
  toast('&#9989; Bet saved!');
  renderLog();
  renderPnL();
}

function submitParlay(){
  if(LEGS.length<2){toast('Need 2+ legs');return;}
  if(!PF.odds){toast('Enter combined odds');return;}
  var stake  = parseFloat(PF.stake)||25;
  var odds   = parseInt(PF.odds)||0;
  var profit = calcProfit(odds, stake, PF.result);
  BETS.unshift({
    id:      Date.now(),
    dateStr: new Date().toLocaleDateString(),
    player:  'PARLAY ('+LEGS.length+' legs)',
    market:  LEGS.map(function(l,i){return (i+1)+'. '+l.player+' '+l.market;}).join(' | '),
    odds:    odds,
    stake:   stake,
    result:  PF.result,
    profit:  profit,
    notes:   ''
  });
  ss('bets', BETS);
  LEGS = [];
  PF   = {odds:'',stake:'25',result:'PENDING'};
  toast('&#9989; Parlay saved!');
  renderLog();
  renderPnL();
}

function markResult(id, result){
  var idx = BETS.findIndex(function(b){return b.id===id;});
  if(idx===-1) return;
  BETS[idx].result = result;
  BETS[idx].profit = calcProfit(BETS[idx].odds, BETS[idx].stake, result);
  ss('bets', BETS);
  toast(result==='WIN'?'&#9989; WIN!':'&#10060; Loss');
  renderPnL();
}

// ── COPY FOR CLAUDE ───────────────────────────────────────────────────────────
function copyPicks(){
  if(!D){toast('No data');return;}
  var aG = D.picks.filter(function(p){return p.grade==='A';});
  var bG = D.picks.filter(function(p){return p.grade==='B';});
  var wins = BETS.filter(function(b){return b.result==='WIN';}).length;
  var tot  = BETS.filter(function(b){return b.result!=='PENDING';}).length;

  var txt = 'HITTERS EDGE PICKS — '+D.date+'\n';
  txt += 'Record: '+wins+'W/'+(tot-wins)+'L'+(tot?' ('+Math.round(wins/tot*100)+'%)':'')+'\n';
  txt += 'Source: The Odds API (real props) + MLB Stats API (player stats)\n\n';

  txt += '=== A-GRADE PICKS ===\n';
  if(!aG.length) txt += 'None today\n';
  aG.forEach(function(p){
    txt += '\n'+p.name+'\n';
    txt += '  Bet: '+p.propLabel+'\n';
    txt += '  Odds: '+fmtOdds(p.recOdds)+'\n';
    txt += '  Score: '+p.score+'/100\n';
    txt += '  Game: '+p.game+' | '+p.time+'\n';
    if(p.bStats){
      txt += '  AVG: '+p.bStats.avg+' OBP: '+p.bStats.obp+' H/G: '+p.bStats.hpg+'\n';
      txt += '  Streak: '+p.bStats.hotCold+'\n';
    }
  });

  txt += '\n=== B-GRADE PICKS ===\n';
  if(!bG.length) txt += 'None\n';
  bG.slice(0,5).forEach(function(p){
    txt += p.name+' — '+p.propLabel+' '+fmtOdds(p.recOdds)+' ('+p.score+'/100)\n';
  });

  txt += '\n=== GAME TOTALS ===\n';
  D.totals.filter(function(t){return t.isUpcoming;}).forEach(function(t){
    txt += t.game+' | Line: '+t.line+' Over: '+fmtOdds(t.overOdds)+' Under: '+fmtOdds(t.underOdds)+'\n';
  });

  txt += '\nPLEASE ANALYZE:\n1. Top pick + best prop type today\n2. Best 2-3 leg parlay combo\n3. Any picks to avoid\n4. Overall assessment\n\nRULES: A-Grade=real money $25 max. B-Grade=bonus only. -140 or better.';

  copyText(txt, 'copy-ok');
}

function copyParlay(){
  var txt = 'PARLAY ANALYSIS — '+new Date().toLocaleDateString()+'\n\nLegs:\n';
  LEGS.forEach(function(l,i){
    txt += (i+1)+'. '+l.player+' — '+l.market+'\n';
    if(D){
      var m = D.picks.find(function(p){return p.name.toLowerCase().indexOf(l.player.toLowerCase())>-1;});
      if(m) txt += '   Score: '+m.score+'/100 | Odds: '+fmtOdds(m.recOdds)+(m.bStats?' | Streak: '+m.bStats.hotCold:'')+'\n';
    }
  });
  txt += '\nQuestions:\n1. Grade each leg\n2. Do they correlate?\n3. Weakest leg to cut\n4. Better as singles or parlay?';
  copyText(txt, 'parlay-ok');
}

function copyText(txt, okId){
  navigator.clipboard.writeText(txt).then(function(){
    showOk(okId); toast('&#10003; Copied!');
  }).catch(function(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');showOk(okId);toast('&#10003; Copied!');}
    catch(e){toast('Copy failed — try again');}
    document.body.removeChild(ta);
  });
}

function showOk(id){
  var el=document.getElementById(id);
  if(el){el.style.display='block';setTimeout(function(){el.style.display='none';},5000);}
}

// ── AUTO REFRESH ──────────────────────────────────────────────────────────────
function startAutoRefresh(){
  if(REFRESH_T) return;
  NEXT_R = Date.now() + 60*60*1000;
  REFRESH_T = setInterval(function(){
    loadAll();
    NEXT_R = Date.now() + 60*60*1000;
  }, 60*60*1000);
  if(COUNTDOWN_T) clearInterval(COUNTDOWN_T);
  COUNTDOWN_T = setInterval(function(){
    var el = document.getElementById('rtimer');
    if(!el) return;
    var diff = NEXT_R - Date.now();
    if(diff<=0){el.textContent='Refreshing...';return;}
    var m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
    el.textContent = 'Refresh in '+m+'m '+('0'+s).slice(-2)+'s';
  }, 1000);
}

loadAll();
