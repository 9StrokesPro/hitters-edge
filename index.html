<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hitters Edge v7</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--sur:#111827;--sur2:#1a2235;--bdr:#1e2d45;
  --txt:#e2e8f0;--mut:#64748b;
  --grn:#22c55e;--gbg:#052e16;
  --amb:#f59e0b;--abg:#2d1a00;
  --red:#ef4444;--rbg:#2d0a0a;
  --blu:#3b82f6;--bbg:#0a1929;
  --pur:#a855f7;--pbg:#1e0a2d;
  --tel:#14b8a6;--tbg:#021a18;
  --nvy:#6366f1;--nbg:#0d0e2a;
  --gld:#fbbf24;--org:#ff9800;
}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:72px;max-width:640px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:700;color:var(--gld)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 6px;background:none;border:none;color:var(--mut);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb.active{color:var(--gld)}
.pg{display:none;padding:12px 12px 0}
.pg.active{display:block}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:9px}
.sect{margin-bottom:8px;border-radius:11px;overflow:hidden;border:1px solid var(--bdr)}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;user-select:none}
.stit{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.scnt{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(0,0,0,.3)}
.sarr{font-size:11px;color:var(--mut);transition:transform .2s}
.sarr.open{transform:rotate(180deg)}
.sbdy{display:none;padding:8px}
.sbdy.open{display:block}
.s-hri .shdr{background:#0a1f0a}.s-hri .stit{color:var(--grn)}
.s-hit .shdr{background:var(--tbg)}.s-hit .stit{color:var(--tel)}
.s-tb  .shdr{background:var(--nbg)}.s-tb  .stit{color:var(--nvy)}
.s-hr  .shdr{background:var(--pbg)}.s-hr  .stit{color:var(--pur)}
.s-run .shdr{background:#0a1f0a}.s-run .stit{color:var(--grn)}
.s-rbi .shdr{background:#1a0a1a}.s-rbi .stit{color:#e91e63}
.s-sb  .shdr{background:var(--tbg)}.s-sb  .stit{color:var(--tel)}
.s-dbl .shdr{background:var(--nbg)}.s-dbl .stit{color:var(--nvy)}
.s-sgl .shdr{background:var(--tbg)}.s-sgl .stit{color:var(--tel)}
.s-wlk .shdr{background:var(--bbg)}.s-wlk .stit{color:var(--blu)}
.s-bk  .shdr{background:var(--abg)}.s-bk  .stit{color:var(--amb)}
.s-ok  .shdr{background:var(--bbg)}.s-ok  .stit{color:var(--blu)}
.s-uk  .shdr{background:var(--rbg)}.s-uk  .stit{color:var(--red)}
.s-pha .shdr{background:var(--bbg)}.s-pha .stit{color:var(--blu)}
.s-pwa .shdr{background:var(--bbg)}.s-pwa .stit{color:var(--blu)}
.s-per .shdr{background:var(--rbg)}.s-per .stit{color:var(--red)}
.s-pip .shdr{background:var(--pbg)}.s-pip .stit{color:var(--pur)}
.s-go  .shdr{background:#0a1f0a}.s-go  .stit{color:var(--grn)}
.s-gu  .shdr{background:var(--bbg)}.s-gu  .stit{color:var(--blu)}
.gc{border-radius:10px;padding:11px;margin-bottom:8px;border-left:3px solid}
.gtyp{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.gnm{font-size:15px;font-weight:700;margin-bottom:2px}
.gmt{font-size:11px;color:var(--mut);margin-bottom:6px}
.sbar{margin:6px 0 4px}
.sbar-top{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:2px}
.sbar-tr{height:4px;background:var(--sur2);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;transition:width .6s}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:7px 0}
.s4b{background:rgba(0,0,0,.3);border-radius:7px;padding:5px;text-align:center}
.s4v{font-size:13px;font-weight:700}
.s4l{font-size:8px;color:var(--mut);margin-top:1px;text-transform:uppercase}
.gln{background:rgba(0,0,0,.3);border-radius:7px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.badge{border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700}
.ba{background:var(--gbg);color:var(--grn);border:1px solid var(--grn)}
.bb{background:var(--abg);color:var(--amb);border:1px solid var(--amb)}
.bw{background:var(--gbg);color:var(--grn)}
.bl{background:var(--rbg);color:var(--red)}
.bp{background:var(--sur2);color:var(--mut)}
.btn{background:var(--gld);color:#000;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn-s{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:14px;margin-bottom:10px}
.inp:focus{outline:none;border-color:var(--gld)}
select.inp option{background:var(--sur2)}
.lbl{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.pnl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.pnl-box{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.bet-row{background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tab-row{display:flex;gap:5px;margin-bottom:12px}
.tab-b{flex:1;padding:7px;background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;text-align:center;font-weight:600}
.tab-b.active{background:var(--gld);color:#000;border-color:var(--gld)}
.leg{background:var(--sur2);border-radius:8px;padding:9px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.leg-rm{background:var(--rbg);color:var(--red);border:1px solid var(--red);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer}
.pr-row{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:12px;margin-bottom:8px}
.pr-row.best{border-color:var(--grn)}.pr-row.worst{border-color:var(--red)}
.stl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.stl::after{content:"";flex:1;height:1px;background:var(--bdr)}
.empty{text-align:center;padding:24px 14px;color:var(--mut);font-size:13px;line-height:1.6}
.spnr{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.load{text-align:center;padding:50px 16px;color:var(--mut)}
.rbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer}
.toast-el{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast-el.show{opacity:1}
.rbtns{display:flex;gap:5px;margin-top:6px}
.btnw{background:var(--grn);color:#000;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.btnl{background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.status-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.pill-up{background:var(--gbg);color:var(--grn)}
.pill-live{background:#1a0a00;color:var(--org)}
.pill-fin{background:var(--sur2);color:var(--mut)}
.live-warn{background:#1a0a00;border:1px solid var(--org);border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--org);text-align:center}
.conf{background:var(--gbg);color:var(--grn);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:5px}
.proj{background:var(--abg);color:var(--amb);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:5px}
.live-tag{background:#1a0a00;color:var(--org);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:5px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="logo">&#9918; Hitters Edge v7</div>
    <div style="font-size:10px;color:var(--mut)" id="lu">Loading...</div>
    <div style="font-size:9px;color:var(--mut)" id="rtimer"></div>
  </div>
  <div style="text-align:right">
    <div style="font-size:16px;font-weight:700" id="pnl-hdr">$0.00</div>
    <div style="font-size:9px;color:var(--mut);text-transform:uppercase">All Time P&L</div>
  </div>
</div>

<div id="pg-guide"    class="pg active"><div class="load"><div class="spnr"></div>Loading today's games...</div></div>
<div id="pg-batters"  class="pg"><div class="load"><div class="spnr"></div>Loading...</div></div>
<div id="pg-pitchers" class="pg"><div class="load"><div class="spnr"></div>Loading...</div></div>
<div id="pg-totals"   class="pg"><div class="load"><div class="spnr"></div>Loading...</div></div>
<div id="pg-pnl"      class="pg"></div>
<div id="pg-log"      class="pg"></div>

<nav class="nav">
  <button class="nb active" id="nb-guide"    onclick="sp('guide')">   <span style="font-size:17px">&#128203;</span>Guide</button>
  <button class="nb"         id="nb-batters"  onclick="sp('batters')"> <span style="font-size:17px">&#9918;</span>Batters</button>
  <button class="nb"         id="nb-pitchers" onclick="sp('pitchers')"><span style="font-size:17px">&#9201;</span>Pitchers</button>
  <button class="nb"         id="nb-totals"   onclick="sp('totals')">  <span style="font-size:17px">&#127967;</span>Totals</button>
  <button class="nb"         id="nb-pnl"      onclick="sp('pnl')">     <span style="font-size:17px">&#128176;</span>P&amp;L</button>
  <button class="nb"         id="nb-log"      onclick="sp('log')">     <span style="font-size:17px">&#10133;</span>Log</button>
</nav>
<div class="toast-el" id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var D=null,BETS=[],LEGS=[],LM='single',TOAST_T=null,REFRESH_T=null,COUNTDOWN_T=null,NEXT_R=null;
var OPEN={hri:true,hit:false,tb:false,hr:false,run:false,rbi:false,sb:false,dbl:false,sgl:false,wlk:false,bk:false,ok:false,uk:false,pha:false,pwa:false,per:false,pip:false,go:false,gu:false};
var LF={player:'',team:'',market:'Over 1.5 H+R+RBI',odds:'-115',stake:'25',result:'PENDING',notes:''};
var PF={odds:'',stake:'25',result:'PENDING'};
var ML={player:'',market:'Over 1.5 H+R+RBI'};

// ── STORAGE ──────────────────────────────────────────────────────────────────
function sg(k,d){try{var v=localStorage.getItem('he7_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem('he7_'+k,JSON.stringify(v));}catch(e){}}
BETS=sg('bets',[]);

// ── PARK FACTORS ─────────────────────────────────────────────────────────────
var PK={'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,'Dodger Stadium':101,'T-Mobile Park':100,'Progressive Field':100,'Nationals Park':100,'Minute Maid Park':98,'Angel Stadium':99,'Chase Field':99,'loanDepot park':98,'Oracle Park':97,'Citi Field':97,'Comerica Park':97,'Petco Park':96,'Target Field':96,'PNC Park':96,'Busch Stadium':95,'Kauffman Stadium':95,'Tropicana Field':97,'Sutter Health Park':98};
var MLB='https://statsapi.mlb.com/api/v1';

// ── UTILS ────────────────────────────────────────────────────────────────────
function sp(n){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});
  document.getElementById('pg-'+n).classList.add('active');
  document.getElementById('nb-'+n).classList.add('active');
  if(n==='log')rLog();
  if(n==='pnl')rPnL();
}

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  if(TOAST_T)clearTimeout(TOAST_T);
  TOAST_T=setTimeout(function(){t.classList.remove('show');},2500);
}

function today(){
  var s=new Date().toLocaleDateString('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
  var p=s.split('/');return p[2]+'-'+p[0]+'-'+p[1];
}

function fmtT(iso){
  if(!iso)return 'TBD';
  try{
    var d=new Date(iso),h=d.getUTCHours(),m=d.getUTCMinutes(),mo=d.getUTCMonth()+1;
    var et=h-(mo>=3&&mo<=11?4:5);et=((et%24)+24)%24;
    var ap=et>=12?'PM':'AM',h12=et%12||12;
    return h12+':'+(m<10?'0':'')+m+' '+ap+' ET';
  }catch(e){return 'TBD';}
}

function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}

function pct(n){return Math.max(0,Math.min(100,Math.round(n)));}

function sc(s){return s>=70?'var(--grn)':s>=50?'var(--amb)':'var(--mut)';}

function bar(s,c){
  var col=c||sc(s);
  return '<div class="sbar"><div class="sbar-top"><span>Score</span><span style="color:'+col+';font-weight:700">'+s+'/100</span></div><div class="sbar-tr"><div class="sbar-fill" style="width:'+s+'%;background:'+col+'"></div></div></div>';
}

function s4(items){
  return '<div class="s4">'+items.map(function(i){
    return '<div class="s4b"><div class="s4v" style="color:'+(i[2]||'var(--txt)')+'">'+( i[0]!==undefined&&i[0]!==null?i[0]:'--')+'</div><div class="s4l">'+i[1]+'</div></div>';
  }).join('')+'</div>';
}

function hb(hc){
  if(!hc||hc==='Neutral')return '';
  if(hc==='HOT')    return '<span style="font-size:13px">&#128293;&#128293;&#128293;</span>';
  if(hc==='Warming')return '<span style="font-size:13px">&#128293;&#128293;</span>';
  if(hc==='COLD')   return '<span style="font-size:13px">&#129704;&#129704;&#129704;</span>';
  if(hc==='Cooling')return '<span style="font-size:13px">&#129704;</span>';
  return '';
}

function gb(g){
  if(g==='A')return '<span class="badge ba">&#9733; A</span>';
  if(g==='B')return '<span class="badge bb">&#9889; B</span>';
  return '';
}

function confTag(confirmed,isLive){
  if(isLive)   return '<span class="live-tag">&#128308; LIVE</span>';
  if(confirmed)return '<span class="conf">&#10003; CONFIRMED</span>';
  return '<span class="proj">&#8987; PROJECTED</span>';
}

// ── MLB API ───────────────────────────────────────────────────────────────────
async function fj(url){
  try{var r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  catch(e){console.warn('fetch err:',e.message);return null;}
}

async function loadGames(){
  var dt=today();
  var data=await fj(MLB+'/schedule?sportId=1&date='+dt+'&hydrate=lineups,probablePitcher(note),team,venue&language=en');
  if(!data||!data.dates||!data.dates[0]||!data.dates[0].games)return[];
  var now=new Date();
  return data.dates[0].games.map(function(g){
    var st=g.status&&g.status.abstractGameState||'Preview';
    var gdt=g.gameDate?new Date(g.gameDate):null;
    var isUpcoming=st==='Preview'&&gdt&&gdt>now;
    var isLive=st==='Live';
    var isFinal=st==='Final';
    var awayArr=g.lineups&&g.lineups.awayPlayers||[];
    var homeArr=g.lineups&&g.lineups.homePlayers||[];
    var lineupPosted=awayArr.length>0&&homeArr.length>0;
    return{
      gamePk:g.gamePk,
      time:fmtT(g.gameDate),
      gameDate:gdt,
      venue:g.venue&&g.venue.name||'Unknown',
      park:PK[g.venue&&g.venue.name]||100,
      awayTeam:g.teams&&g.teams.away&&g.teams.away.team&&g.teams.away.team.name||'TBD',
      homeTeam:g.teams&&g.teams.home&&g.teams.home.team&&g.teams.home.team.name||'TBD',
      awayTeamId:g.teams&&g.teams.away&&g.teams.away.team&&g.teams.away.team.id||null,
      homeTeamId:g.teams&&g.teams.home&&g.teams.home.team&&g.teams.home.team.id||null,
      awayPitcher:{name:g.teams&&g.teams.away&&g.teams.away.probablePitcher&&g.teams.away.probablePitcher.fullName||'TBD',id:g.teams&&g.teams.away&&g.teams.away.probablePitcher&&g.teams.away.probablePitcher.id||null},
      homePitcher:{name:g.teams&&g.teams.home&&g.teams.home.probablePitcher&&g.teams.home.probablePitcher.fullName||'TBD',id:g.teams&&g.teams.home&&g.teams.home.probablePitcher&&g.teams.home.probablePitcher.id||null},
      awayLineup:exLu(g,'away'),
      homeLineup:exLu(g,'home'),
      lineupPosted:lineupPosted,
      isUpcoming:isUpcoming,
      isLive:isLive,
      isFinal:isFinal
    };
  });
}

function exLu(g,side){
  var arr=g.lineups&&g.lineups[side+'Players']||[];
  return arr.map(function(p,i){
    return{spot:i+1,name:p.fullName||'Unknown',id:p.id||null,pos:p.primaryPosition&&p.primaryPosition.abbreviation||'?',confirmed:true};
  });
}

async function fetchRoster(teamId,season){
  var data=await fj(MLB+'/teams/'+teamId+'/roster?rosterType=active&season='+season);
  if(!data||!data.roster)return[];
  return data.roster.filter(function(p){return p.position&&p.position.type==='Hitter';})
    .map(function(p){return{spot:99,name:p.person&&p.person.fullName||'?',id:p.person&&p.person.id||null,pos:p.position&&p.position.abbreviation||'?',confirmed:false};});
}

async function loadPitcher(id,season){
  if(!id)return null;
  var data=await fj(MLB+'/people/'+id+'?hydrate=stats(group=pitching,type=season,season='+season+')&sportId=1');
  var splits=data&&data.people&&data.people[0]&&data.people[0].stats&&data.people[0].stats[0]&&data.people[0].stats[0].splits||[];
  if(!splits.length)return null;
  var s=splits[0].stat;
  var ip=parseFloat(s.inningsPitched)||1,gs=parseInt(s.gamesStarted)||0;
  var ks=parseInt(s.strikeOuts)||0,bbs=parseInt(s.baseOnBalls)||0;
  var era=parseFloat(s.era)||0,whip=parseFloat(s.whip)||0;
  var h=parseInt(s.hits)||0,hr=parseInt(s.homeRuns)||0;
  var k9=Math.round((ks/ip)*9*100)/100,bb9=Math.round((bbs/ip)*9*100)/100;
  var avgK=Math.round((ks/Math.max(gs,1))*10)/10;
  var avgH=Math.round((h/Math.max(gs,1))*10)/10;
  var avgHR=Math.round((hr/Math.max(gs,1))*100)/100;
  var team=splits[0]&&splits[0].team&&splits[0].team.name||'?';
  var rf=await loadPForm(id,season);
  var vuln=0,flags=[];
  if(era>4.50){vuln++;flags.push('ERA '+era);}
  if(whip>1.40){vuln++;flags.push('WHIP '+whip);}
  if(k9<7.0){vuln++;flags.push('K/9 '+k9);}
  if(rf.lastERA!=='N/A'&&parseFloat(rf.lastERA)>5.0){vuln++;flags.push('Last '+rf.lastERA+' ERA');}
  if(rf.last3ERA!=='N/A'&&parseFloat(rf.last3ERA)>5.5)vuln=Math.min(vuln+1,4);
  return{era,whip,k9,bb9,ip,gs,avgK,avgH,avgHR,team,
    isAce:era<=2.50&&gs>=6,isVuln:vuln>=2,vulnScore:vuln,flags,
    lastERA:rf.lastERA,last3ERA:rf.last3ERA};
}

async function loadPForm(id,season){
  var data=await fj(MLB+'/people/'+id+'/stats?stats=gameLog&group=pitching&season='+season+'&sportId=1');
  var splits=data&&data.stats&&data.stats[0]&&data.stats[0].splits||[];
  if(!splits.length)return{lastERA:'N/A',last3ERA:'N/A'};
  var last=splits[splits.length-1].stat;
  var lIP=parseFloat(last.inningsPitched)||0,lER=parseInt(last.earnedRuns)||0;
  var lastERA=lIP>0?String(Math.round((lER/lIP)*9*100)/100):'0 IP';
  var rec=splits.slice(-3),tIP=0,tER=0;
  rec.forEach(function(r){tIP+=parseFloat(r.stat.inningsPitched)||0;tER+=parseInt(r.stat.earnedRuns)||0;});
  return{lastERA:lastERA,last3ERA:tIP>0?String(Math.round((tER/tIP)*9*100)/100):'N/A'};
}

async function loadBatter(id,season){
  if(!id)return null;
  var data=await fj(MLB+'/people/'+id+'?hydrate=stats(group=hitting,type=season,season='+season+')&sportId=1');
  var splits=data&&data.people&&data.people[0]&&data.people[0].stats&&data.people[0].stats[0]&&data.people[0].stats[0].splits||[];
  if(!splits.length)return null;
  var s=splits[0].stat;
  var games=parseInt(s.gamesPlayed)||1;
  var hits=parseInt(s.hits)||0,hrs=parseInt(s.homeRuns)||0;
  var tb=parseInt(s.totalBases)||0,runs=parseInt(s.runs)||0,rbi=parseInt(s.rbi)||0;
  var bb=parseInt(s.baseOnBalls)||0,dbl=parseInt(s.doubles)||0,tri=parseInt(s.triples)||0;
  var ks=parseInt(s.strikeOuts)||0,pa=parseInt(s.plateAppearances)||games*4;
  var avg=parseFloat(s.avg)||0,obp=parseFloat(s.obp)||0,slg=parseFloat(s.slg)||0;
  var sb=parseInt(s.stolenBases)||0;
  var xbh=dbl+tri+hrs,sng=Math.max(hits-hrs-tri-dbl,0);
  var hpg=Math.round((hits/games)*100)/100;
  var hrpg=Math.round((hrs/games)*100)/100;
  var tbpg=Math.round((tb/games)*100)/100;
  var runspg=Math.round((runs/games)*100)/100;
  var rbipg=Math.round((rbi/games)*100)/100;
  var xbhpg=Math.round((xbh/games)*100)/100;
  var bbRate=Math.round((obp-avg)*1000)/1000;
  var sbpg=Math.round((sb/games)*100)/100;
  var dbpg=Math.round((dbl/games)*100)/100;
  var singpg=Math.round((sng/games)*100)/100;
  var kpct=pa>0?Math.round((ks/pa)*1000)/1000:0;
  var l14=await loadL14(id,season);
  var hotCold='Neutral';
  if(l14.avg>0&&avg>0){
    if(l14.avg>=avg+0.050)hotCold='HOT';
    else if(l14.avg>=avg+0.020)hotCold='Warming';
    else if(l14.avg<=avg-0.050)hotCold='COLD';
    else if(l14.avg<=avg-0.020)hotCold='Cooling';
  }
  return{avg,obp,slg,hpg,hrpg,tbpg,runspg,rbipg,xbhpg,bbRate,sbpg,dbpg,singpg,kpct,hotCold};
}

async function loadL14(id,season){
  var data=await fj(MLB+'/people/'+id+'/stats?stats=gameLog&group=hitting&season='+season+'&sportId=1');
  var splits=data&&data.stats&&data.stats[0]&&data.stats[0].splits||[];
  if(!splits.length)return{hits:0,avg:0};
  var cut=new Date();cut.setDate(cut.getDate()-14);
  var tH=0,tAB=0;
  for(var i=splits.length-1;i>=0;i--){
    if(new Date(splits[i].date)<cut)break;
    tH+=parseInt(splits[i].stat.hits)||0;
    tAB+=parseInt(splits[i].stat.atBats)||0;
  }
  return{hits:tH,avg:tAB>0?Math.round((tH/tAB)*1000)/1000:0};
}

function sHRI(b,spot,v,park){
  var s=0;
  s+=[0,25,22,15,10,3][Math.min(spot,5)]||3;
  if(b.obp>=0.380)s+=15;else if(b.obp>=0.350)s+=10;else if(b.obp>=0.320)s+=5;
  if(b.avg>=0.300)s+=10;else if(b.avg>=0.275)s+=7;else if(b.avg>=0.250)s+=4;
  if(b.hpg>=1.2)s+=10;else if(b.hpg>=1.0)s+=7;else if(b.hpg>=0.8)s+=4;
  if(b.runspg+b.rbipg>=1.5)s+=10;else if(b.runspg+b.rbipg>=1.0)s+=6;else if(b.runspg+b.rbipg>=0.7)s+=3;
  if(v>=4)s+=15;else if(v>=3)s+=10;else if(v>=2)s+=5;
  if(park>=108)s+=8;else if(park>=104)s+=5;else if(park>=100)s+=3;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;else if(b.hotCold==='COLD')s-=10;else if(b.hotCold==='Cooling')s-=5;
  return pct(s);
}
function sHit(b,spot,v,park){
  var s=0;

  if(b.avg>=0.310)s+=25;else if(b.avg>=0.290)s+=18;else if(b.avg>=0.270)s+=12;else if(b.avg>=0.250)s+=6;
  if(b.hpg>=1.3)s+=20;else if(b.hpg>=1.1)s+=14;else if(b.hpg>=0.9)s+=8;
  if(b.bbRate>=0.120)s-=12;else if(b.bbRate>=0.090)s-=7;else if(b.bbRate>=0.060)s-=3;else if(b.bbRate<=0.030)s+=5;
  if(b.obp>=0.370)s+=8;else if(b.obp>=0.340)s+=4;
  if(v>=4)s+=15;else if(v>=3)s+=10;else if(v>=2)s+=5;
  if(park>=108)s+=5;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=10;

}
function sTB(b,spot,v,park){

  if(b.tbpg>=1.8)s+=20;else if(b.tbpg>=1.5)s+=14;else if(b.tbpg>=1.2)s+=8;else if(b.tbpg>=0.9)s+=4;
  if(b.xbhpg>=0.60)s+=15;else if(b.xbhpg>=0.45)s+=10;else if(b.xbhpg>=0.30)s+=5;
  if(b.avg>=0.300)s+=10;else if(b.avg>=0.275)s+=7;else if(b.avg>=0.250)s+=4;
  if(b.bbRate>=0.120)s-=15;else if(b.bbRate>=0.090)s-=8;else if(b.bbRate>=0.060)s-=3;else if(b.bbRate<=0.030)s+=5;
  if(v>=4)s+=10;else if(v>=3)s+=7;else if(v>=2)s+=4;
  if(park>=108)s+=10;else if(park>=104)s+=6;else if(park>=100)s+=3;else if(park<96)s-=8;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=8;

function sRuns(b,spot,v,park){

function sWlk(b,p){

  if(b.bbRate>=0.15)s+=30;else if(b.bbRate>=0.12)s+=22;else if(b.bbRate>=0.09)s+=14;else if(b.bbRate>=0.06)s+=7;

function sBK(b,p){

function sGame(aERA,hERA,aWHIP,hWHIP,aAce,hAce,aVuln,hVuln,park){
  var s=0;
  if(park>=112)s+=25;else if(park>=108)s+=18;else if(park>=104)s+=10;else if(park>=100)s+=5;else if(park<96)s-=10;
  var avgE=(aERA+hERA)/2,avgW=(aWHIP+hWHIP)/2;
  if(avgE>=5.0)s+=25;else if(avgE>=4.5)s+=18;else if(avgE>=4.0)s+=10;else if(avgE>=3.5)s+=3;else if(avgE<=3.0)s-=15;
  if(avgW>=1.40)s+=15;else if(avgW>=1.25)s+=8;else if(avgW<=1.10)s-=10;
  if(aVuln&&hVuln)s+=15;else if(aVuln||hVuln)s+=8;
  if(aAce&&hAce)s-=20;else if(aAce||hAce)s-=10;
  return pct(s);
}

function setP(msg){
  document.getElementById('lu').textContent=msg;
}

async function loadAll(){
  var season=new Date().getFullYear();
  setP('Fetching games...');
  var games=await loadGames();

  if(!games.length){
    D={games:[],batters:[],pitchers:[],totals:[],date:today(),loadedAt:'No games today'};
    renderAll();return;
  }

  // Fetch pitcher stats
  setP('Fetching pitcher stats...');
  var pCache={},pIds=[];
  games.forEach(function(g){
    if(g.awayPitcher.id&&pIds.indexOf(g.awayPitcher.id)===-1)pIds.push(g.awayPitcher.id);
    if(g.homePitcher.id&&pIds.indexOf(g.homePitcher.id)===-1)pIds.push(g.homePitcher.id);
  });
  for(var i=0;i<pIds.length;i++){
    setP('Pitchers '+(i+1)+'/'+pIds.length+'...');
    pCache[pIds[i]]=await loadPitcher(pIds[i],season);
    await slp(250);
  }

  // Fill rosters for games without lineups
  setP('Checking lineups...');
  for(var gi=0;gi<games.length;gi++){
    var gg=games[gi];
    if(!gg.lineupPosted&&!gg.isFinal){
      if(gg.awayTeamId&&!gg.awayLineup.length){
        var ar=await fetchRoster(gg.awayTeamId,season);
        if(ar.length)gg.awayLineup=ar;
        await slp(250);
      }
      if(gg.homeTeamId&&!gg.homeLineup.length){
        var hr=await fetchRoster(gg.homeTeamId,season);
        if(hr.length)gg.homeLineup=hr;
        await slp(250);
      }
    }
  }

  // Fetch batter stats
  setP('Fetching batter stats...');
  var bCache={},allP=[];
  games.forEach(function(g){
    if(g.isFinal)return;
    g.awayLineup.forEach(function(p){if(p.id&&!bCache[p.id]){bCache[p.id]=null;allP.push(p);}});
    g.homeLineup.forEach(function(p){if(p.id&&!bCache[p.id]){bCache[p.id]=null;allP.push(p);}});
  });
  for(var j=0;j<allP.length;j++){
    if(j%5===0)setP('Batters '+(j+1)+'/'+allP.length+'...');
    bCache[allP[j].id]=await loadBatter(allP[j].id,season);
    await slp(180);
  }

  // Score batters
  setP('Scoring picks...');
  var batters=[],elim=[];
  games.forEach(function(g){
    if(g.isFinal)return; // skip finished games
    [{lineup:g.awayLineup,team:g.awayTeam,pId:g.homePitcher.id,pName:g.homePitcher.name,game:g},
     {lineup:g.homeLineup,team:g.homeTeam,pId:g.awayPitcher.id,pName:g.awayPitcher.name,game:g}]
    .forEach(function(mu){
      var pit=pCache[mu.pId];
      if(!pit)return;
      if(pit.isAce){
        elim.push({team:mu.team,pitcher:mu.pName,reason:'ACE ('+pit.era+' ERA, '+pit.gs+' GS)'});
        return;
      }
      mu.lineup.forEach(function(player){
        if(player.pos==='P')return;
        var b=bCache[player.id];
        if(!b)return;
        var v=pit.vulnScore,park=mu.game.park;
        var spot=player.confirmed?player.spot:99;
        var nexusSpot=player.confirmed?(spot<=2):(b.obp>=0.350);
        var passV=b.obp>=0.320;
        var cores=(nexusSpot?1:0)+(passV?1:0)+(pit.isVuln?1:0);
        var grade=cores===3?'A':cores===2?'B':'C';
        if(grade==='C')return; // skip C grade entirely

        var hriS=sHRI(b,spot===99?3:spot,v,park);
        var hitS=sHit(b,spot===99?3:spot,v,park);
        var tbS=sTB(b,spot===99?3:spot,v,park);
        var hrS=sHR(b,v,park);
        var runS=sRuns(b,spot===99?3:spot,v,park);
        var rbiS=sRBI(b,spot===99?3:spot,v,park);
        var sbS=sSB(b);
        var dblS=sDbl(b,v,park);
        var sglS=sSgl(b,v);
        var wlkS=sWlk(b,pit);
        var bkS=sBK(b,pit);
        var overall=Math.max(hriS,hitS,tbS,hrS,runS,rbiS);
        if(overall<40)return;

        batters.push({
          name:player.name,pos:player.pos,
          spot:player.confirmed?spot:null,
          confirmed:player.confirmed,
          team:mu.team,
          game:mu.game.awayTeam+' @ '+mu.game.homeTeam,
          time:mu.game.time,
          venue:mu.game.venue,park,
          pitcher:mu.pName,
          pitcherERA:pit.era,pitcherWHIP:pit.whip,
          pitcherFlags:pit.flags,
          isVulnPitcher:pit.isVuln,vulnScore:v,
          isLive:mu.game.isLive,
          isUpcoming:mu.game.isUpcoming,
          grade,overall,
          hriS,hitS,tbS,hrS,runS,rbiS,sbS,dblS,sglS,wlkS,bkS,
          avg:b.avg,obp:b.obp,slg:b.slg,hpg:b.hpg,hrpg:b.hrpg,
          tbpg:b.tbpg,runspg:b.runspg,rbipg:b.rbipg,xbhpg:b.xbhpg,
          bbRate:b.bbRate,sbpg:b.sbpg,dbpg:b.dbpg,singpg:b.singpg,kpct:b.kpct,
          hotCold:b.hotCold
        });
      });
    });
  });
  batters.sort(function(a,b){
    if(a.grade!==b.grade)return a.grade<b.grade?-1:1;
    return b.overall-a.overall;
  });

  // Score pitchers
  var pitchers=[];
  games.filter(function(g){return !g.isFinal;}).forEach(function(g){
    [{id:g.awayPitcher.id,name:g.awayPitcher.name,team:g.awayTeam,opp:g.homeTeam,time:g.time,park:g.park},
     {id:g.homePitcher.id,name:g.homePitcher.name,team:g.homeTeam,opp:g.awayTeam,time:g.time,park:g.park}]
    .forEach(function(p){
      var st=pCache[p.id];if(!st)return;
      var pkScore=sPK(st);
      var phaScore=sPHA(st);
      var pwaScore=sPWA(st);
      var perScore=sPER(st,p.park);
      var pipScore=sPIP(st);
      pitchers.push(Object.assign({},p,st,{
        pkScore,phaScore,pwaScore,perScore,pipScore,
        phaDir:st.avgH>=8.0?'Over Hits Allowed':'Under Hits Allowed',
        pwaDir:st.bb9>=3.0?'Over Walks Allowed':'Under Walks Allowed',
        perDir:perScore>=55?'Over Earned Runs':'Under Earned Runs',
        pipDir:pipScore>=60?'Over 4.5 IP':'Under 4.5 IP'
      }));
    });
  });
  pitchers.sort(function(a,b){return b.pkScore-a.pkScore;});

  // Score game totals
  var totals=games.filter(function(g){return !g.isFinal&&!g.isLive;}).map(function(g){
    var ap=pCache[g.awayPitcher.id],hp=pCache[g.homePitcher.id];
    var aERA=ap&&ap.era||4.5,hERA=hp&&hp.era||4.5;
    var aWHIP=ap&&ap.whip||1.3,hWHIP=hp&&hp.whip||1.3;
    var overScore=sGame(aERA,hERA,aWHIP,hWHIP,ap&&ap.isAce,hp&&hp.isAce,ap&&ap.isVuln,hp&&hp.isVuln,g.park);
    var underScore=100-overScore;
    var dir=overScore>=60?'OVER':underScore>=60?'UNDER':'SKIP';
    return{
      game:g.awayTeam+' @ '+g.homeTeam,time:g.time,venue:g.venue,park:g.park,
      awayPitcher:g.awayPitcher.name,homePitcher:g.homePitcher.name,
      awayERA:aERA,homeERA:hERA,
      direction:dir,overScore:overScore,underScore:underScore,
      score:dir==='OVER'?overScore:dir==='UNDER'?underScore:50,
      rec:dir==='OVER'?'BET OVER ('+overScore+'/100)':dir==='UNDER'?'BET UNDER ('+underScore+'/100)':'SKIP'
    };
  });
  totals.sort(function(a,b){return b.score-a.score;});

  D={games,batters,pitchers,totals,eliminated:elim,date:today(),loadedAt:new Date().toLocaleTimeString()};
  renderAll();
}

function updPnLHdr(){

// ── SECTION BUILDER ───────────────────────────────────────────────────────────
function makeSect(key,cls,icon,label,items,renderFn){
  var n=items.length;
  var c=n>0?n+(n===1?' pick':' picks'):'No picks';
  var o=OPEN[key];
  var h='<div class="sect s-'+cls+'">';
  h+='<div class="shdr" onclick="tog(\''+key+'\')">';
  h+='<div class="stit"><span style="font-size:15px">'+icon+'</span> '+label+' <span class="scnt">'+c+'</span></div>';
  h+='<span class="sarr'+(o?' open':'')+'" id="sa-'+key+'">&#9660;</span>';
  h+='</div>';
  h+='<div class="sbdy'+(o?' open':'')+'" id="sb-'+key+'">';
  if(!n) h+='<div class="empty">No picks yet. Lineups post 2-4 hrs before first pitch.</div>';
  else items.forEach(function(it){h+=renderFn(it);});
  h+='</div></div>';
  return h;
}

function tog(k){
  OPEN[k]=!OPEN[k];
  var b=document.getElementById('sb-'+k),a=document.getElementById('sa-'+k);
  if(b)b.classList.toggle('open',OPEN[k]);
  if(a)a.classList.toggle('open',OPEN[k]);
}

function rTracker(){
  var pm={};
  BETS.filter(function(b){return b.player.indexOf('PARLAY')===-1;}).forEach(function(b){
    if(!pm[b.player])pm[b.player]={name:b.player,wins:0,losses:0,profit:0,bets:0};
    pm[b.player].bets++;pm[b.player].profit+=(b.profit||0);
    if(b.result==='WIN')pm[b.player].wins++;else if(b.result==='LOSS')pm[b.player].losses++;
  });
  var players=Object.values(pm).sort(function(a,b){return b.profit-a.profit;});
  if(!players.length)return'<div class="empty">No player data yet.<br>Log some bets first.</div>';
  var h='<div class="stl" style="color:var(--grn)">Best Performers</div>';
  players.filter(function(p){return p.profit>0;}).slice(0,5).forEach(function(p){h+=prRow(p,'best');});
  h+='<div class="stl" style="color:var(--red)">Costing You Most</div>';
  var losers=players.filter(function(p){return p.profit<0;}).slice(-5).reverse();
  if(!losers.length)h+='<div style="padding:8px;color:var(--mut);font-size:12px;text-align:center">No losses yet.</div>';
  else losers.forEach(function(p){h+=prRow(p,'worst');});
  h+='<div class="stl">All Players</div>';
  players.forEach(function(p){h+=prRow(p,'');});
  return h;
}

function rmLeg(i){LEGS.splice(i,1);rLog();}
function clrLegs(){LEGS=[];rLog();toast('Cleared');}

function calcPay(odds,stake,result){
  var payout=0,profit=0;
  if(result==='WIN'){payout=odds>0?stake+(stake*odds/100):stake+(stake*100/Math.abs(odds));profit=payout-stake;}
  else if(result==='LOSS'){profit=-stake;}
  return{payout:Math.round(payout*100)/100,profit:Math.round(profit*100)/100};
}

function subBet(){
  if(!LF.player){toast('Enter a player name');return;}
  var stake=parseFloat(LF.stake)||25,odds=parseInt(LF.odds)||-115;
  var cp=calcPay(odds,stake,LF.result);
  BETS.unshift({id:Date.now(),date:today(),player:LF.player,team:LF.team,market:LF.market,odds:odds,stake:stake,result:LF.result,payout:cp.payout,profit:cp.profit,notes:LF.notes});
  ss('bets',BETS);
  LF={player:'',team:'',market:'Over 1.5 H+R+RBI',odds:'-115',stake:'25',result:'PENDING',notes:''};
  toast('Bet saved!');rLog();rPnL();
}

function subParlay(){
  if(LEGS.length<2){toast('Need at least 2 legs');return;}
  if(!PF.odds){toast('Enter combined odds');return;}
  var stake=parseFloat(PF.stake)||25,odds=parseInt(PF.odds)||0;
  var cp=calcPay(odds,stake,PF.result);
  BETS.unshift({id:Date.now(),date:today(),player:'PARLAY ('+LEGS.length+' legs)',team:'',market:'Parlay',odds:odds,stake:stake,result:PF.result,payout:cp.payout,profit:cp.profit,notes:LEGS.map(function(l,i){return (i+1)+'. '+l.player+' -- '+l.market;}).join(' | ')});
  ss('bets',BETS);
  LEGS=[];PF={odds:'',stake:'25',result:'PENDING'};
  toast('Parlay saved!');rLog();rPnL();
}

function markR(id,result){
  var idx=BETS.findIndex(function(b){return b.id===id;});
  if(idx===-1)return;
  var b=BETS[idx];
  var cp=calcPay(b.odds,b.stake,result);
  BETS[idx]=Object.assign({},b,{result:result,payout:cp.payout,profit:cp.profit});
  ss('bets',BETS);toast(result==='WIN'?'Marked WIN!':'Marked LOSS');rPnL();
}

// ── AUTO REFRESH ──────────────────────────────────────────────────────────────
function startAR(){
  if(REFRESH_T)return;
  NEXT_R=Date.now()+60*60*1000;
  REFRESH_T=setInterval(async function(){
    var prev=D?D.batters.filter(function(b){return b.confirmed&&b.grade==='A';}).map(function(b){return b.name;}).join(','):'';
    await loadAll();
    if(D){
      var curr=D.batters.filter(function(b){return b.confirmed&&b.grade==='A';}).map(function(b){return b.name;}).join(',');
      if(curr!==prev){
        var nn=D.batters.filter(function(b){return b.confirmed&&b.grade==='A'&&prev.indexOf(b.name)===-1;});
        if(nn.length)toast('&#128276; '+nn.length+' new confirmed A-Grade pick'+(nn.length>1?'s':'')+'!');
      }
    }
    NEXT_R=Date.now()+60*60*1000;
  },60*60*1000);

  if(COUNTDOWN_T)clearInterval(COUNTDOWN_T);
  COUNTDOWN_T=setInterval(function(){
    var el=document.getElementById('rtimer');
    if(!el)return;
    var diff=NEXT_R-Date.now();
    if(diff<=0){el.textContent='Refreshing...';return;}
    var m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);
    el.textContent='Refresh in '+m+'m '+('0'+s).slice(-2)+'s';
  },1000);
}

function copyText(txt,okId){
  navigator.clipboard.writeText(txt).then(function(){
    showCopyOK(okId);
    toast('&#10003; Copied to clipboard!');
  }).catch(function(){
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showCopyOK(okId);toast('&#10003; Copied!');}
    catch(e){toast('Could not copy — try again');}
    document.body.removeChild(ta);
  });
}

function showCopyOK(id){
  var el=document.getElementById(id);
  if(el){el.style.display='block';setTimeout(function(){el.style.display='none';},6000);}
}

  if(REFRESH_T){clearInterval(REFRESH_T);REFRESH_T=null;}

}
