// Full per-pick data dump for Claude analysis ‚Äî every hitter & pitcher input.
function pickDump(p){
  var b=p.bStats, hs=p.hitStat, os=p.oppStat, T=[];
  var pc=function(v){return v==null?'--':v;};
  T.push((p.isPitcher?'[PITCHER] ':'[HITTER] ')+p.name+' ‚Äî '+p.propLabel+'  ('+(p.fire?'FIRES':'no-fire')+(p.paper===false?' REAL':' PAPER')+' | '+(p.module||'')+'/'+(p.moduleClass||'')+')');
  // v13 value headline
  if(p.pModel!=null){
    if(p.edge!=null)T.push('  VALUE: edge '+(p.pModel>=p.pMarket?'+':'')+(p.edge*100).toFixed(1)+'pp | p_model '+(p.pModel*100).toFixed(0)+'% vs market '+(p.pMarket*100).toFixed(0)+'% ('+p.nBooks+' books)'+(p.fire?' -> FIRES':' -> below '+(EDGE_THRESHOLD*100)+'pp / gated'));
    else T.push('  VALUE: p_model '+(p.pModel*100).toFixed(0)+'% | one-way market, no de-vig, no edge (paper/log only)');
  }
  T.push('  Lineup: '+(p.lineupConfirmed?'CONFIRMED':'PROJECTED')+(p.lineupSpot?' #'+p.lineupSpot:'')+' | '+p.game+' '+p.time+(p.gameTotal!=null?' | Game total '+p.gameTotal:''));
  T.push('  Odds: '+fmtOdds(p.recOdds)+(p.bestBook?' (best of '+p.nBooks+' books: '+fmtOdds(p.bestPrice)+' @ '+p.bestBook+')':'')+' | Score '+p.score+'/100 (likelihood only)');
  if(p.recOdds!=null){
    var bookP=(impliedProb(p.recOdds)*100).toFixed(1);
    var cb=CALIB?CALIB[bucketOf(p.score)]:null;
    T.push('  Value: book '+bookP+'%'+(cb&&cb.n>=MIN_VALUE_SAMPLE&&cb.rate!=null?' | model '+(cb.rate*100).toFixed(1)+'% (n='+cb.n+')':' | model calibrating ('+(cb?cb.n:0)+'/'+MIN_VALUE_SAMPLE+')'));
  }
  if(p.sgpPartner)T.push('  ** CORRELATED SGP OPPORTUNITY ‚Äî pairs with '+p.sgpPartner+' vs '+p.pitcher+' (same vulnerability); build as a same-game parlay **');
  else if(p.sameGame)T.push('  ** SAME-GAME as another pick ‚Äî do not combine in a CROSS-game parlay **');
  if(p.conflictFlag)T.push('  ** CONFLICT: same game has a pitcher K over **');
  if(p.l5n||p.l10n||p.inactive)T.push('  Recent form on this line: L5 '+p.l5c+'/'+p.l5n+' | L10 '+p.l10c+'/'+p.l10n+(p.inactive?' | INACTIVE/RETURNING':''));
  if(b){
    var bt=batType(b.iso);
    T.push('  BAT TYPE: '+(bt?bt.label:'-')+' (ISO '+fmt3(b.iso)+') | '+b.games+' games');
    if(p.splitVsL&&p.splitVsR&&(p.oppThrows==='L'||p.oppThrows==='R'))T.push('  Platoon: vs RHP '+fmt3(p.splitVsR.avg)+' AVG '+fmt3(p.splitVsR.ops)+' OPS | vs LHP '+fmt3(p.splitVsL.avg)+' AVG '+fmt3(p.splitVsL.ops)+' OPS | tonight vs '+p.oppThrows+'HP: '+(p.platoonSide||'NEUTRAL')+(p.platoonAdj?' ('+(p.platoonAdj>0?'+':'')+p.platoonAdj+')':''));
    if(p.h2h&&p.h2h.ab>=10)T.push('  Career vs '+(p.oppPitName||'SP')+': '+p.h2h.ab+' AB '+fmt3(p.h2h.avg)+' AVG '+p.h2h.hr+' HR '+fmt3(p.h2h.ops)+' OPS'+(p.h2hFlag?' ['+p.h2hFlag+']':''));
    if(p.park!=null){var pk=parkInfo(p.homeTeam,p.park);T.push('  Park: '+(p.parkVenue||p.homeTeam||'')+' ('+(pk.abbr||'?')+') '+parkLabel(pk.tier)+(pk.rich?' Runs '+pk.runs.toFixed(2)+' HR '+pk.hr.toFixed(2):' factor '+pk.factor));}
    if(p.wx){if(p.wx.neutral)T.push('  Weather: roof/dome ‚Äî neutral');else if(p.wx.temp!=null)T.push('  Weather: '+p.wx.temp+'F, wind '+p.wx.windSpeed+'mph'+(p.wx.windDeg!=null?' from '+windCardinal(p.wx.windDeg):'')+', humidity '+p.wx.humidity+'%'+(p.wx.temp>85?' (hot +1)':p.wx.temp<50?' (cold -2)':''));}
    T.push('  Season: AVG '+fmt3(b.avg)+' OBP '+fmt3(b.obp)+' SLG '+fmt3(b.slg));
    T.push('  Per game: H '+b.hpg+' 1B '+b.sngpg+' TB '+b.tbpg+' HR '+b.hrpg+' R '+b.runspg+' RBI '+b.rbipg+' SB '+b.sbpg+' | BB% '+fmt3(b.bbRate));
    T.push('  10-game: AVG '+fmt3(b.roll10avg)+' OBP '+fmt3(b.roll10obp)+' | 7-day trend: '+b.hotCold);
    if(hs)T.push('  Statcast(bat): xBA '+fmt3(hs.xba)+' xSLG '+fmt3(hs.xslg)+' xwOBA '+fmt3(hs.xwoba)+' wOBA '+fmt3(hs.woba)+' | Barrel '+pc(hs.barrel_batted_rate)+'% HardHit '+pc(hs.hard_hit_percent)+'%');
    if(p.luckSum!=null)T.push('  Luck gap (expected-actual composite): '+(p.luckSum>0?'+':'')+fmt3(p.luckSum)+(p.luckSum>0.100?' ‚Äî REGRESSION DUE (underpriced)':''));
  }
  if(p.oppPitName){
    T.push('  OPP SP: '+p.oppPitName+' | ERA '+pc(p.oppERA)+' WHIP '+pc(p.oppWHIP)+' K/9 '+pc(p.oppK9)+(p.oppL3era!=null?' | last-3 ERA '+p.oppL3era:''));
    if(os)T.push('    SP Statcast: HardHit '+pc(os.hard_hit_percent)+'% Barrel '+pc(os.barrel_batted_rate)+'% Whiff '+pc(os.whiff_percent)+'% | K% '+pc(os.k_percent)+' BB% '+pc(os.bb_percent)+' xSLG '+fmt3(os.xslg));
    var ml=matchLevel(p.batKey,p.oppTypeKey);
    T.push('    Vulnerability: '+(p.oppTypeKey?p.oppTypeKey+' '+p.oppTypeLabel:'untyped')+' | Bat match: '+(ml?ml.label:'-')+' | Matchup tag: '+(p.matchupTag||'-').toUpperCase()+' '+(p.matchupAdj>0?'+':'')+p.matchupAdj);
  }
  if(p.isPitcher&&p.pitSt){
    T.push('  SP season: ERA '+p.pitSt.era+' WHIP '+p.pitSt.whip+' K/9 '+p.pitSt.k9+' BB/9 '+p.pitSt.bb9+' GS '+p.pitSt.gs+' avgK '+p.pitSt.avgK);
    if(p.pitL3)T.push('  Last-3 starts: '+p.pitL3.avgK+' K/start, ERA '+p.pitL3.era+' (line '+p.line+')');
    if(p.pitML!=null)T.push('  Exit risk: '+p.pitTeam+' '+fmtOdds(p.pitML)+(p.pitML<0?' favorite ‚Äî likely deep':' underdog ‚Äî monitor'));
  }
  if(p.filterNotes&&p.filterNotes.length)T.push('  Notes: '+p.filterNotes.join('; '));
  return T.join('\n');
}
function copyPicks(){
  if(!D){toast('No data');return;}
  var premium=D.picks.filter(function(p){return p.grade==='A';});
  var watch=D.picks.filter(function(p){return p.grade==='B'||p.grade==='W';});
  var wins=BETS.filter(function(b){return b.result==='WIN';}).length;
  var tot=BETS.filter(function(b){return b.result!=='PENDING';}).length;
  var txt='HITTERS EDGE v13.1 ‚Äî '+D.date+' (generated '+(D.generatedAt||'?')+', odds as of '+(D.oddsAsOf||'?')+')\n';
  txt+='Record: '+wins+'W/'+(tot-wins)+'L'+(tot?' ('+Math.round(wins/tot*100)+'%)':'')+'\n';
  txt+='Score = normalized 0-100 WITHIN each prop (a ranking, not a win probability). Value model% = real settled-bet hit rate for that score bucket.\n';
  if(D.aceNotes&&D.aceNotes.length){txt+='\nACE FILTERS (batters skipped):\n';D.aceNotes.forEach(function(n){txt+='  '+n.team+' vs '+n.pitcher+' ('+n.era+' ERA)\n';});}
  if(D.mismatchNotes&&D.mismatchNotes.length){txt+='\nMISMATCHES REMOVED:\n';D.mismatchNotes.forEach(function(m){txt+='  '+m.name+' ‚Äî '+m.prop+' ('+m.reason.replace('Mismatch: ','')+')\n';});}
  txt+='\n========== PREMIUM CARD ('+premium.length+') ==========\n';
  if(!premium.length)txt+='None today\n';
  premium.forEach(function(p){txt+='\n'+pickDump(p)+'\n';});
  txt+='\n========== WATCH LIST ('+watch.length+') ==========\n';
  if(!watch.length)txt+='None\n';
  watch.forEach(function(p){txt+='\n'+pickDump(p)+'\n';});
  if(D.sgps&&D.sgps.length){
    txt+='\n========== CORRELATED SGP OPPORTUNITIES ==========\n';
    D.sgps.forEach(function(s){txt+='\n'+s.game+' ‚Äî vs '+s.pitcher+' ('+(s.typeKey||'')+' '+(s.typeLabel||'')+'), combined '+fmtOdds(s.combined)+'\n';s.legs.forEach(function(l){txt+='  '+l.name+' #'+l.spot+' ('+l.bat+'): '+l.prop+' '+fmtOdds(l.odds)+'\n';});});
  }
  txt+='\n========== GAME TOTALS ==========\n';
  D.totals.filter(function(t){return t.isUpcoming;}).forEach(function(t){txt+=t.game+' Line '+t.line+' O '+fmtOdds(t.overOdds)+' U '+fmtOdds(t.underOdds)+'\n';});
  // ‚îÄ‚îÄ PERFORMANCE (ROI-first) ‚Äî surface the brains, read-only ‚îÄ‚îÄ
  var s=MSTATS||buildModelStats();
  var ln=function(label,o){return '  '+label+': n='+o.t+' | '+Math.round(o.w/o.t*100)+'% | ROI '+(Math.round(o.u/o.t*100)>=0?'+':'')+Math.round(o.u/o.t*100)+'%'+(o.on?' | avg '+(Math.round(o.os/o.on)>0?'+':'')+Math.round(o.os/o.on):'')+'\n';};
  // ‚îÄ‚îÄ v13 VALUE / CLV-FIRST (the new scoreboard) ‚îÄ‚îÄ
  txt+='\n========== VALUE SCOREBOARD (CLV-FIRST) ‚Äî v13 ==========\n';
  txt+='Phase: '+(PAPER_ONLY?'0 (PAPER ONLY)':'1+ (real money enabled)')+' | model '+(modelCalibrated()?'CALIBRATED':'UNCALIBRATED')+' ('+(s.calib_n||0)+'/'+CALIB_MIN_N+') | fired '+(s.fired_n||0)+' | gated '+(s.gated_n||0)+' | avg edge '+(s.edge_n?(s.edge_sum/s.edge_n*100).toFixed(1)+'pp':'n/a')+'\n';
  txt+='By module (n | win% | ROI | CLV avg | %CLV+ | status):\n';
  Object.keys(s.by_module||{}).sort(function(a,b){return s.by_module[b].t-s.by_module[a].t;}).forEach(function(mk){
    var m=s.by_module[mk],cm=(s.clv_by_module||{})[mk];
    txt+='  '+mk+': n='+m.t+' | '+Math.round(m.w/m.t*100)+'% | ROI '+(Math.round(m.u/m.t*100)>=0?'+':'')+Math.round(m.u/m.t*100)+'%'+(cm&&cm.n?' | CLV '+(Math.round(cm.sum/cm.n*10)/10)+' | '+Math.round(cm.pos/cm.n*100)+'%+':' | CLV n/a')+' | '+(moduleClvKilled(mk)?'KILLED':(MODULE_CLASS[mk]||'experimental'))+'\n';
  });
  txt+='Calibration (predicted -> actual):\n';
  for(var cbn=0;cbn<10;cbn++){var cc=(s.calib||{})[cbn];if(cc&&cc.n)txt+='  '+(cbn*10)+'-'+(cbn*10+10)+'%: '+Math.round(cc.hit/cc.n*100)+'% actual (n='+cc.n+')\n';}
  txt+='\n========== PERFORMANCE (ROI-FIRST) ==========\n';
  txt+='(all tracked picks ‚Äî both boards; NOT a real-money record)\n';
  txt+='Overall: tracked '+s.total_generated+' | settled '+s.total_resolved+' | pending '+s.total_pending+' | void '+(s.total_dnp||0)+' | push '+(s.total_push||0)+(s.by_overall.all&&s.by_overall.all.t?' | '+Math.round(s.by_overall.all.w/s.by_overall.all.t*100)+'% | ROI '+(Math.round(s.by_overall.all.u/s.by_overall.all.t*100)>=0?'+':'')+Math.round(s.by_overall.all.u/s.by_overall.all.t*100)+'%':'')+'\n';
  txt+='By odds bucket:\n';['-140..-120','-119..-100','juiced <-140','+money'].forEach(function(k){if(s.by_odds_bucket[k]&&s.by_odds_bucket[k].t)txt+=ln(k,s.by_odds_bucket[k]);});
  txt+='By prop (ROI desc):\n';Object.keys(s.by_prop_type).sort(function(a,b){return (s.by_prop_type[b].u/s.by_prop_type[b].t)-(s.by_prop_type[a].u/s.by_prop_type[a].t);}).forEach(function(k){if(s.by_prop_type[k].t)txt+=ln(k,s.by_prop_type[k]);});
  ['strikeouts|over','strikeouts|under'].forEach(function(k){if(s.by_prop_dir[k]&&s.by_prop_dir[k].t)txt+=ln(k.replace('strikeouts|','K-'),s.by_prop_dir[k]);});
  txt+='By grade:\n';['A','B','W'].forEach(function(g){if(s.by_grade[g]&&s.by_grade[g].t)txt+=ln('Grade '+g,s.by_grade[g]);});
  txt+='By side:\n';['over','under'].forEach(function(k){if(s.by_direction[k]&&s.by_direction[k].t)txt+=ln(k,s.by_direction[k]);});
  txt+='CLV: '+(s.clv_n?('avg '+(Math.round(s.clv_sum/s.clv_n*10)/10)+' | '+Math.round(s.clv_pos/s.clv_n*100)+'% positive (n='+s.clv_n+')'):'null (not captured yet)')+'\n';
  if(s.clv_by_prop&&Object.keys(s.clv_by_prop).length){
    txt+='CLV by prop:\n';
    Object.keys(s.clv_by_prop).sort().forEach(function(cpk){var cp=s.clv_by_prop[cpk],ca=Math.round(cp.sum/cp.n*10)/10;var pr2=s.by_prop_type[cpk]&&s.by_prop_type[cpk].t?s.by_prop_type[cpk].u/s.by_prop_type[cpk].t*100:null;txt+='  '+cpk+': avg '+(ca>0?'+':'')+ca+' | '+Math.round(cp.pos/cp.n*100)+'% pos (n='+cp.n+')'+(pr2!=null&&pr2>=10&&s.by_prop_type[cpk].t>=30&&ca<=0.5&&cp.n>=20?' [!] +ROI without CLV ‚Äî variance-driven, do not upsize':'')+'\n';});
  }

  // ‚îÄ‚îÄ SETTLEMENT LOG (last 14 days) ‚Äî read-only ‚îÄ‚îÄ
  txt+='\n========== SETTLEMENT LOG (last 14 days) ==========\n';
  txt+='date | player | prop | line | side | odds | grade | result | graded_stat | closing_odds | clv\n';
  var c14=new Date();c14.setDate(c14.getDate()-14);
  var c14s=c14.getFullYear()+'-'+String(c14.getMonth()+1).padStart(2,'0')+'-'+String(c14.getDate()).padStart(2,'0');
  var rmap={WIN:'W',LOSS:'L',DNP:'void',VOID:'void',PUSH:'push'};
  var sl=getAllLoggedPicks().filter(function(p){return p.result&&p.result!=='PENDING'&&p.date>=c14s;}).sort(function(a,b){return(b.resolved_at||'').localeCompare(a.resolved_at||'');});
  if(!sl.length)txt+='(none settled in window)\n';
  sl.forEach(function(p){txt+=p.date+' | '+p.player_name+' | '+p.prop_type+' | '+p.line+' | '+p.direction+' | '+fmtOdds(p.odds)+' | '+p.grade+' | '+(rmap[p.result]||p.result)+' | '+(p.settle||'-')+' | '+(p.closing_odds!=null?fmtOdds(p.closing_odds):'null')+' | '+(p.clv!=null?p.clv:'null')+'\n';});

  txt+='\nANALYZE:\n1. Rank the Premium singles by edge (Score = modeled win probability) + matchup/platoon/park context.\n2. Which Premium picks to fade (cooling 10-game trend, tough/AVOID matchup, regression-down).\n3. Read PERFORMANCE: which odds/prop/grade buckets are actually +ROI, and whether CLV is positive.\n';
  txt+='\nRULES: Premium = real money, staking band -140..-100 only. Watch = bonus/out-of-band. Singles only, no parlays. No aces, no stolen bases, player-type matched. Everything tracked regardless of band.';
  copyText(txt,'copy-ok');
}

function copyText(txt,okId){

var RESOLVE_T=null;
var REFRESH_MS=60*60*1000; // v12: guard-controlled ‚Äî budgetGuard() widens this (60->90->120m) when burn > allowance
function startAR(){
  if(REFRESH_T)return;
  NEXT_R=Date.now()+REFRESH_MS;
  function tick(){
    // v12 off-hours: slate done -> no odds pulls, just settle results via free statsapi
    if(D&&D.upcoming===0&&D.live===0){resolvePending();NEXT_R=Date.now()+REFRESH_MS;return;}
    loadAll();NEXT_R=Date.now()+REFRESH_MS;
    // re-arm with the (possibly widened) interval
    clearInterval(REFRESH_T);REFRESH_T=setInterval(tick,REFRESH_MS);
  }
  REFRESH_T=setInterval(tick,REFRESH_MS);
  // Outcome resolution: own hourly timer so it runs even between card reloads
  if(!RESOLVE_T)RESOLVE_T=setInterval(function(){resolvePending();},60*60*1000);
  if(COUNTDOWN_T)clearInterval(COUNTDOWN_T);
  COUNTDOWN_T=setInterval(function(){var el=document.getElementById('rtimer');if(!el)return;var diff=NEXT_R-Date.now();if(diff<=0){el.textContent='Refreshing...';return;}var m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);el.textContent='Refresh in '+m+'m '+('0'+s).slice(-2)+'s';},1000);
}
