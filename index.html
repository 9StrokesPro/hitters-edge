<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hitters Edge v8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--sur:#111827;--sur2:#1a2235;--bdr:#1e2d45;
  --txt:#e2e8f0;--mut:#64748b;
  --grn:#22c55e;--gbg:#052e16;
  --amb:#f59e0b;--abg:#2d1a00;
  --red:#ef4444;--rbg:#2d0a0a;
  --blu:#3b82f6;--bbg:#0a1929;
  --pur:#a855f7;--pbg:#1e0a2d;
  --tel:#14b8a6;--tbg:#021a18;
  --nvy:#6366f1;--nbg:#0d0e2a;
  --gld:#fbbf24;--org:#ff9800;
}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:72px;max-width:640px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:var(--gld)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 6px;background:none;border:none;color:var(--mut);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.nb.on{color:var(--gld)}
.pg{display:none;padding:10px 10px 0}
.pg.on{display:block}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:8px}
.btn{background:var(--gld);color:#000;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn:active{opacity:.85}
.btn-s{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--gld)}
select.inp option{background:var(--sur2)}
.lbl{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.spnr{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.load{text-align:center;padding:50px 16px;color:var(--mut)}
.err{background:var(--rbg);border:1px solid var(--red);border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px;color:var(--red)}
.toast-el{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast-el.show{opacity:1}
/* PICK CARDS */
.pick{border-radius:11px;padding:12px;margin-bottom:8px;border-left:4px solid}
.pick-a{background:#071a07;border-color:var(--grn)}
.pick-b{background:#1a1400;border-color:var(--amb)}
.pick-skip{background:var(--rbg);border-color:var(--red)}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.pname{font-size:15px;font-weight:700}
.pgame{font-size:11px;color:var(--mut);margin-top:2px}
.pbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.ba{background:var(--gbg);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.bb{background:var(--abg);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
.pstat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:7px 0}
.psb{background:rgba(0,0,0,.3);border-radius:7px;padding:5px;text-align:center}
.psv{font-size:13px;font-weight:700}
.psl{font-size:8px;color:var(--mut);margin-top:1px;text-transform:uppercase}
.pline{background:rgba(0,0,0,.3);border-radius:7px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.pline-label{font-size:10px;color:var(--mut)}
.pline-val{font-size:14px;font-weight:700;color:var(--gld)}
.pline-odds{font-size:13px;font-weight:700;color:var(--grn)}
.sbar{height:5px;background:var(--sur2);border-radius:3px;margin:6px 0;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px;transition:width .5s}
.hb{font-size:14px}
/* STATUS BAR */
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stpill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.st-up{background:var(--gbg);color:var(--grn)}
.st-lv{background:#1a0a00;color:var(--org)}
.st-fn{background:var(--sur2);color:var(--mut)}
/* GAME TOTAL CARD */
.gtcard{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:11px;margin-bottom:8px}
/* P&L */
.pnlg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pnlb{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.bet-row{background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rbtns{display:flex;gap:5px;margin-top:6px}
.bw{background:var(--gbg);color:var(--grn);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.bl{background:var(--rbg);color:var(--red);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
/* TABS */
.tabrow{display:flex;gap:5px;margin-bottom:10px}
.tabb{flex:1;padding:7px;background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;text-align:center;font-weight:600}
.tabb.on{background:var(--gld);color:#000;border-color:var(--gld)}
/* PARLAY */
.leg{background:var(--sur2);border-radius:8px;padding:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.leg-rm{background:var(--rbg);color:var(--red);border:1px solid var(--red);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer}
/* ALERT */
.alert-warn{background:#1a0a00;border:1px solid var(--org);border-radius:9px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--org)}
.stl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.stl::after{content:"";flex:1;height:1px;background:var(--bdr)}
.empty{text-align:center;padding:24px;color:var(--mut);font-size:13px;line-height:1.6}
.rbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer}
</style>
</head>
<body>

  <div>
    <div class="logo">&#9918; Hitters Edge v8</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
var ODDS_KEY = 'c662d3af7ba8e40cddf08b0fca0684a9';
var ODDS_BASE = 'https://api.the-odds-api.com/v4';
var MLB_BASE  = 'https://statsapi.mlb.com/api/v1';

// ── STATE ─────────────────────────────────────────────────────────────────────
var D = null, BETS = [], LEGS = [], LM = 'single', TOAST_T = null;
var REFRESH_T = null, COUNTDOWN_T = null, NEXT_R = null;
var LF = {player:'',team:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
var PF = {odds:'',stake:'25',result:'PENDING'};
var ML = {player:'',market:'Over 0.5 Hits'};

// ── STORAGE ───────────────────────────────────────────────────────────────────
function sg(k,d){try{var v=localStorage.getItem('he8_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem('he8_'+k,JSON.stringify(v));}catch(e){}}
BETS = sg('bets',[]);

// ── PARK FACTORS ──────────────────────────────────────────────────────────────
var PF_MAP = {
  'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,
  'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,
  'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,
  'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,
  'Dodger Stadium':101,'T-Mobile Park':100,'Progressive Field':100,
  'Nationals Park':100,'Minute Maid Park':98,'Daikin Park':98,
  'Angel Stadium':99,'Chase Field':99,'loanDepot park':98,
  'Oracle Park':97,'Citi Field':97,'Comerica Park':97,
  'Petco Park':96,'Target Field':96,'PNC Park':96,
  'Busch Stadium':95,'Kauffman Stadium':95,'Tropicana Field':97,
  'Sutter Health Park':98,'UNIQLO Field at Dodger Stadium':101
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function nav(n) {
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('pg-'+n).classList.add('on');
  document.getElementById('nb-'+n).classList.add('on');
  if(n==='log')rLog();
  if(n==='pnl')rPnL();
}

function toast(m) {
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  if(TOAST_T)clearTimeout(TOAST_T);
  TOAST_T=setTimeout(function(){t.classList.remove('show');},2800);
}

function setP(m){document.getElementById('lu').textContent=m;}

function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}

function fmtTime(iso){
  if(!iso)return'TBD';
  try{
    var d=new Date(iso);
    return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';
  }catch(e){return'TBD';}
}

function fmtOdds(o){
  if(!o&&o!==0)return'--';
  return o>0?'+'+o:String(o);
}

function calcPayout(odds,stake){
  if(odds>0)return Math.round((stake*odds/100+stake)*100)/100;
  return Math.round((stake*100/Math.abs(odds)+stake)*100)/100;
}

function calcProfit(odds,stake,result){
  if(result==='WIN'){return odds>0?Math.round(stake*odds/100*100)/100:Math.round(stake*100/Math.abs(odds)*100)/100;}
  if(result==='LOSS')return -stake;
  return 0;
}

function hb(hc){
  if(!hc||hc==='Neutral')return'';
  if(hc==='HOT')return'<span class="hb">&#128293;&#128293;&#128293;</span>';
  if(hc==='Warming')return'<span class="hb">&#128293;&#128293;</span>';
  if(hc==='COLD')return'<span class="hb">&#129704;&#129704;&#129704;</span>';
  if(hc==='Cooling')return'<span class="hb">&#129704;</span>';
  return'';
}

function scoreBar(s,col){
  return'<div class="sbar"><div class="sbar-fill" style="width:'+Math.min(s,100)+'%;background:'+(col||'var(--gld)')+'"></div></div>';
}

// ── ODDS API ──────────────────────────────────────────────────────────────────
async function fetchOdds(market) {
  var url = ODDS_BASE+'/sports/baseball_mlb/odds?regions=us&markets='+market
    +'&oddsFormat=american&apiKey='+ODDS_KEY;
  try {
    var r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    console.error('Odds API error:', e);
    return null;
  }
}

async function fetchEventProps(eventId, markets) {
  var url = ODDS_BASE+'/sports/baseball_mlb/events/'+eventId+'/odds?regions=us&markets='
    +markets+'&oddsFormat=american&apiKey='+ODDS_KEY;
  try {
    var r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    console.error('Props API error:', e);
    return null;
  }
}

// ── MLB STATS API ─────────────────────────────────────────────────────────────
async function fetchJ(url) {
  try {
    var r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    console.warn('MLB API:', e.message);
    return null;
  }
}

async function loadBatterStats(id, season) {
  if(!id) return null;
  var d = await fetchJ(MLB_BASE+'/people/'+id+'?hydrate=stats(group=hitting,type=season,season='+season+')&sportId=1');
  var splits = d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length) return null;
  var s = splits[0].stat;
  var g = parseInt(s.gamesPlayed)||1;
  var hits = parseInt(s.hits)||0;
  var hrs = parseInt(s.homeRuns)||0;
  var tb = parseInt(s.totalBases)||0;
  var runs = parseInt(s.runs)||0;
  var rbi = parseInt(s.rbi)||0;
  var bb = parseInt(s.baseOnBalls)||0;
  var dbl = parseInt(s.doubles)||0;
  var sb = parseInt(s.stolenBases)||0;
  var avg = parseFloat(s.avg)||0;
  var obp = parseFloat(s.obp)||0;
  var slg = parseFloat(s.slg)||0;
  var bbRate = Math.round((obp-avg)*1000)/1000;

  // Last 14 days for hot/cold
  var l14 = await loadLast14(id, season);
  var hotCold = 'Neutral';
  if(l14.avg>0&&avg>0){
    var diff = l14.avg - avg;
    if(diff>=0.050) hotCold='HOT';
    else if(diff>=0.020) hotCold='Warming';
    else if(diff<=-0.050) hotCold='COLD';
    else if(diff<=-0.020) hotCold='Cooling';
  }

  return {
    avg, obp, slg, bbRate,
    hpg: Math.round((hits/g)*100)/100,
    hrpg: Math.round((hrs/g)*100)/100,
    tbpg: Math.round((tb/g)*100)/100,
    runspg: Math.round((runs/g)*100)/100,
    rbipg: Math.round((rbi/g)*100)/100,
    sbpg: Math.round((sb/g)*100)/100,
    dbpg: Math.round((dbl/g)*100)/100,
    hotCold, games: g
  };
}

async function loadLast14(id, season) {
  var d = await fetchJ(MLB_BASE+'/people/'+id+'/stats?stats=gameLog&group=hitting&season='+season+'&sportId=1');
  var splits = d&&d.stats&&d.stats[0]&&d.stats[0].splits||[];
  if(!splits.length) return {avg:0};
  var cut = new Date(); cut.setDate(cut.getDate()-14);
  var tH=0,tAB=0;
  for(var i=splits.length-1;i>=0;i--){
    if(new Date(splits[i].date)<cut) break;
    tH+=parseInt(splits[i].stat.hits)||0;
    tAB+=parseInt(splits[i].stat.atBats)||0;
  }
  return {avg: tAB>0?Math.round((tH/tAB)*1000)/1000:0};
}

async function loadPitcherStats(id, season) {
  if(!id) return null;
  var d = await fetchJ(MLB_BASE+'/people/'+id+'?hydrate=stats(group=pitching,type=season,season='+season+')&sportId=1');
  var splits = d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length) return null;
  var s = splits[0].stat;
  var ip = parseFloat(s.inningsPitched)||1;
  var gs = parseInt(s.gamesStarted)||0;
  var era = parseFloat(s.era)||0;
  var whip = parseFloat(s.whip)||0;
  var ks = parseInt(s.strikeOuts)||0;
  var bbs = parseInt(s.baseOnBalls)||0;
  var hits = parseInt(s.hits)||0;
  var k9 = Math.round((ks/ip)*9*10)/10;
  var bb9 = Math.round((bbs/ip)*9*10)/10;
  var avgK = gs>0?Math.round((ks/gs)*10)/10:0;
  var avgH = gs>0?Math.round((hits/gs)*10)/10:0;
  var vulnFlags = [];
  if(era>4.50) vulnFlags.push('ERA '+era);
  if(whip>1.40) vulnFlags.push('WHIP '+whip);
  if(k9<7.0) vulnFlags.push('K/9 '+k9);
  return {era,whip,k9,bb9,gs,avgK,avgH,isVuln:vulnFlags.length>=2,vulnFlags,
    isAce:era<=2.50&&gs>=6};
}

// ── SCORING FUNCTIONS ─────────────────────────────────────────────────────────
function scoreHits(b, pit, spot) {
  var s=0;
  // Batter AVG is the #1 factor for hits
  if(b.avg>=0.320)s+=30; else if(b.avg>=0.300)s+=22; else if(b.avg>=0.280)s+=15; else if(b.avg>=0.260)s+=8; else if(b.avg>=0.240)s+=3;
  if(b.hpg>=1.3)s+=20; else if(b.hpg>=1.1)s+=14; else if(b.hpg>=0.9)s+=8;
  // Walk rate hurts hits — walks take up at-bats
  if(b.bbRate>=0.12)s-=15; else if(b.bbRate>=0.09)s-=8; else if(b.bbRate>=0.06)s-=3; else if(b.bbRate<=0.03)s+=5;
  // Pitcher vulnerability
  if(pit){if(pit.isVuln)s+=15; else if(pit.era>4.0)s+=8;}
  // Lineup spot
  if(spot<=2)s+=10; else if(spot<=4)s+=6; else if(spot<=6)s+=3;
  // Hot/cold
  if(b.hotCold==='HOT')s+=12; else if(b.hotCold==='Warming')s+=6;
  else if(b.hotCold==='COLD')s-=15; else if(b.hotCold==='Cooling')s-=7;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreTB(b, pit, park) {
  var s=0;
  if(b.slg>=0.500)s+=25; else if(b.slg>=0.450)s+=18; else if(b.slg>=0.400)s+=10; else if(b.slg>=0.350)s+=4;
  if(b.tbpg>=1.8)s+=20; else if(b.tbpg>=1.5)s+=14; else if(b.tbpg>=1.2)s+=8;
  // Walk rate kills TB — walk = 0 total bases
  if(b.bbRate>=0.12)s-=18; else if(b.bbRate>=0.09)s-=10; else if(b.bbRate>=0.06)s-=4; else if(b.bbRate<=0.03)s+=5;
  if(pit){if(pit.isVuln)s+=12; else if(pit.era>4.0)s+=6;}
  if(park>=108)s+=12; else if(park>=104)s+=7; else if(park>=100)s+=3; else if(park<96)s-=8;
  if(b.hotCold==='HOT')s+=10; else if(b.hotCold==='COLD')s-=12;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreHR(b, pit, park) {
  var s=0;
  if(b.hrpg>=0.25)s+=35; else if(b.hrpg>=0.18)s+=25; else if(b.hrpg>=0.12)s+=15; else if(b.hrpg>=0.07)s+=6;
  if(b.slg>=0.500)s+=12; else if(b.slg>=0.450)s+=7;
  if(pit){if(pit.isVuln)s+=12; else if(pit.era>4.5)s+=6;}
  if(park>=112)s+=18; else if(park>=108)s+=12; else if(park>=104)s+=6; else if(park<96)s-=12;
  if(b.hotCold==='HOT')s+=8; else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreHRI(b, pit, spot, park) {
  var s=0;
  if(spot<=2)s+=25; else if(spot<=3)s+=15; else if(spot<=4)s+=10; else if(spot<=5)s+=5;
  if(b.obp>=0.380)s+=18; else if(b.obp>=0.350)s+=12; else if(b.obp>=0.320)s+=7;
  if(b.avg>=0.300)s+=12; else if(b.avg>=0.275)s+=8; else if(b.avg>=0.250)s+=4;
  if(b.runspg+b.rbipg>=1.5)s+=12; else if(b.runspg+b.rbipg>=1.0)s+=7;
  if(pit){if(pit.isVuln)s+=15; else if(pit.era>4.0)s+=8;}
  if(park>=108)s+=8; else if(park>=104)s+=4;
  if(b.hotCold==='HOT')s+=10; else if(b.hotCold==='Warming')s+=5;
  else if(b.hotCold==='COLD')s-=12; else if(b.hotCold==='Cooling')s-=6;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreSB(b) {
  var s=0;
  if(b.sbpg>=0.25)s+=45; else if(b.sbpg>=0.15)s+=30; else if(b.sbpg>=0.08)s+=15; else if(b.sbpg>=0.04)s+=5;
  if(b.obp>=0.370)s+=12; else if(b.obp>=0.340)s+=7;
  if(b.hotCold==='HOT')s+=8; else if(b.hotCold==='COLD')s-=15;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreDoubles(b, pit, park) {
  var s=0;
  if(b.dbpg>=0.20)s+=35; else if(b.dbpg>=0.14)s+=25; else if(b.dbpg>=0.09)s+=15; else if(b.dbpg>=0.05)s+=5;
  if(b.avg>=0.300)s+=12; else if(b.avg>=0.270)s+=7;
  if(b.slg>=0.470)s+=12; else if(b.slg>=0.420)s+=7;
  if(pit&&pit.isVuln)s+=10;
  if(park>=108)s+=10; else if(park>=104)s+=6; else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=8; else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scoreWalks(b, pit) {
  var s=0;
  if(b.bbRate>=0.15)s+=35; else if(b.bbRate>=0.12)s+=25; else if(b.bbRate>=0.09)s+=15; else if(b.bbRate>=0.06)s+=7;
  if(pit&&pit.bb9>=4.0)s+=30; else if(pit&&pit.bb9>=3.0)s+=18; else if(pit&&pit.bb9>=2.5)s+=8;
  if(b.hotCold==='HOT')s+=5; else if(b.hotCold==='COLD')s-=8;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function scorePitcherK(pit) {
  var s=0;
  if(pit.avgK>=7.5)s+=35; else if(pit.avgK>=6.0)s+=25; else if(pit.avgK>=4.5)s+=10;
  if(pit.k9>=9.0)s+=22; else if(pit.k9>=7.5)s+=14;
  if(pit.avgH<=5.0)s+=15; else if(pit.avgH<=6.5)s+=8;
  if(pit.gs>=8)s+=10; else if(pit.gs>=4)s+=5;
  if(pit.bb9<=2.5)s+=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function gradePlay(score, oddsValue) {
  // Grade based on score AND odds value
  // oddsValue: positive = good value, negative = bad value
  if(score>=70&&oddsValue>=0) return'A';
  if(score>=60&&oddsValue>=-10) return'A';
  if(score>=55) return'B';
  if(score>=45) return'B';
  return'C';
}

var PROP_MARKETS = [
  'batter_hits','batter_total_bases','batter_home_runs',
  'batter_rbis','batter_runs_scored','batter_stolen_bases',
  'batter_doubles','batter_walks',

// ── MAIN LOADER ───────────────────────────────────────────────────────────────
async function loadAll() {
  var season = 2026;
  setP('Loading MLB games...');
  document.getElementById('pg-picks').innerHTML = '<div class="load"><div class="spnr"></div>Loading today\'s props...</div>';
  document.getElementById('pg-totals').innerHTML = '<div class="load"><div class="spnr"></div>Loading totals...</div>';

  // Step 1: Get today's games + totals from Odds API
  setP('Fetching odds...');
  var gamesData = await fetchOdds('h2h,totals');

  if(!gamesData) {
    document.getElementById('pg-picks').innerHTML = '<div class="card"><div class="err">&#9888; Could not connect to Odds API. Check your API key or internet connection.</div><button class="btn" onclick="loadAll()">Retry</button></div>';
    return;
  }

  if(!gamesData.length) {
    document.getElementById('pg-picks').innerHTML = '<div class="card" style="text-align:center;color:var(--mut);padding:30px">No MLB games today. Check back tomorrow.</div>';
    return;
  }

  // Filter to upcoming games only
  var now = new Date();
  var upcoming = gamesData.filter(function(g){return new Date(g.commence_time)>now;});
  var live = gamesData.filter(function(g){
    var ct = new Date(g.commence_time);
    return ct<=now && (now-ct)<(4*60*60*1000); // within 4 hours of start
  });
  var finished = gamesData.filter(function(g){
    var ct = new Date(g.commence_time);
    return (now-ct)>=(4*60*60*1000);
  });

  // Step 2: Load props for upcoming games
  setP('Loading player props...');
  var allProps = {}; // eventId -> props data
  for(var gi=0; gi<upcoming.length; gi++) {
    var ev = upcoming[gi];
    setP('Props '+ev.away_team+' @ '+ev.home_team+'...');
    var pd = await fetchEventProps(ev.id, PROP_MARKETS);
    if(pd) allProps[ev.id] = pd;
    await slp(300); // rate limit
  }

  // Step 3: Build picks from props data
  setP('Scoring picks...');
  var picks = [];
  var pitcherCache = {};
  var batterCache = {};

  for(var ei=0; ei<upcoming.length; ei++) {
    var game = upcoming[ei];
    var props = allProps[game.id];
    if(!props||!props.bookmakers||!props.bookmakers.length) continue;

    var park = PF_MAP[props.home_team]||100;
    var venue = props.home_team; // approximation

    // Collect all player props from best book (DraftKings preferred, then FanDuel)
    var bookPref = ['draftkings','fanduel','betmgm','caesars','mybookieag','bovada'];
    var bestBook = null;
    for(var bi=0; bi<bookPref.length; bi++){
      var found = props.bookmakers.find(function(bk){return bk.key===bookPref[bi];});
      if(found){bestBook=found;break;}
    }
    if(!bestBook&&props.bookmakers.length) bestBook=props.bookmakers[0];
    if(!bestBook) continue;

    // Also check Hard Rock Bet specifically if available
    var hardRock = props.bookmakers.find(function(bk){return bk.key==='hardrock_bet'||bk.key==='hard_rock';});

    // Group outcomes by player and market
    var playerProps = {}; // playerName -> {market -> {line, over, under}}
    bestBook.markets.forEach(function(mkt){
      mkt.outcomes.forEach(function(o){
        if(!o.description) return; // skip non-player outcomes
        var name = o.description;
        if(!playerProps[name]) playerProps[name]={};
        if(!playerProps[name][mkt.key]) playerProps[name][mkt.key]={line:o.point,over:null,under:null};
        if(o.name==='Over') playerProps[name][mkt.key].over=o.price;
        if(o.name==='Under') playerProps[name][mkt.key].under=o.price;
      });
    });

    // Score each player's props
    var playerNames = Object.keys(playerProps);
    for(var pi=0; pi<playerNames.length; pi++) {
      var pName = playerNames[pi];
      var pMkts = playerProps[pName];

      // Look up MLB player stats by name
      if(!batterCache[pName]) {
        var search = await fetchJ(MLB_BASE+'/people/search?names='+encodeURIComponent(pName)+'&sportId=1');
        var pid = search&&search.people&&search.people[0]&&search.people[0].id;
        if(pid) {
          batterCache[pName] = await loadBatterStats(pid, season);
          await slp(150);
        } else {
          batterCache[pName] = null;
        }
      }
      var bStats = batterCache[pName];

      // Score each available market
      Object.keys(pMkts).forEach(function(mktKey){
        var mkt = pMkts[mktKey];
        if(mkt.over===null&&mkt.under===null) return;

        var score = 0;
        var recSide = null;
        var recOdds = null;
        var propLabel = '';
        var betLine = '';

        if(bStats) {
          if(mktKey==='batter_hits'){
            score=scoreHits(bStats,null,5);
            propLabel='Over '+mkt.line+' Hits';
            betLine='Over '+mkt.line+' Hits';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_total_bases'){
            score=scoreTB(bStats,null,park);
            propLabel='Over '+mkt.line+' Total Bases';
            betLine='Over '+mkt.line+' Total Bases';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_home_runs'){
            score=scoreHR(bStats,null,park);
            propLabel='Over '+mkt.line+' HR';
            betLine='Over '+mkt.line+' HR';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_rbis'){
            score=scoreHRI(bStats,null,5,park);
            propLabel='Over '+mkt.line+' RBI';
            betLine='Over '+mkt.line+' RBI';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_runs_scored'){
            score=scoreHRI(bStats,null,5,park)*0.85;
            propLabel='Over '+mkt.line+' Runs';
            betLine='Over '+mkt.line+' Runs Scored';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_stolen_bases'){
            score=scoreSB(bStats);
            propLabel='Over '+mkt.line+' SB';
            betLine='Over '+mkt.line+' Stolen Bases';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_doubles'){
            score=scoreDoubles(bStats,null,park);
            propLabel='Over '+mkt.line+' Doubles';
            betLine='Over '+mkt.line+' Doubles';
            recSide='over'; recOdds=mkt.over;
          } else if(mktKey==='batter_walks'){
            score=scoreWalks(bStats,null);
            propLabel='Over '+mkt.line+' Walks';
            betLine='Over '+mkt.line+' Walks';
            recSide='over'; recOdds=mkt.over;
          }
        }

        if(mktKey==='pitcher_strikeouts') {
          // Need pitcher stats
          propLabel=(score>=50?'Over':'Under')+' '+mkt.line+' Strikeouts';
          betLine=propLabel;
          // Will be handled below
        }

        if(score<40||!recOdds) return;

        // Only show if odds are -140 or better
        if(recOdds<-140) return;

        var grade = score>=65?'A':score>=50?'B':'C';
        if(grade==='C') return;

        picks.push({
          name: pName,
          game: game.away_team+' @ '+game.home_team,
          time: fmtTime(game.commence_time),
          venue: venue,
          park: park,
          propLabel: propLabel,
          betLine: betLine,
          mktKey: mktKey,
          line: mkt.line,
          overOdds: mkt.over,
          underOdds: mkt.under,
          recSide: recSide,
          recOdds: recOdds,
          score: Math.round(score),
          grade: grade,
          stats: bStats,
          gameId: game.id
        });
      });
    }
  }

  // Also handle pitcher Ks separately using pitcher stats
  setP('Loading pitcher data...');
  for(var ei2=0; ei2<upcoming.length; ei2++) {
    var gm = upcoming[ei2];
    var pdata = allProps[gm.id];
    if(!pdata) continue;

    // Find pitcher strikeout markets
    var bestBk = pdata.bookmakers.find(function(b){return b.key==='draftkings';}) || pdata.bookmakers[0];
    if(!bestBk) continue;

    var kMkt = bestBk.markets.find(function(m){return m.key==='pitcher_strikeouts';});
    if(!kMkt) continue;

    // Group by pitcher
    var pitcherKs = {};
    kMkt.outcomes.forEach(function(o){
      if(!o.description) return;
      var n = o.description;
      if(!pitcherKs[n]) pitcherKs[n]={line:o.point,over:null,under:null};
      if(o.name==='Over') pitcherKs[n].over=o.price;
      if(o.name==='Under') pitcherKs[n].under=o.price;
    });

    var pitNames = Object.keys(pitcherKs);
    for(var pki=0; pki<pitNames.length; pki++) {
      var pitName = pitNames[pki];
      var pitK = pitcherKs[pitName];

      if(!pitcherCache[pitName]) {
        var ps = await fetchJ(MLB_BASE+'/people/search?names='+encodeURIComponent(pitName)+'&sportId=1');
        var ppid = ps&&ps.people&&ps.people[0]&&ps.people[0].id;
        if(ppid) {
          pitcherCache[pitName] = await loadPitcherStats(ppid, season);
          await slp(150);
        } else {
          pitcherCache[pitName] = null;
        }
      }

      var pst = pitcherCache[pitName];
      if(!pst) continue;

      var kScore = scorePitcherK(pst);
      var recSide2 = kScore>=55?'over':'under';
      var recOdds2 = recSide2==='over'?pitK.over:pitK.under;

      if(!recOdds2||recOdds2<-140) continue;
      if(kScore<45) continue;

      var grade2 = kScore>=65?'A':kScore>=50?'B':'C';
      if(grade2==='C') continue;

      picks.push({
        name: pitName,
        game: gm.away_team+' @ '+gm.home_team,
        time: fmtTime(gm.commence_time),
        isPitcher: true,
        mktKey: 'pitcher_strikeouts',
        propLabel: (recSide2==='over'?'Over':'Under')+' '+pitK.line+' Strikeouts',
        betLine: (recSide2==='over'?'Over':'Under')+' '+pitK.line+' Ks',
        line: pitK.line,
        overOdds: pitK.over,
        underOdds: pitK.under,
        recSide: recSide2,
        recOdds: recOdds2,
        score: kScore,
        grade: grade2,
        pitStats: pst,
        gameId: gm.id
      });
    }
  }

  // Sort: A first, then by score
  picks.sort(function(a,b){
    if(a.grade!==b.grade) return a.grade<b.grade?-1:1;
    return b.score-a.score;
  });

  // Build totals
  var totals = [];
  gamesData.forEach(function(g){
    var isUpcoming = new Date(g.commence_time)>now;
    var bk = g.bookmakers&&g.bookmakers.find(function(b){return b.key==='draftkings';})||g.bookmakers&&g.bookmakers[0];
    if(!bk) return;
    var tot = bk.markets&&bk.markets.find(function(m){return m.key==='totals';});
    if(!tot) return;
    var over = tot.outcomes.find(function(o){return o.name==='Over';});
    var under = tot.outcomes.find(function(o){return o.name==='Under';});
    if(!over||!under) return;
    totals.push({
      game: g.away_team+' @ '+g.home_team,
      time: fmtTime(g.commence_time),
      line: over.point,
      overOdds: over.price,
      underOdds: under.price,
      isUpcoming: isUpcoming,
      park: PF_MAP[g.home_team]||100
    });
  });

  D = {
    picks, totals,
    upcoming: upcoming.length,
    live: live.length,
    finished: finished.length,
    loadedAt: new Date().toLocaleTimeString(),
    date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
  };

  setP('Updated '+D.loadedAt);
  rPicks();
  rTotals();
  updPnLHdr();
  if(!REFRESH_T) startAR();
}

    h+='<div style="display:flex;align-items:center;gap:8px">';

  document.getElementById('pg-totals').innerHTML = h;
}

// ── P&L ───────────────────────────────────────────────────────────────────────
function updPnLHdr() {
  var tot = BETS.reduce(function(a,b){return a+(b.profit||0);},0);
  var el = document.getElementById('pnl-hdr');
  el.textContent = (tot>=0?'+$':'-$')+Math.abs(tot).toFixed(2);
  el.style.color = tot>=0?'var(--grn)':'var(--red)';
}

function rPnL() {
  var today = new Date().toLocaleDateString();
  var pnl = BETS.reduce(function(a,b){
    a.total+=(b.profit||0);
    a.staked+=(b.stake||0);
    if(b.dateStr===today) a.today+=(b.profit||0);
    if(b.result==='WIN')a.wins++; else if(b.result==='LOSS')a.losses++; else a.pend++;
    return a;
  },{total:0,today:0,staked:0,wins:0,losses:0,pend:0});
  var roi = pnl.staked>0?Math.round((pnl.total/pnl.staked)*100):0;

  var h = '<div class="pnlg">';
  h += '<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(pnl.today>=0?'var(--grn)':'var(--red)')+'">'+(pnl.today>=0?'+$':'-$')+Math.abs(pnl.today).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">TODAY</div></div>';
  h += '<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(pnl.total>=0?'var(--grn)':'var(--red)')+'">'+(pnl.total>=0?'+$':'-$')+Math.abs(pnl.total).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">ALL TIME</div></div>';
  h += '<div class="pnlb"><div style="font-size:18px;font-weight:700">'+pnl.wins+'W / '+pnl.losses+'L</div><div style="font-size:10px;color:var(--mut)">RECORD</div></div>';
  h += '<div class="pnlb"><div style="font-size:18px;font-weight:700;color:'+(roi>=0?'var(--grn)':'var(--red)')+'">'+roi+'%</div><div style="font-size:10px;color:var(--mut)">ROI</div></div>';
  h += '</div>';

  if(!BETS.length) {
    h += '<div class="empty">No bets logged yet.<br>Go to Log tab to add your first bet.</div>';
  } else {
    h += '<div class="stl">Bet History</div>';
    BETS.forEach(function(b){
      var pc = b.result==='WIN'?'var(--grn)':b.result==='LOSS'?'var(--red)':'var(--mut)';
      var pl = b.result==='WIN'?'+$'+b.profit.toFixed(2):b.result==='LOSS'?'-$'+Math.abs(b.profit||0).toFixed(2):'PENDING';
      h += '<div class="bet-row">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b.player+'</div>';
      h += '<div style="font-size:10px;color:var(--mut);margin-top:2px">'+b.dateStr+' &middot; '+b.market+' &middot; $'+b.stake+' @ '+fmtOdds(parseInt(b.odds))+'</div>';
      if(b.result==='PENDING'||!b.result) {
        h += '<div class="rbtns">';
        h += '<button class="bw" onclick="markR('+b.id+',\'WIN\')">&#10003; Win</button>';
        h += '<button class="bl" onclick="markR('+b.id+',\'LOSS\')">&#10007; Loss</button>';
        h += '</div>';
      }
      h += '</div>';
      h += '<div style="text-align:right;flex-shrink:0">';
      h += '<div style="font-size:14px;font-weight:700;color:'+pc+'">'+pl+'</div>';
      h += '<div style="font-size:10px;color:var(--mut);margin-top:2px">'+b.result+'</div>';
      h += '</div>';
      h += '</div>';
    });
  }

  document.getElementById('pg-pnl').innerHTML = h;
  updPnLHdr();
}

// ── LOG TAB ───────────────────────────────────────────────────────────────────
var MKTS = [
  'Over 0.5 Hits','Over 1.5 Hits','Over 1.5 Total Bases','Over 2.5 Total Bases',
  'Over 0.5 HR','Over 0.5 RBI','Over 1.5 RBI','Over 0.5 Runs Scored',
  'Over 0.5 Stolen Bases','Over 0.5 Doubles','Over 0.5 Walks',
  'Over 4.5 Strikeouts','Over 5.5 Strikeouts','Over 6.5 Strikeouts','Over 7.5 Strikeouts',
  'Under 3.5 Strikeouts','Under 4.5 Strikeouts',
  'Over Game Total','Under Game Total','Other'
];

function rLog() {
  var tabs = '<div class="tabrow">';
  tabs += '<div class="tabb'+(LM==='single'?' on':'')+'" onclick="setLM(\'single\')">Single</div>';
  tabs += '<div class="tabb'+(LM==='parlay'?' on':'')+'" onclick="setLM(\'parlay\')">Parlay</div>';
  tabs += '</div>';
  var body = LM==='single'?rSingle():rParlay();
  document.getElementById('pg-log').innerHTML = tabs+body;
}

function setLM(m){LM=m;rLog();}

function rSingle(){
  var h='<div class="card">';
  h+='<label class="lbl">Player / Pitcher</label><input class="inp" id="fp" value="'+LF.player+'" placeholder="e.g. Yordan Alvarez" oninput="LF.player=this.value">';
  h+='<label class="lbl">Market</label><select class="inp" onchange="LF.market=this.value">';
  MKTS.forEach(function(m){h+='<option'+(m===LF.market?' selected':'')+'>'+m+'</option>';});
  h+='</select>';
  h+='<label class="lbl">Odds (American)</label><input class="inp" type="number" value="'+LF.odds+'" placeholder="-115" oninput="LF.odds=this.value">';
  h+='<label class="lbl">Stake ($)</label><input class="inp" type="number" value="'+LF.stake+'" oninput="LF.stake=this.value">';
  h+='<label class="lbl">Result</label><select class="inp" onchange="LF.result=this.value">';
  ['PENDING','WIN','LOSS'].forEach(function(r){h+='<option'+(r===LF.result?' selected':'')+'>'+r+'</option>';});
  h+='</select>';
  h+='<label class="lbl">Notes (optional)</label><input class="inp" value="'+LF.notes+'" placeholder="vs Tanner Bibee, Daikin Park..." oninput="LF.notes=this.value">';
  h+='<button class="btn" onclick="subBet()">Save Bet</button></div>';
  return h;
}

function rParlay(){
  var h='<div class="card">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px">PARLAY LEGS ('+LEGS.length+')</div>';
  if(!LEGS.length){
    h+='<div style="text-align:center;padding:14px;color:var(--mut);font-size:12px;border:1px dashed var(--bdr);border-radius:8px;margin-bottom:10px">Tap &ldquo;+ Add to Parlay&rdquo; on any pick</div>';
  } else {
    LEGS.forEach(function(l,i){
      h+='<div class="leg"><div><div style="font-size:10px;color:var(--mut)">Leg '+(i+1)+'</div>';
      h+='<div style="font-size:13px;font-weight:600">'+l.player+'</div>';
      h+='<div style="font-size:11px;color:var(--mut)">'+l.market+'</div></div>';
      h+='<button class="leg-rm" onclick="rmLeg('+i+')">&#10005;</button></div>';
    });
  }
  // Manual add
  h+='<div style="border:1px dashed var(--bdr);border-radius:8px;padding:10px;margin-bottom:10px">';
  h+='<div style="font-size:10px;color:var(--mut);margin-bottom:6px">ADD LEG MANUALLY</div>';
  h+='<input class="inp" placeholder="Player name" value="'+ML.player+'" oninput="ML.player=this.value" style="margin-bottom:6px">';
  h+='<select class="inp" onchange="ML.market=this.value" style="margin-bottom:0">';
  MKTS.forEach(function(m){h+='<option>'+m+'</option>';});
  h+='</select>';
  h+='<button class="btn-s" onclick="addManLeg()" style="margin-top:6px">+ Add Leg</button></div>';

  h+='<label class="lbl">Combined Odds</label><input class="inp" type="number" placeholder="+350" value="'+PF.odds+'" oninput="PF.odds=this.value">';
  h+='<label class="lbl">Stake ($)</label><input class="inp" type="number" value="'+PF.stake+'" oninput="PF.stake=this.value">';
  h+='<label class="lbl">Result</label><select class="inp" onchange="PF.result=this.value">';
  ['PENDING','WIN','LOSS'].forEach(function(r){h+='<option'+(r===PF.result?' selected':'')+'>'+r+'</option>';});
  h+='</select>';

  if(LEGS.length>=2){
    h+='<button class="btn" onclick="subParlay()">Save Parlay ('+LEGS.length+' legs)</button>';
    h+='<button class="btn-s" onclick="copyParlay()" style="margin-top:6px">&#129302; Analyze with Claude</button>';
    h+='<div id="parlay-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;color:var(--grn)">&#10003; Copied! Paste into Claude.</div>';
  } else {
    h+='<div style="text-align:center;padding:8px;color:var(--mut);font-size:12px">Need at least 2 legs</div>';
  }
  h+='<button class="btn-s" style="background:var(--rbg);color:var(--red);border-color:var(--red);margin-top:6px" onclick="clrLegs()">Clear All Legs</button>';
  h+='</div>';
  return h;
}

// ── BET ACTIONS ───────────────────────────────────────────────────────────────
function logFG(cid){
  var d=window['_d'+cid]; if(!d){toast('Error reading pick');return;}
  LF.player=d.player; LF.market=d.market;
  LF.notes=d.team+' | '+d.time;
  LM='single'; nav('log');
  toast('Pre-filled — add odds and save');
}

function aLeg(cid){
  var d=window['_d'+cid]; if(!d){toast('Error');return;}
  LEGS.push({player:d.player,market:d.market});
  toast('Added leg '+(LEGS.length));
  if(LM==='parlay')rLog();
}

function addManLeg(){
  if(!ML.player){toast('Enter a player name');return;}
  LEGS.push({player:ML.player,market:ML.market});
  ML.player=''; toast('Leg added ('+LEGS.length+')'); rLog();
}

function rmLeg(i){LEGS.splice(i,1);rLog();}
function clrLegs(){LEGS=[];rLog();toast('Cleared');}

function subBet(){
  if(!LF.player){toast('Enter a player name');return;}
  var stake=parseFloat(LF.stake)||25;
  var odds=parseInt(LF.odds)||(-115);
  var profit=calcProfit(odds,stake,LF.result);
  BETS.unshift({
    id:Date.now(),
    dateStr:new Date().toLocaleDateString(),
    player:LF.player,market:LF.market,
    odds:odds,stake:stake,result:LF.result,
    profit:profit,notes:LF.notes
  });
  ss('bets',BETS);
  LF={player:'',team:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
  toast('Bet saved!'); rLog(); rPnL();
}

function subParlay(){
  if(LEGS.length<2){toast('Need 2+ legs');return;}
  if(!PF.odds){toast('Enter combined odds');return;}
  var stake=parseFloat(PF.stake)||25;
  var odds=parseInt(PF.odds)||0;
  var profit=calcProfit(odds,stake,PF.result);
  BETS.unshift({
    id:Date.now(),
    dateStr:new Date().toLocaleDateString(),
    player:'PARLAY ('+LEGS.length+' legs)',
    market:LEGS.map(function(l){return l.player+' '+l.market;}).join(' + '),
    odds:odds,stake:stake,result:PF.result,profit:profit,notes:''
  });
  ss('bets',BETS);
  LEGS=[]; PF={odds:'',stake:'25',result:'PENDING'};
  toast('Parlay saved!'); rLog(); rPnL();
}

function markR(id,result){
  var idx=BETS.findIndex(function(b){return b.id===id;});
  if(idx===-1)return;
  var b=BETS[idx];
  b.result=result;
  b.profit=calcProfit(b.odds,b.stake,result);
  BETS[idx]=b;
  ss('bets',BETS);
  toast(result==='WIN'?'&#9989; Marked WIN!':'&#10060; Marked Loss');
  rPnL();
}

// ── COPY FOR CLAUDE ───────────────────────────────────────────────────────────
function copyPicks(){
  if(!D){toast('No data loaded');return;}
  var aG=D.picks.filter(function(p){return p.grade==='A';});
  var bG=D.picks.filter(function(p){return p.grade==='B';});
  var wins=BETS.filter(function(b){return b.result==='WIN';}).length;
  var total=BETS.filter(function(b){return b.result!=='PENDING';}).length;

  var txt='HITTERS EDGE — '+D.date+'\n';
  txt+='Record: '+wins+'W / '+(total-wins)+'L'+(total?(' — '+Math.round(wins/total*100)+'% win rate'):'')+'  \n\n';
  txt+='DATA SOURCE: The Odds API (real props from DraftKings/FanDuel, live odds)\n\n';

  txt+='═══ A-GRADE PICKS (bet these) ═══\n';
  if(!aG.length) txt+='None today\n';
  aG.forEach(function(p){
    txt+='\n'+p.name+'\n';
    txt+='  Prop: '+p.propLabel+'\n';
    txt+='  Odds: '+fmtOdds(p.recOdds)+'\n';
    txt+='  Score: '+p.score+'/100\n';
    txt+='  Game: '+p.game+' | '+p.time+'\n';
    if(p.stats){
      txt+='  AVG: '+p.stats.avg+' OBP: '+p.stats.obp+' SLG: '+p.stats.slg+'\n';
      txt+='  H/G: '+p.stats.hpg+' | Walk Rate: '+p.stats.bbRate+'\n';
      txt+='  Streak: '+p.stats.hotCold+'\n';
    }
  });

  txt+='\n═══ B-GRADE PICKS (bonus bets only) ═══\n';
  if(!bG.length) txt+='None\n';
  bG.slice(0,5).forEach(function(p){
    txt+='\n'+p.name+' — '+p.propLabel+' '+fmtOdds(p.recOdds)+'\n';
    txt+='  Score: '+p.score+'/100 | '+p.game+' '+p.time+'\n';
    if(p.stats) txt+='  AVG: '+p.stats.avg+' | Streak: '+p.stats.hotCold+'\n';
  });

  txt+='\n═══ GAME TOTALS ═══\n';
  D.totals.filter(function(t){return t.isUpcoming;}).forEach(function(t){
    txt+=t.game+' — Line: '+t.line+' | Over: '+fmtOdds(t.overOdds)+' Under: '+fmtOdds(t.underOdds)+'\n';
  });

  txt+='\n═══ WHAT I NEED FROM YOU ═══\n';
  txt+='1. TOP PICK today and why\n';
  txt+='2. Best 2-3 leg PARLAY combination\n';
  txt+='3. Any picks to AVOID and why\n';
  txt+='4. Overall assessment — strong or weak day\n';
  txt+='\nRULES: A-Grade = real money $25 max. B-Grade = bonus bets only. -140 or better odds only.';

  copyText(txt,'copy-ok');
}

function copyParlay(){
  var txt='PARLAY ANALYSIS REQUEST\n\n';
  txt+='Legs ('+LEGS.length+'):\n';
  LEGS.forEach(function(l,i){
    txt+=(i+1)+'. '+l.player+' — '+l.market+'\n';
    if(D){
      var match=D.picks.find(function(p){return p.name.toLowerCase().indexOf(l.player.toLowerCase())>-1;});
      if(match){
        txt+='   Score: '+match.score+'/100 | Odds: '+fmtOdds(match.recOdds)+'\n';
        if(match.stats) txt+='   AVG: '+match.stats.avg+' | Streak: '+match.stats.hotCold+'\n';
      }
    }
  });
  txt+='\nQUESTIONS:\n1. Grade each leg\n2. Do these legs correlate?\n3. Weakest leg to remove\n4. Singles vs parlay — what do you recommend';
  copyText(txt,'parlay-ok');
}

function copyText(txt,okId){
  navigator.clipboard.writeText(txt).then(function(){
    showOk(okId); toast('&#10003; Copied!');
  }).catch(function(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');showOk(okId);toast('&#10003; Copied!');}
    catch(e){toast('Could not copy');}
    document.body.removeChild(ta);
  });
}

function showOk(id){
  var el=document.getElementById(id);
  if(el){el.style.display='block';setTimeout(function(){el.style.display='none';},5000);}
}

// ── AUTO REFRESH ──────────────────────────────────────────────────────────────
function startAR(){
  if(REFRESH_T)return;
  NEXT_R=Date.now()+60*60*1000;
  REFRESH_T=setInterval(function(){
    loadAll();
    NEXT_R=Date.now()+60*60*1000;
  },60*60*1000);

  if(COUNTDOWN_T)clearInterval(COUNTDOWN_T);
  COUNTDOWN_T=setInterval(function(){
    var el=document.getElementById('rtimer');
    if(!el)return;
    var diff=NEXT_R-Date.now();
    if(diff<=0){el.textContent='Refreshing...';return;}
    var m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);
    el.textContent='Refresh in '+m+'m '+('0'+s).slice(-2)+'s';
  },1000);
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
loadAll();
