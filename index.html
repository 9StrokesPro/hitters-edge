<style>

<script>
'use strict';
/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   EDGE SCANNER v14 ‚Äî clean rebuild (2026-07). ONE job, done honestly:
   flag SETUP BETS = a book whose price is out of line with the de-vig consensus
   of its peer books, across ALL active sports, main markets (ML/spread/total).
   No prediction. No stats. The market is the model; the outlier is the bet.
   Judged by CLV. Paper until the strategy PROVES it beats the close.
   Prior system's 3,727-bet history proved stat-based picking has zero edge ‚Äî
   that machinery is gone by design, not by accident.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */

// ‚îÄ‚îÄ CONFIG ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var API_KEY   = 'c662d3af7ba8e40cddf08b0fca0684a9';
var BASE      = 'https://api.the-odds-api.com/v4';
var REGION    = 'us,us2';                   // us2 adds Hard Rock Bet (Joe's only legal book in FL)
var MARKETS   = 'h2h,spreads,totals';       // 3 markets x 2 regions = 6 credits per sport per sweep
var HOME_BOOK = 'hardrockbet';              // Joe's book: every pick shows Hard Rock's price vs fair
// Joe's sports, in priority order. Others are ignored entirely.
var SPORT_PRIORITY=['baseball_mlb','americanfootball_nfl','basketball_nba','icehockey_nhl','soccer_epl','americanfootball_ncaaf','basketball_ncaab','basketball_wnba','soccer_usa_mls','mma_mixed_martial_arts'];
var MAX_SPORTS       = 8;      // pull odds for at most N sports per sweep (budget)
var WINDOW_HOURS     = 48;     // ONLY games starting within this window ‚Äî kills off-season /
                               // far-future lines (e.g. an NFL game posted months early with
                               // 2 books and junk prices). A sport with no games in-window is
                               // skipped for FREE via the /events endpoint (0 credits).
var EDGE_MIN         = 0.02;   // flag when best price beats peer consensus by >= 2pp
var EDGE_IMPLAUSIBLE = 0.08;   // above this = stale/suspended line, flag as artifact, never a pick
var MIN_PEERS        = 3;      // need >= N OTHER two-way books for a trustworthy consensus
// SELECTS = the market's most likely WINNERS tonight (moneyline), ranked by the de-vig
// consensus probability across all books ‚Äî the strongest predictor available anywhere.
// Taken at the best-priced book. Tracked separately from setups so the data shows how
// "pick the likely winner" actually performs (the price charges for likelihood ‚Äî measure it).
// SELECTS (Joe's spec): winners first, at decent odds, bettable AT HARD ROCK.
// A select must be: the consensus-favored side (>=50% to win), QUOTED ON HARD ROCK,
// with Hard Rock's price inside [-140 .. +200). Ranked by WIN PROBABILITY.
var SELECT_MIN_PROB  = 0.50;   // every select is more likely to win than lose
var SELECT_MIN_PEERS = 4;      // need a real consensus (>= N two-way books)
var SELECT_MAX       = 10;     // top N per sweep
var SELECT_MIN_ODDS  = -140;   // no heavier juice than -140 (kills -156/-400 favorites)
var SELECT_MAX_ODDS  = 200;    // nothing at +200 or longer (too much risk)
var PAPER_MODE       = true;   // master switch. Real-money label turns on ONLY via clvProven() below.
var CLV_PROVE_N      = 50;     // strategy needs >= N settled flagged picks...
var CLV_PROVE_PCT    = 52;     // ...with >= this % beating the close AND avg CLV >= 0
var REFRESH_MS       = 60*60*1000; // widened automatically by the budget guard
var K = 'es14_';               // localStorage prefix (old he9_ history left untouched)

// ‚îÄ‚îÄ UTIL ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function sg(k,d){try{var v=localStorage.getItem(K+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function fmtOdds(o){return o==null?'?':(o>0?'+'+o:''+o);}
// TODAY/TOMORROW tag + relative hours, so a rolling 48h board is never confusing
function whenTag(start){
  var d=new Date(start),now=new Date();
  var day=(d.toDateString()===now.toDateString())?'TODAY':(d.toDateString()===new Date(now.getTime()+864e5).toDateString())?'TOMORROW':(d.getMonth()+1)+'/'+d.getDate();
  var hrs=Math.round((d.getTime()-now.getTime())/36e5);
  return '<b>'+day+'</b> '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(hrs>=1?' (in '+hrs+'h)':' (soon)');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function impliedProb(a){if(a==null||isNaN(a))return null;return a<0?(-a)/(-a+100):100/(a+100);}
function profit1u(a){return a>0?a/100:100/Math.abs(a);}
function devig(pa,pb){var qa=impliedProb(pa),qb=impliedProb(pb);if(qa==null||qb==null)return null;var s=qa+qb;return s>0?qa/s:null;}

// ‚îÄ‚îÄ BUDGET GUARD (proven pattern; headers are CORS-exposed) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var BUDGET=sg('budget',{remaining:null,used:null,ts:null});
async function oddsFetch(url){
  try{
    var r=await fetch(url);
    var rem=parseFloat(r.headers.get('x-requests-remaining'));
    if(!isNaN(rem)){BUDGET.remaining=rem;BUDGET.used=parseFloat(r.headers.get('x-requests-used'))||BUDGET.used;BUDGET.ts=new Date().toISOString();ss('budget',BUDGET);}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.warn('fetch',e.message);return null;}
}
function allowance(){if(BUDGET.remaining==null)return null;var n=new Date(),dl=(new Date(n.getFullYear(),n.getMonth()+1,0).getDate())-n.getDate()+1;return Math.round(BUDGET.remaining/Math.max(dl,1));}
function budgetGuard(sweepCost){
  var a=allowance();if(a==null||!sweepCost)return;
  var perDay=Math.ceil(24*60/(REFRESH_MS/60000))*sweepCost;
  while(perDay>a&&REFRESH_MS<3*60*60*1000){REFRESH_MS+=30*60*1000;perDay=Math.ceil(24*60/(REFRESH_MS/60000))*sweepCost;}
}
function budgetLine(){
  var el=document.getElementById('budget');if(!el)return;
  if(BUDGET.remaining==null){el.textContent='';return;}
  var quota=(BUDGET.remaining||0)+(BUDGET.used||0), warn=quota>0&&BUDGET.used/quota>=0.8;
  el.innerHTML='credits '+Math.round(BUDGET.remaining).toLocaleString()+(allowance()!=null?' &middot; ~'+allowance().toLocaleString()+'/day':'')+' &middot; refresh '+(REFRESH_MS/60000)+'m'+(warn?' &middot; <b style="color:var(--red)">80%+ QUOTA USED</b>':'');
}

// ‚îÄ‚îÄ MARKET PARSING: every game -> two-way market instances across books ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// instance = {sport,gameId,game,start,market,key,label,sideA,sideB,rows:{book:{a,b}}}
function parseSport(sportKey,sportTitle,games){
  var out=[];
  (games||[]).forEach(function(g){
    var inst={}; // mkey -> instance
    (g.bookmakers||[]).forEach(function(bk){
      (bk.markets||[]).forEach(function(m){
        if(m.key!=='h2h'&&m.key!=='spreads'&&m.key!=='totals')return;
        var os=m.outcomes||[];
        if(m.key==='h2h'){
          if(os.length!==2)return; // skip 3-way (soccer draw)
          var A=os.find(function(o){return o.name===g.home_team;}),B=os.find(function(o){return o.name===g.away_team;});
          if(!A||!B)return;
          add(m.key,'ml','Moneyline',g.home_team,g.away_team,bk.key,A.price,B.price);
        }else if(m.key==='totals'){
          var ov=os.find(function(o){return o.name==='Over';}),un=os.find(function(o){return o.name==='Under';});
          if(!ov||!un||ov.point==null)return;
          add(m.key,'tot'+ov.point,'Total '+ov.point,'Over '+ov.point,'Under '+ov.point,bk.key,ov.price,un.price);
        }else{ // spreads: pair home/away at mirrored points
          var H=os.find(function(o){return o.name===g.home_team;}),W=os.find(function(o){return o.name===g.away_team;});
          if(!H||!W||H.point==null)return;
          add(m.key,'sp'+H.point,'Spread',g.home_team+' '+(H.point>0?'+':'')+H.point,g.away_team+' '+(W.point>0?'+':'')+W.point,bk.key,H.price,W.price,H.point);
        }
        function add(mkt,keyId,label,sa,sb,book,pa,pb,pt){
          var mk=mkt+'|'+keyId;
          var it=inst[mk]||(inst[mk]={sport:sportKey,sportTitle:sportTitle,gameId:g.id,game:g.away_team+' @ '+g.home_team,
            home:g.home_team,away:g.away_team,start:g.commence_time,market:mkt,key:keyId,label:label,sideA:sa,sideB:sb,point:(pt!=null?pt:null),rows:{}});
          it.rows[book]={a:pa,b:pb};
        }
      });
    });
    Object.keys(inst).forEach(function(mk){out.push(inst[mk]);});
  });
  return out;
}

// ‚îÄ‚îÄ THE SIGNAL: best price vs PEER de-vig consensus (outlier excluded) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function consensusExcl(rows,exclBook){ // fair prob of side A from peers quoting BOTH sides
  var fs=[];
  Object.keys(rows).forEach(function(b){
    if(b===exclBook)return;var r=rows[b];
    if(r.a==null||r.b==null)return;
    var f=devig(r.a,r.b);if(f!=null)fs.push(f);
  });
  if(fs.length<2)return null;
  fs.sort(function(x,y){return x-y;});var m=Math.floor(fs.length/2);
  return{p:fs.length%2?fs[m]:(fs[m-1]+fs[m])/2,n:fs.length};
}
function lineValue(it){ // best side to take, or null
  var best=null;
  [['a',it.sideA],['b',it.sideB]].forEach(function(sd){
    var f=sd[0],name=sd[1],top=null;
    Object.keys(it.rows).forEach(function(b){var px=it.rows[b][f];if(px==null)return;if(top==null||px>top.price)top={price:px,book:b};});
    if(!top)return;
    var c=consensusExcl(it.rows,top.book);if(!c)return;
    var fair=f==='a'?c.p:(1-c.p);
    var edge=fair-impliedProb(top.price);
    if(edge==null)return;
    if(best==null||edge>best.edge)best={side:name,f:f,edge:edge,fair:fair,price:top.price,book:top.book,peers:c.n};
  });
  return best;
}

// ‚îÄ‚îÄ PICK LOG + CLOSE CAPTURE + SETTLEMENT ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function pickId(it,side,type){return (type||'setup')+'|'+it.sport+'|'+it.gameId+'|'+it.market+'|'+it.key+'|'+side;}
function allPicks(){var a=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(K+'pick_')===0){try{a.push(JSON.parse(localStorage.getItem(k)));}catch(e){}}}return a;}
// Log a pick once (first sighting = our "bet"). type: 'setup' (price out of line with
// peers) or 'select' (market's most likely winner at the best price). Both settle + CLV.
function logPick(it,o){
  var id=pickId(it,o.side,o.type),key=K+'pick_'+id;
  if(localStorage.getItem(key))return;
  var rec={id:id,type:o.type,flagged_at:new Date().toISOString(),date:new Date().toISOString().slice(0,10),
    sport:it.sport,sportTitle:it.sportTitle,game:it.game,home:it.home,away:it.away,start:it.start,
    market:it.market,mkey:it.key,label:it.label,side:o.side,f:o.f,point:it.point,
    price:o.price,book:o.book,edge:(o.edge!=null?Math.round(o.edge*1000)/1000:null),
    fair_at_flag:(o.fair!=null?Math.round(o.fair*1000)/1000:null),prob:(o.prob!=null?Math.round(o.prob*1000)/1000:null),peers:o.peers||0,
    close_fair:null,result:'PENDING',clv:null,paper:true};
  try{localStorage.setItem(key,JSON.stringify(rec));}catch(e){}
}
function logFlag(it,lv){logPick(it,{type:'setup',side:lv.side,f:lv.f,price:lv.price,book:lv.book,edge:lv.edge,fair:lv.fair,peers:lv.peers});}
function updateCloses(instances){ // pre-game: keep refreshing consensus; freezes at last sweep before start
  var now=Date.now(),map={};
  instances.forEach(function(it){map[it.sport+'|'+it.gameId+'|'+it.market+'|'+it.key]=it;});
  allPicks().forEach(function(p){
    if(p.result!=='PENDING')return;
    if(new Date(p.start).getTime()<now)return;
    var it=map[p.sport+'|'+p.gameId+'|'+p.market+'|'+p.mkey];if(!it)return;
    var c=consensusExcl(it.rows,null);if(!c)return;
    p.close_fair=Math.round((p.f==='a'?c.p:(1-c.p))*1000)/1000;
    try{localStorage.setItem(K+'pick_'+p.id,JSON.stringify(p));}catch(e){}
  });
}
async function settle(){
  var pend=allPicks().filter(function(p){return p.result==='PENDING'&&new Date(p.start).getTime()<Date.now()-2.5*60*60*1000;});
  if(!pend.length)return;
  var sports=[];pend.forEach(function(p){if(sports.indexOf(p.sport)<0)sports.push(p.sport);});
  for(var i=0;i<sports.length;i++){
    var sc=await oddsFetch(BASE+'/sports/'+sports[i]+'/scores?daysFrom=3&apiKey='+API_KEY); // 2 credits
    if(!sc)continue;
    var byId={};sc.forEach(function(g){byId[g.id]=g;});
    pend.filter(function(p){return p.sport===sports[i];}).forEach(function(p){
      var g=byId[p.gameId];
      if(!g){ if(Date.now()-new Date(p.start).getTime()>3*864e5){p.result='VOID';save(p);} return; }
      if(!g.completed||!g.scores)return;
      var hs=null,as=null;
      g.scores.forEach(function(s){if(s.name===p.home)hs=parseFloat(s.score);if(s.name===p.away)as=parseFloat(s.score);});
      if(hs==null||as==null)return;
      var res=grade(p,hs,as);
      if(res==null)return;
      p.result=res;
      // CLV: fair prob at close vs implied of the price we flagged. >0 = beat the close.
      if(p.close_fair!=null)p.clv=Math.round((p.close_fair-impliedProb(p.price))*1000)/1000;
      save(p);
    });
  }
  function save(p){try{localStorage.setItem(K+'pick_'+p.id,JSON.stringify(p));}catch(e){}}
}
function grade(p,hs,as){
  if(p.market==='h2h'){var winner=hs>as?p.home:(as>hs?p.away:null);if(winner==null)return'PUSH';return p.side===winner?'WIN':'LOSS';}
  if(p.market==='totals'){var tot=hs+as,pt=parseFloat(p.mkey.replace('tot',''));if(tot===pt)return'PUSH';var over=tot>pt;return (p.f==='a')===over?'WIN':'LOSS';}
  if(p.market==='spreads'){var isHome=p.f==='a';var margin=isHome?(hs-as):(as-hs);var sp=isHome?p.point:-p.point;var adj=margin+sp;if(adj===0)return'PUSH';return adj>0?'WIN':'LOSS';}
  return null;
}

// ‚îÄ‚îÄ STRATEGY SCOREBOARD (CLV is the judge) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function stats(){
  var mk=function(){return{n:0,w:0,u:0,pending:0,clvN:0,clvPos:0,clvSum:0};};
  var s={flagged:0,pending:0,settled:0,w:0,units:0,clvN:0,clvSum:0,clvPos:0,bySport:{},byType:{setup:mk(),select:mk()}};
  allPicks().forEach(function(p){
    s.flagged++;
    var ty=s.byType[p.type==='select'?'select':'setup'];
    if(p.result==='PENDING'){s.pending++;ty.pending++;return;}
    if(p.result==='PUSH'||p.result==='VOID')return;
    s.settled++;if(p.result==='WIN'){s.w++;s.units+=profit1u(p.price);}else s.units-=1;
    ty.n++;if(p.result==='WIN'){ty.w++;ty.u+=profit1u(p.price);}else ty.u-=1;
    var sp=s.bySport[p.sportTitle]||(s.bySport[p.sportTitle]={n:0,w:0,u:0,clvN:0,clvPos:0,clvSum:0});
    sp.n++;if(p.result==='WIN'){sp.w++;sp.u+=profit1u(p.price);}else sp.u-=1;
    if(p.clv!=null){s.clvN++;s.clvSum+=p.clv;if(p.clv>0)s.clvPos++;sp.clvN++;sp.clvSum+=p.clv;if(p.clv>0)sp.clvPos++;ty.clvN++;ty.clvSum+=p.clv;if(p.clv>0)ty.clvPos++;}
  });
  return s;
}
// The real-money gate judges the SETUP strategy only (selects are a tracked experiment ‚Äî
// the market's favorites at best price; expected ~breakeven-minus-vig until data says otherwise).
function clvProven(){var t=stats().byType.setup;return t.clvN>=CLV_PROVE_N&&(t.clvPos/t.clvN*100)>=CLV_PROVE_PCT&&(t.clvSum/t.clvN)>=0;}

// ‚îÄ‚îÄ SCAN ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var D=null,REFRESH_T=null,NEXT_R=0;
function setS(m){var el=document.getElementById('status');if(el)el.textContent=m;}
async function scanAll(){
  setS('Discovering sports...');
  var before=BUDGET.remaining;
  var sports=await oddsFetch(BASE+'/sports?apiKey='+API_KEY); // free
  if(!Array.isArray(sports)){document.getElementById('main').innerHTML='<div class="card" style="border-color:var(--red)">Cannot reach The Odds API. <button class="btn" onclick="scanAll()">Retry</button></div>';setS('Error');return;}
  // Joe's sports only, priority order, and only if the API says they're active.
  var activeMap={};sports.forEach(function(s){if(s.active&&!s.has_outrights)activeMap[s.key]=s.title;});
  var now=Date.now(), winEnd=now+WINDOW_HOURS*3600e3;
  var instances=[],flags=[],near=[],artifacts=[],selects=[],sportsScanned=[],sportsSkipped=[],pulled=0;
  for(var i=0;i<SPORT_PRIORITY.length&&pulled<MAX_SPORTS;i++){
    var skey=SPORT_PRIORITY[i], title=activeMap[skey];
    if(!title){sportsSkipped.push(skey.split('_').pop().toUpperCase()+' (off-season)');continue;}
    // FREE schedule pre-check: any games inside the window? (0 credits)
    setS('Checking '+title+' schedule...');
    var evs=await oddsFetch(BASE+'/sports/'+skey+'/events?apiKey='+API_KEY);
    var inWin=(Array.isArray(evs)?evs:[]).filter(function(g){var t=new Date(g.commence_time).getTime();return t>now&&t<winEnd;});
    if(!inWin.length){sportsSkipped.push(title+' (no games in '+WINDOW_HOURS+'h)');continue;}
    setS('Scanning '+title+' ('+inWin.length+' games)...');
    var games=await oddsFetch(BASE+'/sports/'+skey+'/odds?regions='+REGION+'&markets='+MARKETS+'&oddsFormat=american&apiKey='+API_KEY); // ~3 credits
    pulled++;
    if(!games||!games.length)continue;
    // hard window filter ‚Äî never look at a game outside [now, now+window]
    games=games.filter(function(g){var t=new Date(g.commence_time).getTime();return t>now&&t<winEnd;});
    if(!games.length){sportsSkipped.push(title+' (no games in '+WINDOW_HOURS+'h)');continue;}
    sportsScanned.push(title+' ('+games.length+'g)');
    var inst=parseSport(skey,title,games);
    instances=instances.concat(inst);
    inst.forEach(function(it){
      var lv=lineValue(it);
      if(lv){
        var rec={it:it,lv:lv};
        if(lv.edge>EDGE_IMPLAUSIBLE)artifacts.push(rec);
        else if(lv.edge>=EDGE_MIN&&lv.peers>=MIN_PEERS){flags.push(rec);logFlag(it,lv);}
        else if(lv.edge>0)near.push(rec);
      }
      // SELECTS (Joe's spec): the consensus-favored side across ML/spreads/totals,
      // BETTABLE AT HARD ROCK, with HR's price inside [-140..+200). HR's price IS the
      // pick's price ‚Äî that's the book he bets. Ranked by win probability.
      var c=consensusExcl(it.rows,null); // all books
      if(c&&c.n>=SELECT_MIN_PEERS){
        var f=c.p>=0.5?'a':'b', prob=f==='a'?c.p:(1-c.p);
        if(prob>=SELECT_MIN_PROB){
          var hrRow=it.rows[HOME_BOOK], hrPrice=hrRow?hrRow[f]:null;
          if(hrPrice!=null&&hrPrice>=SELECT_MIN_ODDS&&hrPrice<SELECT_MAX_ODDS){
            var top=null;Object.keys(it.rows).forEach(function(b){var px=it.rows[b][f];if(px==null)return;if(top==null||px>top.price)top={price:px,book:b};});
            selects.push({it:it,side:(f==='a'?it.sideA:it.sideB),f:f,prob:prob,
              price:hrPrice,book:HOME_BOOK,peers:c.n,
              ev:prob*profit1u(hrPrice)-(1-prob),
              value:prob-impliedProb(hrPrice),                 // HR price vs fair
              bestPrice:(top?top.price:null),bestBook:(top?top.book:null)});
          }
        }
      }
    });
  }
  // one select per game (highest win prob) ‚Äî don't stack ML + spread + total of one game
  var byGame={};
  selects.forEach(function(sl){var k2=sl.it.sport+'|'+sl.it.gameId;if(!byGame[k2]||sl.prob>byGame[k2].prob)byGame[k2]=sl;});
  selects=Object.keys(byGame).map(function(k2){return byGame[k2];});
  selects.sort(function(a,b){return b.prob-a.prob||b.ev-a.ev;}); // winners first, EV breaks ties
  selects=selects.slice(0,SELECT_MAX);
  selects.forEach(function(sl){logPick(sl.it,{type:'select',side:sl.side,f:sl.f,price:sl.price,book:sl.book,fair:sl.prob,prob:sl.prob,peers:sl.peers,edge:sl.value});});
  updateCloses(instances);
  var cost=(before!=null&&BUDGET.remaining!=null)?Math.max(before-BUDGET.remaining,0):null;
  budgetGuard(cost);
  flags.sort(function(a,b){return b.lv.edge-a.lv.edge;});
  near.sort(function(a,b){return b.lv.edge-a.lv.edge;});
  D={flags:flags,near:near.slice(0,10),selects:selects,artifacts:artifacts.length,sports:sportsScanned,skipped:sportsSkipped,instances:instances.length,at:new Date().toLocaleTimeString(),cost:cost};
  render();budgetLine();updCount();
  setS('Scanned '+sportsScanned.length+' sports ‚Ä¢ '+instances.length+' markets ‚Ä¢ '+flags.length+' setup bets ‚Ä¢ '+D.at);
  settle().then(function(){render();});
  if(!REFRESH_T)startAR();
}

function startAR(){
  NEXT_R=Date.now()+REFRESH_MS;
  function tick(){scanAll();NEXT_R=Date.now()+REFRESH_MS;clearInterval(REFRESH_T);REFRESH_T=setInterval(tick,REFRESH_MS);}
  REFRESH_T=setInterval(tick,REFRESH_MS);
  setInterval(function(){var el=document.getElementById('rtimer');if(!el)return;var d=NEXT_R-Date.now();if(d<=0){el.textContent='refreshing...';return;}el.textContent='next scan '+Math.floor(d/60000)+'m';},15000);
}
updCount();budgetLine();scanAll();
</script>
