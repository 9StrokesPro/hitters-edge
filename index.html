}
function calcProfit(odds,stake,result){
  if(result==='WIN')return odds>0?Math.round(stake*odds/100*100)/100:Math.round(stake*100/Math.abs(odds)*100)/100;
  if(result==='LOSS')return -stake;
  return 0;
}

// ── API HELPERS ───────────────────────────────────────────────────────────────
async function apiFetch(url){
  try{
    var r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.warn('API error',url.slice(0,80),e.message);return null;}
}

// ── STEP 1: MLB SCHEDULE ──────────────────────────────────────────────────────
// Returns games with pitcher IDs, lineup player IDs, venue
async function loadMLBSchedule(){
  var url=MLB+'/schedule?sportId=1&date='+todayStr()
    +'&hydrate=probablePitcher,lineups,team,venue&language=en';
  var data=await apiFetch(url);
  var games=data&&data.dates&&data.dates[0]&&data.dates[0].games||[];
  return games.map(function(g){
    var away=g.teams.away,home=g.teams.home;
    var awayLu=(g.lineups&&g.lineups.awayPlayers||[]).map(function(p){return{id:p.id,name:p.fullName,pos:p.primaryPosition&&p.primaryPosition.abbreviation};});
    var homeLu=(g.lineups&&g.lineups.homePlayers||[]).map(function(p){return{id:p.id,name:p.fullName,pos:p.primaryPosition&&p.primaryPosition.abbreviation};});
    return{
      gamePk:g.gamePk,
      status:g.status&&g.status.abstractGameState||'Preview',
      awayTeam:away.team.name,homeTeam:home.team.name,
      awayTeamId:away.team.id,homeTeamId:home.team.id,
      venue:g.venue&&g.venue.name||'',
      awayPitcher:{id:away.probablePitcher&&away.probablePitcher.id||null,name:away.probablePitcher&&away.probablePitcher.fullName||'TBD'},
      homePitcher:{id:home.probablePitcher&&home.probablePitcher.id||null,name:home.probablePitcher&&home.probablePitcher.fullName||'TBD'},
      awayLineup:awayLu,homeLineup:homeLu,
      lineupPosted:awayLu.length>0
    };
  });
}

// ── STEP 3: BULK PITCHER STATS ────────────────────────────────────────────────
// One call for all pitchers
async function loadBulkPitcherStats(ids){
  if(!ids.length)return{};
  var url=MLB+'/people?personIds='+ids.join(',')
    +'&hydrate=stats(group=pitching,type=season,season='+SEASON+')&sportId=1';
  var data=await apiFetch(url);
  var result={};
  (data&&data.people||[]).forEach(function(p){
    var splits=p.stats&&p.stats[0]&&p.stats[0].splits||[];
    if(!splits.length){result[p.id]=null;return;}
    var s=splits[0].stat;
    var ip=Math.max(parseFloat(s.inningsPitched)||1,1);
    var gs=parseInt(s.gamesStarted)||0;
    var ks=parseInt(s.strikeOuts)||0;
    var bbs=parseInt(s.baseOnBalls)||0;
    var hits=parseInt(s.hits)||0;
    var era=parseFloat(s.era)||0;
    var whip=parseFloat(s.whip)||0;
    result[p.id]={
      era,whip,gs,
      k9:Math.round(ks/ip*9*10)/10,
      bb9:Math.round(bbs/ip*9*10)/10,
      avgK:gs>0?Math.round(ks/gs*10)/10:0,
      avgH:gs>0?Math.round(hits/gs*10)/10:0,
      // ACE = ERA 2.75 or below AND 6+ starts
      isAce:era<=2.75&&gs>=6
    };
  });
  return result;
}

// ── STEP 5: BULK BATTER STATS ─────────────────────────────────────────────────
// Batch into chunks of 50 IDs per call
async function loadBulkBatterStats(ids){
  if(!ids.length)return{};
  var result={};
  var chunks=[];
  for(var i=0;i<ids.length;i+=50)chunks.push(ids.slice(i,i+50));
  for(var ci=0;ci<chunks.length;ci++){
    var url=MLB+'/people?personIds='+chunks[ci].join(',')
      +'&hydrate=stats(group=hitting,type=season,season='+SEASON+')&sportId=1';
    var data=await apiFetch(url);
    (data&&data.people||[]).forEach(function(p){
      var splits=p.stats&&p.stats[0]&&p.stats[0].splits||[];
      if(!splits.length){result[p.id]=null;return;}
      var s=splits[0].stat;
      var g=Math.max(parseInt(s.gamesPlayed)||1,1);
      var hits=parseInt(s.hits)||0,hrs=parseInt(s.homeRuns)||0;
      var tb=parseInt(s.totalBases)||0,runs=parseInt(s.runs)||0;
      var rbi=parseInt(s.rbi)||0,bb=parseInt(s.baseOnBalls)||0;
      var dbl=parseInt(s.doubles)||0,sb=parseInt(s.stolenBases)||0;
      var avg=parseFloat(s.avg)||0,obp=parseFloat(s.obp)||0,slg=parseFloat(s.slg)||0;
      // Singles = hits minus XBH
      var tri=parseInt(s.triples)||0;
      var sng=Math.max(hits-hrs-tri-dbl,0);
      result[p.id]={
        avg,obp,slg,games:g,
        bbRate:Math.round(Math.max(obp-avg,0)*1000)/1000,
        hpg:Math.round(hits/g*100)/100,
        hrpg:Math.round(hrs/g*100)/100,
        tbpg:Math.round(tb/g*100)/100,
        runspg:Math.round(runs/g*100)/100,
        rbipg:Math.round(rbi/g*100)/100,
        sbpg:Math.round(sb/g*100)/100,
        dbpg:Math.round(dbl/g*100)/100,
        sngpg:Math.round(sng/g*100)/100,
        hotCold:'Neutral' // filled in next step
      };
    });
    if(ci<chunks.length-1)await slp(300);
  }
  return result;
}

// Bulk load last-14-day game logs for hot/cold — batch 10 at a time
async function loadHotCold(ids,seasonStats){
  var cut=new Date();cut.setDate(cut.getDate()-14);
  var results={};
  // Process in parallel batches of 10
  for(var i=0;i<ids.length;i+=10){
    var batch=ids.slice(i,i+10);
    await Promise.all(batch.map(async function(id){
      var data=await apiFetch(MLB+'/people/'+id+'/stats?stats=gameLog&group=hitting&season='+SEASON+'&sportId=1');
      var splits=data&&data.stats&&data.stats[0]&&data.stats[0].splits||[];
      var tH=0,tAB=0;
      for(var j=splits.length-1;j>=0;j--){
        if(new Date(splits[j].date)<cut)break;
        tH+=parseInt(splits[j].stat.hits)||0;
        tAB+=parseInt(splits[j].stat.atBats)||0;
      }
      var l14=tAB>0?Math.round(tH/tAB*1000)/1000:0;
      var season=seasonStats[id]&&seasonStats[id].avg||0;
      var diff=l14-season;
      results[id]=diff>=0.050?'HOT':diff>=0.020?'Warming':diff<=-0.050?'COLD':diff<=-0.020?'Cooling':'Neutral';
    }));
    await slp(200);
  }
  return results;
}

// ── SCORING ───────────────────────────────────────────────────────────────────
function scoreHRI(b,park){
  var s=0;
  if(b.avg>=0.310)s+=20;else if(b.avg>=0.290)s+=14;else if(b.avg>=0.270)s+=8;else if(b.avg>=0.250)s+=3;
  if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=14;else if(b.obp>=0.320)s+=8;else if(b.obp>=0.300)s+=3;
  if(b.hpg>=1.2)s+=15;else if(b.hpg>=1.0)s+=10;else if(b.hpg>=0.8)s+=5;
  var rprod=(b.runspg||0)+(b.rbipg||0);
  if(rprod>=1.5)s+=18;else if(rprod>=1.0)s+=12;else if(rprod>=0.7)s+=6;
  if(park>=108)s+=8;else if(park>=104)s+=4;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;
  else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreHits(b){
  var s=0;
  if(b.avg>=0.320)s+=32;else if(b.avg>=0.300)s+=24;else if(b.avg>=0.280)s+=16;else if(b.avg>=0.260)s+=8;else if(b.avg>=0.240)s+=3;
  if(b.hpg>=1.3)s+=20;else if(b.hpg>=1.1)s+=13;else if(b.hpg>=0.9)s+=7;
  if(b.bbRate>=0.12)s-=15;else if(b.bbRate>=0.09)s-=8;else if(b.bbRate>=0.06)s-=3;else if(b.bbRate<=0.03)s+=5;
  if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;
  else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreSingles(b){
  var s=0;
  if(b.avg>=0.310)s+=30;else if(b.avg>=0.290)s+=22;else if(b.avg>=0.270)s+=14;else if(b.avg>=0.250)s+=7;
  if(b.sngpg>=0.80)s+=20;else if(b.sngpg>=0.60)s+=13;else if(b.sngpg>=0.45)s+=7;
  if(b.hrpg<=0.05)s+=18;else if(b.hrpg<=0.08)s+=10;else if(b.hrpg>=0.20)s-=12;
  if(b.bbRate<=0.04)s+=12;else if(b.bbRate<=0.07)s+=6;else if(b.bbRate>=0.12)s-=10;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;
  else if(b.hotCold==='COLD')s-=12;else if(b.hotCold==='Cooling')s-=6;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreTB(b,park){
  var s=0;
  if(b.slg>=0.500)s+=25;else if(b.slg>=0.450)s+=18;else if(b.slg>=0.400)s+=10;else if(b.slg>=0.350)s+=4;
  if(b.tbpg>=1.8)s+=20;else if(b.tbpg>=1.5)s+=14;else if(b.tbpg>=1.2)s+=8;
  if(b.bbRate>=0.12)s-=18;else if(b.bbRate>=0.09)s-=10;else if(b.bbRate>=0.06)s-=4;else if(b.bbRate<=0.03)s+=5;
  if(park>=108)s+=12;else if(park>=104)s+=7;else if(park>=100)s+=3;else if(park<96)s-=8;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreHR(b,park){
  var s=0;
  if(b.hrpg>=0.25)s+=35;else if(b.hrpg>=0.18)s+=25;else if(b.hrpg>=0.12)s+=15;else if(b.hrpg>=0.07)s+=6;
  if(b.slg>=0.500)s+=12;else if(b.slg>=0.450)s+=7;
  if(park>=112)s+=18;else if(park>=108)s+=12;else if(park>=104)s+=6;else if(park<96)s-=12;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreRBI(b){
  var s=0;
  if(b.rbipg>=0.80)s+=30;else if(b.rbipg>=0.60)s+=20;else if(b.rbipg>=0.45)s+=10;
  if(b.slg>=0.500)s+=18;else if(b.slg>=0.450)s+=12;else if(b.slg>=0.400)s+=6;
  if(b.avg>=0.300)s+=10;else if(b.avg>=0.275)s+=6;
  if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreRuns(b){
  var s=0;
  if(b.runspg>=0.80)s+=30;else if(b.runspg>=0.60)s+=20;else if(b.runspg>=0.45)s+=10;
  if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=13;else if(b.obp>=0.320)s+=7;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreSB(b){
  var s=0;
  if(b.sbpg>=0.25)s+=45;else if(b.sbpg>=0.15)s+=30;else if(b.sbpg>=0.08)s+=15;else if(b.sbpg>=0.04)s+=5;
  if(b.obp>=0.370)s+=12;else if(b.obp>=0.340)s+=7;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=15;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreDoubles(b,park){
  var s=0;
  if(b.dbpg>=0.20)s+=35;else if(b.dbpg>=0.14)s+=25;else if(b.dbpg>=0.09)s+=15;else if(b.dbpg>=0.05)s+=5;
  if(b.avg>=0.300)s+=12;else if(b.avg>=0.270)s+=7;
  if(b.slg>=0.470)s+=12;else if(b.slg>=0.420)s+=7;
  if(park>=108)s+=10;else if(park>=104)s+=6;else if(park<96)s-=5;
  if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreWalks(b){
  var s=0;
  if(b.bbRate>=0.15)s+=35;else if(b.bbRate>=0.12)s+=25;else if(b.bbRate>=0.09)s+=15;else if(b.bbRate>=0.06)s+=7;
  if(b.hotCold==='HOT')s+=5;else if(b.hotCold==='COLD')s-=8;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scorePitcherK(p){
  var s=0;
  if(p.avgK>=7.5)s+=35;else if(p.avgK>=6.0)s+=25;else if(p.avgK>=4.5)s+=10;
  if(p.k9>=9.0)s+=22;else if(p.k9>=7.5)s+=14;
  if(p.avgH<=5.0)s+=15;else if(p.avgH<=6.5)s+=8;
  if(p.gs>=8)s+=10;else if(p.gs>=4)s+=5;
  if(p.bb9<=2.5)s+=10;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function getScore(mktKey,b,p,park){
  if(mktKey==='pitcher_strikeouts') return p?scorePitcherK(p):0;
  if(!b)return 0;
  if(mktKey==='batter_hits_runs_rbis') return scoreHRI(b,park);
  if(mktKey==='batter_hits')           return scoreHits(b);
  if(mktKey==='batter_singles')        return scoreSingles(b);
  if(mktKey==='batter_total_bases')    return scoreTB(b,park);
  if(mktKey==='batter_home_runs')      return scoreHR(b,park);
  if(mktKey==='batter_rbis')           return scoreRBI(b);
  if(mktKey==='batter_runs_scored')    return scoreRuns(b);
  if(mktKey==='batter_stolen_bases')   return scoreSB(b);
  if(mktKey==='batter_doubles')        return scoreDoubles(b,park);
  if(mktKey==='batter_walks')          return scoreWalks(b);
  return 0;
}
function buildLabel(mktKey,line,score){
  var side=(mktKey==='pitcher_strikeouts'&&score<55)?'Under':'Over';
  var labels={'batter_hits_runs_rbis':'H+R+RBI','batter_singles':'Singles',
    'batter_hits':'Hits','batter_total_bases':'Total Bases','batter_home_runs':'HR',
    'batter_rbis':'RBI','batter_runs_scored':'Runs Scored','batter_stolen_bases':'SB',
    'batter_doubles':'Doubles','batter_walks':'Walks','pitcher_strikeouts':'Strikeouts'};
  return side+' '+line+' '+(labels[mktKey]||mktKey);
}

// ── MATCH PLAYER NAME → ID ────────────────────────────────────────────────────
// Build lookup from lineup data: normalized name → player ID
function buildNameIndex(mlbGames){
  var idx={};
  mlbGames.forEach(function(g){
    g.awayLineup.concat(g.homeLineup).forEach(function(p){
      if(!p.id)return;
      // Store by full name and last name for fuzzy matching
      var norm=p.name.toLowerCase().trim();
      idx[norm]=p.id;
      var parts=p.name.split(' ');
      if(parts.length>=2){
        var last=parts[parts.length-1].toLowerCase();
        if(!idx[last])idx[last]=p.id; // last name only (first match wins)
      }
    });
  });
  return idx;
}

function lookupPlayerId(propName,nameIndex){
  var norm=propName.toLowerCase().trim();
  if(nameIndex[norm])return nameIndex[norm];
  // Try last name only
  var parts=propName.split(' ');
  if(parts.length>=2){
    var last=parts[parts.length-1].toLowerCase();
    if(nameIndex[last])return nameIndex[last];
  }
  return null;
}

// Match Odds API team name to MLB schedule game
function matchOddsToMLB(oddsGame,mlbGames){
  var awayLast=oddsGame.away_team.split(' ').pop().toLowerCase();
  var homeLast=oddsGame.home_team.split(' ').pop().toLowerCase();
  for(var i=0;i<mlbGames.length;i++){
    var mg=mlbGames[i];
    if(mg.awayTeam.split(' ').pop().toLowerCase()===awayLast&&
       mg.homeTeam.split(' ').pop().toLowerCase()===homeLast){
      return mg;
    }
  }
  return null;
}

// ── MAIN LOADER ───────────────────────────────────────────────────────────────
async function loadAll(){
  showLoading();
  setP('Loading...');

  // ── STEP 1: MLB schedule ──────────────────────────────────────────────────
  setStep('s1','active');
  var mlbGames=await loadMLBSchedule();
  setStep('s1','done');
  console.log('MLB games:',mlbGames.length);

  // ── STEP 2: Odds API games ────────────────────────────────────────────────
  setStep('s2','active');
  var oddsGames=await loadOddsGames();
  setStep('s2','done');

  if(!oddsGames||!oddsGames.length){
    document.getElementById('pg-picks').innerHTML=
      '<div style="padding:10px"><div class="card" style="border-color:var(--red)">'+
      '<div style="color:var(--red);font-weight:700;margin-bottom:8px">&#9888; Could not reach The Odds API</div>'+
      '<div style="font-size:12px;color:var(--mut);margin-bottom:10px">Check your API key or internet connection.</div>'+
      '<button class="btn" onclick="loadAll()">Retry</button></div></div>';
    setP('Error — tap Retry');
    return;
  }

  // Separate upcoming/live/finished using Odds API times
  var now=new Date();
  var upcoming=[],live=[],finished=[];
  oddsGames.forEach(function(g){
    var ct=new Date(g.commence_time),elapsed=now-ct;
    if(ct>now)upcoming.push(g);
    else if(elapsed<4*60*60*1000)live.push(g);
    else finished.push(g);
  });

  // Build totals from all odds games
  var totals=[];
  oddsGames.forEach(function(g){
    var bk=(g.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(g.bookmakers&&g.bookmakers[0]);
    if(!bk)return;
    var tot=(bk.markets||[]).find(function(m){return m.key==='totals';});
    if(!tot)return;
    var ov=(tot.outcomes||[]).find(function(o){return o.name==='Over';});
    var un=(tot.outcomes||[]).find(function(o){return o.name==='Under';});
    if(!ov||!un)return;
    var mlbG=matchOddsToMLB(g,mlbGames);
    totals.push({
      game:g.away_team+' @ '+g.home_team,
      time:fmtTime(g.commence_time),
      line:ov.point,overOdds:ov.price,underOdds:un.price,
      park:PARKS[(mlbG&&mlbG.venue)||g.home_team]||100,
      isUpcoming:new Date(g.commence_time)>now
    });
  });

  // ── STEP 3: Bulk pitcher stats + ace detection ────────────────────────────
  setStep('s3','active');
  var pitcherIds=[];
  mlbGames.forEach(function(g){
    if(g.awayPitcher.id)pitcherIds.push(g.awayPitcher.id);
    if(g.homePitcher.id)pitcherIds.push(g.homePitcher.id);
  });
  // Dedupe
  pitcherIds=pitcherIds.filter(function(id,i){return pitcherIds.indexOf(id)===i;});
  var pitcherStats=await loadBulkPitcherStats(pitcherIds);

  // Map ace pitchers per game
  // homeAce = home pitcher is ace → away batters are filtered
  // awayAce = away pitcher is ace → home batters are filtered
  // The game itself stays — the OTHER team's batters are still bettable
  var gameAceInfo={};  // oddsGameId -> {homeAce, awayAce, homePitcherName, awayPitcherName, homeERA, awayERA}
  var aceNotes=[];     // for display only

  upcoming.forEach(function(og){
    var mlbG=matchOddsToMLB(og,mlbGames);
    if(!mlbG)return;
    var awayPst=mlbG.awayPitcher.id?pitcherStats[mlbG.awayPitcher.id]:null;
    var homePst=mlbG.homePitcher.id?pitcherStats[mlbG.homePitcher.id]:null;
    var awayAce=!!(awayPst&&awayPst.isAce);
    var homeAce=!!(homePst&&homePst.isAce);
    gameAceInfo[og.id]={
      homeAce:homeAce,awayAce:awayAce,
      homePitcherName:mlbG.homePitcher.name,
      awayPitcherName:mlbG.awayPitcher.name,
      homeERA:homePst&&homePst.era,
      awayERA:awayPst&&awayPst.era
    };
    if(homeAce){
      aceNotes.push({
        note:og.away_team+' batters vs '+mlbG.homePitcher.name+' ('+homePst.era+' ERA) — skipped',
        pitcher:mlbG.homePitcher.name,era:homePst.era,
        filteredTeam:og.away_team
      });
    }
    if(awayAce){
      aceNotes.push({
        note:og.home_team+' batters vs '+mlbG.awayPitcher.name+' ('+awayPst.era+' ERA) — skipped',
        pitcher:mlbG.awayPitcher.name,era:awayPst.era,
        filteredTeam:og.home_team
      });
    }
  });
  setStep('s3','done');
  console.log('Ace matchups filtered:',aceNotes.map(function(n){return n.pitcher;}));

  // ALL upcoming games are still bettable — we just filter specific team's batters
  var bettableGames=upcoming;
  setP('Loading props for '+bettableGames.length+' games...');

  // ── STEP 4: Props for bettable games only ────────────────────────────────
  setStep('s4','active');
  var allPropsData={}; // eventId -> bookmaker data
  for(var gi=0;gi<bettableGames.length;gi++){
    var og=bettableGames[gi];
    var pd=await loadEventProps(og.id);
    if(pd&&pd.bookmakers&&pd.bookmakers.length)allPropsData[og.id]=pd;
    await slp(250);
  }
  setStep('s4','done');

  // ── STEP 5: Collect player IDs and bulk load stats ────────────────────────
  setStep('s5','active');

  // Build name→ID index from MLB lineups
  var nameIndex=buildNameIndex(mlbGames);

  // Collect all unique player names from props
  var propPlayerNames={};  // name -> {id or null, mktKeys[]}
  Object.values(allPropsData).forEach(function(pd){
    var bestBook=(pd.bookmakers||[]).find(function(b){return b.key==='draftkings';})||pd.bookmakers[0];
    if(!bestBook)return;
    (bestBook.markets||[]).forEach(function(mkt){
      (mkt.outcomes||[]).forEach(function(o){
        if(!o.description)return;
        var n=o.description;
        if(!propPlayerNames[n])propPlayerNames[n]={id:lookupPlayerId(n,nameIndex),mkts:{}};
        if(!propPlayerNames[n].mkts[mkt.key])propPlayerNames[n].mkts[mkt.key]={line:o.point,over:null,under:null};
        if(o.name==='Over')propPlayerNames[n].mkts[mkt.key].over=o.price;
        if(o.name==='Under')propPlayerNames[n].mkts[mkt.key].under=o.price;
      });
    });
  });

  // Separate batters and pitchers
  var batterIds=[],pitcherPropIds=[];
  Object.entries(propPlayerNames).forEach(function(e){
    var name=e[0],info=e[1];
    var mktKeys=Object.keys(info.mkts);
    var isPitcher=mktKeys.length===1&&mktKeys[0]==='pitcher_strikeouts';
    if(info.id){
      if(isPitcher)pitcherPropIds.push(info.id);
      else batterIds.push(info.id);
    }
  });
  batterIds=batterIds.filter(function(id,i){return batterIds.indexOf(id)===i;});

  // Bulk load batter stats
  var batterStats=await loadBulkBatterStats(batterIds);
  setStep('s5','done');

  // ── STEP 6: Hot/cold for batters ─────────────────────────────────────────
  setStep('s6','active');
  // Only check hot/cold for players with stats
  var hcIds=batterIds.filter(function(id){return batterStats[id];});
  var hotColdMap=await loadHotCold(hcIds,batterStats);
  // Apply hot/cold to batter stats
  hcIds.forEach(function(id){
    if(batterStats[id])batterStats[id].hotCold=hotColdMap[id]||'Neutral';
  });
  setStep('s6','done');

  // ── STEP 7: Score picks ───────────────────────────────────────────────────
  setStep('s7','active');
  var picks=[];

  Object.entries(allPropsData).forEach(function(entry){
    var eventId=entry[0],pd=entry[1];
    // Find matching odds game for park/time
    var og=upcoming.find(function(g){return g.id===eventId;});
    if(!og)return;
    var mlbG=matchOddsToMLB(og,mlbGames);
    var park=PARKS[(mlbG&&mlbG.venue)||og.home_team]||100;

    var bestBook=(pd.bookmakers||[]).find(function(b){return b.key==='draftkings';})||pd.bookmakers[0];
    if(!bestBook)return;

    // Rebuild player map for this game
    var pmap={};
    (bestBook.markets||[]).forEach(function(mkt){
      (mkt.outcomes||[]).forEach(function(o){
        if(!o.description)return;
        var n=o.description;
        if(!pmap[n])pmap[n]={};
        if(!pmap[n][mkt.key])pmap[n][mkt.key]={line:o.point,over:null,under:null};
        if(o.name==='Over')pmap[n][mkt.key].over=o.price;
        if(o.name==='Under')pmap[n][mkt.key].under=o.price;
      });
    });

    // Get ace info for this game
    var aceInfo=gameAceInfo[eventId]||{homeAce:false,awayAce:false};

    Object.entries(pmap).forEach(function(pe){
      var pName=pe[0],mkts=pe[1];
      var pInfo=propPlayerNames[pName];
      var pid=pInfo&&pInfo.id||null;
      var bStats=pid&&batterStats[pid]||null;

      // Find pitcher stats for this player (if they are a pitcher prop)
      var pitSt=null;
      if(mkts['pitcher_strikeouts']&&mlbG){
        if(mlbG.homePitcher.name===pName&&mlbG.homePitcher.id)
          pitSt=pitcherStats[mlbG.homePitcher.id];
        else if(mlbG.awayPitcher.name===pName&&mlbG.awayPitcher.id)
          pitSt=pitcherStats[mlbG.awayPitcher.id];
        if(!pitSt&&pid)pitSt=pitcherStats[pid];
      }

      // Determine if this BATTER is facing an ace pitcher
      // If home pitcher is an ace → away batters are filtered
      // If away pitcher is an ace → home batters are filtered
      var onAwayTeam=mlbG&&mlbG.awayLineup.some(function(p){return p.name===pName;});
      var onHomeTeam=mlbG&&mlbG.homeLineup.some(function(p){return p.name===pName;});
      var facingAce=false;
      if(onAwayTeam&&aceInfo.homeAce) facingAce=true; // away batter faces home ace
      if(onHomeTeam&&aceInfo.awayAce) facingAce=true; // home batter faces away ace

      Object.entries(mkts).forEach(function(me){
        var mktKey=me[0],mkt=me[1];
        // Skip batter props if facing an ace — pitcher K props still allowed
        if(facingAce&&mktKey!=='pitcher_strikeouts'){
          return;
        }
        var score=getScore(mktKey,bStats,pitSt,park);
        if(score<40)return;

        // Determine rec side and odds
        var recOdds=mkt.over; // default over
        if(mktKey==='pitcher_strikeouts'&&score<55)recOdds=mkt.under;
        if(!recOdds)return;
        if(recOdds<-140)return; // protocol: -140 or better only

        var grade=score>=65?'A':score>=50?'B':'C';
        if(grade==='C')return;

        // Find pitcher name for display
        var vsName='';
        if(mlbG&&mktKey!=='pitcher_strikeouts'){
          // Determine if player is on away or home team — check lineup
          var onAway=mlbG.awayLineup.some(function(p){return p.name===pName;});
          var onHome=mlbG.homeLineup.some(function(p){return p.name===pName;});
          if(onAway)vsName=mlbG.homePitcher.name;
          else if(onHome)vsName=mlbG.awayPitcher.name;
          else vsName=mlbG.homePitcher.name; // fallback
        }

        picks.push({
          name:pName,
          game:og.away_team+' @ '+og.home_team,
          time:fmtTime(og.commence_time),
          park:park,
          mktKey:mktKey,
          propLabel:buildLabel(mktKey,mkt.line,score),
          line:mkt.line,
          recOdds:recOdds,
          overOdds:mkt.over,
          underOdds:mkt.under,
          score:score,
          grade:grade,
          bStats:bStats,
          pitSt:pitSt,
          pitcher:vsName
        });
      });
    });
  });

  // Sort: A before B, then by score
  picks.sort(function(a,b){
    if(a.grade!==b.grade)return a.grade<b.grade?-1:1;
    return b.score-a.score;
  });
  setStep('s7','done');

  D={
    picks,totals,aceNotes,
    upcoming:upcoming.length,
    live:live.length,
    finished:finished.length,
    aceCount:aceNotes.length,
    date:new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}),
    loadedAt:new Date().toLocaleTimeString()
  };

  setP('Updated '+D.loadedAt+' \u2022 '+picks.length+' props \u2022 '+aceNotes.length+' ace matchups filtered');
  renderPicks();
  renderTotals();
  updPnLHdr();
  if(!REFRESH_T)startAutoRefresh();
}

  h+='<div><div style="font-size:12px;font-weight:700;color:var(--grn)">&#9733; A-Grade = Real Money</div>';
  h+='<div style="font-size:11px;color:var(--mut);margin-top:2px">$25 max &middot; -140 or better &middot; confirm lineup</div></div>';

  h+='<button class="btn-s" onclick="copyPicks()" style="margin-bottom:8px">&#129302; Copy Picks for Claude Analysis</button>';
  h+='<div id="copy-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;color:var(--grn)">&#10003; Copied! Paste into Claude chat.</div>';

  if(!D.picks.length){
    h+='<div class="empty">No props available yet.<br>Props post 2-3 hrs before first pitch.<br><br><button class="rbtn" onclick="loadAll()">&#8635; Refresh</button></div>';
    document.getElementById('pg-picks').innerHTML=h;
    return;
  }

  // Collapsible sections
  SECTIONS.forEach(function(sect){
    var sp=D.picks.filter(function(p){return p.mktKey===sect.key;});
    if(!sp.length)return;
    var aC=sp.filter(function(p){return p.grade==='A';}).length;
    var bC=sp.filter(function(p){return p.grade==='B';}).length;
    if(!SECT_OPEN.hasOwnProperty(sect.key))SECT_OPEN[sect.key]=aC>0;
    var isOpen=SECT_OPEN[sect.key];
    var hdrBg=aC>0?'#071a07':'var(--sur2)';

    h+='<div class="sect">';
    h+='<div class="sect-hdr" style="background:'+hdrBg+'" onclick="toggleSection(\''+sect.key+'\')">';
    h+='<div class="sect-title"><span style="font-size:16px">'+sect.icon+'</span>';
    h+='<span style="color:'+sect.col+'">'+sect.label+'</span>';

// ── PICK CARD ─────────────────────────────────────────────────────────────────
function pickCard(p){
  var cid='c'+Math.random().toString(36).substr(2,8);
  window['_d'+cid]={player:p.name,market:p.propLabel,game:p.game,time:p.time};
  var isA=p.grade==='A',col=isA?'var(--grn)':'var(--amb)';
  var h='<div class="pick '+(isA?'pick-a':'pick-b')+'">';
  h+='<div class="prow"><div>';
  h+='<div class="pname">'+p.name+(p.bStats?hotBadge(p.bStats.hotCold):'')+'</div>';
  h+='<div class="pgame">'+p.game+' &middot; '+p.time+(p.pitcher?' &middot; vs '+p.pitcher:'')+'</div>';
  h+='</div><span class="pbadge '+(isA?'ba':'bb')+'">'+(isA?'&#9733; A':'&#9889; B')+'</span></div>';
  h+='<div class="sbar"><div class="sbar-fill" style="width:'+p.score+'%;background:'+col+'"></div></div>';
  h+='<div style="font-size:10px;color:'+col+';font-weight:700;margin-bottom:6px">Score: '+p.score+'/100</div>';

  // Stat grid — prop-specific
  if(p.bStats){
    h+='<div class="pgrid">';
    if(p.mktKey==='batter_hits_runs_rbis'){
      h+=sg4(p.bStats.avg,'AVG','var(--grn)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.runspg,'R/G','var(--grn)')+sg4(p.bStats.rbipg,'RBI/G','var(--red)');
    }else if(p.mktKey==='batter_singles'){
      h+=sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.sngpg,'1B/G','var(--tel)')+sg4(p.bStats.hrpg,'HR/G','var(--mut)')+sg4(p.bStats.bbRate,'Walk%','var(--mut)');
    }else if(p.mktKey==='batter_total_bases'){
      h+=sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.tbpg,'TB/G','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.bbRate,'Walk%','var(--amb)');
    }else if(p.mktKey==='batter_home_runs'){
      h+=sg4(p.bStats.hrpg,'HR/G','var(--pur)')+sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    }else if(p.mktKey==='batter_stolen_bases'){
      h+=sg4(p.bStats.sbpg,'SB/G','var(--tel)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    }else if(p.mktKey==='batter_doubles'){
      h+=sg4(p.bStats.dbpg,'2B/G','var(--nvy)')+sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    }else if(p.mktKey==='batter_walks'){
      h+=sg4(p.bStats.bbRate,'Walk%','var(--blu)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    }else{
      h+=sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.hpg,'H/G','var(--amb)')+sg4(p.bStats.bbRate,'Walk%','var(--mut)');
    }
    h+='</div>';
    if(p.bStats.hotCold==='COLD'||p.bStats.hotCold==='Cooling'){
      h+='<div style="font-size:11px;color:var(--red);margin-bottom:5px">&#9888; '+p.bStats.hotCold+' last 14 days vs season avg</div>';
    }
    if(p.bStats.bbRate>=0.09&&(p.mktKey==='batter_hits'||p.mktKey==='batter_total_bases')){
      h+='<div style="font-size:11px;color:var(--amb);margin-bottom:5px">&#9888; High walk rate hurts this prop</div>';
    }
  }
  if(p.pitSt&&p.mktKey==='pitcher_strikeouts'){
    h+='<div class="pgrid">'+sg4(p.pitSt.era,'ERA','var(--red)')+sg4(p.pitSt.k9,'K/9','var(--blu)')+sg4(p.pitSt.avgK,'K/Start','var(--grn)')+sg4(p.pitSt.gs,'GS','var(--mut)')+'</div>';
  }

  // Bet line + real odds
  h+='<div class="pline">';
  h+='<div><div style="font-size:10px;color:var(--mut)">Recommended Bet</div>';
  h+='<div style="font-size:13px;font-weight:700;color:var(--gld)">'+p.propLabel+'</div></div>';
  h+='<div style="text-align:right"><div style="font-size:10px;color:var(--mut)">Odds</div>';
  h+='<div style="font-size:15px;font-weight:700;color:var(--grn)">'+fmtOdds(p.recOdds)+'</div></div>';
  h+='</div>';
  h+='<button class="btn" onclick="logFromPick(\''+cid+'\')">+ Log This Bet</button>';
  h+='<button class="btn-s" onclick="addLeg(\''+cid+'\')">+ Add to Parlay</button>';
  h+='</div>';
  return h;
}

function sg4(val,lbl,col){
  return '<div class="pgrid-box"><div class="pgrid-val" style="color:'+col+'">'+(val!==null&&val!==undefined?val:'--')+'</div><div class="pgrid-lbl">'+lbl+'</div></div>';
}

// ── P&L ───────────────────────────────────────────────────────────────────────
function updPnLHdr(){
  var tot=BETS.reduce(function(a,b){return a+(b.profit||0);},0);
  var el=document.getElementById('pnl-hdr');
  el.textContent=(tot>=0?'+$':'-$')+Math.abs(tot).toFixed(2);
  el.style.color=tot>=0?'var(--grn)':'var(--red)';
}
function renderPnL(){
  var today=new Date().toLocaleDateString();
  var st=BETS.reduce(function(a,b){
    a.total+=(b.profit||0);a.staked+=(b.stake||0);
    if(b.dateStr===today)a.today+=(b.profit||0);
    if(b.result==='WIN')a.wins++;else if(b.result==='LOSS')a.losses++;else a.pend++;
    return a;
  },{total:0,today:0,staked:0,wins:0,losses:0,pend:0});
  var roi=st.staked>0?Math.round(st.total/st.staked*100):0;
  var h='<div class="pnlg">';
  h+='<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(st.today>=0?'var(--grn)':'var(--red)')+'">'+(st.today>=0?'+$':'-$')+Math.abs(st.today).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">TODAY</div></div>';
  h+='<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(st.total>=0?'var(--grn)':'var(--red)')+'">'+(st.total>=0?'+$':'-$')+Math.abs(st.total).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">ALL TIME</div></div>';
  h+='<div class="pnlb"><div style="font-size:18px;font-weight:700">'+st.wins+'W / '+st.losses+'L</div><div style="font-size:10px;color:var(--mut)">RECORD</div></div>';
  h+='<div class="pnlb"><div style="font-size:18px;font-weight:700;color:'+(roi>=0?'var(--grn)':'var(--red)')+'">'+roi+'%</div><div style="font-size:10px;color:var(--mut)">ROI</div></div>';
  h+='</div>';
  if(!BETS.length){h+='<div class="empty">No bets logged yet.</div>';}
  else{
    h+='<div class="stl">Bet History</div>';
    BETS.forEach(function(b){
      var pc=b.result==='WIN'?'var(--grn)':b.result==='LOSS'?'var(--red)':'var(--mut)';
      var pl=b.result==='WIN'?'+$'+b.profit.toFixed(2):b.result==='LOSS'?'-$'+Math.abs(b.profit||0).toFixed(2):'PENDING';
      h+='<div class="bet-row"><div style="flex:1;min-width:0">';
      h+='<div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b.player+'</div>';
      h+='<div style="font-size:10px;color:var(--mut)">'+b.dateStr+' &middot; '+b.market+' &middot; $'+b.stake+' @ '+fmtOdds(parseInt(b.odds||0))+'</div>';
      if(!b.result||b.result==='PENDING'){
        h+='<div class="rbtns"><button class="bw" onclick="markResult('+b.id+',\'WIN\')">&#10003; Win</button><button class="bl" onclick="markResult('+b.id+',\'LOSS\')">&#10007; Loss</button></div>';
      }
      h+='</div><div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:700;color:'+pc+'">'+pl+'</div><div style="font-size:10px;color:var(--mut)">'+b.result+'</div></div></div>';
    });
  }
  document.getElementById('pg-pnl').innerHTML=h;
  updPnLHdr();
}

// ── BET ACTIONS ───────────────────────────────────────────────────────────────
function logFromPick(cid){
  var d=window['_d'+cid];if(!d)return;
  LF.player=d.player;LF.market=d.market;LF.notes=d.game+' | '+d.time;
  LOG_MODE='single';nav('log');toast('Pre-filled — set odds then save');
}
function addLeg(cid){
  var d=window['_d'+cid];if(!d)return;
  LEGS.push({player:d.player,market:d.market});
  toast('Leg '+LEGS.length+' added');
  if(LOG_MODE==='parlay')renderLog();
}
function addManualLeg(){
  if(!ML_player.trim()){toast('Enter name');return;}
  LEGS.push({player:ML_player,market:ML_market});ML_player='';
  toast('Leg '+LEGS.length);renderLog();
}
function removeLeg(i){LEGS.splice(i,1);renderLog();}
function clearLegs(){LEGS=[];renderLog();toast('Cleared');}
function submitBet(){
  if(!LF.player.trim()){toast('Enter player name');return;}
  var stake=parseFloat(LF.stake)||25,odds=parseInt(LF.odds)||(-115);
  BETS.unshift({id:Date.now(),dateStr:new Date().toLocaleDateString(),
    player:LF.player,market:LF.market,odds:odds,stake:stake,
    result:LF.result,profit:calcProfit(odds,stake,LF.result),notes:LF.notes});
  ss('bets',BETS);
  LF={player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
  toast('&#9989; Saved!');renderLog();renderPnL();
}
function submitParlay(){
  if(LEGS.length<2){toast('Need 2+ legs');return;}
  if(!PF.odds){toast('Enter odds');return;}
  var stake=parseFloat(PF.stake)||25,odds=parseInt(PF.odds)||0;
  BETS.unshift({id:Date.now(),dateStr:new Date().toLocaleDateString(),
    player:'PARLAY ('+LEGS.length+' legs)',
    market:LEGS.map(function(l,i){return (i+1)+'. '+l.player+' '+l.market;}).join(' | '),
    odds:odds,stake:stake,result:PF.result,profit:calcProfit(odds,stake,PF.result),notes:''});
  ss('bets',BETS);
  LEGS=[];PF={odds:'',stake:'25',result:'PENDING'};
  toast('&#9989; Parlay saved!');renderLog();renderPnL();
}
function markResult(id,result){
  var idx=BETS.findIndex(function(b){return b.id===id;});
  if(idx===-1)return;
  BETS[idx].result=result;BETS[idx].profit=calcProfit(BETS[idx].odds,BETS[idx].stake,result);
  ss('bets',BETS);toast(result==='WIN'?'&#9989; WIN!':'&#10060; Loss');renderPnL();
}

function copyPicks(){
  if(!D){toast('No data');return;}
  var aG=D.picks.filter(function(p){return p.grade==='A';});
  var bG=D.picks.filter(function(p){return p.grade==='B';});
  var wins=BETS.filter(function(b){return b.result==='WIN';}).length;
  var tot=BETS.filter(function(b){return b.result!=='PENDING';}).length;
  var txt='HITTERS EDGE — '+D.date+'\n';
  txt+='Record: '+wins+'W/'+(tot-wins)+'L'+(tot?' ('+Math.round(wins/tot*100)+'%)':'')+'\n';
  txt+='Source: The Odds API (real lines) + MLB Stats API (current 2026 season stats)\n\n';
  if(D.aceNotes&&D.aceNotes.length){
    txt+='ACE PITCHER FILTERS:\n';
    D.aceNotes.forEach(function(e){txt+='  '+e.filteredTeam+' batters vs '+e.pitcher+' ('+e.era+' ERA) skipped\n';});
    txt+='\n';
  }
  txt+='=== A-GRADE PICKS ===\n';
  if(!aG.length)txt+='None today\n';
  aG.forEach(function(p){
    txt+='\n'+p.name+'\n';
    txt+='  Bet: '+p.propLabel+' | Odds: '+fmtOdds(p.recOdds)+' | Score: '+p.score+'/100\n';
    txt+='  Game: '+p.game+' | '+p.time+(p.pitcher?' | vs '+p.pitcher:'')+'\n';
    if(p.bStats)txt+='  AVG: '+p.bStats.avg+' OBP: '+p.bStats.obp+' H/G: '+p.bStats.hpg+' Streak: '+p.bStats.hotCold+'\n';
  });
  txt+='\n=== B-GRADE PICKS ===\n';
  bG.slice(0,5).forEach(function(p){txt+=p.name+' — '+p.propLabel+' '+fmtOdds(p.recOdds)+' ('+p.score+')\n';});
  txt+='\n=== GAME TOTALS ===\n';
  D.totals.filter(function(t){return t.isUpcoming;}).forEach(function(t){
    txt+=t.game+' Line: '+t.line+' O: '+fmtOdds(t.overOdds)+' U: '+fmtOdds(t.underOdds)+'\n';
  });
  txt+='\nPLEASE ANALYZE:\n1. Top pick + best prop today\n2. Best 2-3 leg parlay\n3. Picks to avoid\n4. Strong or weak day overall\n';
  txt+='\nRULES: A=real money $25 max. B=bonus only. -140 or better. No ace pitchers.';
  copyText(txt,'copy-ok');
}
function copyParlay(){
  var txt='PARLAY ANALYSIS\n\nLegs:\n';
  LEGS.forEach(function(l,i){
    txt+=(i+1)+'. '+l.player+' — '+l.market+'\n';
    if(D){var m=D.picks.find(function(p){return p.name.toLowerCase().indexOf(l.player.toLowerCase())>-1;});
      if(m)txt+='   Score: '+m.score+'/100 | Odds: '+fmtOdds(m.recOdds)+(m.bStats?' | Streak: '+m.bStats.hotCold:'')+'\n';}
  });
  txt+='\n1. Grade each leg\n2. Do they correlate?\n3. Weakest leg to cut\n4. Singles vs parlay?';
  copyText(txt,'parlay-ok');
}
function copyText(txt,okId){
  navigator.clipboard.writeText(txt).then(function(){showOk(okId);toast('&#10003; Copied!');})
  .catch(function(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showOk(okId);toast('&#10003; Copied!');}catch(e){toast('Copy failed');}
    document.body.removeChild(ta);
  });
}
function showOk(id){var el=document.getElementById(id);if(el){el.style.display='block';setTimeout(function(){el.style.display='none';},5000);}}
