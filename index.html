<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

  --txt:#e2e8f0;--mut:#64748b;

}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:72px;max-width:640px;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:var(--gld)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--sur);border-top:1px solid var(--bdr);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 6px;background:none;border:none;color:var(--mut);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb.on{color:var(--gld)}
.pg{display:none;padding:10px 10px 0}
.pg.on{display:block}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:8px}
.btn{background:var(--gld);color:#000;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn-s{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none}
.inp:focus{border-color:var(--gld)}
select.inp option{background:var(--sur2)}
.lbl{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.spnr{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.load{text-align:center;padding:40px 16px;color:var(--mut)}

.sect-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.sect-arr{font-size:11px;color:var(--mut);transition:transform .25s;display:inline-block}

.pgame{font-size:11px;color:var(--mut);margin-top:2px}
.pbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0}
.ba{background:var(--gbg);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.bb{background:var(--abg);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
.sbar{height:5px;background:var(--sur2);border-radius:3px;margin:6px 0;overflow:hidden}

.bw{background:var(--gbg);color:var(--grn);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.bl{background:var(--rbg);color:var(--red);border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
.tabrow{display:flex;gap:5px;margin-bottom:10px}

.stl::after{content:"";flex:1;height:1px;background:var(--bdr)}
.empty{text-align:center;padding:24px;color:var(--mut);font-size:13px;line-height:1.6}
.rbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer}
.ace-note{background:var(--rbg);border:1px solid rgba(239,68,68,.3);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:11px}

<script>
'use strict';
var ODDS_KEY  = 'c662d3af7ba8e40cddf08b0fca0684a9';
var ODDS_BASE = 'https://api.the-odds-api.com/v4';
var MLB       = 'https://statsapi.mlb.com/api/v1';
var SEASON    = 2026;
var D=null,BETS=[],LEGS=[],LOG_MODE='single',TOAST_T=null,REFRESH_T=null,COUNTDOWN_T=null,NEXT_R=null;
var SECT_OPEN={};
var LF={player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
var PF={odds:'',stake:'25',result:'PENDING'};
var ML_player='',ML_market='Over 0.5 Hits';
function sg(k,d){try{var v=localStorage.getItem('he8_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem('he8_'+k,JSON.stringify(v));}catch(e){}}
BETS=sg('bets',[]);
var PARKS={'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,'Dodger Stadium':101,'T-Mobile Park':100,'Progressive Field':100,'Nationals Park':100,'Daikin Park':98,'Minute Maid Park':98,'Angel Stadium':99,'Chase Field':99,'loanDepot park':98,'Oracle Park':97,'Citi Field':97,'Comerica Park':97,'Petco Park':96,'Target Field':96,'PNC Park':96,'Busch Stadium':95,'Kauffman Stadium':95,'Tropicana Field':97,'Sutter Health Park':98};
var SECTIONS=[
  {key:'batter_hits_runs_rbis',label:'Hits + Runs + RBI',icon:'&#128994;',col:'var(--grn)'},
  {key:'batter_hits',         label:'Hits',             icon:'&#129337;',col:'var(--tel)'},
  {key:'batter_singles',      label:'Singles',          icon:'1&#65039;',col:'var(--tel)'},
  {key:'batter_total_bases',  label:'Total Bases',      icon:'&#128311;',col:'var(--nvy)'},
  {key:'batter_home_runs',    label:'Home Runs',        icon:'&#128165;',col:'var(--pur)'},
  {key:'batter_rbis',         label:'RBI',              icon:'&#128170;',col:'#e91e63'},
  {key:'batter_runs_scored',  label:'Runs Scored',      icon:'&#127939;',col:'var(--grn)'},
  {key:'batter_stolen_bases', label:'Stolen Bases',     icon:'&#128168;',col:'var(--tel)'},
  {key:'batter_doubles',      label:'Doubles',          icon:'2&#65039;',col:'var(--nvy)'},
  {key:'batter_walks',        label:'Walks',            icon:'&#128065;',col:'var(--blu)'},
  {key:'pitcher_strikeouts',  label:'Strikeouts',       icon:'&#9917;',  col:'var(--red)'},
];
function nav(n){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('pg-'+n).classList.add('on');
  document.getElementById('nb-'+n).classList.add('on');
  if(n==='log')renderLog();
  if(n==='pnl')renderPnL();
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');if(TOAST_T)clearTimeout(TOAST_T);TOAST_T=setTimeout(function(){t.classList.remove('show');},2800);}
function setP(m){document.getElementById('lu').textContent=m;}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}
function fmtTime(iso){if(!iso)return'TBD';try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';}catch(e){return'TBD';}}
function fmtOdds(o){if(o===null||o===undefined)return'--';return o>0?'+'+o:String(o);}
function hotBadge(hc){if(!hc||hc==='Neutral')return'';if(hc==='HOT')return' &#128293;&#128293;&#128293;';if(hc==='Warming')return' &#128293;&#128293;';if(hc==='COLD')return' &#129704;&#129704;&#129704;';if(hc==='Cooling')return' &#129704;';return'';}
function calcProfit(odds,stake,result){if(result==='WIN')return odds>0?Math.round(stake*odds/100*100)/100:Math.round(stake*100/Math.abs(odds)*100)/100;if(result==='LOSS')return -stake;return 0;}
function todayStr(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function toggleSection(key){
  SECT_OPEN[key]=!SECT_OPEN[key];
  var b=document.getElementById('sb-'+key),a=document.getElementById('sa-'+key);
  if(b){if(SECT_OPEN[key])b.classList.add('open');else b.classList.remove('open');}
  if(a){if(SECT_OPEN[key])a.classList.add('open');else a.classList.remove('open');}
}
// ── API ───────────────────────────────────────────────────────────────────────
async function apiFetch(url){
  try{var r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  catch(e){console.warn('fetch err',e.message,url.slice(0,60));return null;}
}
async function loadOddsGames(){
  return await apiFetch(ODDS_BASE+'/sports/baseball_mlb/odds?regions=us&markets=h2h,totals&oddsFormat=american&apiKey='+ODDS_KEY);
}
async function loadEventProps(eventId){
  var mkts='batter_hits,batter_hits_runs_rbis,batter_singles,batter_total_bases,batter_home_runs,batter_rbis,batter_runs_scored,batter_stolen_bases,batter_doubles,batter_walks,pitcher_strikeouts';
  return await apiFetch(ODDS_BASE+'/sports/baseball_mlb/events/'+eventId+'/odds?regions=us&markets='+mkts+'&oddsFormat=american&apiKey='+ODDS_KEY);
}
// Get probable pitchers from MLB schedule (for ace detection)
async function loadProbablePitchers(){
  var data=await apiFetch(MLB+'/schedule?sportId=1&date='+todayStr()+'&hydrate=probablePitcher,team&language=en');
  var games=data&&data.dates&&data.dates[0]&&data.dates[0].games||[];
  var map={};
  games.forEach(function(g){
    var awayName=g.teams.away.team.name;
    var homeName=g.teams.home.team.name;
    var awayPit=g.teams.away.probablePitcher;
    var homePit=g.teams.home.probablePitcher;
    // key by last word of team name for matching
    var awayKey=awayName.split(' ').pop().toLowerCase();
    var homeKey=homeName.split(' ').pop().toLowerCase();
    map[awayKey+'_'+homeKey]={
      awayPitcherId:awayPit&&awayPit.id||null,
      awayPitcherName:awayPit&&awayPit.fullName||'TBD',
      homePitcherId:homePit&&homePit.id||null,
      homePitcherName:homePit&&homePit.fullName||'TBD',
      awayTeam:awayName,
      homeTeam:homeName
    };
  });
  return map;
}
// Get pitcher stats by ID
async function getPitcherStats(id){
  if(!id)return null;
  var data=await apiFetch(MLB+'/people/'+id+'?hydrate=stats(group=pitching,type=season,season='+SEASON+')&sportId=1');
  var splits=data&&data.people&&data.people[0]&&data.people[0].stats&&data.people[0].stats[0]&&data.people[0].stats[0].splits||[];
  if(!splits.length)return null;
  var s=splits[0].stat;
  var ip=Math.max(parseFloat(s.inningsPitched)||1,1);
  var gs=parseInt(s.gamesStarted)||0;
  var ks=parseInt(s.strikeOuts)||0;
  var bbs=parseInt(s.baseOnBalls)||0;
  var hits=parseInt(s.hits)||0;
  var era=parseFloat(s.era)||0;
  return{era,whip:parseFloat(s.whip)||0,gs,
    k9:Math.round(ks/ip*9*10)/10,bb9:Math.round(bbs/ip*9*10)/10,
    avgK:gs>0?Math.round(ks/gs*10)/10:0,
    avgH:gs>0?Math.round(hits/gs*10)/10:0,
    isAce:era<=2.75&&gs>=6};
}
// Get batter stats by name search
async function getBatterStats(name){
  var s=await apiFetch(MLB+'/people/search?names='+encodeURIComponent(name)+'&sportId=1');
  var pid=s&&s.people&&s.people[0]&&s.people[0].id;
  if(!pid)return null;
  var d=await apiFetch(MLB+'/people/'+pid+'?hydrate=stats(group=hitting,type=season,season='+SEASON+')&sportId=1');
  var splits=d&&d.people&&d.people[0]&&d.people[0].stats&&d.people[0].stats[0]&&d.people[0].stats[0].splits||[];
  if(!splits.length)return null;
  var st=splits[0].stat;
  var g=Math.max(parseInt(st.gamesPlayed)||1,1);
  var hits=parseInt(st.hits)||0,hrs=parseInt(st.homeRuns)||0,tb=parseInt(st.totalBases)||0;
  var runs=parseInt(st.runs)||0,rbi=parseInt(st.rbi)||0;
  var dbl=parseInt(st.doubles)||0,tri=parseInt(st.triples)||0,sb=parseInt(st.stolenBases)||0;
  var avg=parseFloat(st.avg)||0,obp=parseFloat(st.obp)||0,slg=parseFloat(st.slg)||0;
  var sng=Math.max(hits-hrs-tri-dbl,0);
  // last 14 days hot/cold
  var gl=await apiFetch(MLB+'/people/'+pid+'/stats?stats=gameLog&group=hitting&season='+SEASON+'&sportId=1');
  var gls=gl&&gl.stats&&gl.stats[0]&&gl.stats[0].splits||[];
  var cut=new Date();cut.setDate(cut.getDate()-14);
  var tH=0,tAB=0;
  for(var i=gls.length-1;i>=0;i--){if(new Date(gls[i].date)<cut)break;tH+=parseInt(gls[i].stat.hits)||0;tAB+=parseInt(gls[i].stat.atBats)||0;}
  var l14=tAB>0?Math.round(tH/tAB*1000)/1000:0;
  var diff=l14-avg;
  var hotCold=diff>=0.050?'HOT':diff>=0.020?'Warming':diff<=-0.050?'COLD':diff<=-0.020?'Cooling':'Neutral';
  return{avg,obp,slg,hotCold,bbRate:Math.round(Math.max(obp-avg,0)*1000)/1000,
    hpg:Math.round(hits/g*100)/100,hrpg:Math.round(hrs/g*100)/100,
    tbpg:Math.round(tb/g*100)/100,runspg:Math.round(runs/g*100)/100,
    rbipg:Math.round(rbi/g*100)/100,sbpg:Math.round(sb/g*100)/100,
    dbpg:Math.round(dbl/g*100)/100,sngpg:Math.round(sng/g*100)/100};
}
// ── SCORING ───────────────────────────────────────────────────────────────────
function scoreHRI(b,park){var s=0;if(b.avg>=0.310)s+=20;else if(b.avg>=0.290)s+=14;else if(b.avg>=0.270)s+=8;else if(b.avg>=0.250)s+=3;if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=14;else if(b.obp>=0.320)s+=8;if(b.hpg>=1.2)s+=15;else if(b.hpg>=1.0)s+=10;else if(b.hpg>=0.8)s+=5;var rp=(b.runspg||0)+(b.rbipg||0);if(rp>=1.5)s+=18;else if(rp>=1.0)s+=12;else if(rp>=0.7)s+=6;if(park>=108)s+=8;else if(park>=104)s+=4;else if(park<96)s-=5;if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreHits(b){var s=0;if(b.avg>=0.320)s+=32;else if(b.avg>=0.300)s+=24;else if(b.avg>=0.280)s+=16;else if(b.avg>=0.260)s+=8;else if(b.avg>=0.240)s+=3;if(b.hpg>=1.3)s+=20;else if(b.hpg>=1.1)s+=13;else if(b.hpg>=0.9)s+=7;if(b.bbRate>=0.12)s-=15;else if(b.bbRate>=0.09)s-=8;else if(b.bbRate>=0.06)s-=3;else if(b.bbRate<=0.03)s+=5;if(b.hotCold==='HOT')s+=12;else if(b.hotCold==='Warming')s+=6;else if(b.hotCold==='COLD')s-=15;else if(b.hotCold==='Cooling')s-=7;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreSingles(b){var s=0;if(b.avg>=0.310)s+=30;else if(b.avg>=0.290)s+=22;else if(b.avg>=0.270)s+=14;else if(b.avg>=0.250)s+=7;if(b.sngpg>=0.80)s+=20;else if(b.sngpg>=0.60)s+=13;else if(b.sngpg>=0.45)s+=7;if(b.hrpg<=0.05)s+=18;else if(b.hrpg<=0.08)s+=10;else if(b.hrpg>=0.20)s-=12;if(b.bbRate<=0.04)s+=12;else if(b.bbRate<=0.07)s+=6;else if(b.bbRate>=0.12)s-=10;if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='Warming')s+=5;else if(b.hotCold==='COLD')s-=12;else if(b.hotCold==='Cooling')s-=6;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreTB(b,park){var s=0;if(b.slg>=0.500)s+=25;else if(b.slg>=0.450)s+=18;else if(b.slg>=0.400)s+=10;else if(b.slg>=0.350)s+=4;if(b.tbpg>=1.8)s+=20;else if(b.tbpg>=1.5)s+=14;else if(b.tbpg>=1.2)s+=8;if(b.bbRate>=0.12)s-=18;else if(b.bbRate>=0.09)s-=10;else if(b.bbRate>=0.06)s-=4;else if(b.bbRate<=0.03)s+=5;if(park>=108)s+=12;else if(park>=104)s+=7;else if(park>=100)s+=3;else if(park<96)s-=8;if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreHR(b,park){var s=0;if(b.hrpg>=0.25)s+=35;else if(b.hrpg>=0.18)s+=25;else if(b.hrpg>=0.12)s+=15;else if(b.hrpg>=0.07)s+=6;if(b.slg>=0.500)s+=12;else if(b.slg>=0.450)s+=7;if(park>=112)s+=18;else if(park>=108)s+=12;else if(park>=104)s+=6;else if(park<96)s-=12;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreRBI(b){var s=0;if(b.rbipg>=0.80)s+=30;else if(b.rbipg>=0.60)s+=20;else if(b.rbipg>=0.45)s+=10;if(b.slg>=0.500)s+=18;else if(b.slg>=0.450)s+=12;else if(b.slg>=0.400)s+=6;if(b.avg>=0.300)s+=10;else if(b.avg>=0.275)s+=6;if(b.hotCold==='HOT')s+=10;else if(b.hotCold==='COLD')s-=12;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreRuns(b){var s=0;if(b.runspg>=0.80)s+=30;else if(b.runspg>=0.60)s+=20;else if(b.runspg>=0.45)s+=10;if(b.obp>=0.380)s+=20;else if(b.obp>=0.350)s+=13;else if(b.obp>=0.320)s+=7;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreSB(b){var s=0;if(b.sbpg>=0.25)s+=45;else if(b.sbpg>=0.15)s+=30;else if(b.sbpg>=0.08)s+=15;else if(b.sbpg>=0.04)s+=5;if(b.obp>=0.370)s+=12;else if(b.obp>=0.340)s+=7;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=15;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreDbl(b,park){var s=0;if(b.dbpg>=0.20)s+=35;else if(b.dbpg>=0.14)s+=25;else if(b.dbpg>=0.09)s+=15;else if(b.dbpg>=0.05)s+=5;if(b.avg>=0.300)s+=12;else if(b.avg>=0.270)s+=7;if(b.slg>=0.470)s+=12;else if(b.slg>=0.420)s+=7;if(park>=108)s+=10;else if(park>=104)s+=6;else if(park<96)s-=5;if(b.hotCold==='HOT')s+=8;else if(b.hotCold==='COLD')s-=10;return Math.max(0,Math.min(100,Math.round(s)));}
function scoreWlk(b){var s=0;if(b.bbRate>=0.15)s+=35;else if(b.bbRate>=0.12)s+=25;else if(b.bbRate>=0.09)s+=15;else if(b.bbRate>=0.06)s+=7;if(b.hotCold==='HOT')s+=5;else if(b.hotCold==='COLD')s-=8;return Math.max(0,Math.min(100,Math.round(s)));}
function scorePK(p){var s=0;if(p.avgK>=7.5)s+=35;else if(p.avgK>=6.0)s+=25;else if(p.avgK>=4.5)s+=10;if(p.k9>=9.0)s+=22;else if(p.k9>=7.5)s+=14;if(p.avgH<=5.0)s+=15;else if(p.avgH<=6.5)s+=8;if(p.gs>=8)s+=10;else if(p.gs>=4)s+=5;if(p.bb9<=2.5)s+=10;return Math.max(0,Math.min(100,Math.round(s)));}
function getScore(k,b,p,park){
  if(k==='pitcher_strikeouts')return p?scorePK(p):0;
  if(!b)return 0;
  if(k==='batter_hits_runs_rbis')return scoreHRI(b,park);
  if(k==='batter_hits')return scoreHits(b);
  if(k==='batter_singles')return scoreSingles(b);
  if(k==='batter_total_bases')return scoreTB(b,park);
  if(k==='batter_home_runs')return scoreHR(b,park);
  if(k==='batter_rbis')return scoreRBI(b);
  if(k==='batter_runs_scored')return scoreRuns(b);
  if(k==='batter_stolen_bases')return scoreSB(b);
  if(k==='batter_doubles')return scoreDbl(b,park);
  if(k==='batter_walks')return scoreWlk(b);
  return 0;
}
function mkLabel(k,line,score){
  var side=(k==='pitcher_strikeouts'&&score<55)?'Under':'Over';
  var labels={'batter_hits_runs_rbis':'H+R+RBI','batter_singles':'Singles','batter_hits':'Hits','batter_total_bases':'Total Bases','batter_home_runs':'HR','batter_rbis':'RBI','batter_runs_scored':'Runs Scored','batter_stolen_bases':'SB','batter_doubles':'Doubles','batter_walks':'Walks','pitcher_strikeouts':'Strikeouts'};
  return side+' '+line+' '+(labels[k]||k);
}
// ── MAIN LOADER ───────────────────────────────────────────────────────────────
async function loadAll(){
  setP('Loading...');
  document.getElementById('pg-picks').innerHTML='<div class="load"><div class="spnr"></div>Fetching today\'s games...</div>';

  // Step 1: Odds API games + totals
  setP('Fetching odds...');
  var oddsGames=await loadOddsGames();
  if(!oddsGames||!oddsGames.length){
    document.getElementById('pg-picks').innerHTML='<div style="padding:10px"><div class="card" style="border-color:var(--red);color:var(--red)">Could not reach The Odds API. Check connection.<br><br><button class="btn" onclick="loadAll()">Retry</button></div></div>';
    setP('Error');return;
  }

  var now=new Date();
  var upcoming=[],live=[],finished=[];
  oddsGames.forEach(function(g){
    var ct=new Date(g.commence_time),el=now-ct;
    if(ct>now)upcoming.push(g);
    else if(el<4*60*60*1000)live.push(g);
    else finished.push(g);
  });

  // Build totals
  var totals=[];
  oddsGames.forEach(function(g){
    var bk=(g.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(g.bookmakers||[])[0];
    if(!bk)return;
    var tot=(bk.markets||[]).find(function(m){return m.key==='totals';});
    if(!tot)return;
    var ov=(tot.outcomes||[]).find(function(o){return o.name==='Over';});
    var un=(tot.outcomes||[]).find(function(o){return o.name==='Under';});
    if(!ov||!un)return;
    totals.push({game:g.away_team+' @ '+g.home_team,time:fmtTime(g.commence_time),line:ov.point,overOdds:ov.price,underOdds:un.price,park:PARKS[g.home_team]||100,isUpcoming:new Date(g.commence_time)>now});
  });

  // Step 2: Probable pitchers for ace detection
  setP('Checking pitchers...');
  var pitcherMap=await loadProbablePitchers();

  // Load pitcher stats for all probable pitchers and check for aces
  var pitcherStatCache={};
  var aceInfo={};  // eventId -> {homeIsAce, awayIsAce, homePitName, awayPitName, homeERA, awayERA}

  for(var gi=0;gi<upcoming.length;gi++){
    var og=upcoming[gi];
    var awayKey=og.away_team.split(' ').pop().toLowerCase();
    var homeKey=og.home_team.split(' ').pop().toLowerCase();
    var pm=pitcherMap[awayKey+'_'+homeKey];
    if(!pm){aceInfo[og.id]={homeIsAce:false,awayIsAce:false};continue;}

    // Load home pitcher stats
    var homePst=null,awayPst=null;
    if(pm.homePitcherId&&!pitcherStatCache[pm.homePitcherId]){
      pitcherStatCache[pm.homePitcherId]=await getPitcherStats(pm.homePitcherId);
      await slp(150);
    }
    if(pm.awayPitcherId&&!pitcherStatCache[pm.awayPitcherId]){
      pitcherStatCache[pm.awayPitcherId]=await getPitcherStats(pm.awayPitcherId);
      await slp(150);
    }
    homePst=pm.homePitcherId?pitcherStatCache[pm.homePitcherId]:null;
    awayPst=pm.awayPitcherId?pitcherStatCache[pm.awayPitcherId]:null;

    aceInfo[og.id]={
      homeIsAce:!!(homePst&&homePst.isAce),
      awayIsAce:!!(awayPst&&awayPst.isAce),
      homePitName:pm.homePitcherName,
      awayPitName:pm.awayPitcherName,
      homeERA:homePst&&homePst.era,
      awayERA:awayPst&&awayPst.era,
      homePitSt:homePst,
      awayPitSt:awayPst
    };
  }

  // Build ace notes for display
  var aceNotes=[];
  upcoming.forEach(function(og){
    var ai=aceInfo[og.id]||{};
    // homeIsAce = home pitcher is ace = AWAY batters are filtered
    if(ai.homeIsAce)aceNotes.push({team:og.away_team,pitcher:ai.homePitName,era:ai.homeERA});
    // awayIsAce = away pitcher is ace = HOME batters are filtered
    if(ai.awayIsAce)aceNotes.push({team:og.home_team,pitcher:ai.awayPitName,era:ai.awayERA});
  });

  // Step 3: Props per upcoming game
  setP('Loading props (0/'+upcoming.length+')...');
  var picks=[];
  var batterCache={};

  for(var gi2=0;gi2<upcoming.length;gi2++){
    var og2=upcoming[gi2];
    var park=PARKS[og2.home_team]||100;
    var ai2=aceInfo[og2.id]||{homeIsAce:false,awayIsAce:false};
    setP('Props '+(gi2+1)+'/'+upcoming.length+': '+og2.away_team.split(' ').pop()+' @ '+og2.home_team.split(' ').pop());

    var pd=await loadEventProps(og2.id);
    if(!pd||!pd.bookmakers||!pd.bookmakers.length){await slp(200);continue;}

    var bestBook=(pd.bookmakers||[]).find(function(b){return b.key==='draftkings';})||(pd.bookmakers||[])[0];
    if(!bestBook)continue;

    // Build player prop map
    var pmap={};
    (bestBook.markets||[]).forEach(function(mkt){
      (mkt.outcomes||[]).forEach(function(o){
        if(!o.description)return;
        var n=o.description;
        if(!pmap[n])pmap[n]={};
        if(!pmap[n][mkt.key])pmap[n][mkt.key]={line:o.point,over:null,under:null};
        if(o.name==='Over')pmap[n][mkt.key].over=o.price;
        if(o.name==='Under')pmap[n][mkt.key].under=o.price;
      });
    });

    var playerNames=Object.keys(pmap);
    for(var pi=0;pi<playerNames.length;pi++){
      var pName=playerNames[pi];
      var mkts=pmap[pName];
      var mktKeys=Object.keys(mkts);
      var isPitcher=mktKeys.length===1&&mktKeys[0]==='pitcher_strikeouts';

      // Load batter stats if needed
      if(!isPitcher&&!batterCache.hasOwnProperty(pName)){
        batterCache[pName]=await getBatterStats(pName);
        await slp(150);
      }
      var bStats=isPitcher?null:(batterCache[pName]||null);

      // Get pitcher stats for pitcher K props
      // Use the ace info pitcher stats if name matches
      var pitSt=null;
      if(isPitcher){
        if(ai2.homePitName===pName)pitSt=ai2.homePitSt;
        else if(ai2.awayPitName===pName)pitSt=ai2.awayPitSt;
      }

      // Determine if this batter is facing an ace
      // We don't know which team they are on from prop data alone
      // So we use a simple heuristic: if EITHER pitcher is an ace, flag it
      // and only skip if we have name evidence they face that ace
      // Conservative: if home is ace, away batters filtered; if away is ace, home batters filtered
      // Since we can't tell from prop data alone which team, skip if both aces or use score penalty
      // Best approach: if homeIsAce AND player is NOT the home pitcher K prop → likely away batter → skip
      // If awayIsAce AND player is NOT the away pitcher K prop → likely home batter → skip
      // For now: skip batter props when the player is confirmed NOT a pitcher and an ace exists
      var facingAce=false;
      if(!isPitcher&&bStats){
        // If home pitcher is ace, most batters in this game facing home pitcher = away batters
        // If away pitcher is ace, home batters face them
        // Skip all batter props if either ace is pitching — the user can see who is skipped
        if(ai2.homeIsAce||ai2.awayIsAce) facingAce=true;
      }
      if(facingAce) continue;

      mktKeys.forEach(function(k){
        var mkt=mkts[k];
        var score=getScore(k,bStats,pitSt,park);
        if(score<40)return;
        var recOdds=(k==='pitcher_strikeouts'&&score<55)?mkt.under:mkt.over;
        if(!recOdds||recOdds<-140)return;
        var grade=score>=65?'A':score>=50?'B':'C';
        if(grade==='C')return;
        picks.push({name:pName,game:og2.away_team+' @ '+og2.home_team,time:fmtTime(og2.commence_time),park,mktKey:k,propLabel:mkLabel(k,mkt.line,score),line:mkt.line,recOdds,overOdds:mkt.over,underOdds:mkt.under,score,grade,bStats,pitSt});
      });
    }
    await slp(200);
  }

  picks.sort(function(a,b){if(a.grade!==b.grade)return a.grade<b.grade?-1:1;return b.score-a.score;});

  D={picks,totals,aceNotes,upcoming:upcoming.length,live:live.length,finished:finished.length,
    date:new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
    loadedAt:new Date().toLocaleTimeString()};

  setP('Updated '+D.loadedAt+' \u2022 '+picks.length+' props \u2022 '+aceNotes.length+' ace matchups filtered');
  renderPicks();renderTotals();updPnLHdr();
  if(!REFRESH_T)startAR();
}
// ── RENDER PICKS ──────────────────────────────────────────────────────────────

  var h='';
  h+='<div class="stbar">';
  if(D.upcoming>0)h+='<span class="stpill st-up">&#9200; '+D.upcoming+' upcoming</span>';
  if(D.live>0)    h+='<span class="stpill st-lv">&#128308; '+D.live+' live</span>';
  if(D.finished>0)h+='<span class="stpill st-fn">&#10003; '+D.finished+' final</span>';
  if(D.aceNotes&&D.aceNotes.length)h+='<span class="stpill st-ace">&#9940; '+D.aceNotes.length+' ace matchup'+(D.aceNotes.length>1?'s':'')+' filtered</span>';
  h+='</div>';

  h+='<div style="display:flex;justify-content:space-between;align-items:center">';
  h+='<div><div style="font-size:12px;font-weight:700;color:var(--grn)">&#9733; A-Grade = Real Money</div>';
  h+='<div style="font-size:11px;color:var(--mut);margin-top:2px">$25 max &middot; -140 or better &middot; confirm lineup</div></div>';
  h+='<div style="text-align:right"><div style="font-size:22px;font-weight:700;color:var(--grn)">'+aCount+'</div><div style="font-size:9px;color:var(--mut)">A-Grade</div></div></div></div>';
  h+='<button class="btn-s" onclick="copyPicks()" style="margin-bottom:8px">&#129302; Copy Picks for Claude</button>';
  h+='<div id="copy-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;color:var(--grn)">&#10003; Copied! Paste into Claude.</div>';
  if(!D.picks.length){
    h+='<div class="empty">No props yet.<br>Props post 2-3 hrs before first pitch.<br><br><button class="rbtn" onclick="loadAll()">&#8635; Refresh</button></div>';
    document.getElementById('pg-picks').innerHTML=h;return;
  }
  SECTIONS.forEach(function(sect){
    var sp=D.picks.filter(function(p){return p.mktKey===sect.key;});
    if(!sp.length)return;
    var aC=sp.filter(function(p){return p.grade==='A';}).length;
    var bC=sp.filter(function(p){return p.grade==='B';}).length;
    if(!SECT_OPEN.hasOwnProperty(sect.key))SECT_OPEN[sect.key]=aC>0;
    var isOpen=SECT_OPEN[sect.key];
    h+='<div class="sect"><div class="sect-hdr" style="background:'+(aC>0?'#071a07':'var(--sur2)')+'" onclick="toggleSection(\''+sect.key+'\')">';
    h+='<div class="sect-title"><span style="font-size:16px">'+sect.icon+'</span><span style="color:'+sect.col+'">'+sect.label+'</span>';

function sg4(v,l,c){return '<div class="pgrid-box"><div class="pgrid-val" style="color:'+c+'">'+(v!==null&&v!==undefined?v:'--')+'</div><div class="pgrid-lbl">'+l+'</div></div>';}
function pickCard(p){
  var cid='c'+Math.random().toString(36).substr(2,8);
  window['_d'+cid]={player:p.name,market:p.propLabel,game:p.game,time:p.time};
  var isA=p.grade==='A',col=isA?'var(--grn)':'var(--amb)';
  var h='<div class="pick '+(isA?'pick-a':'pick-b')+'">';
  h+='<div class="prow"><div><div class="pname">'+p.name+(p.bStats?hotBadge(p.bStats.hotCold):'')+'</div>';
  h+='<div class="pgame">'+p.game+' &middot; '+p.time+'</div></div>';
  h+='<span class="pbadge '+(isA?'ba':'bb')+'">'+(isA?'&#9733; A':'&#9889; B')+'</span></div>';
  h+='<div class="sbar"><div class="sbar-fill" style="width:'+p.score+'%;background:'+col+'"></div></div>';
  h+='<div style="font-size:10px;color:'+col+';font-weight:700;margin-bottom:6px">Score: '+p.score+'/100</div>';
  if(p.bStats){
    h+='<div class="pgrid">';
    if(p.mktKey==='batter_hits_runs_rbis')h+=sg4(p.bStats.avg,'AVG','var(--grn)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.runspg,'R/G','var(--grn)')+sg4(p.bStats.rbipg,'RBI/G','var(--red)');
    else if(p.mktKey==='batter_singles')h+=sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.sngpg,'1B/G','var(--tel)')+sg4(p.bStats.hrpg,'HR/G','var(--mut)')+sg4(p.bStats.bbRate,'Walk%','var(--mut)');
    else if(p.mktKey==='batter_total_bases')h+=sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.tbpg,'TB/G','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.bbRate,'Walk%','var(--amb)');
    else if(p.mktKey==='batter_home_runs')h+=sg4(p.bStats.hrpg,'HR/G','var(--pur)')+sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else if(p.mktKey==='batter_stolen_bases')h+=sg4(p.bStats.sbpg,'SB/G','var(--tel)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else if(p.mktKey==='batter_doubles')h+=sg4(p.bStats.dbpg,'2B/G','var(--nvy)')+sg4(p.bStats.slg,'SLG','var(--nvy)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else if(p.mktKey==='batter_walks')h+=sg4(p.bStats.bbRate,'Walk%','var(--blu)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.score,'Score','var(--gld)');
    else h+=sg4(p.bStats.avg,'AVG','var(--tel)')+sg4(p.bStats.obp,'OBP','var(--blu)')+sg4(p.bStats.hpg,'H/G','var(--amb)')+sg4(p.bStats.bbRate,'Walk%','var(--mut)');
    h+='</div>';
    if(p.bStats.hotCold==='COLD'||p.bStats.hotCold==='Cooling')h+='<div style="font-size:11px;color:var(--red);margin-bottom:5px">&#9888; '+p.bStats.hotCold+' — batting below season avg</div>';
    if(p.bStats.bbRate>=0.09&&(p.mktKey==='batter_hits'||p.mktKey==='batter_total_bases'))h+='<div style="font-size:11px;color:var(--amb);margin-bottom:5px">&#9888; High walk rate hurts this prop</div>';
  }
  if(p.pitSt)h+='<div class="pgrid">'+sg4(p.pitSt.era,'ERA','var(--red)')+sg4(p.pitSt.k9,'K/9','var(--blu)')+sg4(p.pitSt.avgK,'K/Start','var(--grn)')+sg4(p.pitSt.gs,'GS','var(--mut)')+'</div>';
  h+='<div class="pline"><div><div style="font-size:10px;color:var(--mut)">Recommended Bet</div><div style="font-size:13px;font-weight:700;color:var(--gld)">'+p.propLabel+'</div></div>';
  h+='<div style="text-align:right"><div style="font-size:10px;color:var(--mut)">Odds</div><div style="font-size:15px;font-weight:700;color:var(--grn)">'+fmtOdds(p.recOdds)+'</div></div></div>';
  h+='<button class="btn" onclick="logFromPick(\''+cid+'\')">+ Log This Bet</button>';
  h+='<button class="btn-s" onclick="addLeg(\''+cid+'\')">+ Add to Parlay</button>';
  h+='</div>';return h;
}
// ── RENDER TOTALS ─────────────────────────────────────────────────────────────
function renderTotals(){
  if(!D)return;
  var h='<div style="font-size:11px;color:var(--mut);margin-bottom:8px">Game over/under from DraftKings</div>';
  if(!D.totals.length)h+='<div class="empty">No totals yet.</div>';
  else D.totals.forEach(function(t){
    var pn=t.park>=108?'&#128293; Hitter park':t.park<=96?'&#129704; Pitcher park':'';
    h+='<div class="tot-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px"><div><div style="font-size:14px;font-weight:700">'+t.game+'</div><div style="font-size:11px;color:var(--mut)">'+t.time+(pn?' &middot; '+pn:'')+'</div></div><div style="font-size:18px;font-weight:700;color:var(--gld)">'+t.line+'</div></div>';
    h+='<div style="display:flex;gap:8px"><div style="flex:1;background:var(--gbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Over</div><div style="font-size:17px;font-weight:700;color:var(--grn)">'+fmtOdds(t.overOdds)+'</div></div>';
    h+='<div style="flex:1;background:var(--bbg);border-radius:8px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--mut)">Under</div><div style="font-size:17px;font-weight:700;color:var(--blu)">'+fmtOdds(t.underOdds)+'</div></div></div>';
    if(!t.isUpcoming)h+='<div style="font-size:10px;color:var(--mut);margin-top:6px;text-align:center">&#128308; In progress or final</div>';
    h+='</div>';
  });
  document.getElementById('pg-totals').innerHTML=h;
}
// ── P&L ───────────────────────────────────────────────────────────────────────
function updPnLHdr(){var tot=BETS.reduce(function(a,b){return a+(b.profit||0);},0);var el=document.getElementById('pnl-hdr');el.textContent=(tot>=0?'+$':'-$')+Math.abs(tot).toFixed(2);el.style.color=tot>=0?'var(--grn)':'var(--red)';}
function renderPnL(){
  var today=new Date().toLocaleDateString();
  var st=BETS.reduce(function(a,b){a.total+=(b.profit||0);a.staked+=(b.stake||0);if(b.dateStr===today)a.today+=(b.profit||0);if(b.result==='WIN')a.wins++;else if(b.result==='LOSS')a.losses++;else a.pend++;return a;},{total:0,today:0,staked:0,wins:0,losses:0,pend:0});
  var roi=st.staked>0?Math.round(st.total/st.staked*100):0;
  var h='<div class="pnlg">';
  h+='<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(st.today>=0?'var(--grn)':'var(--red)')+'">'+(st.today>=0?'+$':'-$')+Math.abs(st.today).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">TODAY</div></div>';
  h+='<div class="pnlb"><div style="font-size:20px;font-weight:700;color:'+(st.total>=0?'var(--grn)':'var(--red)')+'">'+(st.total>=0?'+$':'-$')+Math.abs(st.total).toFixed(2)+'</div><div style="font-size:10px;color:var(--mut)">ALL TIME</div></div>';
  h+='<div class="pnlb"><div style="font-size:18px;font-weight:700">'+st.wins+'W / '+st.losses+'L</div><div style="font-size:10px;color:var(--mut)">RECORD</div></div>';
  h+='<div class="pnlb"><div style="font-size:18px;font-weight:700;color:'+(roi>=0?'var(--grn)':'var(--red)')+'">'+roi+'%</div><div style="font-size:10px;color:var(--mut)">ROI</div></div></div>';
  if(!BETS.length)h+='<div class="empty">No bets logged yet.</div>';
  else{
    h+='<div class="stl">Bet History</div>';
    BETS.forEach(function(b){
      var pc=b.result==='WIN'?'var(--grn)':b.result==='LOSS'?'var(--red)':'var(--mut)';
      var pl=b.result==='WIN'?'+$'+b.profit.toFixed(2):b.result==='LOSS'?'-$'+Math.abs(b.profit||0).toFixed(2):'PENDING';
      h+='<div class="bet-row"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b.player+'</div>';
      h+='<div style="font-size:10px;color:var(--mut)">'+b.dateStr+' &middot; '+b.market+' &middot; $'+b.stake+' @ '+fmtOdds(parseInt(b.odds||0))+'</div>';
      if(!b.result||b.result==='PENDING')h+='<div class="rbtns"><button class="bw" onclick="markResult('+b.id+',\'WIN\')">&#10003; Win</button><button class="bl" onclick="markResult('+b.id+',\'LOSS\')">&#10007; Loss</button></div>';
      h+='</div><div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:700;color:'+pc+'">'+pl+'</div><div style="font-size:10px;color:var(--mut)">'+b.result+'</div></div></div>';
    });
  }
  document.getElementById('pg-pnl').innerHTML=h;updPnLHdr();
}
// ── LOG ───────────────────────────────────────────────────────────────────────
var MKTS=['Over 1.5 H+R+RBI','Over 2.5 H+R+RBI','Over 0.5 Singles','Over 0.5 Hits','Over 1.5 Hits','Over 1.5 Total Bases','Over 2.5 Total Bases','Over 0.5 HR','Over 0.5 RBI','Over 1.5 RBI','Over 0.5 Runs Scored','Over 0.5 Stolen Bases','Over 0.5 Doubles','Over 0.5 Walks','Over 4.5 Strikeouts','Over 5.5 Strikeouts','Over 6.5 Strikeouts','Over 7.5 Strikeouts','Under 3.5 Strikeouts','Under 4.5 Strikeouts','Over Game Total','Under Game Total','Other'];
function renderLog(){
  var tabs='<div class="tabrow"><div class="tabb'+(LOG_MODE==='single'?' on':'')+'" onclick="setLogMode(\'single\')">Single</div><div class="tabb'+(LOG_MODE==='parlay'?' on':'')+'" onclick="setLogMode(\'parlay\')">Parlay</div></div>';
  document.getElementById('pg-log').innerHTML=tabs+(LOG_MODE==='single'?renderSingle():renderParlay());
}
function setLogMode(m){LOG_MODE=m;renderLog();}
function mktOpts(sel){return MKTS.map(function(m){return'<option'+(m===sel?' selected':'')+'>'+m+'</option>';}).join('');}
function renderSingle(){
  return'<div class="card"><label class="lbl">Player</label><input class="inp" value="'+LF.player+'" placeholder="e.g. Yordan Alvarez" oninput="LF.player=this.value"><label class="lbl">Market</label><select class="inp" onchange="LF.market=this.value">'+mktOpts(LF.market)+'</select><label class="lbl">Odds</label><input class="inp" type="number" value="'+LF.odds+'" placeholder="-115" oninput="LF.odds=this.value"><label class="lbl">Stake ($)</label><input class="inp" type="number" value="'+LF.stake+'" oninput="LF.stake=this.value"><label class="lbl">Result</label><select class="inp" onchange="LF.result=this.value"><option>PENDING</option><option>WIN</option><option>LOSS</option></select><label class="lbl">Notes</label><input class="inp" value="'+LF.notes+'" placeholder="matchup notes..." oninput="LF.notes=this.value"><button class="btn" onclick="submitBet()">Save Bet</button></div>';
}
function renderParlay(){
  var h='<div class="card"><div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px">LEGS ('+LEGS.length+')</div>';
  if(!LEGS.length)h+='<div style="text-align:center;padding:14px;color:var(--mut);font-size:12px;border:1px dashed var(--bdr);border-radius:8px;margin-bottom:10px">Tap + Add to Parlay on any pick</div>';
  else LEGS.forEach(function(l,i){h+='<div class="leg"><div><div style="font-size:10px;color:var(--mut)">Leg '+(i+1)+'</div><div style="font-size:13px;font-weight:600">'+l.player+'</div><div style="font-size:11px;color:var(--mut)">'+l.market+'</div></div><button class="leg-rm" onclick="removeLeg('+i+')">&#10005;</button></div>';});
  h+='<div style="border:1px dashed var(--bdr);border-radius:8px;padding:10px;margin-bottom:10px"><div style="font-size:10px;color:var(--mut);margin-bottom:6px;text-transform:uppercase">Add Manually</div><input class="inp" placeholder="Player" value="'+ML_player+'" oninput="ML_player=this.value" style="margin-bottom:6px"><select class="inp" onchange="ML_market=this.value" style="margin-bottom:0">'+mktOpts(ML_market)+'</select><button class="btn-s" onclick="addManualLeg()" style="margin-top:6px">+ Add Leg</button></div>';
  h+='<label class="lbl">Combined Odds</label><input class="inp" type="number" placeholder="+350" value="'+PF.odds+'" oninput="PF.odds=this.value"><label class="lbl">Stake ($)</label><input class="inp" type="number" value="'+PF.stake+'" oninput="PF.stake=this.value"><label class="lbl">Result</label><select class="inp" onchange="PF.result=this.value"><option>PENDING</option><option>WIN</option><option>LOSS</option></select>';
  if(LEGS.length>=2){h+='<button class="btn" onclick="submitParlay()">Save Parlay ('+LEGS.length+' legs)</button><button class="btn-s" onclick="copyParlay()">&#129302; Analyze with Claude</button><div id="parlay-ok" style="display:none;background:var(--gbg);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;color:var(--grn)">&#10003; Copied!</div>';}
  else h+='<div style="text-align:center;padding:8px;color:var(--mut);font-size:12px">Need 2+ legs</div>';
  h+='<button class="btn-s" style="background:var(--rbg);color:var(--red);border-color:var(--red);margin-top:6px" onclick="clearLegs()">Clear All</button></div>';
  return h;
}
function logFromPick(cid){var d=window['_d'+cid];if(!d)return;LF.player=d.player;LF.market=d.market;LF.notes=d.game+' | '+d.time;LOG_MODE='single';nav('log');toast('Pre-filled — set odds then save');}
function addLeg(cid){var d=window['_d'+cid];if(!d)return;LEGS.push({player:d.player,market:d.market});toast('Leg '+LEGS.length+' added');if(LOG_MODE==='parlay')renderLog();}
function addManualLeg(){if(!ML_player.trim()){toast('Enter name');return;}LEGS.push({player:ML_player,market:ML_market});ML_player='';toast('Leg '+LEGS.length);renderLog();}
function removeLeg(i){LEGS.splice(i,1);renderLog();}
function clearLegs(){LEGS=[];renderLog();toast('Cleared');}
function submitBet(){
  if(!LF.player.trim()){toast('Enter player name');return;}
  var stake=parseFloat(LF.stake)||25,odds=parseInt(LF.odds)||(-115);
  BETS.unshift({id:Date.now(),dateStr:new Date().toLocaleDateString(),player:LF.player,market:LF.market,odds,stake,result:LF.result,profit:calcProfit(odds,stake,LF.result),notes:LF.notes});
  ss('bets',BETS);LF={player:'',market:'Over 0.5 Hits',odds:'-115',stake:'25',result:'PENDING',notes:''};
  toast('&#9989; Saved!');renderLog();renderPnL();
}
function submitParlay(){
  if(LEGS.length<2){toast('Need 2+ legs');return;}if(!PF.odds){toast('Enter odds');return;}
  var stake=parseFloat(PF.stake)||25,odds=parseInt(PF.odds)||0;
  BETS.unshift({id:Date.now(),dateStr:new Date().toLocaleDateString(),player:'PARLAY ('+LEGS.length+' legs)',market:LEGS.map(function(l,i){return(i+1)+'. '+l.player+' '+l.market;}).join(' | '),odds,stake,result:PF.result,profit:calcProfit(odds,stake,PF.result),notes:''});
  ss('bets',BETS);LEGS=[];PF={odds:'',stake:'25',result:'PENDING'};
  toast('&#9989; Saved!');renderLog();renderPnL();
}
function markResult(id,result){
  var idx=BETS.findIndex(function(b){return b.id===id;});if(idx===-1)return;
  BETS[idx].result=result;BETS[idx].profit=calcProfit(BETS[idx].odds,BETS[idx].stake,result);
  ss('bets',BETS);toast(result==='WIN'?'&#9989; WIN!':'&#10060; Loss');renderPnL();
}
function copyPicks(){
  if(!D){toast('No data');return;}
  var aG=D.picks.filter(function(p){return p.grade==='A';});
  var bG=D.picks.filter(function(p){return p.grade==='B';});
  var wins=BETS.filter(function(b){return b.result==='WIN';}).length;
  var tot=BETS.filter(function(b){return b.result!=='PENDING';}).length;
  var txt='HITTERS EDGE — '+D.date+'\nRecord: '+wins+'W/'+(tot-wins)+'L'+(tot?' ('+Math.round(wins/tot*100)+'%)':'')+'\n';
  if(D.aceNotes&&D.aceNotes.length){txt+='\nACE FILTERS:\n';D.aceNotes.forEach(function(n){txt+='  '+n.team+' batters vs '+n.pitcher+' ('+n.era+' ERA) — skipped\n';});}
  txt+='\n=== A-GRADE ===\n';if(!aG.length)txt+='None\n';
  aG.forEach(function(p){txt+='\n'+p.name+'\n  Bet: '+p.propLabel+' | Odds: '+fmtOdds(p.recOdds)+' | Score: '+p.score+'/100\n  Game: '+p.game+' | '+p.time+'\n'+(p.bStats?'  AVG: '+p.bStats.avg+' OBP: '+p.bStats.obp+' H/G: '+p.bStats.hpg+' Streak: '+p.bStats.hotCold+'\n':'');});
  txt+='\n=== B-GRADE ===\n';bG.slice(0,5).forEach(function(p){txt+=p.name+' — '+p.propLabel+' '+fmtOdds(p.recOdds)+' ('+p.score+')\n';});
  txt+='\n=== TOTALS ===\n';D.totals.filter(function(t){return t.isUpcoming;}).forEach(function(t){txt+=t.game+' Line:'+t.line+' O:'+fmtOdds(t.overOdds)+' U:'+fmtOdds(t.underOdds)+'\n';});
  txt+='\nANALYZE:\n1. Top pick + best prop\n2. Best 2-3 leg parlay\n3. Picks to avoid\n4. Strong or weak day?\nRULES: A=real money $25. B=bonus. -140 or better. No aces.';
  copyText(txt,'copy-ok');
}
function copyParlay(){
  var txt='PARLAY ANALYSIS\n\n';
  LEGS.forEach(function(l,i){txt+=(i+1)+'. '+l.player+' — '+l.market+'\n';if(D){var m=D.picks.find(function(p){return p.name.toLowerCase().indexOf(l.player.toLowerCase())>-1;});if(m)txt+='   Score:'+m.score+' Odds:'+fmtOdds(m.recOdds)+(m.bStats?' Streak:'+m.bStats.hotCold:'')+'\n';}});
  txt+='\n1. Grade each leg\n2. Correlate?\n3. Weakest leg?\n4. Singles vs parlay?';
  copyText(txt,'parlay-ok');
}
function copyText(txt,okId){
  navigator.clipboard.writeText(txt).then(function(){showOk(okId);toast('&#10003; Copied!');}).catch(function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showOk(okId);toast('&#10003; Copied!');}catch(e){toast('Copy failed');}document.body.removeChild(ta);});
}
function showOk(id){var el=document.getElementById(id);if(el){el.style.display='block';setTimeout(function(){el.style.display='none';},5000);}}
function startAR(){
  if(REFRESH_T)return;
  NEXT_R=Date.now()+60*60*1000;
  REFRESH_T=setInterval(function(){loadAll();NEXT_R=Date.now()+60*60*1000;},60*60*1000);
  if(COUNTDOWN_T)clearInterval(COUNTDOWN_T);
  COUNTDOWN_T=setInterval(function(){var el=document.getElementById('rtimer');if(!el)return;var diff=NEXT_R-Date.now();if(diff<=0){el.textContent='Refreshing...';return;}var m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);el.textContent='Refresh in '+m+'m '+('0'+s).slice(-2)+'s';},1000);
}
loadAll();
</script>
