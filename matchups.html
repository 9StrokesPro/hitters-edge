<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:50px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bord)}
.logo{font-size:16px;font-weight:800}
.btn{background:var(--sur);border:1px solid var(--bord);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.card{background:var(--sur);border:1px solid var(--bord);border-radius:12px;padding:12px;margin:10px 14px}
.mcard{background:var(--sur);border:1px solid var(--bord);border-radius:12px;margin:10px 14px;overflow:hidden}
.mhead{padding:10px 12px;border-bottom:1px solid var(--bord);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mbody{padding:10px 12px;display:none}
.mcard.open .mbody{display:block}
.sect{border-top:1px solid var(--bord);padding:8px 0;font-size:11px}
.sect:first-child{border-top:none}
.sh{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.5px;margin-bottom:3px}
.g{font-size:20px;font-weight:900;border-radius:8px;padding:2px 10px}
.gA{background:rgba(34,197,94,.15);color:var(--grn)}.gB{background:rgba(59,130,246,.15);color:var(--blu)}
.gC{background:rgba(245,158,11,.12);color:var(--amb)}.gD{background:rgba(239,68,68,.12);color:var(--red)}
.tag{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;display:inline-block}
.load{text-align:center;color:var(--mut);padding:30px 0}
.spnr{width:22px;height:22px;border:3px solid var(--bord);border-top-color:var(--blu);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
small,.mut{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2333;border:1px solid var(--bord);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.show{opacity:1}
.fx{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
</style>
</head>

<script>
'use strict';
/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   MATCHUP ENGINE v15 ‚Äî reads the hitter against the pitcher (per v15 spec).
   Keeps the proven v13 data layer (statsapi + Baseball Savant + weather + park),
   DELETES the fake-edge/betting model, adds pitch-mix fit + freshness gating,
   outputs a transparent matchup card + grade per hitter. Guardrails:
   - BvP is NOISE (footnote only, never moves the grade)      [spec 4.1]
   - Form weighted by EXPECTED stats + luck gap, not box AVG  [spec 4.2]
   - Price is not the product (check Edge Scanner separately) [spec 6]
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
var SEASON=2026;
var MLB='https://statsapi.mlb.com/api/v1';
var OWM_KEY='6a060c8de21d6f1a5cd9d6fed2b7a53b';
var ODDS_KEY='e738de03c4b7e835c52b50e1a0b1c494'; // ONLY for game totals context (~2 credits/load)
var K='me15_';
var STALE_MIN=30;          // auto re-pull grades + prices every 30m (matches the server cron)
var PITCH_MIN_SEEN=50;     // hitter needs >=N pitches seen vs a type to trust his xSLG vs it
var CONC=10;               // statsapi concurrency

// ‚îÄ‚îÄ utils ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function sg(k,d){try{var v=localStorage.getItem(K+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function f3(v){if(v==null)return'--';if(v<0)return'-'+f3(-v);return v>=1?v.toFixed(3):('.'+String(Math.round(v*1000)).padStart(3,'0'));}
async function apiFetch(url){try{var r=await fetch(url);if(!r.ok)throw 0;return await r.json();}catch(e){return null;}}
async function pool(items,fn,n){var i=0,out=new Array(items.length);async function w(){while(i<items.length){var ix=i++;out[ix]=await fn(items[ix],ix);}}var ws=[];for(var j=0;j<Math.min(n,items.length);j++)ws.push(w());await Promise.all(ws);return out;}
function windCardinal(deg){if(deg==null)return'';return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
// Baseball innings-pitched notation: "3.1" = 3‚Öì, "3.2" = 3‚Öî (the decimal is OUTS, not tenths).
function ipToInn(ip){var s=String(ip==null?'0':ip).split('.');var whole=parseInt(s[0])||0;var outs=s[1]?parseInt(s[1].charAt(0))||0:0;return whole+Math.min(outs,2)/3;}
// Sanity-cap an ERA to a physically-plausible scoring range (a 22 ERA is a data artifact).
function capEra(e){if(e==null||isNaN(e))return null;return Math.round(Math.max(0,Math.min(e,9))*100)/100;}
var MIN_PITCHER_IP=20;  // below this, season ERA is small-sample noise -> anchor on Statcast, not ERA
var MIN_PITCHER_G=4;    // and this many appearances
var LG_K_PCT=0.220;     // MLB league strikeout rate (K per plate appearance) ‚Äî the Log5 baseline
var K_MKT_WEIGHT=0.5;   // K-prop edge: keep this fraction of the model's disagreement with the sharp
                        // de-vig market (the rest is model noise) ‚Äî centers the board, kills phantom edges
var K_SLATE_FLAG_MAX=0.30; // if >this share of K props still flag "vs market", warn the slate is miscalibrated
var LG_WHIFF=24.5;      // league-avg whiff% (swinging-strike rate)
var LG_BAT_WHIFF=24.5;  // league-avg BATTER whiff% ‚Äî the reachable SwStr/Contact substitute (varies ~18-32%)
var LG_PITCHES_PA=3.90; // league-avg pitches per PA (battle-to-contact baseline)
var LG_TEAM_XWOBA=0.315;// league-avg team xwOBA (offense-quality baseline)
var PITCH_CEILING=100;  // realistic starter pitch-count ceiling ‚Üí couples grind lineups to fewer innings
var BF_PER_IP=4.30;     // batters faced per inning (~3 outs + baserunners) ‚Äî for expected-BF

// ‚ïê‚ïê PITCHER DATA LAYER (brief ¬ß3) + CONFIDENCE GATE (¬ß4) ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
// From a probable's game log + season baselines, build the standard pitcher block and the
// R1‚ÄìR4 flags. K numbers are a PLAIN arithmetic mean over QUALIFYING starts (>=3.0 IP) ‚Äî never
// the multiplier shortcut that produced the old bad math ‚Äî with divide-by-zero guarded to null.
function buildKLayer(gls,season){
  var games=(gls||[]).map(function(r){var st=r.stat;return{
    date:r.date, ip:ipToInn(st.inningsPitched), k:parseInt(st.strikeOuts)||0, bf:parseInt(st.battersFaced)||0,
    h:parseInt(st.hits)||0, bb:parseInt(st.baseOnBalls)||0, er:parseInt(st.earnedRuns)||0, started:parseInt(st.gamesStarted)||0};});
  var last3=games.slice(-3);
  var qual=last3.filter(function(x){return x.ip>=3.0;});          // DROP short outings (injury exits / opener cameos)
  var sumK=0,sumIP=0,sumBF=0;qual.forEach(function(x){sumK+=x.k;sumIP+=x.ip;sumBF+=x.bf;});
  var k_per_game_L3=qual.length?Math.round(sumK/qual.length*10)/10:null;      // simple mean K per qualifying start
  var k9_L3=(qual.length&&sumIP>0)?Math.round(sumK/sumIP*9*10)/10:null;
  var avg_ip_L3=qual.length?Math.round(sumIP/qual.length*10)/10:null;         // durability / expected length
  var recent_kpct=(qual.length&&sumBF>0)?sumK/sumBF:null;
  // WHIP over last 7 appearances
  var last7=games.slice(-7),wIP=0,wBase=0;last7.forEach(function(x){wIP+=x.ip;wBase+=x.h+x.bb;});
  var whip_L7=wIP>0?Math.round(wBase/wIP*100)/100:null;
  // ROLE ‚Äî starts share + typical outing length = what the hitters actually face
  var gs=season.gs,g=season.g,avgIpAll=g>0?season.ip/g:0;
  var recentStartIp=(function(){var s2=last3.filter(function(x){return x.started;});if(!s2.length)return null;var t=0;s2.forEach(function(x){t+=x.ip;});return t/s2.length;})();
  var role,short_leash=false;
  if(gs===0)role=avgIpAll>=2.0?'bulk':'reliever';
  else if(recentStartIp!=null&&recentStartIp<3.0)role='opener';
  else if(gs>=3&&gs/Math.max(g,1)>=0.4)role='starter';
  else role=avgIpAll>=4?'starter':'bulk';
  if(role==='starter'&&avg_ip_L3!=null&&avg_ip_L3<4.5)short_leash=true;
  if(role==='opener')short_leash=true;
  // STATUS ‚Äî a long recent gap in the log = returning from IL / layoff (recent-form stats are stale)
  var status='active';
  if(games.length){
    var dts=games.slice(-6).map(function(x){return new Date(x.date).getTime();});
    var maxGap=0;for(var i=1;i<dts.length;i++){var dd=(dts[i]-dts[i-1])/864e5;if(dd>maxGap)maxGap=dd;}
    var daysSince=(Date.now()-dts[dts.length-1])/864e5;
    if(maxGap>=15||daysSince>=15)status='returning_from_IL';
  }
  // ‚îÄ‚îÄ CONFIDENCE GATE ‚îÄ‚îÄ
  var flags=[];
  // R1 ‚Äî data confidence: <2 qualifying starts OR high spread in the last-3 K count
  var kRange=0;if(qual.length>=2){var ks=qual.map(function(x){return x.k;});kRange=Math.max.apply(null,ks)-Math.min.apply(null,ks);}
  var r1=qual.length<2||kRange>=7;
  if(r1)flags.push({rule:'R1',msg:qual.length<2?('only '+qual.length+' qualifying start'+(qual.length===1?'':'s')+' in last 3 ‚Äî recent form is noise'):('high K variance last 3 ('+kRange+'-K spread) ‚Äî unstable')});
  // R2 ‚Äî role: not a starter ‚Üí hitters don't face him all night; suppress full-start K prop
  var r2=role!=='starter';
  if(r2)flags.push({rule:'R2',msg:role+' ‚Äî opposing hitters won‚Äôt face him all night; no full-start K prop'});
  // R3 ‚Äî trajectory / health: recent form diverging from the season baseline (may be stale)
  var whipDelta=(whip_L7!=null&&season.whip!=null)?Math.round((whip_L7-season.whip)*100)/100:null;
  var k9Delta=(k9_L3!=null&&season.k9!=null)?Math.round((k9_L3-season.k9)*10)/10:null;
  var r3=false,direction=null,trajMsg='';
  if((whipDelta!=null&&Math.abs(whipDelta)>=0.20)||(k9Delta!=null&&Math.abs(k9Delta)>=1.5)||status==='returning_from_IL'){
    r3=true;
    var worse=(whipDelta!=null&&whipDelta>=0.20)||(k9Delta!=null&&k9Delta<=-1.5)||status==='returning_from_IL';
    var better=(k9Delta!=null&&k9Delta>=1.5)||(whipDelta!=null&&whipDelta<=-0.20);
    direction=(worse&&!better)?'worse':(better&&!worse)?'better':((k9Delta!=null&&k9Delta<0)?'worse':'better');
    trajMsg=direction==='worse'?'recent WORSE than season (may revert / injury ‚Äî the recent line may describe a pitcher who won‚Äôt show tonight)':'recent BETTER than season (rounding into form ‚Äî may be tougher than the season line)';
    flags.push({rule:'R3',msg:trajMsg});
  }
  var confidence=r1?'LOW':(r3?'MEDIUM':'HIGH');
  return{kGames:games.slice(-5),qStarts:qual.length,
    k_per_game_L3:k_per_game_L3,k9_L3:k9_L3,avg_ip_L3:avg_ip_L3,whip_L7:whip_L7,recent_kpct:recent_kpct,
    season_kpct:season.kpct,season_era:season.era,season_whip:season.whip,season_k9:season.k9,
    blended_kpct:(recent_kpct!=null&&season.kpct!=null)?0.70*season.kpct+0.30*recent_kpct:(season.kpct!=null?season.kpct:recent_kpct), // SINGLE SOURCE of pitcher K% ‚Äî both boards read this
    role:role,short_leash:short_leash,status:status,confidence:confidence,flags:flags,
    r1:r1,r2:r2,r3:r3,trajectory_direction:direction,trajectory_msg:trajMsg,whipDelta:whipDelta,k9Delta:k9Delta};
}

// ‚îÄ‚îÄ static maps (ported from v13) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var PARKS={'Coors Field':115,'Great American Ball Park':112,'Fenway Park':108,'Globe Life Field':107,'Citizens Bank Park':106,'American Family Field':105,'Wrigley Field':104,'Rogers Centre':104,'Yankee Stadium':103,'Truist Park':102,'Camden Yards':103,'Guaranteed Rate Field':103,'Dodger Stadium':101,'T-Mobile Park':100,'Progressive Field':100,'Nationals Park':100,'Daikin Park':98,'Minute Maid Park':98,'Angel Stadium':99,'Chase Field':99,'loanDepot park':98,'Oracle Park':97,'Citi Field':97,'Comerica Park':97,'Petco Park':96,'Target Field':96,'PNC Park':96,'Busch Stadium':95,'Kauffman Stadium':95,'Tropicana Field':97,'Sutter Health Park':98};
var TEAM_ABBR={'Arizona Diamondbacks':'AZ','Atlanta Braves':'ATL','Baltimore Orioles':'BAL','Boston Red Sox':'BOS','Chicago Cubs':'CHC','Chicago White Sox':'CWS','Cincinnati Reds':'CIN','Cleveland Guardians':'CLE','Colorado Rockies':'COL','Detroit Tigers':'DET','Houston Astros':'HOU','Kansas City Royals':'KC','Los Angeles Angels':'LAA','Los Angeles Dodgers':'LAD','Miami Marlins':'MIA','Milwaukee Brewers':'MIL','Minnesota Twins':'MIN','New York Mets':'NYM','New York Yankees':'NYY','Philadelphia Phillies':'PHI','Pittsburgh Pirates':'PIT','San Diego Padres':'SD','San Francisco Giants':'SF','Seattle Mariners':'SEA','St. Louis Cardinals':'STL','Tampa Bay Rays':'TB','Texas Rangers':'TEX','Toronto Blue Jays':'TOR','Washington Nationals':'WSH','Athletics':'ATH','Oakland Athletics':'ATH'};
var STADIUM_TYPE={'AZ':'retractable','HOU':'retractable','SEA':'retractable','MIA':'retractable','MIL':'retractable','TEX':'retractable','TOR':'retractable'};
var CITY_BY_ABBR={'AZ':'Phoenix,US','ATL':'Atlanta,US','BAL':'Baltimore,US','BOS':'Boston,US','CHC':'Chicago,US','CWS':'Chicago,US','CIN':'Cincinnati,US','CLE':'Cleveland,US','COL':'Denver,US','DET':'Detroit,US','HOU':'Houston,US','KC':'Kansas City,US','LAA':'Anaheim,US','LAD':'Los Angeles,US','MIA':'Miami,US','MIL':'Milwaukee,US','MIN':'Minneapolis,US','NYM':'New York,US','NYY':'New York,US','PHI':'Philadelphia,US','PIT':'Pittsburgh,US','SD':'San Diego,US','SF':'San Francisco,US','SEA':'Seattle,US','STL':'St. Louis,US','TB':'St. Petersburg,US','TEX':'Arlington,US','TOR':'Toronto,CA','WSH':'Washington,US','ATH':'Sacramento,US'};
// pitch-type code -> readable
var PITCH_NAME={FF:'4-seam FB',SI:'Sinker',FC:'Cutter',SL:'Slider',ST:'Sweeper',CU:'Curveball',KC:'Knuckle-curve',CH:'Changeup',FS:'Splitter',SV:'Slurve',FO:'Forkball',SC:'Screwball',KN:'Knuckleball'};

// ‚îÄ‚îÄ classification (ported from v13, verbatim logic) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function batType(iso){
  if(iso==null)return null;
  if(iso>0.200)return{key:'POWER',label:'POWER BAT'};
  if(iso>=0.150)return{key:'HYBRID',label:'HYBRID BAT'};
  return{key:'CONTACT',label:'CONTACT BAT'};
}
function classifyPitcher(pm,ps){
  if(!pm)return null;
  var era=pm.era,whip=pm.whip,k9=pm.k9,bb9=pm.bb9;
  var hh=ps?ps.hard_hit_percent:null,br=ps?ps.barrel_batted_rate:null,wh=ps?ps.whiff_percent:null,bb=ps?ps.bb_percent:null;
  var walkHi=(bb!=null)?bb>8:(bb9!=null&&bb9>3.0);
  if(era>5.00&&whip>1.50&&hh!=null&&hh>40)return{key:'TYPE3',label:'UNIVERSAL TARGET'};
  if(hh!=null&&br!=null&&wh!=null&&hh>40&&br>8&&wh<22)return{key:'TYPE1',label:'POWER TARGET'};
  if(whip>1.40&&walkHi&&k9<7.0)return{key:'TYPE2',label:'CONTACT TARGET'};
  if(era<3.00&&k9>9.0&&hh!=null&&hh<30)return{key:'TYPE4',label:'AVOID'};
  return null;
}
function luckGap(b,bs){
  if(!bs||!b)return null;
  var sum=0,parts=[];
  if(bs.xba!=null&&b.avg!=null){sum+=bs.xba-b.avg;parts.push({k:'xBA',x:bs.xba,a:b.avg});}
  if(bs.xslg!=null&&b.slg!=null){sum+=bs.xslg-b.slg;parts.push({k:'xSLG',x:bs.xslg,a:b.slg});}
  if(bs.xwoba!=null&&bs.woba!=null){sum+=bs.xwoba-bs.woba;parts.push({k:'xwOBA',x:bs.xwoba,a:bs.woba});}
  if(!parts.length)return null;
  return{sum:Math.round(sum*1000)/1000,parts:parts};
}
function platoonMod(tonight,other){
  if(!tonight||!other||tonight.ab<40||other.ab<40)return null;
  var diff=Math.round((tonight.ops-other.ops)*1000)/1000,mag=Math.abs(diff),adj=0;
  if(diff>0)adj=mag>0.100?4:(mag>=0.050?2:0);
  else if(diff<0)adj=mag>0.100?-4:(mag>=0.050?-2:0);
  return{adj:adj,side:diff>0?'FAVORABLE':(diff<0?'UNFAVORABLE':'NEUTRAL'),diff:diff};
}
function paEstimate(spot){if(!spot)return'';var m={1:'4-5',2:'4-5',3:'4',4:'4',5:'3-4',6:'3-4',7:'3-4',8:'3',9:'3'};return m[spot]||'3-4';}

// ‚îÄ‚îÄ data pulls (ported from v13; statsapi + savant, all free) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
async function loadSchedule(){
  var d=await apiFetch(MLB+'/schedule?sportId=1&date='+todayStr()+'&hydrate=probablePitcher,lineups,team,venue&language=en');
  var games=d&&d.dates&&d.dates[0]&&d.dates[0].games||[];

// NO default to any one market (TB/H+R+RBI no longer win by fiat). Value + a light fit break ties.
var EDGE_MKTS=['batter_runs_scored','batter_rbis','batter_home_runs'];              // where we hunt to beat the book

    out.marketFlag=flags.length?flags.join(' ¬∑ '):null;

    // ‚îÄ‚îÄ recommendation gates ‚îÄ‚îÄ
    out.recommend=true;out.holdReason=null;
    if(out.suppressed){out.recommend=false;out.holdReason='not a full-game starter ‚Äî no full-start K line';}
    else if(out.side==='Over'&&lowK){out.recommend=false;out.holdReason='below-average strikeout arm (K% '+(pit_kpct*100).toFixed(1)+'<'+(LG_K_PCT*100).toFixed(0)+' lg) ‚Äî the model won‚Äôt chase an over here';}
    else if(out.side==='Over'&&out.divergence>=1.5&&reliableLine){out.recommend=false;out.holdReason='model runs '+out.divergence.toFixed(1)+' K hot vs the line ‚Äî too far above market to trust (this profile lost on 8/21)';}
    else if(out.flagged){out.recommend=false;out.holdReason='recent-form flag ‚Äî low confidence, no auto-bet';}
  }
  return out;
}

// ‚îÄ‚îÄ PITCH-MIX FIT (spec 3.6 ‚Äî wired) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Weighted hitter xSLG across the pitcher's arsenal (usage-weighted, only pitch
// types where the hitter has seen >= PITCH_MIN_SEEN pitches). Returns null if
// insufficient data ‚Äî the card says so honestly instead of guessing.
function pitchMixFit(batterId,arsenal,bps){
  if(!arsenal||!arsenal.length||!bps)return null;
  var wSum=0,wTot=0,lines=[],covered=0;
  arsenal.forEach(function(a){
    if(a.pct<10)return; // ignore rarely-thrown pitches
    var row=bps[batterId+'|'+a.code];
    if(!row||row.pitches==null||row.pitches<PITCH_MIN_SEEN||row.est_slg==null){lines.push({pitch:a.name,pct:a.pct,xslg:null});return;}
    wSum+=a.pct*row.est_slg;wTot+=a.pct;covered+=a.pct;
    lines.push({pitch:a.name,pct:a.pct,xslg:row.est_slg,rv:row.run_value_per_100});
  });
  if(wTot<30)return{fit:null,lines:lines,note:'insufficient pitch-level data for this hitter'};
  return{fit:Math.round(wSum/wTot*1000)/1000,coveredPct:Math.round(covered),lines:lines};
}

// ‚îÄ‚îÄ THE MATCHUP GRADE (spec 4) ‚Äî transparent, every factor on the card ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function gradeMatchup(h){
  var F=[]; // {name, pts, detail}
  function add(name,pts,detail){F.push({name:name,pts:Math.round(pts*10)/10,detail:detail});}
  // 1. Talent ‚Äî EXPECTED stats anchor (spec 4.2)
  var xw=h.bSav&&h.bSav.xwoba!=null?h.bSav.xwoba:null;
  var t=0,td='';
  if(xw!=null){t=xw>=0.400?20:xw>=0.370?16:xw>=0.340?12:xw>=0.320?8:xw>=0.300?4:0;td='xwOBA '+f3(xw)+(xw>=0.400?' (elite)':xw>=0.340?' (strong)':xw>=0.300?' (average)':' (below avg)');}
  else{var ops=h.b.obp+h.b.slg;t=ops>=0.900?16:ops>=0.820?12:ops>=0.750?8:ops>=0.700?4:0;td='OPS '+f3(ops)+' (no Statcast ‚Äî season proxy)';}
  add('Hitter talent',t,td);
  // 2. Form QUALITY ‚Äî hot/cold + luck gap (spec 4.2: expected > results)
  var form=0,fd=h.b.hotCold;
  form+=h.b.hotCold==='HOT'?6:h.b.hotCold==='Warming'?3:h.b.hotCold==='COLD'?-6:h.b.hotCold==='Cooling'?-3:0;
  if(h.lg){
    if(h.lg.sum>=0.060){form+=6;fd+=' + under-rewarded (luck gap +'+f3(h.lg.sum)+') ‚Äî earned, room to run';}
    else if(h.lg.sum>=0.025){form+=3;fd+=' + slightly under-rewarded (+'+f3(h.lg.sum)+')';}
    else if(h.lg.sum<=-0.060){form-=6;fd+=' but OVER-performing expected ('+f3(h.lg.sum)+') ‚Äî regression-down risk';}
    else if(h.lg.sum<=-0.025){form-=3;fd+=' but running a bit hot vs expected ('+f3(h.lg.sum)+')';}
    else fd+=' (results match expected ‚Äî real)';
  }
  add('Form (vs expected)',form,fd+' ¬∑ L10 '+f3(h.b.roll10avg)+'/'+f3(h.b.roll10slg));
  // 3. Platoon
  if(h.pm)add('Platoon',h.pm.adj,h.pm.side+' vs '+(h.oppThrows||'?')+'HP (OPS diff '+(h.pm.diff>0?'+':'')+f3(Math.abs(h.pm.diff))+')');
  else add('Platoon',0,'insufficient split sample');
  // 4. Pitcher vulnerability ‚Äî STATCAST-ANCHORED (quality of contact / bat-missing are the
  //    primary signal; they stabilize far faster than ERA). Season ERA is a SECONDARY,
  //    sanity-capped input, and last-3 ERA only a minor recent-form nudge. A pitcher with a
  //    tiny sample (e.g. 1 start off the IL) contributes NOTHING from ERA ‚Äî it's noise.
  var P=h.pit,pv=0,pvd=[];
  if(!P||P.isPitcher===false){ add('Pitcher vulnerability',0,'no reliable pitcher data'); }
  else if(!P.reliable){
    // SMALL SAMPLE = UNKNOWN. Both ERA and Statcast are noise off a couple innings ‚Äî score
    // NEUTRAL (don't inflate OR punish), and let the hitter's own profile drive the grade.
    add('Pitcher vulnerability',0,'UNKNOWN ‚Äî only '+(P.ip||0)+' IP / '+(P.gs||0)+' GS this season; too small to read (both ERA and Statcast are noise). Grade is hitter-driven.');
  }else{
    var ps=h.pSav;
    // -- PRIMARY: Statcast quality-of-contact allowed (reliable sample only) --
    if(ps){
      if(ps.xslg!=null){pv+=ps.xslg>=0.480?7:ps.xslg>=0.430?4:ps.xslg>=0.390?1:ps.xslg>=0.340?-2:-5;pvd.push('xSLG-against '+f3(ps.xslg)+(ps.xslg>=0.430?' (gets squared up)':ps.xslg<=0.340?' (limits damage)':''));}
      if(ps.hard_hit_percent!=null){pv+=ps.hard_hit_percent>44?4:ps.hard_hit_percent>40?2:ps.hard_hit_percent<32?-3:0;pvd.push('HardHit '+ps.hard_hit_percent+'%');}
      if(ps.barrel_batted_rate!=null){pv+=ps.barrel_batted_rate>9?3:ps.barrel_batted_rate>7?1:ps.barrel_batted_rate<5?-2:0;pvd.push('Barrel '+ps.barrel_batted_rate+'%');}
      // NOTE: whiff/K (contact-PREVENTION) moved OUT of this damage factor into its own
      // 'Pitcher K-suppression' factor below ‚Äî two distinct axes, no double-count (advisor's fix).
      if(ps.bb_percent!=null&&ps.bb_percent>10){pv+=2;pvd.push('walks people (BB% '+ps.bb_percent+')');}
    }else pvd.push('no Statcast row');
    // -- SECONDARY: season ERA, sanity-capped --
    if(P.era!=null){pv+=P.era>=5.0?4:P.era>=4.3?2:P.era>=3.7?0:P.era>=3.0?-2:-4;pvd.push('ERA '+P.era.toFixed(2)+' ('+P.ip+' IP)');}
    // -- MINOR: last-3 recent form, capped, only if L3 has real innings --
    if(P.l3&&P.l3.reliable&&P.l3.era!=null){
      if(P.l3.era>=6){pv+=1.5;pvd.push('last-3 rough ('+P.l3.era.toFixed(2)+' over '+P.l3.inn+' IP)');}
      else if(P.l3.era<=2.5){pv-=1.5;pvd.push('last-3 sharp ('+P.l3.era.toFixed(2)+')');}
    }
    if(h.vuln){pvd.push(h.vuln.label);
      if(h.vuln.key==='TYPE4'){pv-=5;}
      else if((h.vuln.key==='TYPE1'&&h.bt&&h.bt.key==='POWER')||(h.vuln.key==='TYPE2'&&h.bt&&h.bt.key==='CONTACT')){pv+=3;pvd.push('PERFECT bat-type match');}
    }
    // ‚îÄ‚îÄ R4: CONFIRM / CONFLICT cross-check (brief FIX 1) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
    // Compare the INDEPENDENT pitcher recent-form (whip_L7 & k9_L3 trajectory) against the
    // engine's own vulnerability read (sign of pv). DIRECTIONAL, not a blind shrink:
    //   ‚Ä¢ agree  ‚Üí CONFIRM: push the factor further in the agreed direction, hold confidence
    //   ‚Ä¢ disagree ‚Üí CONFLICT: the season read may be stale ‚Üí pull toward neutral + cut confidence
    // This fixes the bug where "rounding into form" (a pitcher getting TOUGHER) was softening the
    // hitter's penalty instead of hardening it.
    var KL=P.kLayer;
    if(KL){
      var trend=0;                                        // +1 = trending TOUGHER, -1 = more HITTABLE
      if(KL.k9Delta!=null)trend+=KL.k9Delta>=1.0?1:KL.k9Delta<=-1.0?-1:0;
      if(KL.whipDelta!=null)trend+=KL.whipDelta<=-0.15?1:KL.whipDelta>=0.15?-1:0;
      var engineHittable=pv>0.5?1:pv<-0.5?-1:0;           // engine: +1 sees him hittable, -1 sees him tough
      var recentHittable=trend>0?-1:trend<0?1:0;          // tougher trend => LESS hittable
      if(trend!==0&&engineHittable!==0){
        if(recentHittable===engineHittable){              // AGREE ‚Üí confirm & strengthen
          h._pitchTag='CONFIRM';
          pv=pv+(pv>0?1.5:-1.5);
          pvd.push('CONFIRM ‚úì recent form '+(trend>0?'trending tougher':'more hittable')+' ‚Äî agrees with the read');
        }else{                                            // DISAGREE ‚Üí conflict, widen uncertainty
          h._pitchTag='CONFLICT';h._pitchConfDown=true;
          pv=Math.round(pv*0.45*10)/10;
          pvd.push('CONFLICT ‚ö† recent form '+(trend>0?'trending TOUGHER':'more HITTABLE')+' vs the season read ‚Äî softened, confidence cut');
        }
      }
      if(KL.status==='returning_from_IL'){h._pitchTag=h._pitchTag||'CONFLICT';h._pitchConfDown=true;pvd.push('‚ö† back from IL/layoff ‚Äî recent form unreliable');}
      if(KL.r2){                                          // ROLE suppression: opener/reliever/bulk
        pv=Math.round(pv*0.5*10)/10;h._pitchConfDown=true;
        pvd.push('‚ö† '+KL.role+' ‚Äî hitters face him ~1-2 PAs (rest is the bullpen); read + PA assumption cut');
      }
    }
    pv=Math.max(-12,Math.min(15,pv));
    add('Pitcher vulnerability',pv,pvd.join(' ¬∑ '));
    // ‚îÄ‚îÄ 4b. PITCHER K-SUPPRESSION (advisor's integration fix) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
    // A SECOND, distinct pitcher axis: contact-PREVENTION (strikeout rate), separate from the
    // damage-on-contact factor above. Uses the SAME blended K% the K-prop board outputs (single
    // source ‚Äî the two boards can't drift). High-K arm suppresses contact ‚Üí lowers the hitter;
    // contact pitcher ‚Üí raises him. Weighted HEAVIER for contact bats (their value is Hits/H+R+RBI)
    // and LIGHTER for power bats (Total Bases is less K-sensitive).
    var okpct=P.kLayer&&P.kLayer.blended_kpct;
    if(okpct!=null){
      var dev=okpct-LG_K_PCT;                                // + = more Ks than league
      var w=(h.bt&&h.bt.key==='CONTACT')?1.3:(h.bt&&h.bt.key==='POWER')?0.6:1.0;
      var ksup=Math.max(-8,Math.min(6,Math.round(-dev*70*w*10)/10));
      add('Pitcher K-suppression',ksup,'opp K% '+(okpct*100).toFixed(1)+'% ('+(dev>=0?'+':'')+(dev*100).toFixed(1)+' vs lg) ‚Äî '+(dev>0.02?'misses bats, suppresses contact props':dev<-0.02?'contact pitcher, lets hitters put it in play':'league-average K rate')+' ¬∑ weighted for '+(h.bt?h.bt.label.toLowerCase():'balanced bat'));
    }
    // ‚îÄ‚îÄ 4c. LINEUP OFFENSIVE CONTEXT (team xwOBA ‚Üí run/RBI props) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
    // A strong lineup means more traffic to drive in / be driven in ‚Äî raises run & RBI props for a
    // hitter in the middle of the order. Uses Savant team xwOBA vs league (the wRC+ substitute).
  }
  // ‚îÄ‚îÄ 4c. LINEUP OFFENSIVE CONTEXT (team xwOBA ‚Üí run/RBI props) ‚Äî TOP-LEVEL (hitter's own team,
  // independent of the pitcher). Strong lineup = more traffic to drive in / be driven in. wRC+ substitute.
  if(h.teamXwoba!=null){
    var xdev=h.teamXwoba-LG_TEAM_XWOBA,xslot=h.spot||9;
    var slotW=(xslot>=2&&xslot<=6)?1.0:0.5;                  // run-producing slots benefit most
    var lc=Math.max(-4,Math.min(4,Math.round(xdev*80*slotW*10)/10));
    add('Lineup context (run/RBI)',lc,'team xwOBA '+f3(h.teamXwoba)+' ('+(xdev>=0?'+':'')+f3(xdev)+' vs lg) ‚Äî '+(xdev>0.010?'strong lineup, more traffic for runs/RBI':xdev<-0.010?'weak lineup, thin traffic':'average lineup')+' ¬∑ slot #'+xslot);
  }
  // 5. Pitch-mix fit (spec 3.6 ‚Äî weighted heavily once wired)
  var pmix=0,pmd='';
  if(h.mix&&h.mix.fit!=null){
    var fit=h.mix.fit;
    pmix=fit>=0.500?12:fit>=0.460?8:fit>=0.420?4:fit>=0.380?0:fit>=0.340?-4:-8;
    pmd='usage-weighted xSLG '+f3(fit)+' vs this arsenal ('+h.mix.coveredPct+'% of pitches covered)';
    var best=h.mix.lines.filter(function(l){return l.xslg!=null;}).sort(function(a,b){return b.xslg-a.xslg;})[0];
    if(best)pmd+=' ¬∑ best: '+f3(best.xslg)+' xSLG vs '+best.pitch+' ('+best.pct+'% thrown)';
  }else pmd=(h.mix&&h.mix.note)||'DATA NOT YET AVAILABLE for this hitter';
  add('Pitch-mix fit',pmix,pmd);
  // 6. Park & environment
  var env=0,ed=[];
  if(h.park>=112){env+=5;ed.push('extreme hitter park ('+h.park+')');}
  else if(h.park>=104){env+=3;ed.push('hitter park ('+h.park+')');}
  else if(h.park<=96){env-=3;ed.push('pitcher park ('+h.park+')');}
  else ed.push('neutral park ('+h.park+')');
  if(h.total!=null){if(h.total>=10){env+=3;ed.push('game total '+h.total+' (books expect runs)');}else if(h.total>=9){env+=1;ed.push('total '+h.total);}else if(h.total<=7.5){env-=2;ed.push('low total '+h.total);}else ed.push('total '+h.total);}
  if(h.wx&&!h.wx.neutral&&h.wx.temp!=null){if(h.wx.temp>=88){env+=1;ed.push(h.wx.temp+'¬∞F (ball carries)');}else if(h.wx.temp<=48){env-=1;ed.push(h.wx.temp+'¬∞F (cold)');}}
  add('Park & environment',env,ed.join(' ¬∑ '));
  // 7. Lineup slot
  var slot=h.spot,sl=0;
  if(slot){sl=slot<=2?4:slot<=4?3:slot<=6?1:0;add('Lineup slot',sl,'#'+slot+' ('+paEstimate(slot)+' PAs'+(slot<=2?' ‚Äî extra PA edge':slot<=4?' ‚Äî run-producer slot':'')+')'+(h.confirmed?'':' [PROJECTED]'));}
  else add('Lineup slot',0,'not in a posted lineup');
  var score=Math.round(F.reduce(function(a,x){return a+x.pts;},0));
  var grade=score>=32?'A':score>=22?'B':score>=12?'C':'D';
  // confidence (spec 3.5): data completeness + lineup state
  var conf=(h.confirmed?1:0)+(h.bSav?1:0)+(h.mix&&h.mix.fit!=null?1:0)+(h.pit&&h.pit.reliable?1:0); // pitcher counts only if we've seen enough of him
  var confidence=conf>=4?'HIGH':conf>=2?'MEDIUM':'LOW';
  if(h._pitchConfDown)confidence=confidence==='HIGH'?'MEDIUM':'LOW'; // R4 CONFLICT / role / IL ‚Üí drop a tier
  return{score:score,grade:grade,confidence:confidence,factors:F,pitchTag:h._pitchTag||null};
}
// Best-fit stat (spec 4): profile -> which stat to back
function bestFitStat(h){
  var bt=h.bt?h.bt.key:null,total=h.total||0,slot=h.spot||9,k9=h.pit?h.pit.k9:null;
  if(bt==='POWER'&&total>=9)return'Total Bases over / H+R+RBI over (power + run environment)';
  if(bt==='POWER')return'Total Bases over (power profile)';
  if(bt==='CONTACT'&&k9!=null&&k9<7.5)return'Hits / Singles (contact bat vs low-K arm)';
  if(slot<=2&&total>=9)return'Runs (top of order in a high-total game)';
  if(slot>=3&&slot<=6&&total>=9)return'RBI / H+R+RBI (run producer + environment)';
  if(bt==='CONTACT')return'Hits over';
  return'H+R+RBI over (balanced profile)';
}

// ‚îÄ‚îÄ MAIN LOAD ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
var D=null;
function setS(m){var el=document.getElementById('status');if(el)el.textContent=m;}
async function loadAll(){
  var t0=Date.now();
  document.getElementById('main').innerHTML='<div class="load"><div class="spnr"></div>Reading the matchups...</div>';
  setS('Loading schedule + lineups...');
  var games=await loadSchedule();
  if(!games.length){document.getElementById('main').innerHTML='<div class="card">No upcoming MLB games today.</div>';setS('No slate');return;}
  setS('Loading Statcast layers...');
  var sc=await loadStatcast();
  var bps=await loadBatterPitchStats();
  var teamOff={};try{teamOff=await loadTeamOffense();}catch(e){}
  var whiffMap={};try{whiffMap=await loadBatterWhiff();}catch(e){} // opponent-lineup contact (SwStr substitute)
  var wx=await loadWeatherFor(games);
  var totals=await loadTotals();
  // projected lineups for unposted games (real last-game orders ‚Äî no phantoms, spec 3.5)
  setS('Resolving lineups ('+games.filter(function(g){return g.posted;}).length+'/'+games.length+' posted)...');
  for(var i=0;i<games.length;i++){
    var g=games[i];
    if(!g.awayLu.length)g.awayLu=(await projectedLineup(g.awayId)).map(function(p){return{id:p.id,name:p.name,spot:p.spot,projected:true};});
    if(!g.homeLu.length)g.homeLu=(await projectedLineup(g.homeId)).map(function(p){return{id:p.id,name:p.name,spot:p.spot,projected:true};});
  }
  // pitchers (both probables per game, incl. arsenal)
  setS('Reading pitchers + arsenals...');
  var pitIds=[];games.forEach(function(g){if(g.awayPit)pitIds.push(g.awayPit.id);if(g.homePit)pitIds.push(g.homePit.id);});
  var pitArr=await pool(pitIds,function(id){return getPitcher(id);},CONC);
  var pitMap={};pitIds.forEach(function(id,ix){pitMap[id]=pitArr[ix];});
  for(var pk in pitMap){var PP=pitMap[pk];if(PP&&PP.finish==null&&sc.pit[PP.id]&&sc.pit[PP.id].whiff_percent!=null)PP.finish=sc.pit[PP.id].whiff_percent;} // attach whiff/finish BEFORE grading
  // hitters
  var jobs=[];
  games.forEach(function(g){
    var total=totals[g.awayTeam+' @ '+g.homeTeam]||null,wxg=wx[g.awayTeam+' @ '+g.homeTeam]||null;
    var park=PARKS[g.venue]||100;
    [['away',g.awayLu,g.homePit],['home',g.homeLu,g.awayPit]].forEach(function(side){
      side[1].forEach(function(pl){
        jobs.push({g:g,side:side[0],pl:pl,oppPitId:side[2]?side[2].id:null,oppPitName:side[2]?side[2].fullName:null,total:total,wx:wxg,park:park});
      });
    });
  });
  setS('Reading '+jobs.length+' hitters vs their pitchers...');
  var done=0;
  var hitters=await pool(jobs,async function(j){
    var b=await getBatter(j.pl.id);
    done++;if(done%15===0)setS('Reading hitters... '+done+'/'+jobs.length);
    if(!b)return null;
    var pit=j.oppPitId?pitMap[j.oppPitId]:null;
    var bSav=sc.bat[j.pl.id]||null,pSav=(pit&&sc.pit[pit.id])||null;
    var oppThrows=pit?pit.throws:null;
    var tonight=oppThrows==='L'?b.splitVsL:oppThrows==='R'?b.splitVsR:null;
    var other=oppThrows==='L'?b.splitVsR:oppThrows==='R'?b.splitVsL:null;
    var h={
      name:j.pl.name,id:j.pl.id,team:j.side==='away'?j.g.awayTeam:j.g.homeTeam,
      teamXwoba:teamOff[TEAM_ABBR[j.side==='away'?j.g.awayTeam:j.g.homeTeam]]||null, // lineup offensive context (Savant team xwOBA)
      game:j.g.awayTeam+' @ '+j.g.homeTeam,start:j.g.start,total:j.total,wx:j.wx,park:j.park,venue:j.g.venue,
      spot:j.pl.spot,confirmed:!j.pl.projected&&j.g.posted,
      b:b,bSav:bSav,bt:batType(b.iso),lg:luckGap(b,bSav),
      pit:pit,pSav:pSav,oppPitName:j.oppPitName,oppThrows:oppThrows,
      pm:platoonMod(tonight,other),tonightSplit:tonight,otherSplit:other,
      vuln:(pit&&pit.reliable)?classifyPitcher(pit,pSav):null, // only type an arm we've seen enough of
      mix:pit?pitchMixFit(j.pl.id,pit.arsenal,bps):null,
      bvp:null
    };
    var gr=gradeMatchup(h);h.score=gr.score;h.grade=gr.grade;h.confidence=gr.confidence;h.factors=gr.factors;h.pitchTag=gr.pitchTag;
    h.bestFit=bestFitStat(h);
    return h;
  },CONC);
  hitters=hitters.filter(Boolean);
  // BvP footnotes for A/B cards only (it's NOISE ‚Äî never affects the grade; spec 4.1)
  var ab=hitters.filter(function(h){return h.grade==='A'||h.grade==='B';});
  setS('BvP footnotes for '+ab.length+' A/B cards (noise ‚Äî display only)...');
  await pool(ab,async function(h){var pid=h.pit?h.pit.id:null;h.bvp=await getBvP(h.id,pid);},CONC);
  // PROPS ON HARD ROCK ‚Äî attach the actual bettable line to every card (info, never ranking)
  setS('Pulling Hard Rock prop lines...');
  var propRes={props:{},pitchers:{},status:{},at:null};
  try{propRes=await loadProps(games);attachProps(hitters,propRes);}catch(e){console.warn('props',e);hitters.forEach(function(h){if(h.propFetch==null)h.propFetch='failed';});}
  hitters.sort(function(a,b){return b.score-a.score;});
  // ‚îÄ‚îÄ PITCHER STRIKEOUT-PROPS BOARD (brief ¬ß5/¬ß6) ‚Äî project every probable, attach the K line ‚îÄ‚îÄ
  setS('Projecting pitcher strikeouts...');
  var teamIdSet={};games.forEach(function(g){teamIdSet[g.awayId]=1;teamIdSet[g.homeId]=1;});
  var kSplits={};try{kSplits=await loadTeamKSplits(Object.keys(teamIdSet).map(Number));}catch(e){}
  var pitchers=[];
  games.forEach(function(g){
    [[g.awayPit,g.homeId,g.awayTeam,g.homeTeam,g.homeLu],[g.homePit,g.awayId,g.homeTeam,g.awayTeam,g.awayLu]].forEach(function(x){
      var pp=x[0];if(!pp)return;var P=pitMap[pp.id];if(!P)return;
      if(P.finish==null&&sc.pit[P.id]&&sc.pit[P.id].whiff_percent!=null)P.finish=sc.pit[P.id].whiff_percent; // whiff/finish
      var ts=kSplits[x[1]]||{},base=(P.throws==='L')?ts.vL:(P.throws==='R')?ts.vR:null;
      var lw=lineupWhiff(x[4],whiffMap);                 // the actual opposing lineup's whiff% (contact)
      var oppSplit=base?Object.assign({},base,{whiff:lw}):(lw!=null?{whiff:lw}:null); // copy ‚Äî never mutate cache
      var kprop=(propRes.pitchers&&propRes.pitchers[P.name])||null;
      pitchers.push({name:P.name,team:x[2],opp:x[3],game:g.awayTeam+' @ '+g.homeTeam,start:g.start,throws:P.throws,P:P,oppSplit:oppSplit,oppKpct:oppSplit?oppSplit.kpct:null,kprop:kprop,proj:projectK(P,oppSplit,kprop)});
    });
  });
  pitchers.sort(function(a,b){                                    // recommended first, then biggest edge
    var ar=(a.proj&&a.proj.recommend)?1:0,br=(b.proj&&b.proj.recommend)?1:0;
    if(ar!==br)return br-ar;
    var ae=(a.proj&&a.proj.edge!=null)?a.proj.edge:-1,be=(b.proj&&b.proj.edge!=null)?b.proj.edge:-1;
    return be-ae;
  });
  logKProjections(pitchers);                              // instrument: record tonight's K projections
  var kcal=null;try{kcal=await settleKProjections();}catch(e){} // settle prior nights vs real box-score Ks
  D={hitters:hitters,games:games,pitchers:pitchers,kcalib:kcal,generatedAt:new Date(),loadSec:Math.round((Date.now()-t0)/1000),propsAt:propRes.at,serverDown:propRes.serverDown};
  render();
  setS(hitters.length+' matchup cards ‚Ä¢ '+games.length+' games ‚Ä¢ built in '+D.loadSec+'s');
  freshLine();
}

// üü¢ top play ¬∑ üü° playable (read the note) ¬∑ üî¥ weak/pass. A pitcher cross-check
// or thin data knocks a pick down one light and says why in plain words.
function pickLight(h){
  var base=h.grade==='A'?2:h.grade==='B'?1:0;
  if(h.pitchTag==='CONFLICT'||h.confidence==='LOW')base=Math.max(0,base-1);
  return base===2?'green':base===1?'yellow':'red';
}
function lightDot(l){return l==='green'?'&#128994;':l==='yellow'?'&#128993;':'&#128308;';}

function pickWhy(h){ // one plain-English sentence, or null when there's nothing to flag
  var pn=esc(h.oppPitName||'the pitcher');
  if(h.pitchTag==='CONFLICT'){
    var KL=h.pit&&h.pit.kLayer;
    if(KL){
      if(KL.r2)return pn+' is '+(KL.role==='opener'?'an opener':KL.role==='bulk'?'a bulk reliever':'a '+KL.role)+' ‚Äî your hitter only faces him once or twice before the bullpen comes in, so this matchup read is thin.';
      if(KL.status==='returning_from_IL')return pn+' just came off the injured list ‚Äî his recent numbers aren‚Äôt trustworthy yet, so the grade is shakier than it looks.';
      if(KL.trajectory_direction==='better')return pn+' has been SHARPER lately than his season stats ‚Äî he may be tougher tonight than the grade assumes.';
      if(KL.trajectory_direction==='worse')return pn+'‚Äôs season line looks fine, but he‚Äôs been getting hit lately ‚Äî could go either way, so treat it as lower confidence.';
    }
    return pn+'‚Äôs recent form doesn‚Äôt match his season stats ‚Äî read with caution.';
  }
  if(h.confidence==='LOW')return 'Thin data here (lineup not posted yet, or small samples) ‚Äî lower confidence.';
  return null;
}

    b+='<span class="mut">Model projects <b>'+pr.mu+' Ks</b> ‚Äî Hard Rock hasn‚Äôt posted a K line for him yet.</span>';
  }else if(!pr.recommend){
    b+='<div style="padding:6px 8px;border-radius:8px;background:rgba(139,148,167,.12)"><b>NO PLAY</b> ‚Äî '+esc(pr.holdReason||'')+'<div style="font-size:10px;margin-top:2px" class="mut">Model projects '+pr.mu+' Ks (leans '+esc(pr.side||'')+' '+pr.line+'), but a guardrail says sit this one out.</div></div>';
  }else{
    b+='<div style="padding:6px 8px;border-radius:8px;background:rgba(234,179,8,.10)">&#127919; <b>'+esc(kBetHeadline(p))+'</b>'+(pr.marketFlag?'<div style="font-size:10px;color:var(--amb);margin-top:2px">‚ö† '+esc(pr.marketFlag)+'</div>':'')+'</div>';
  }
  // auditable line source: the SAME line the edge + guardrail used (line-sync fix)
  if(pr&&pr.ok&&pr.line!=null){
    var kAge=(D&&D.propsAt)?Math.round((Date.now()-D.propsAt)/60000):null;
    b+='<div style="font-size:9px;margin-top:3px" class="mut">line '+pr.line+' ¬∑ '+(pr.hasHR?'<b>Hard Rock</b>':((pr.totalBooks||0)+'-book'+((pr.totalBooks||0)<3?' (thin)':'')))+(pr.lineDisagree?' ¬∑ <span style="color:var(--amb)">books disagree, spread '+pr.lineSpread+'K</span>':'')+(kAge!=null?' ¬∑ as of '+hhmm(D.propsAt)+' ('+kAge+'m ago)':'')+'</div>';
  }
  b+='</div>';
  // PROJECTION MATH
  if(pr&&pr.ok){
    b+='<div class="sect"><div class="sh">PROJECTION MATH (¬ß5)</div>'
      +'Pitcher K% (70% season / 30% recent): <b>'+kpctTxt(pr.pit_kpct)+'</b><br>'
      +'Opp '+esc(p.opp)+' K% vs '+(p.throws||'?')+'HP: <b>'+kpctTxt(pr.opp_kpct)+'</b>'+(p.oppKpct==null?' <span class="mut">(league avg ‚Äî no split)</span>':'')+'<br>'
      +(pr.oppWhiff!=null?'Lineup whiff% (contact): <b>'+pr.oppWhiff+'%</b>'+(pr.oppWhiff<=22?' (contact ‚Äî battles, fewer Ks)':pr.oppWhiff>=27?' (free-swingers ‚Äî more Ks)':'')+' ‚Üí effective opp K% <b>'+kpctTxt(pr.effOpp)+'</b><br>':'')
      +(pr.oppPPA!=null?'Opp pitches/PA seen: <b>'+pr.oppPPA+'</b>'+(pr.oppPPA>=4.0?' (grinds counts)':'')+'<br>':'')
      +'Log5 matchup K%: <b>'+kpctTxt(pr.matchup_kpct)+'</b> ‚Üí '+pr.expIP+' IP'+(pr.ppaMatch!=null?' <span class="mut">(pitch-count-capped @'+pr.ppaMatch+' P/PA)</span>':'')+' √ó '+(pr.bfPerInn||'--')+' batters/inn ‚âà '+pr.expBF+' faced, times-order K decay ‚Üí <b>Œº '+pr.mu+' Ks</b>'
      +(pr.finish!=null?'<br><span class="mut">finish (whiff) '+pr.finish.toFixed(1)+'% ‚Äî shown for context, not scored (collinear with K%)</span>':'')
      +(pr.line!=null?'<br>Poisson at '+pr.line+': P(Over) '+kpctTxt(pr.pOver)+' ¬∑ P(Under) '+kpctTxt(pr.pUnder)+(pr.divergence!=null?' ¬∑ model '+(pr.divergence>=0?'+':'')+pr.divergence+' K vs line':''):'')+'</div>';
  }
  // PITCHER DATA LAYER
  if(KL){
    b+='<div class="sect"><div class="sh">PITCHER DATA LAYER (¬ß3)</div>'
      +'Season: '+(KL.season_era!=null?KL.season_era.toFixed(2)+' ERA':'--')+' ¬∑ '+(KL.season_whip!=null?KL.season_whip.toFixed(2)+' WHIP':'--')+' ¬∑ '+(KL.season_k9!=null?KL.season_k9+' K/9':'--')+' ¬∑ '+kpctTxt(KL.season_kpct)+' K%<br>'
      +'Last-3 <span class="mut">(&lt;3 IP dropped)</span>: '+(KL.k_per_game_L3!=null?'<b>'+KL.k_per_game_L3+' K/start</b>':'n/a')+' ¬∑ '+(KL.k9_L3!=null?KL.k9_L3+' K/9':'--')+' ¬∑ '+(KL.avg_ip_L3!=null?KL.avg_ip_L3+' IP/start':'--')+' <span class="mut">('+KL.qStarts+' qualifying)</span><br>'
      +'WHIP last 7: '+(KL.whip_L7!=null?KL.whip_L7:'--')+' ¬∑ role <b>'+KL.role+'</b>'+(KL.short_leash?' (short leash)':'')+' ¬∑ '+(KL.status==='returning_from_IL'?'<b style="color:var(--amb)">returning from IL/layoff</b>':'active')
      +((KL.k9Delta!=null||KL.whipDelta!=null)?'<br><span class="mut">vs season: K/9 '+(KL.k9Delta!=null?(KL.k9Delta>0?'+':'')+KL.k9Delta:'--')+' ¬∑ WHIP '+(KL.whipDelta!=null?(KL.whipDelta>0?'+':'')+KL.whipDelta:'--')+'</span>':'')+'</div>';
    b+='<div class="sect"><div class="sh">CONFIDENCE GATE (¬ß4)</div>'
      +((KL.flags&&KL.flags.length)?KL.flags.map(function(f){return '<div style="color:var(--amb)">['+f.rule+'] '+esc(f.msg)+'</div>';}).join(''):'<span style="color:var(--grn)">‚úì no flags ‚Äî clean starter, stable recent form</span>')+'</div>';
    if(KL.kGames&&KL.kGames.length)
      b+='<div class="sect"><div class="sh">LAST '+KL.kGames.length+' APPEARANCES</div>'+KL.kGames.map(function(x){return x.date+': '+(Math.round(x.ip*10)/10)+' IP ¬∑ '+x.k+' K ¬∑ '+x.bf+' BF'+(x.ip<3?' <span style="color:var(--amb)">(short ‚Äî dropped from L3)</span>':'');}).join('<br>')+'</div>';
  }
  b+='<div style="font-size:10px;margin-top:4px" class="mut">Projection, not a lock ‚Äî confirm the line on Hard Rock before betting. Edge is a model estimate vs the de-vig market fair, same honesty rule as the hitter side.</div></div>';
  return '<div class="mcard" id="pc'+ix+'">'+head+b+'</div>';
}
function tgp(ix){var el=document.getElementById('pc'+ix);if(el)el.classList.toggle('open');}
function render(){
  if(!D)return;
  var h='';
  var A=D.hitters.filter(function(x){return x.grade==='A';});
  var conf=D.games.filter(function(g){return g.posted;}).length;
  h+='<div class="card" style="border-color:var(--gld)"><b style="color:var(--gld);font-size:13px">&#11088; TOP MATCHUPS TONIGHT ('+A.length+' A-grades)</b>';
  h+='<div style="font-size:10px;margin-top:2px" class="mut">Lineups posted: '+conf+'/'+D.games.length+' games ¬∑ ranked best-to-worst ¬∑ &#128994; top play &nbsp; &#128993; playable (read the note) &nbsp; &#128308; weak ‚Äî lean pass. A yellow/red pick shows why in plain words.</div>';
  if(A.length)A.slice(0,12).forEach(function(x){
    var lt=pickLight(x),why=pickWhy(x);
    h+='<div style="font-size:12px;margin-top:6px">'+lightDot(lt)+' <b>'+esc(x.name)+'</b> <span class="mut">('+esc(TEAM_ABBR[x.team]||x.team)+' vs '+esc(x.oppPitName||'TBD')+')</span> ‚Äî '+x.score+' pts ¬∑ '+(x.confirmed?'#'+x.spot+' conf':'proj')
      +(why?'<br><span style="font-size:10px;color:'+lightCol(lt)+'">'+why+'</span>':'')
      +(x.bestProp?'<br><span style="color:var(--gld);font-size:11px">&#127921; '+esc(x.bestProp.label)+' O'+x.bestProp.line+' '+(x.bestProp.hr>0?'+':'')+x.bestProp.hr+' on Hard Rock'+(x.bestProp.fair!=null?(x.bestProp.fair-impliedP(x.bestProp.hr)>=-0.005?' ‚úì fair':''):'')+(x.bestProp.stale?' (stale)':'')+'</span>':'<br><span style="font-size:10px;color:'+(x.propFetch==='failed'||x.propFetch==='not_covered'?'var(--amb)':'var(--mut)')+'">'+(x.propFetch==='failed'?'‚ö† server unreachable':x.propFetch==='not_covered'?'not pulled yet':'not posted yet')+'</span>')+'</div>';
  });
  else h+='<div style="font-size:11px;margin-top:5px" class="mut">No A-grades right now ‚Äî check back when lineups post.</div>';
  h+='</div>';
  // ‚îÄ‚îÄ PITCHER STRIKEOUT PROPS board (brief ¬ß5/¬ß6) ‚îÄ‚îÄ
  if(D.pitchers&&D.pitchers.length){
    var withBet=D.pitchers.filter(function(p){return p.proj&&p.proj.recommend;});
    var held=D.pitchers.filter(function(p){return p.proj&&p.proj.ok&&p.proj.line!=null&&!p.proj.recommend;}).length;
    // SLATE-LEVEL CALIBRATION GUARD ‚Äî if too many props diverge from the market, the model (not the
    // market) is probably off. Read a mostly-flagged board as "miscalibrated," not a stack of edges.
    var withLine=D.pitchers.filter(function(p){return p.proj&&p.proj.ok&&p.proj.line!=null&&p.proj.edge!=null;});
    var flaggedCt=withLine.filter(function(p){return p.proj.edge>=0.10;}).length;
    var miscal=withLine.length>=4&&(flaggedCt/withLine.length)>K_SLATE_FLAG_MAX;
    h+='<div class="card" style="border-color:'+(miscal?'var(--red)':'var(--pur)')+'"><b style="color:'+(miscal?'var(--red)':'var(--pur)')+';font-size:13px">&#9918; PITCHER STRIKEOUT PROPS ('+withBet.length+' recommended ¬∑ '+held+' held)</b>';
    if(miscal)h+='<div style="color:var(--red);font-weight:800;font-size:11px;margin-top:4px">‚ö† MODEL LIKELY MISCALIBRATED FOR THIS SLATE ‚Äî '+flaggedCt+'/'+withLine.length+' props diverge from the market. Treat all K props as low-confidence tonight; the sharp market is probably right.</div>';
    h+='<div style="font-size:10px;margin-top:2px" class="mut">Expected Ks = Log5 (pitcher K% √ó opp lineup contact) ‚Üí times-through-order decay ‚Üí Poisson, edge MARKET-ANCHORED to the de-vig fair. Guardrails hold back below-average-K arms, openers, injury/trajectory flags, oversized edges, and unconfirmed lines. Ranked by edge. Projection, not a lock.</div>';
    // rolling calibration (instrument, don't tune) ‚Äî is the model running hot/cold vs real box-score Ks?
    var kc=D.kcalib;
    if(kc&&kc.n>0){var ad=kc.sumDiff/kc.n,aa=kc.sumAbs/kc.n,fa=kc.fN?kc.fSumDiff/kc.fN:null;
      h+='<div style="font-size:10px;margin-top:5px;padding:5px 7px;border-radius:7px;background:rgba(59,130,246,.10)"><b>&#128207; K MODEL CALIBRATION</b> ‚Äî rolling '+kc.n+' settled pitcher'+(kc.n===1?'':'s')+': <b style="color:'+(Math.abs(ad)<=0.4?'var(--grn)':'var(--amb)')+'">avg projection ‚àí actual = '+(ad>=0?'+':'')+ad.toFixed(2)+' K</b> '+(ad>0.5?'(running HOT ‚Äî over-projecting)':ad<-0.5?'(running COLD ‚Äî under-projecting)':'(well-centered)')+' ¬∑ avg miss '+aa.toFixed(2)+' K'+(fa!=null?' ¬∑ flagged subset '+(fa>=0?'+':'')+fa.toFixed(2)+' K':'')+(kc.n<30?' <span class="mut">(small sample ‚Äî watch, don‚Äôt tune)</span>':'')+'</div>';}
    h+='</div>';
    D.pitchers.forEach(function(p,ix){h+=pcard(p,ix);});
  }
  // ‚îÄ‚îÄ EDGE PLAYS ‚Äî Runs / RBI / HR (where context can beat the generic market price) ‚îÄ‚îÄ
  var edgeList=D.hitters.filter(function(x){return x.edgeProp&&x.edgeProp.tilt>=0.035&&x.spot&&x.grade!=='D';}).sort(function(a,b){return b.edgeProp.tilt-a.edgeProp.tilt;}).slice(0,15);
  h+='<div class="card" style="border-color:var(--grn)"><b style="color:var(--grn);font-size:13px">&#127919; EDGE PLAYS ‚Äî Runs / RBI / HR ('+edgeList.length+')</b>';
  h+='<div style="font-size:10px;margin-top:2px" class="mut">The derivative props where context (lineup traffic, game total, park, barrel-prone arm) can beat the generic market price ‚Äî this is where we try to win. Ranked by our tilt. Our read, unproven ‚Äî the market may already price some of it, so treat as leans.</div>';
  edgeList.forEach(function(x){var bp=x.edgeProp;
    h+='<div style="font-size:12px;margin-top:6px"><b>'+esc(x.name)+'</b> <span class="mut">('+esc(TEAM_ABBR[x.team]||x.team)+' vs '+esc(x.oppPitName||'TBD')+')</span> ‚Äî <b style="color:var(--grn)">'+bp.label+' O'+bp.line+' '+(bp.hr>0?'+':'')+bp.hr+'</b> <span class="mut">'+Math.round((bp.edgeP||bp.likely)*100)+'%</span> ¬∑ <b style="color:var(--grn)">+'+(bp.tilt*100).toFixed(1)+'pp</b><br><span style="font-size:10px" class="mut">'+esc((bp.edgeWhy||[]).join(' ¬∑ '))+'</span></div>';
  });
  if(!edgeList.length)h+='<div style="font-size:11px;margin-top:5px" class="mut">No clear edge spots right now ‚Äî they show once lineups, totals, and pitchers post.</div>';
  h+='</div>';
  // ‚îÄ‚îÄ CONTACT PLAYS ‚Äî Hits / Singles / TB / HRR (safer, high-hit-rate; efficiently priced) ‚îÄ‚îÄ
  var contactList=D.hitters.filter(function(x){return x.contactProp&&x.spot&&x.grade!=='D';}).sort(function(a,b){return b.contactProp.likely-a.contactProp.likely;}).slice(0,15);
  h+='<div class="card"><b style="color:var(--blu);font-size:13px">&#128994; CONTACT PLAYS ‚Äî Hits / Singles / TB / HRR ('+contactList.length+')</b>';
  h+='<div style="font-size:10px;margin-top:2px" class="mut">The safer, high-hit-rate props ‚Äî most likely to cash, but tightly priced (slim value). Ranked by hit likelihood.</div>';
  contactList.forEach(function(x){var bp=x.contactProp;
    h+='<div style="font-size:12px;margin-top:6px"><b>'+esc(x.name)+'</b> <span class="mut">('+esc(TEAM_ABBR[x.team]||x.team)+')</span> ‚Äî <b>'+bp.label+' O'+bp.line+' '+(bp.hr>0?'+':'')+bp.hr+'</b> <span class="mut">'+Math.round(bp.likely*100)+'% likely'+(bp.value!=null?' ¬∑ '+(bp.value>=0?'+':'')+(bp.value*100).toFixed(1)+'pp':'')+'</span></div>';
  });
  h+='</div>';
  D.hitters.slice(0,120).forEach(function(x,ix){h+=mcard(x,ix);});
  if(D.hitters.length>120)h+='<div class="card mut" style="font-size:11px">'+(D.hitters.length-120)+' lower-graded cards not shown.</div>';
  document.getElementById('main').innerHTML=h;
}
function copyTop(){
  if(!D){toast('Still loading');return;}
  var A=D.hitters.filter(function(x){return x.grade==='A'||x.grade==='B';}).slice(0,15);
  var t='MATCHUP ENGINE v15 ‚Äî '+new Date().toLocaleString()+' (data '+D.generatedAt.toLocaleTimeString()+')\n';
  t+='Grade = how well the hitter is set up tonight (talent/form-vs-expected/platoon/pitcher/pitch-mix/park/slot). NOT a bet signal ‚Äî price-check before betting.\n\n';
  A.forEach(function(x){
    var lt=pickLight(x),why=pickWhy(x);
    t+=(lt==='green'?'üü¢':lt==='yellow'?'üü°':'üî¥')+' '+x.grade+' ('+x.score+') '+x.name+' ('+(TEAM_ABBR[x.team]||x.team)+') vs '+(x.oppPitName||'TBD')+(x.oppThrows?' ('+x.oppThrows+'HP)':'')+' | '+(x.confirmed?'#'+x.spot+' CONF':'PROJ')+' | '+x.confidence+'\n';
    if(why)t+='   ‚ö† '+why.replace(/<[^>]+>/g,'')+'\n';
    t+='   THE BET: '+(x.bestProp?propLine(x.bestProp):(x.propFetch==='failed'?'[server unreachable]':x.propFetch==='not_covered'?'[not pulled yet]':'[HR not posted yet]')+' ('+x.bestFit.split(' (')[0]+')')+'\n';
    var top=x.factors.slice().sort(function(a,b){return b.pts-a.pts;}).slice(0,2);
    t+='   why: '+top.map(function(f){return f.name+' +'+f.pts+' ('+f.detail.split(' ¬∑ ')[0]+')';}).join('; ')+'\n';
  });
  // pitcher strikeout props ‚Äî top edges (brief ¬ß6: combined board)
  var kb=(D.pitchers||[]).filter(function(p){return p.proj&&p.proj.recommend;}).slice(0,8);
  if(kb.length){
    t+='\n‚Äî PITCHER STRIKEOUT PROPS (recommended ¬∑ projection, not a lock; edge vs de-vig fair) ‚Äî\n';
    kb.forEach(function(p){var pr=p.proj;
      t+=p.name+' ('+(TEAM_ABBR[p.team]||p.team)+' '+p.throws+'HP) vs '+p.opp+' ‚Äî Ks '+(pr.side==='Over'?'O':'U')+pr.line+(pr.hrPrice!=null?' '+(pr.hrPrice>0?'+':'')+pr.hrPrice:'')+' | model '+pr.mu+' Ks'+(pr.edge!=null?', '+(pr.edge*100).toFixed(1)+'pp edge':'')+' ¬∑ '+pr.confidence+'\n'+(pr.marketFlag?'   ‚ö† '+pr.marketFlag+'\n':'');
    });
  }else{
    // no posted K lines yet (dead odds key / server not pulled) ‚Äî surface the top projections anyway
    var kp=(D.pitchers||[]).filter(function(p){return p.proj&&p.proj.ok&&!p.proj.suppressed&&p.proj.mu!=null;}).sort(function(a,b){return b.proj.mu-a.proj.mu;}).slice(0,5);
    if(kp.length){
      t+='\n‚Äî TOP PITCHER K PROJECTIONS (no Hard Rock line posted yet) ‚Äî\n';
      kp.forEach(function(p){var pr=p.proj;
        t+=p.name+' ('+(TEAM_ABBR[p.team]||p.team)+' '+p.throws+'HP) vs '+p.opp+' ‚Äî proj '+pr.mu+' Ks'+(pr.line!=null&&pr.holdReason?' [held: '+pr.holdReason.split(' ‚Äî')[0]+']':'')+' ¬∑ '+pr.confidence+'\n';
      });
    }
  }
  navigator.clipboard.writeText(t).then(function(){toast('Copied top matchups + K props');}).catch(function(){toast('Copy failed');});
}
