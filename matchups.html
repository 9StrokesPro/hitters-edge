<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchup Engine v15</title>
<style>
:root{--bg:#0b0e13;--sur:#131722;--bord:#232a38;--txt:#e8ecf3;--mut:#8b94a7;--grn:#22c55e;--red:#ef4444;--amb:#f59e0b;--pur:#a78bfa;--blu:#3b82f6;--gld:#eab308}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:50px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bord)}
.logo{font-size:16px;font-weight:800}
.btn{background:var(--sur);border:1px solid var(--bord);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.card{background:var(--sur);border:1px solid var(--bord);border-radius:12px;padding:12px;margin:10px 14px}
.mcard{background:var(--sur);border:1px solid var(--bord);border-radius:12px;margin:10px 14px;overflow:hidden}
.mhead{padding:10px 12px;border-bottom:1px solid var(--bord);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mbody{padding:10px 12px;display:none}
.mcard.open .mbody{display:block}
.sect{border-top:1px solid var(--bord);padding:8px 0;font-size:11px}
.sect:first-child{border-top:none}
.sh{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.5px;margin-bottom:3px}
.g{font-size:20px;font-weight:900;border-radius:8px;padding:2px 10px}
.gA{background:rgba(34,197,94,.15);color:var(--grn)}.gB{background:rgba(59,130,246,.15);color:var(--blu)}
.gC{background:rgba(245,158,11,.12);color:var(--amb)}.gD{background:rgba(239,68,68,.12);color:var(--red)}
.tag{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;display:inline-block}
.load{text-align:center;color:var(--mut);padding:30px 0}
.spnr{width:22px;height:22px;border:3px solid var(--bord);border-top-color:var(--blu);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
small,.mut{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2333;border:1px solid var(--bord);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.show{opacity:1}
.fx{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="logo">&#9918; Matchup Engine v15</div>
    <div style="font-size:9px" class="mut" id="status">Loading...</div>
    <div style="font-size:9px" class="mut" id="fresh"></div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="copyTop()">&#128203; Copy top</button>
    <button class="btn" onclick="loadAll()">&#8635; Refresh</button>
  </div>
</div>
<div id="main"><div class="load"><div class="spnr"></div>Reading the matchups...</div></div>
<div id="toast"></div>

<script>
'use strict';
/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   MATCHUP ENGINE v15 ‚Äî reads the hitter against the pitcher (per v15 spec).
   Keeps the proven v13 data layer (statsapi + Baseball Savant + weather + park),
   DELETES the fake-edge/betting model, adds pitch-mix fit + freshness gating,
   outputs a transparent matchup card + grade per hitter. Guardrails:
   - BvP is NOISE (footnote only, never moves the grade)      [spec 4.1]
   - Form weighted by EXPECTED stats + luck gap, not box AVG  [spec 4.2]
   - Price is not the product (check Edge Scanner separately) [spec 6]
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
var SEASON=2026;
var MLB='https://statsapi.mlb.com/api/v1';
var OWM_KEY='6a060c8de21d6f1a5cd9d6fed2b7a53b';
var ODDS_KEY='e738de03c4b7e835c52b50e1a0b1c494'; // ONLY for game totals context (~2 credits/load)
var K='me15_';
var BUILD='v15.033'; // NEXT #1 ‚Äî MONOTONIC build number. Bump the last segment by 1 on EVERY build handed to Joe (even a one-line fix). Header + copy export both read this.
var SHOW_LEGACY=false; // NEXT(2026-08-27) #2 ‚Äî the ONE LIST is the ONLY decision surface, on the PAGE and in the COPY EXPORT. The legacy board sections (Top Picks / Edge / Contact / K / HELD) apply the FULL ace filter while the one list uses the ME-70a-corrected version ‚Äî two surfaces disagreeing = Joe bets a stale board. Flag off, not deleted, so diagnostics recover. Target list + DATA DUMP are NOT legacy (front door + grader feed) and stay.
// ME-86 ‚Äî stake sizing from bankroll + unit, so a 15-bet night is mechanical not 15 decisions. Configurable
// in localStorage (me15_bankroll / me15_unit_pct); flat 1u per bet. setBankroll(n)/setUnit(pct) from console.
var BANKROLL=sg('bankroll',1000), UNIT_PCT=sg('unit_pct',0.01);
function unitDollars(){return Math.max(1,Math.round(BANKROLL*UNIT_PCT));}
function setBankroll(n){BANKROLL=+n;ss('bankroll',BANKROLL);if(typeof render==='function')render();}
function setUnit(p){UNIT_PCT=+p;ss('unit_pct',UNIT_PCT);if(typeof render==='function')render();}
// ME-16 ‚Äî price band, configured in ONE place. Reject anything worse than PRICE_MIN or longer than
// PRICE_MAX at GENERATION (before it reaches a board), not as a display toggle.
var PRICE_MIN=-140, PRICE_MAX=150;
function priceInBand(hr){return hr!=null&&hr>=PRICE_MIN&&hr<=PRICE_MAX;}
// ME-45 ‚Äî ACE EXCLUSION. A hitter facing a season ace (opposing starter's SEASON xBA-against ‚â§ ACE_XBA_MAX,
// with ‚â•ACE_MIN_STARTS) has ALL of his props rejected before any board ‚Äî the market knows most exactly there.
// SEASON, never L3 (recent form must never unlock an ace). HITTER props only; pitcher K props are unaffected.
var ACE_XBA_MAX=0.240, ACE_MIN_STARTS=5;
// ME-70 (2026-08-27) ‚Äî the hard exclusion was TOO WIDE: it hid the board's biggest, most credible edges (Baldwin/
// Alvarez vs Yamamoto) and was INCOHERENT (same hitter bettable on HRR, held on Runs). Now an arm is HARD-EXCLUDED
// only when ALL THREE hold ‚Äî season xBA-agst ‚â§ ACE_XBA_MAX AND projected hits in the slate's BOTTOM TERCILE AND a
// real strikeout signal (posted K prop ‚â• ACE_K_PROP_MIN, else season K% ‚â• league + ~1SD). Every other ace-ish arm
// takes a flat ACE_EDGE_PENALTY on edge across ALL markets and competes on the one list. Decision is precomputed
// per hitter in loadAll (h.aceHardExclude / h.acePenalize) since it needs the slate terciles + K props.
var ACE_EDGE_PENALTY=0.010;  // 1.0pp off edge for an ace-ish (but not hard-excluded) matchup, all markets
var ACE_K_PROP_MIN=6.5;      // posted K prop at/above this = high-K signal (the primary K test)
var ACE_KPCT_SD=0.045;       // ~1SD of MLB starter K%; fallback high-K test when no K prop is posted
function aceOut(h){return !!(h&&h.aceHardExclude);}                 // ME-70 ‚Äî hard exclusion only (all 3 conditions); computed in loadAll
function acePenalty(h){return (h&&h.acePenalize)?ACE_EDGE_PENALTY:0;} // ME-70 ‚Äî 1pp edge haircut for ace-ish-but-not-excluded
// ME-19 ‚Äî ONE probability everywhere = a blend of the player-rate model and the market fair, weight in
// ONE place. modelP is matchup-BLIND (season rate only; see ME-28), so the market half is load-bearing ‚Äî
// it is the only place matchup info (starter, park, slot) currently enters. Do NOT ship BLEND_W=1.0.
// ME-20 ‚Äî a play must clear EDGE_GATE of edge_vs_price to render in ANY recommending section.
var BLEND_W=0.5, EDGE_GATE=0.02, T_GATE=2.0; // ME-95 ‚Äî endorsement needs BOTH: edge‚â•EDGE_GATE AND t‚â•T_GATE
// ME-104 ‚Äî PER-MARKET Œª BIAS CORRECTION, applied to Œª BEFORE modelP/edge/t. A uniformly inflated Œª inflates edge AND
// t together, so the t gate was selecting HOW FAR OUR BIAS CARRIED US FROM THE MARKET and calling that confidence
// (singles cleared 6/14 rows, all 19-36% above book). k strips the measured per-market CONSTANT; the row-specific
// disagreement (the only real edge) survives. NOT "matching the book" ‚Äî Tatis stays +21% over after correction.
// Measured 2026-08-28 off /slate ‚Äî REFIT WEEKLY, do not hardcode forever. Markets absent here get k=1 (no change).
var ME104_K={batter_singles:0.888,batter_hits_runs_rbis:0.952,batter_hits:0.910,batter_total_bases:1.007,batter_runs_scored:1.008,batter_rbis:1.051};
function me104k(mkt){return (ME104_K[mkt]!=null)?ME104_K[mkt]:1;}
function modelBlend(m,f){return (m==null&&f==null)?null:m==null?f:f==null?m:BLEND_W*m+(1-BLEND_W)*f;}
function edgeVsPrice(pP,hr){var be=impliedP(hr);return (pP==null||be==null)?null:Math.round((pP-be)*1000)/1000;} // vs the price you PAY (implied, with vig) ‚Äî not the de-vig fair
// ME-22 ‚Äî ONE ruler, labelled. Rank/qualify on edge_vs_price everywhere (hitters AND Ks); show edge_vs_fair
// alongside so the two are never confused again. Returns "+5.8pp vs price ¬∑ +2.1 vs fair".
function edgePair(vp,vf){if(vp==null)return '';var s=(vp>=0?'+':'')+(vp*100).toFixed(1)+'pp vs price';if(vf!=null)s+=' ¬∑ '+(vf>=0?'+':'')+(vf*100).toFixed(1)+' vs fair';return s;}
var STALE_MIN=30;          // auto re-pull grades + prices every 30m (matches the server cron)
var PITCH_MIN_SEEN=50;     // hitter needs >=N pitches seen vs a type to trust his xSLG vs it
var CONC=10;               // statsapi concurrency

// ‚îÄ‚îÄ utils ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function sg(k,d){try{var v=localStorage.getItem(K+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));}catch(e){}}
// ME-17 ‚Äî slate date anchored to EASTERN (not UTC), so a refresh during night games doesn't jump to
// tomorrow's card (midnight UTC = 8pm ET). Before 6 AM ET we stay on the prior day's slate so late
// West-coast games settle on the right card. Computed ONCE per session (sticky) ‚Äî a plain refresh
// reuses it; it only re-derives on a full page reload.
function todayStr(){
  if(window.__SLATE)return window.__SLATE;
  var o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date()).forEach(function(p){o[p.type]=p.value;});
  var y=+o.year,m=+o.month,d=+o.day,h=+o.hour;
  if(h<6){var dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()-1);y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate();}
  window.__SLATE=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return window.__SLATE;
}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function f3(v){if(v==null)return'--';if(v<0)return'-'+f3(-v);return v>=1?v.toFixed(3):('.'+String(Math.round(v*1000)).padStart(3,'0'));}
function r3(x){return x==null?null:Math.round(x*1000)/1000;} // ME-49 ‚Äî 3-decimal lambda display, no float dust
async function apiFetch(url){try{var r=await fetch(url);if(!r.ok)throw 0;return await r.json();}catch(e){return null;}}
async function pool(items,fn,n){var i=0,out=new Array(items.length);async function w(){while(i<items.length){var ix=i++;out[ix]=await fn(items[ix],ix);}}var ws=[];for(var j=0;j<Math.min(n,items.length);j++)ws.push(w());await Promise.all(ws);return out;}
function windCardinal(deg){if(deg==null)return'';return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
// Baseball innings-pitched notation: "3.1" = 3‚Öì, "3.2" = 3‚Öî (the decimal is OUTS, not tenths).
function ipToInn(ip){var s=String(ip==null?'0':ip).split('.');var whole=parseInt(s[0])||0;var outs=s[1]?parseInt(s[1].charAt(0))||0:0;return whole+Math.min(outs,2)/3;}
// Sanity-cap an ERA to a physically-plausible scoring range (a 22 ERA is a data artifact).
function capEra(e){if(e==null||isNaN(e))return null;return Math.round(Math.max(0,Math.min(e,9))*100)/100;}
var MIN_PITCHER_IP=20;  // below this, season ERA is small-sample noise -> anchor on Statcast, not ERA
var MIN_PITCHER_G=4;    // and this many appearances
var MIN_PITCHER_STARTS=5; // ME-11 ‚Äî below this many qualifying starts, a K ranking is a small-sample artifact (Jobe on 3) ‚Üí flag ‚Üí HELD
var LG_K_PCT=0.220;     // MLB league strikeout rate (K per plate appearance) ‚Äî the Log5 baseline
var K_MKT_WEIGHT=0.5;   // K-prop edge: keep this fraction of the model's disagreement with the sharp
                        // de-vig market (the rest is model noise) ‚Äî centers the board, kills phantom edges
var K_SLATE_FLAG_MAX=0.30; // if >this share of K props still flag "vs market", warn the slate is miscalibrated
var LG_WHIFF=24.5;      // league-avg whiff% (swinging-strike rate)
var LG_BAT_WHIFF=24.5;  // league-avg BATTER whiff% ‚Äî the reachable SwStr/Contact substitute (varies ~18-32%)
var LG_PITCHES_PA=3.90; // league-avg pitches per PA (battle-to-contact baseline)
var LG_TEAM_XWOBA=0.315;// league-avg team xwOBA (offense-quality baseline)
var PITCH_CEILING=100;  // realistic starter pitch-count ceiling ‚Üí couples grind lineups to fewer innings
var BF_PER_IP=4.30;     // batters faced per inning (~3 outs + baserunners) ‚Äî for expected-BF

// ‚ïê‚ïê PITCHER DATA LAYER (brief ¬ß3) + CONFIDENCE GATE (¬ß4) ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
// From a probable's game log + season baselines, build the standard pitcher block and the
// R1‚ÄìR4 flags. K numbers are a PLAIN arithmetic mean over QUALIFYING starts (>=3.0 IP) ‚Äî never
// the multiplier shortcut that produced the old bad math ‚Äî with divide-by-zero guarded to null.
function buildKLayer(gls,season){
  var games=(gls||[]).map(function(r){var st=r.stat;return{
    date:r.date, ip:ipToInn(st.inningsPitched), k:parseInt(st.strikeOuts)||0, bf:parseInt(st.battersFaced)||0,
    h:parseInt(st.hits)||0, bb:parseInt(st.baseOnBalls)||0, er:parseInt(st.earnedRuns)||0, started:parseInt(st.gamesStarted)||0};});
  var last3=games.slice(-3);
  var qual=last3.filter(function(x){return x.ip>=3.0;});          // DROP short outings (injury exits / opener cameos)
  var sumK=0,sumIP=0,sumBF=0;qual.forEach(function(x){sumK+=x.k;sumIP+=x.ip;sumBF+=x.bf;});
  var k_per_game_L3=qual.length?Math.round(sumK/qual.length*10)/10:null;      // simple mean K per qualifying start
  var k9_L3=(qual.length&&sumIP>0)?Math.round(sumK/sumIP*9*10)/10:null;
  var avg_ip_L3=qual.length?Math.round(sumIP/qual.length*10)/10:null;         // durability / expected length
  var recent_kpct=(qual.length&&sumBF>0)?sumK/sumBF:null;
  // WHIP over last 7 appearances
  var last7=games.slice(-7),wIP=0,wBase=0;last7.forEach(function(x){wIP+=x.ip;wBase+=x.h+x.bb;});
  var whip_L7=wIP>0?Math.round(wBase/wIP*100)/100:null;
  // ROLE ‚Äî starts share + typical outing length = what the hitters actually face
  var gs=season.gs,g=season.g,avgIpAll=g>0?season.ip/g:0;
  var recentStartIp=(function(){var s2=last3.filter(function(x){return x.started;});if(!s2.length)return null;var t=0;s2.forEach(function(x){t+=x.ip;});return t/s2.length;})();
  var role,short_leash=false;
  if(gs===0)role=avgIpAll>=2.0?'bulk':'reliever';
  else if(recentStartIp!=null&&recentStartIp<3.0)role='opener';
  else if(gs>=3&&gs/Math.max(g,1)>=0.4)role='starter';
  else role=avgIpAll>=4?'starter':'bulk';
  if(role==='starter'&&avg_ip_L3!=null&&avg_ip_L3<4.5)short_leash=true;
  if(role==='opener')short_leash=true;
  // STATUS ‚Äî a long recent gap in the log = returning from IL / layoff (recent-form stats are stale)
  var status='active';
  if(games.length){
    var dts=games.slice(-6).map(function(x){return new Date(x.date).getTime();});
    var maxGap=0;for(var i=1;i<dts.length;i++){var dd=(dts[i]-dts[i-1])/864e5;if(dd>maxGap)maxGap=dd;}
    var daysSince=(Date.now()-dts[dts.length-1])/864e5;
    if(maxGap>=15||daysSince>=15)status='returning_from_IL';
  }
  // ‚îÄ‚îÄ CONFIDENCE GATE ‚îÄ‚îÄ
  var flags=[];
  // R1 ‚Äî data confidence: <2 qualifying starts OR high spread in the last-3 K count
  var kRange=0;if(qual.length>=2){var ks=qual.map(function(x){return x.k;});kRange=Math.max.apply(null,ks)-Math.min.apply(null,ks);}
  var r1=qual.length<2||kRange>=7;
  if(r1)flags.push({rule:'R1',msg:qual.length<2?('only '+qual.length+' qualifying start'+(qual.length===1?'':'s')+' in last 3 ‚Äî recent form is noise'):('high K variance last 3 ('+kRange+'-K spread) ‚Äî unstable')});
  // R2 ‚Äî role: not a starter ‚Üí hitters don't face him all night; suppress full-start K prop
  var r2=role!=='starter';
  if(r2)flags.push({rule:'R2',msg:role+' ‚Äî opposing hitters won‚Äôt face him all night; no full-start K prop'});
  // R3 ‚Äî trajectory / health: recent form diverging from the season baseline (may be stale)
  var whipDelta=(whip_L7!=null&&season.whip!=null)?Math.round((whip_L7-season.whip)*100)/100:null;
  var k9Delta=(k9_L3!=null&&season.k9!=null)?Math.round((k9_L3-season.k9)*10)/10:null;
  var r3=false,direction=null,trajMsg='';
  if((whipDelta!=null&&Math.abs(whipDelta)>=0.20)||(k9Delta!=null&&Math.abs(k9Delta)>=1.5)||status==='returning_from_IL'){
    r3=true;
    var worse=(whipDelta!=null&&whipDelta>=0.20)||(k9Delta!=null&&k9Delta<=-1.5)||status==='returning_from_IL';
    var better=(k9Delta!=null&&k9Delta>=1.5)||(whipDelta!=null&&whipDelta<=-0.20);
    direction=(worse&&!better)?'worse':(better&&!worse)?'better':((k9Delta!=null&&k9Delta<0)?'worse':'better');
    trajMsg=direction==='worse'?'recent WORSE than season (may revert / injury ‚Äî the recent line may describe a pitcher who won‚Äôt show tonight)':'recent BETTER than season (rounding into form ‚Äî may be tougher than the season line)';
    flags.push({rule:'R3',msg:trajMsg});
  }
  var confidence=r1?'LOW':(r3?'MEDIUM':'HIGH');
  // ‚îÄ‚îÄ HITS-ALLOWED (Layer 1 of the pitcher-target engine ‚Äî THE simple "is he hittable" read) ‚îÄ‚îÄ
  var starts=games.filter(function(x){return x.started;});
  var recentStarts=starts.slice(-5);
  var lastN=recentStarts.slice(-3);
  var hitsL3=lastN.reduce(function(a,x){return a+x.h;},0);
  var hitsL5=recentStarts.reduce(function(a,x){return a+x.h;},0);
  var hitsArr=recentStarts.map(function(x){return x.h;});
  var hitsPerStart=lastN.length?Math.round(hitsL3/lastN.length*10)/10:null;
  var seasonHitsPerStart=starts.length?Math.round(starts.reduce(function(a,x){return a+x.h;},0)/starts.length*10)/10:null;
  var hitsTrend='flat';

// market wins ‚Üí a HR hitter surfaces HR, a doubles bat surfaces doubles, a slap hitter surfaces singles.

      tilt:tilt,edgeP:edgeP!=null?Math.round(edgeP*1000)/1000:null,edgeWhy:ct.why,edgeTags:ct.tags,edgePrimary:ct.primary,score:score};

// ‚ïê‚ïê PROP LADDER ‚Äî the picker's decision menu. Every prop with model prob + price, ranked by the
// SOUNDEST play (probability-for-price), not the flashiest. HR is a labeled DART, never the headline.
// Rules: (a) HRR ranks ABOVE TB (more paths to cash ‚Äî hit/run/RBI each count vs needing bases);
// (b) SINGLES matched to profile ‚Äî good value for slap hitters (hits are mostly singles, better price),
// a TRAP for power bats (throws away extra-base hits); (c) HR never primary. ‚ïê‚ïê

// windows agree (7 games alone is noise). HOT/COLD need L7 and L10 each ‚â•15% off season; disagreeing = MIXED.
function formRead(h,mkt){

  var streak=(g7<=-TH&&g10<=-TH)?'COLD':(g7>=TH&&g10>=TH)?'HOT':'mixed';

    finish:P.finish,battleFactor:Math.round(battleFactor*1000)/1000,oppWhiff:(oppSplit&&oppSplit.whiff)||null,effOpp:Math.round(effOpp*1000)/1000,ppaMatch:ppaMatch?Math.round(ppaMatch*100)/100:null,oppPPA:(oppSplit&&oppSplit.pPA)||null,
    suppressed:L.r2||L.qStarts<1,flagged:L.r3,confidence:L.confidence,
    trajectory_direction:L.trajectory_direction,recommend:false,holdReason:'no posted line'};
  if(kprop&&kprop.line!=null){

    out.hasHR=!!kprop.hasHR;out.totalBooks=kprop.totalBooks||0;out.lineSpread=kprop.lineSpread;out.lineDisagree=!!kprop.lineDisagree;
    // ME-93 ‚Äî THE SIDE FOLLOWS THE PROJECTION vs THE LINE. proj (Œº) > line ‚Üí OVER, Œº < line ‚Üí UNDER. Full stop.
    // (Was: side = sign(modelP ‚àí market_fair), which inverts whenever the market's implied projection differs from
    //  ours ‚Äî Hughes Œº 5.67 > line 5.5 = OVER, but the market priced the over higher, so the old rule printed UNDER.)

    if(kprop.fair!=null){                                               // 7. edge vs de-vig fair ‚Äî MARKET-ANCHORED

      // Poisson over-states its own confidence at low K lines. Keep only K_MKT_WEIGHT of the model's
      // disagreement so edges are honest and the board centers on the market. Œº stays raw (below).

    }

    out.edgePrice=(out.modelP!=null&&out.hrPrice!=null)?Math.round((out.modelP-impliedP(out.hrPrice))*1000)/1000:null; // ME-22 ‚Äî same ruler as hitters (our prob ‚àí price you pay)
    // ME-59 ‚Äî SE + t on the K edge. The anchored prob moves K_MKT_WEIGHT¬∑pmf per unit Œº, so SE(edge)=K_MKT_WEIGHT¬∑pmf¬∑SE(Œº);
    // SE(Œº)=per-start K SD/‚àön (assumption-free ‚Äî Ks are under-dispersed, ‚àö(Œº/G) overstates), fallback ‚àö(Œº/n) flagged.
    if(out.edgePrice!=null&&mu!=null&&kprop.line!=null){

      if(L.kSD!=null&&kN>=2){seMu=L.kSD/Math.sqrt(kN);}else{seMu=Math.sqrt(mu/Math.max(kN||1,1));ap=true;}
      var seModel=K_MKT_WEIGHT*poissonPMF(Math.floor(kprop.line),mu)*seMu;
      out.seEdge=Math.round(seModel*10000)/10000;out.tStat=(seModel>0)?Math.round(out.edgePrice/seModel*100)/100:null;out.seApprox=ap;
    }
    out.divergence=Math.round((mu-kprop.line)*10)/10;                    // + = model above the CURRENT line
    // ‚îÄ‚îÄ LINE RELIABILITY (line-sync fix) ‚îÄ‚îÄ
    // The edge AND the guardrail read the SAME reconciled line (server: Hard Rock's line, else the
    // modal line ‚Äî never a lone outlier). Only trust that line if HR posted it OR ‚â•3 books agree.
    // An unreliable/thin line, or wide cross-book disagreement, can't be allowed to fire a NO PLAY.
    var reliableLine=out.hasHR||(out.nBooks||0)>=3;
    var flags=[];
    if(!reliableLine)flags.push('line not confirmed ('+(out.hasHR?'':'no Hard Rock line; ')+out.totalBooks+' book'+(out.totalBooks===1?'':'s')+') ‚Äî verify');
    if(out.lineDisagree)flags.push('books disagree on the line (spread '+out.lineSpread+' K) ‚Äî verify');
    // ‚îÄ‚îÄ DIVERGENCE ‚Üí CONFIDENCE (symmetric): oversized edge = likely model/line error, not value ‚îÄ‚îÄ
    if(out.edge!=null&&out.edge>=0.10)flags.push('model runs '+(out.side==='Over'?'HOT':'COLD')+' vs market ('+(out.edge*100).toFixed(0)+'pp) ‚Äî verify');
    if(L.seasonStarts!=null&&L.seasonStarts<MIN_PITCHER_STARTS)flags.push('thin sample ‚Äî '+L.seasonStarts+' start'+(L.seasonStarts===1?'':'s')+' this season (need '+MIN_PITCHER_STARTS+') ‚Äî ranking is a small-sample artifact'); // ME-11
    out.marketFlag=flags.length?flags.join(' ¬∑ '):null;
    if(flags.length)out.confidence='LOW';
    // ‚îÄ‚îÄ recommendation gates ‚îÄ‚îÄ
    out.recommend=true;out.holdReason=null;
    if(out.suppressed){out.recommend=false;out.holdReason='not a full-game starter ‚Äî no full-start K line';}
    else if(out.side==='Over'&&lowK){out.recommend=false;out.holdReason='below-average strikeout arm (K% '+(pit_kpct*100).toFixed(1)+'<'+(LG_K_PCT*100).toFixed(0)+' lg) ‚Äî the model won‚Äôt chase an over here';}
    else if(out.side==='Over'&&out.divergence>=1.5&&reliableLine){out.recommend=false;out.holdReason='model runs '+out.divergence.toFixed(1)+' K hot vs the line ‚Äî too far above market to trust (this profile lost on 8/21)';}
    else if(out.flagged){out.recommend=false;out.holdReason='recent-form flag ‚Äî low confidence, no auto-bet';}
    else if(out.edgePrice!=null&&out.edgePrice<EDGE_GATE){out.recommend=false;out.holdReason='edge '+(out.edgePrice*100).toFixed(1)+'pp vs the price you pay ‚Äî inside the noise, not worth a play';} // ME-22 ‚Äî qualify on edge_vs_price, same ruler as hitters
    else if(out.hrPrice!=null&&!priceInBand(out.hrPrice)){out.recommend=false;out.holdReason='price '+(out.hrPrice>0?'+':'')+out.hrPrice+' outside the '+PRICE_MIN+'..+'+PRICE_MAX+' band';} // ME-16
  }
  return out;
}

// ‚ïê‚ïê PITCHER TARGETING ‚Äî "Is he hittable?" ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
// Layer 1 (recent HITS allowed) is the headline & the sort. Layer 2 (Statcast xBA/xSLG/hard-hit/
// barrel/exit-velo against) confirms whether the hittability is REAL ‚Äî downgrades a soft-contact
// MIRAGE, surfaces a barreled-but-unlucky DUE arm. Layer 3 (whiff/K trend, recent-vs-season "line
// lags", handedness weakness) sharpens and says who to aim. Metrics refine, never hide, the hits.
function buildTarget(P,ps){
  var KL=P&&P.kLayer;if(!KL||P.isPitcher===false)return null;
  var hitsPS=KL.hitsPerStart,arr=KL.hitsArr||[],trend=KL.hitsTrend,seasonHPS=KL.seasonHitsPerStart;
  if(hitsPS==null)return null;
  var xba=ps?ps.xba:null,xslg=ps?ps.xslg:null,hh=ps?ps.hard_hit_percent:null,br=ps?ps.barrel_batted_rate:null,ev=ps?ps.exit_velocity_avg:null;
  var hardContact=(hh!=null&&hh>=42)||(xba!=null&&xba>=0.260)||(br!=null&&br>=8.5);
  var softContact=(hh!=null&&hh<36)&&(xba==null||xba<=0.235);
  var lineLags=(KL.whipDelta!=null&&KL.whipDelta>=0.15)||(seasonHPS!=null&&hitsPS>=seasonHPS+1.5);
  var whiffDrop=KL.k9Delta!=null&&KL.k9Delta<=-1.0;
  var hw=null,hwGap=0;
  if(P.handSplit&&P.handSplit.vL&&P.handSplit.vR){var d=P.handSplit.vL.ops-P.handSplit.vR.ops;hwGap=Math.round(Math.abs(d)*1000)/1000;hw=d>=0.030?'LHB':d<=-0.030?'RHB':'even';}
  // ME-52 ‚Äî HITS ALLOWED = EXPECTED INNINGS √ó HITS PER INNING. The old projHits blended hits-per-START, which
  // bakes in a fixed start length and cannot tell Sale (9 IP, cleared O4.5 on the LOWEST contact rate) from Cabrera
  // (4.1 IP, missed O4.5). 8/27 innings ran 4.33‚Äì9.00. So: project innings from durability CAPPED BY A PITCH BUDGET
  // (~95 pitches), never an assumed 5.5, and multiply by the per-inning hit rate. projIP and hitsRate are stored
  // separately so the gap is diagnosable (ME-87) and each half can be graded on its own.
  var PITCH_BUDGET=95;
  var durIP=(KL.avg_ip_L3!=null)?KL.avg_ip_L3:(P.gs>0?Math.min(P.ip/Math.max(P.gs,1),6):5.0); // recent durability = best pre-game IP proxy
  var ppi=(P.pitchesPerPA!=null?P.pitchesPerPA:3.9)*4.25;                                       // pitches/inning ‚âà pitches/PA √ó ~4.25 PA per inning
  var budgetIP=ppi>0?PITCH_BUDGET/ppi:durIP;                                                    // how many innings ~95 pitches buys at his efficiency
  var shortLeash=(KL.avg_ip_L3!=null&&KL.avg_ip_L3<4.5);                                        // same rule buildKLayer uses for starters
  var projIP=Math.max(3.5,Math.min(durIP,budgetIP,7.5));if(shortLeash)projIP=Math.min(projIP,5.0);
  projIP=Math.round(projIP*100)/100;
  var rateL3=(KL.avg_ip_L3>0&&hitsPS!=null)?hitsPS/KL.avg_ip_L3:null;                           // recent H/inning = (H/start)/(IP/start)
  var seasonIpPerStart=(KL.seasonStarts>0&&P.ip>0)?P.ip/KL.seasonStarts:null;                   // ‚âà season IP per start (P.ip starter-dominated)
  var rateSeason=(seasonIpPerStart>0&&seasonHPS!=null)?seasonHPS/seasonIpPerStart:null;
  var hitsRate=(rateL3!=null&&rateSeason!=null)?(0.6*rateL3+0.4*rateSeason):(rateL3!=null?rateL3:(rateSeason!=null?rateSeason:1.05)); // league ‚âà 1.05 H/IP fallback
  hitsRate=Math.round(hitsRate*1000)/1000;
  var projHits=Math.round(projIP*hitsRate*100)/100;

  return{name:P.name,throws:P.throws,reliable:P.reliable,hitsPS:hitsPS,hitsL3:KL.hitsL3,arr:arr,trend:trend,seasonHPS:seasonHPS,nStarts:KL.nStarts,
    projHits:projHits,projIP:projIP,hitsRate:hitsRate,cls:'NEUTRAL',seasonStarts:(KL&&KL.seasonStarts),hardContact:hardContact,softContact:softContact,xba:xba,xslg:xslg,hh:hh,br:br,ev:ev,
    lineLags:lineLags,whiffDrop:whiffDrop,k9Delta:KL.k9Delta,whipDelta:KL.whipDelta,hw:hw,hwGap:hwGap,handSplit:P.handSplit,sortKey:sortKey};
}
// ‚îÄ‚îÄ PITCH-MIX FIT (spec 3.6 ‚Äî wired) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
// Weighted hitter xSLG across the pitcher's arsenal (usage-weighted, only pitch
// types where the hitter has seen >= PITCH_MIN_SEEN pitches). Returns null if
// insufficient data ‚Äî the card says so honestly instead of guessing.
function pitchMixFit(batterId,arsenal,bps){
  if(!arsenal||!arsenal.length||!bps)return null;
  var wSum=0,wTot=0,lines=[],covered=0;
  arsenal.forEach(function(a){
    if(a.pct<10)return; // ignore rarely-thrown pitches
    var row=bps[batterId+'|'+a.code];
    if(!row||row.pitches==null||row.pitches<PITCH_MIN_SEEN||row.est_slg==null){lines.push({pitch:a.name,pct:a.pct,xslg:null});return;}
    wSum+=a.pct*row.est_slg;wTot+=a.pct;covered+=a.pct;
    lines.push({pitch:a.name,pct:a.pct,xslg:row.est_slg,rv:row.run_value_per_100});
  });
  if(wTot<30)return{fit:null,lines:lines,note:'insufficient pitch-level data for this hitter'};
  return{fit:Math.round(wSum/wTot*1000)/1000,coveredPct:Math.round(covered),lines:lines};
}

// ‚îÄ‚îÄ THE MATCHUP GRADE (spec 4) ‚Äî transparent, every factor on the card ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
function gradeMatchup(h){
  var F=[]; // {name, pts, detail}
  function add(name,pts,detail){F.push({name:name,pts:Math.round(pts*10)/10,detail:detail});}
  // 1. Talent ‚Äî EXPECTED stats anchor (spec 4.2)
  var xw=h.bSav&&h.bSav.xwoba!=null?h.bSav.xwoba:null;
  var t=0,td='';
  if(xw!=null){t=xw>=0.400?20:xw>=0.370?16:xw>=0.340?12:xw>=0.320?8:xw>=0.300?4:0;td='xwOBA '+f3(xw)+(xw>=0.400?' (elite)':xw>=0.340?' (strong)':xw>=0.300?' (average)':' (below avg)');}
  else{var ops=h.b.obp+h.b.slg;t=ops>=0.900?16:ops>=0.820?12:ops>=0.750?8:ops>=0.700?4:0;td='OPS '+f3(ops)+' (no Statcast ‚Äî season proxy)';}
  add('Hitter talent',t,td);
  // 2. Form QUALITY ‚Äî hot/cold + luck gap (spec 4.2: expected > results)
  var form=0,fd=h.b.hotCold;
  form+=h.b.hotCold==='HOT'?6:h.b.hotCold==='Warming'?3:h.b.hotCold==='COLD'?-6:h.b.hotCold==='Cooling'?-3:0;
  if(h.lg){
    if(h.lg.sum>=0.060){form+=6;fd+=' + under-rewarded (luck gap +'+f3(h.lg.sum)+') ‚Äî earned, room to run';}
    else if(h.lg.sum>=0.025){form+=3;fd+=' + slightly under-rewarded (+'+f3(h.lg.sum)+')';}
    else if(h.lg.sum<=-0.060){form-=6;fd+=' but OVER-performing expected ('+f3(h.lg.sum)+') ‚Äî regression-down risk';}
    else if(h.lg.sum<=-0.025){form-=3;fd+=' but running a bit hot vs expected ('+f3(h.lg.sum)+')';}
    else fd+=' (results match expected ‚Äî real)';
  }
  add('Form (vs expected)',form,fd+' ¬∑ L10 '+f3(h.b.roll10avg)+'/'+f3(h.b.roll10slg));
  // 3. Platoon
  if(h.pm)add('Platoon',h.pm.adj,h.pm.side+' vs '+(h.oppThrows||'?')+'HP (OPS diff '+(h.pm.diff>0?'+':'')+f3(Math.abs(h.pm.diff))+')');
  else add('Platoon',0,'insufficient split sample');
  // 4. Pitcher vulnerability ‚Äî STATCAST-ANCHORED (quality of contact / bat-missing are the
  //    primary signal; they stabilize far faster than ERA). Season ERA is a SECONDARY,
  //    sanity-capped input, and last-3 ERA only a minor recent-form nudge. A pitcher with a
  //    tiny sample (e.g. 1 start off the IL) contributes NOTHING from ERA ‚Äî it's noise.
  var P=h.pit,pv=0,pvd=[];
  if(!P||P.isPitcher===false){ add('Pitcher vulnerability',0,'no reliable pitcher data'); }
  else if(!P.reliable){
    // SMALL SAMPLE = UNKNOWN. Both ERA and Statcast are noise off a couple innings ‚Äî score
    // NEUTRAL (don't inflate OR punish), and let the hitter's own profile drive the grade.
    add('Pitcher vulnerability',0,'UNKNOWN ‚Äî only '+(P.ip||0)+' IP / '+(P.gs||0)+' GS this season; too small to read (both ERA and Statcast are noise). Grade is hitter-driven.');
  }else{
    var ps=h.pSav;
    // -- PRIMARY: Statcast quality-of-contact allowed (reliable sample only) --
    if(ps){
      if(ps.xslg!=null){pv+=ps.xslg>=0.480?7:ps.xslg>=0.430?4:ps.xslg>=0.390?1:ps.xslg>=0.340?-2:-5;pvd.push('xSLG-against '+f3(ps.xslg)+(ps.xslg>=0.430?' (gets squared up)':ps.xslg<=0.340?' (limits damage)':''));}
      if(ps.hard_hit_percent!=null){pv+=ps.hard_hit_percent>44?4:ps.hard_hit_percent>40?2:ps.hard_hit_percent<32?-3:0;pvd.push('HardHit '+ps.hard_hit_percent+'%');}
      if(ps.barrel_batted_rate!=null){pv+=ps.barrel_batted_rate>9?3:ps.barrel_batted_rate>7?1:ps.barrel_batted_rate<5?-2:0;pvd.push('Barrel '+ps.barrel_batted_rate+'%');}
      // NOTE: whiff/K (contact-PREVENTION) moved OUT of this damage factor into its own
      // 'Pitcher K-suppression' factor below ‚Äî two distinct axes, no double-count (advisor's fix).
      if(ps.bb_percent!=null&&ps.bb_percent>10){pv+=2;pvd.push('walks people (BB% '+ps.bb_percent+')');}
    }else pvd.push('no Statcast row');
    // -- SECONDARY: season ERA, sanity-capped --
    if(P.era!=null){pv+=P.era>=5.0?4:P.era>=4.3?2:P.era>=3.7?0:P.era>=3.0?-2:-4;pvd.push('ERA '+P.era.toFixed(2)+' ('+P.ip+' IP)');}
    // -- MINOR: last-3 recent form, capped, only if L3 has real innings --
    if(P.l3&&P.l3.reliable&&P.l3.era!=null){
      if(P.l3.era>=6){pv+=1.5;pvd.push('last-3 rough ('+P.l3.era.toFixed(2)+' over '+P.l3.inn+' IP)');}
      else if(P.l3.era<=2.5){pv-=1.5;pvd.push('last-3 sharp ('+P.l3.era.toFixed(2)+')');}
    }
    if(h.vuln){pvd.push(h.vuln.label);
      if(h.vuln.key==='TYPE4'){pv-=5;}
      else if((h.vuln.key==='TYPE1'&&h.bt&&h.bt.key==='POWER')||(h.vuln.key==='TYPE2'&&h.bt&&h.bt.key==='CONTACT')){pv+=3;pvd.push('PERFECT bat-type match');}
    }
    // ‚îÄ‚îÄ R4: CONFIRM / CONFLICT cross-check (brief FIX 1) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
    // Compare the INDEPENDENT pitcher recent-form (whip_L7 & k9_L3 trajectory) against the
    // engine's own vulnerability read (sign of pv). DIRECTIONAL, not a blind shrink:
    //   ‚Ä¢ agree  ‚Üí CONFIRM: push the factor further in the agreed direction, hold confidence
    //   ‚Ä¢ disagree ‚Üí CONFLICT: the season read may be stale ‚Üí pull toward neutral + cut confidence
    // This fixes the bug where "rounding into form" (a pitcher getting TOUGHER) was softening the
    // hitter's penalty instead of hardening it.
    var KL=P.kLayer;
    if(KL){
      var trend=0;                                        // +1 = trending TOUGHER, -1 = more HITTABLE
      if(KL.k9Delta!=null)trend+=KL.k9Delta>=1.0?1:KL.k9Delta<=-1.0?-1:0;
      if(KL.whipDelta!=null)trend+=KL.whipDelta<=-0.15?1:KL.whipDelta>=0.15?-1:0;
      var engineHittable=pv>0.5?1:pv<-0.5?-1:0;           // engine: +1 sees him hittable, -1 sees him tough
      var recentHittable=trend>0?-1:trend<0?1:0;          // tougher trend => LESS hittable
      if(trend!==0&&engineHittable!==0){
        if(recentHittable===engineHittable){              // AGREE ‚Üí confirm & strengthen
          h._pitchTag='CONFIRM';
          pv=pv+(pv>0?1.5:-1.5);
          pvd.push('CONFIRM ‚úì recent form '+(trend>0?'trending tougher':'more hittable')+' ‚Äî agrees with the read');
        }else{                                            // DISAGREE ‚Üí conflict, widen uncertainty
          h._pitchTag='CONFLICT';h._pitchConfDown=true;
          pv=Math.round(pv*0.45*10)/10;
          pvd.push('CONFLICT ‚ö† recent form '+(trend>0?'trending TOUGHER':'more HITTABLE')+' vs the season read ‚Äî softened, confidence cut');
        }
      }
      if(KL.status==='returning_from_IL'){h._pitchTag=h._pitchTag||'CONFLICT';h._pitchConfDown=true;pvd.push('‚ö† back from IL/layoff ‚Äî recent form unreliable');}
      if(KL.r2){                                          // ROLE suppression: opener/reliever/bulk
        pv=Math.round(pv*0.5*10)/10;h._pitchConfDown=true;
        pvd.push('‚ö† '+KL.role+' ‚Äî hitters face him ~1-2 PAs (rest is the bullpen); read + PA assumption cut');
      }
    }
    pv=Math.max(-12,Math.min(15,pv));
    add('Pitcher vulnerability',pv,pvd.join(' ¬∑ '));
    // ‚îÄ‚îÄ 4b. PITCHER K-SUPPRESSION (advisor's integration fix) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
    // A SECOND, distinct pitcher axis: contact-PREVENTION (strikeout rate), separate from the
    // damage-on-contact factor above. Uses the SAME blended K% the K-prop board outputs (single
    // source ‚Äî the two boards can't drift). High-K arm suppresses contact ‚Üí lowers the hitter;
    // contact pitcher ‚Üí raises him. Weighted HEAVIER for contact bats (their value is Hits/H+R+RBI)
    // and LIGHTER for power bats (Total Bases is less K-sensitive).
    var okpct=P.kLayer&&P.kLayer.blended_kpct;
    if(okpct!=null){
      var dev=okpct-LG_K_PCT;                                // + = more Ks than league
      var w=(h.bt&&h.bt.key==='CONTACT')?1.3:(h.bt&&h.bt.key==='POWER')?0.6:1.0;
      var ksup=Math.max(-8,Math.min(6,Math.round(-dev*70*w*10)/10));
      add('Pitcher K-suppression',ksup,'opp K% '+(okpct*100).toFixed(1)+'% ('+(dev>=0?'+':'')+(dev*100).toFixed(1)+' vs lg) ‚Äî '+(dev>0.02?'misses bats, suppresses contact props':dev<-0.02?'contact pitcher, lets hitters put it in play':'league-average K rate')+' ¬∑ weighted for '+(h.bt?h.bt.label.toLowerCase():'balanced bat'));
    }

// Best-fit stat (spec 4): profile -> which stat to back

    var payload={date:todayStr(),build:BUILD,at:Date.now(),blend_w:BLEND_W,gate:EDGE_GATE,unified:unified,targets:targets,rows:rows};
    fetch(SERVER_URL.replace(/\/$/,'')+'/slate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json();}).then(function(j){try{console.log('[ME-96 slate-save] '+(j&&j.ok?('‚úì stored '+j.stored+' ‚Äî '+j.rows+' rows'+(j.kept?' ('+j.kept+')':'')):'no-save '+JSON.stringify(j)));}catch(e){}})
      .catch(function(e){try{console.log('[ME-96 slate-save] worker unreachable ‚Äî slate NOT saved this load: '+e);}catch(_){}});
  }catch(e){try{console.log('[ME-96 slate-save] error: '+e);}catch(_){}}

// ME-32 ‚Äî the dot is DATA-CONFIDENCE, not a bet/no-bet verdict. Value lives in the edge number; a colour

      if(KL.status==='returning_from_IL')return pn+' just came off the injured list ‚Äî his recent numbers aren‚Äôt trustworthy yet, so the grade is shakier than it looks.';
      if(KL.trajectory_direction==='better')return pn+' has been SHARPER lately than his season stats ‚Äî he may be tougher tonight than the grade assumes.';
      if(KL.trajectory_direction==='worse')return pn+'‚Äôs season line looks fine, but he‚Äôs been getting hit lately ‚Äî could go either way, so treat it as lower confidence.';

  var priceTxt=pr.hrPrice!=null?((pr.hrPrice>0?'+':'')+pr.hrPrice):'';

  if(pr.edge!=null)s+=' ‚Äî model '+pr.mu+' Ks ('+kpctTxt(pr.modelP)+' vs '+kpctTxt(pr.fairP)+' fair) ¬∑ '+(pr.edgePrice!=null?edgePair(pr.edgePrice,pr.edgeFair):(pr.edge*100).toFixed(1)+'pp vs fair');
  else s+=' ‚Äî model '+pr.mu+' Ks ('+kpctTxt(pr.modelP)+' ‚Äî no de-vig fair, '+(pr.nBooks||0)+' books)';
  return s;

function boardData(){
  if(!D)return{edge:[],contact:[],pitcher:[],top:[],held:[],dropped:{edge:0,contact:0,top:0}};
  // ME-20 ‚Äî GATE every recommending section on edge_vs_price. ME-32 ‚Äî a play the system WON'T ENDORSE
  // (red dot = thin/conflicting inputs) is not a pick either: it moves to HELD with its reason, never
  // rendering as a positive-edge pick under a do-not-bet dot.
  // ME-36 ‚Äî tilt is now load-bearing but UNMEASURED. A play must clear the gate AND at least break even
  // WITHOUT tilt (edgeNoTilt‚â•0), so a maxed tilt can't qualify a play the model+market call ‚àíEV on their own.
  // Relax this once edge_tilt_only reads positive over 50‚Äì100 graded plays.
  function passes(bp){return bp&&bp.edgeBlend!=null&&bp.edgeBlend>=EDGE_GATE&&(bp.edgeNoTilt==null||bp.edgeNoTilt>=0);}
  function endorsed(h){return pickLight(h)!=='red';}                               // ME-32 ‚Äî red = inputs we won't stand behind
  var held=[];
  function holdHit(h,bp){held.push({kind:'HIT',name:h.name,sub:(TEAM_ABBR[h.team]||h.team)+' vs '+(h.oppPitName||'TBD'),mkt:bp.label,edge:bp.edgeBlend,reason:pickWhy(h)||'thin or conflicting data'});}
  // ME-45 ‚Äî ace exclusion is a HARD filter at the pool: an ace-opposed hitter reaches no BOARD section.
  // ME-50 ‚Äî but it MUST stay in HELD (with reason ACE_OPPONENT, price, and market) ‚Äî HELD is the control
  // group ME-15 needs to prove the picks beat the pool, and ace matchups are exactly the comparison we want.
  var aceRem={};D.hitters.forEach(function(x){if(x.spot&&x.grade!=='D'&&aceOut(x)){var p=x.oppPitName||'?';aceRem[p]=(aceRem[p]||0)+1;var bp=x.bestProp;if(bp&&bp.line!=null)held.push({kind:'HIT',name:x.name,sub:(TEAM_ABBR[x.team]||x.team)+' vs '+(x.oppPitName||'TBD'),mkt:bp.label+' O'+bp.line+' '+(bp.hr>0?'+':'')+bp.hr,edge:bp.edgeBlend,reason:'ACE_OPPONENT ‚Äî opp season xBA-agst '+f3(x.pSav&&x.pSav.xba)});}});
  try{var at=Object.keys(aceRem);console.log('[ME-45 ace filter xBA‚â§'+ACE_XBA_MAX+'] removed '+at.reduce(function(a,p){return a+aceRem[p];},0)+' hitter'+(at.length?': '+at.map(function(p){return p+' √ó'+aceRem[p];}).join(', '):'s')+' ‚Äî kept in HELD as control (ME-50)');}catch(e){}
  var edgePool=D.hitters.filter(function(x){return x.edgeProp&&x.spot&&x.grade!=='D'&&!aceOut(x)&&passes(x.edgeProp);});
  var contactPool=D.hitters.filter(function(x){return x.contactProp&&x.spot&&x.grade!=='D'&&!aceOut(x)&&passes(x.contactProp);});
  var topPool=D.hitters.filter(function(x){return x.bestProp&&x.spot&&x.grade!=='D'&&!aceOut(x)&&passes(x.bestProp);}); // ME-45 ace + ME-32 keep LOW for HELD routing
  var edge=edgePool.filter(endorsed).sort(function(a,b){return b.edgeProp.edgeBlend-a.edgeProp.edgeBlend;});
  var contact=contactPool.filter(endorsed).sort(function(a,b){return b.contactProp.edgeBlend-a.contactProp.edgeBlend;});
  var pitcher=(D.pitchers||[]).filter(function(p){return p.proj&&p.proj.ok&&p.proj.recommend&&!p.proj.marketFlag&&p.proj.confidence!=='LOW';}).sort(function(a,b){return (b.proj.edgePrice||0)-(a.proj.edgePrice||0);}); // ME-22/32
  var heldK=(D.pitchers||[]).filter(function(p){return p.proj&&p.proj.ok&&p.proj.recommend&&(p.proj.marketFlag||p.proj.confidence==='LOW');});
  var dropped={edge:edgePool.length-edge.length,contact:contactPool.length-contact.length,top:0};
  var top=[];
  // TOP PICKS rank by HITTABLE-PITCHER √ó PROBABILITY. Sound contact props in soft-arm spots lead; Runs is
  // downgraded. Endorsed only ‚Äî held plays live in their own section below, not demoted-but-shown here.
  function hittability(h){var KL=h.pit&&h.pit.kLayer,b=0;if(!KL||KL.hitsPerStart==null)return 0;if(KL.hitsPerStart>=7)b+=0.06;else if(KL.hitsPerStart>=6)b+=0.03;if(h.pSav&&h.pSav.xslg!=null&&h.pSav.xslg>=0.44)b+=0.03;if(KL.hitsTrend==='worsening')b+=0.02;return b;}
  function propWt(mkt){return mkt==='batter_hits'?0.05:mkt==='batter_hits_runs_rbis'?0.045:mkt==='batter_total_bases'?0.03:mkt==='batter_singles'?0.03:mkt==='batter_runs_scored'?-0.05:0;} // lead Hits/TB/HRR, downgrade Runs
  function hitReason(h){var KL=h.pit&&h.pit.kLayer,p=[];if(KL&&KL.hitsPerStart!=null)p.push(KL.hitsPerStart+' H/start arm');if(h.pSav&&h.pSav.xslg!=null&&h.pSav.xslg>=0.44)p.push('gets squared up');if(h.b&&(h.b.hotCold==='HOT'||h.b.hotCold==='Warming'))p.push(h.b.hotCold.toLowerCase());if(h.lg&&h.lg.sum>=0.03)p.push('under-rewarded');return p.join(' ¬∑ ')||'solid matchup';}
  topPool.forEach(function(h){if(!endorsed(h))holdHit(h,h.bestProp);});           // ME-32 ‚Äî won't-endorse ‚Üí HELD
  var topHit=topPool.filter(endorsed);
  dropped.top=topPool.length-topHit.length;

  var t='MATCHUP ENGINE '+BUILD+' ‚Äî '+new Date().toLocaleString()+' (data '+D.generatedAt.toLocaleTimeString()+')\n';
  // ‚îÄ‚îÄ üìã ONE LIST ‚Äî THE PRIMARY SURFACE (NEXT #1). Every eligible row, edge-sorted, held inline with reason.
  //    This is the decision list Joe/analyst/grader all read. Legacy board sections are gated off below (SHOW_LEGACY).
  var UL=unifiedList(),ULbet=UL.filter(function(r){return !r.held;}).length;
  var TOP=UL.slice().filter(function(r){return r.ev!=null;}).sort(function(a,b){return b.ev-a.ev;}).slice(0,20);
  var _allClear=UL.filter(function(r){return !r.held;}).every(function(r){return r.t!=null&&r.t>=T_GATE;}),_demoted=UL.filter(function(r){return r.tGated;}).length;
  t+='\n‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê üèÜ TOP 20 by EV ‚Äî both sides, all markets ('+UL.length+' evaluated) ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê\n';
  t+='[ME-95] bettable (clear t‚â•'+T_GATE.toFixed(1)+'+edge gate): '+ULbet+'  ¬∑  demoted by t gate: '+_demoted+'  ¬∑  gate flags are INFO, not a filter\n';
  t+='‚ö† EV uses our modelP (under-ranked winners on the one graded slate) ‚Äî trust agreement+price rows over big-disagreement rows ¬∑ $'+u+'/unit\n';
  t+='#|player|team|opp_starter|market|line|side|price|EV|modelP|breakeven|EDGE_VS_PRICE|t|width|flag\n';
  TOP.forEach(function(r,i){
    var be=r.price!=null?Math.round(impliedP(r.price)*1000)/10:null;
    var flag=r.held?r.held:(r.released?r.released:'BET');
    t+=(i+1)+'|'+r.player+'|'+(r.team||'')+'|'+(r.oppStarter||'')+'|'+r.mkt+'|'+r.line+'|'+r.side+'|'+(r.price>0?'+':'')+r.price
      +'|'+(r.ev>=0?'+':'')+r.ev.toFixed(3)
      +'|'+(r.prob!=null?Math.round(r.prob*100)+'%':'--')+'|'+(be!=null?be+'%':'--')
      +'|'+(r.edge>=0?'+':'')+(r.edge*100).toFixed(1)+'pp|'+(r.tNa?'n/a':(r.t!=null?r.t.toFixed(2)+(r.seAppx?'~':''):'--'))
      +'|'+(r.width!=null?r.width:'-')+'|'+flag+'\n';
  });
  if(!TOP.length)t+='(no eligible rows ‚Äî lineups/prices not posted yet)\n';
  t+='\nThen the TARGET LIST (which pitchers are hittable + their hits-allowed odds) as research context.\n';
  // ‚îÄ‚îÄ üéØ PITCHER TARGETS ‚Äî the front door (sorted by recent hits allowed) + ME-83 hits-allowed odds ‚îÄ‚îÄ
  if(D.targets&&D.targets.length){
    t+='\nüéØ PITCHER TARGETS ‚Äî Is He Hittable? (sorted by recent hits allowed)\n';
    D.targets.forEach(function(tg,i){
      var hp=tg.hitsProp;var odds=hp&&hp.line!=null?' ¬∑ üìä HITS '+(hp.side==='Over'?'O':'U')+hp.line+' '+(hp.price>0?'+':'')+hp.price+' ('+(hp.edge>=0?'+':'')+(hp.edge*100).toFixed(1)+'pp)':' ¬∑ üìä hits line: not posted';
      t+=(i+1)+'. '+tg.name+' ('+(tg.throws||'?')+'HP) vs '+tg.opp+' ‚Äî '+tg.hitsPS+' H/start (L3) ['+(tg.arr||[]).join(',')+'] ¬∑ '+tg.cls+(tg.hw&&tg.hw!=='even'?' ¬∑ weak vs '+tg.hw:'')+(tg.xba!=null?' ¬∑ xBA-agst '+tg.xba:'')+(tg.hitsTrend==='worsening'?' ¬∑ worsening':'')+odds+'\n';
    });
  }
  // ‚îÄ‚îÄ LEGACY BOARD SECTIONS (NEXT #2) ‚Äî gated off. They apply the FULL ace filter and contradict the ONE LIST
  //    (ME-70a-corrected). Kept behind SHOW_LEGACY (false) so diagnostics recover; DATA DUMP below is NOT legacy. ‚îÄ‚îÄ
  if(SHOW_LEGACY){
  // ‚îÄ‚îÄ üèÜ TOP PICKS ‚Äî best of every board, ranked, auditable ‚îÄ‚îÄ
  if(BD.top.length){
    t+='\nüèÜ TOP PICKS ‚Äî ranked by t (edge √∑ its SE; ME-59) ¬∑ endorsed only (held listed below)\n';
    BD.top.forEach(function(pk){
      t+=dotTxt(pk.light)+' ['+pk.kind+'] '+pk.name+' ('+pk.sub+') ‚Äî '+pk.bet+' | '+pk.metric+(pk.se!=null?' ¬±'+(pk.se*100).toFixed(1):'')+(pk.t!=null?' (t '+pk.t.toFixed(2)+(pk.seAppx?' SE_APPROX':'')+')':'')+(pk.t!=null&&pk.t<2?' [inside noise]':'')+(pk.form&&pk.form.l7!=null?' | form S'+pk.form.season+'/L7 '+pk.form.l7+'/L10 '+pk.form.l10+' '+pk.form.streak:'')+' ¬∑ '+pk.conf+(pk.el!=null||pk.ml!=null?' | Œª v1 '+(pk.el!=null?pk.el:'--')+' ¬∑ v2 '+(pk.v2l!=null?pk.v2l:'--')+' ¬∑ mkt '+(pk.ml!=null?pk.ml:'--')+' ¬∑ hand_L7 ____':'')+'\n'; // ME-43/47/49/59 columns
      if(pk.flag)t+='     ‚ö† '+stripTags(pk.flag)+'\n';
      if(pk.reason)t+='     why: '+pk.reason+'\n';
    });
  }
  // ‚îÄ‚îÄ ‚ö† HELD ‚Äî cleared the gate but not endorsed (ME-32) ‚îÄ‚îÄ
  if(BD.held&&BD.held.length){
    t+='\n‚ö† HELD ‚Äî '+BD.held.length+' caught by the gate (diagnostic, NOT a bet list)\n';
    BD.held.forEach(function(pk){t+='‚ö† '+stripTags(''+pk.reason)+'\n     '+pk.name+' ¬∑ '+pk.sub+' ¬∑ '+pk.kind+' '+pk.mkt+(pk.edge!=null?' ¬∑ '+(pk.edge>=0?'+':'')+(pk.edge*100).toFixed(1)+'pp':'')+'\n';});
  }
  // ME-42 ‚Äî DEDUP: one row per unique (player, market, line, price). A play already in TOP PICKS is not
  // repeated in the re-cut sections below; those show only ADDITIONAL plays, so N lines = N unique bets.
  var seen42={};BD.top.forEach(function(pk){seen42[pk.name+'|'+pk.bet]=1;});
  function betStr42(bp){return bp.label+' O'+bp.line+' '+(bp.hr>0?'+':'')+bp.hr;}
  // ‚îÄ‚îÄ üéØ EDGE PLAYS ‚Äî Runs / RBI / HR (only those NOT already in Top Picks) ‚îÄ‚îÄ
  var edgeNew=BD.edge.filter(function(x){var k=x.name+'|'+betStr42(x.edgeProp);if(seen42[k])return false;seen42[k]=1;return true;});
  t+='\nüéØ EDGE PLAYS ‚Äî Runs / RBI / HR ('+edgeNew.length+' not already above) ¬∑ context that can beat the generic price\n';
  edgeNew.slice(0,20).forEach(function(x){var bp=x.edgeProp,why=pickWhy(x);
    t+=dotTxt(pickLight(x))+' '+x.name+' ('+(TEAM_ABBR[x.team]||x.team)+' vs '+(x.oppPitName||'TBD')+') ‚Äî '+betStr42(bp)+' | '+edgePair(bp.edgeBlend,bp.edgeFair)+', '+Math.round(bp.blend*100)+'% ¬∑ '+x.confidence+'\n';
    t+='     why: '+((bp.edgeWhy||[]).join(' ¬∑ ')||'context lean')+'\n';
    if(why)t+='     ‚ö† '+stripTags(why)+'\n';
  });
  if(!edgeNew.length)t+='(nothing new ‚Äî all edge plays are already in Top Picks)\n';
  // ‚îÄ‚îÄ ‚öæ PITCHER Ks / PITCHER EDGE ‚îÄ‚îÄ
  var kb=BD.pitcher;
  t+='\n‚öæ PITCHER K PROPS ('+kb.length+' recommended) ¬∑ Log5 ‚Üí Poisson, edge vs de-vig fair (market-anchored)\n';
  kb.slice(0,20).forEach(function(p){var pr=p.proj;
    t+=(pr.confidence==='HIGH'?'üü¢':pr.confidence==='MEDIUM'?'üü°':'üî¥')+' '+p.name+' ('+(TEAM_ABBR[p.team]||p.team)+' '+p.throws+'HP vs '+p.opp+') ‚Äî Ks '+(pr.side==='Over'?'O':'U')+pr.line+(pr.hrPrice!=null?' '+(pr.hrPrice>0?'+':'')+pr.hrPrice:'')+' | model '+pr.mu+' Ks'+(pr.edgePrice!=null?', '+edgePair(pr.edgePrice,pr.edgeFair):'')+' ¬∑ '+pr.confidence+'\n';
    if(pr.marketFlag)t+='     ‚ö† '+stripTags(pr.marketFlag)+'\n';
  });
  if(!kb.length)t+='(no recommended K plays ‚Äî lines not posted or all held)\n';
  // ‚îÄ‚îÄ üü¢ CONTACT PLAYS ‚Äî Hits / Singles / TB / HRR (only those NOT already above ‚Äî ME-42 dedup) ‚îÄ‚îÄ
  var contactNew=BD.contact.filter(function(x){var k=x.name+'|'+betStr42(x.contactProp);if(seen42[k])return false;seen42[k]=1;return true;});
  t+='\nüü¢ CONTACT PLAYS ‚Äî Hits / Singles / TB / HRR ('+contactNew.length+' not already above) ¬∑ safer, high-hit-rate, tightly priced\n';
  contactNew.slice(0,20).forEach(function(x){var bp=x.contactProp;
    t+=dotTxt(pickLight(x))+' '+x.name+' ('+(TEAM_ABBR[x.team]||x.team)+') ‚Äî '+betStr42(bp)+' | '+Math.round(bp.blend*100)+'% to cash'+(bp.edgeBlend!=null?', '+edgePair(bp.edgeBlend,bp.edgeFair):'')+' ¬∑ '+x.confidence+'\n';
  });
  if(!contactNew.length)t+='(nothing new ‚Äî all contact plays are already in Top Picks)\n';
  } // end SHOW_LEGACY
  // ‚îÄ‚îÄ ME-56a ‚Äî FULL DATA DUMP: every logged column, machine-readable, for CARD-LATEST.txt ‚Üí Drive mirror ‚îÄ‚îÄ
  // Dumps the UNION of keys across the logged playedges rows (auto-includes any future column) + calib payloads.
  var pe=sg('playedges_'+todayStr(),null);
  if(pe&&pe.rows&&pe.rows.length){
    var keyset={};pe.rows.forEach(function(r){Object.keys(r).forEach(function(k){keyset[k]=1;});});
    var cols=Object.keys(keyset);
    t+='\n=== DATA DUMP (ME-56a ‚Äî '+pe.rows.length+' rows ¬∑ build '+BUILD+' ¬∑ '+cols.length+' columns) ===\n';
    t+=cols.join(',')+'\n';
    pe.rows.forEach(function(r){t+=cols.map(function(c){var v=r[c];return (v==null)?'':(''+v).replace(/[,\n]/g,';');}).join(',')+'\n';});
  }else t+='\n=== DATA DUMP (ME-56a) ‚Äî no logged rows this slate yet ===\n';
  // HELD ACE_OPPONENT rows explicitly (control group), plus populated calibration payloads
  var aceHeld=(BD.held||[]).filter(function(p){return /ACE_OPPONENT/.test(''+p.reason);});
  if(aceHeld.length){t+='\nACE_OPPONENT (control, '+aceHeld.length+'): '+aceHeld.map(function(p){return p.name+' '+p.mkt+' ['+stripTags(''+p.reason)+']';}).join(' | ')+'\n';}
  if(D.tcalib&&D.tcalib.n)t+='tcalib: '+JSON.stringify(D.tcalib)+'\n';
  if(D.mcalib&&D.mcalib.n)t+='mcalib: '+JSON.stringify(D.mcalib)+'\n';
  if(D.gcalib&&D.gcalib.n)t+='gcalib: '+JSON.stringify({n:D.gcalib.n,w:D.gcalib.w,l:D.gcalib.l,byGrade:D.gcalib.byGrade,byTilt:D.gcalib.byTilt,starterExited:D.gcalib.starterExited})+'\n';
  navigator.clipboard.writeText(t).then(function(){toast('Copied ‚Äî TOP 20 + targets + DATA DUMP');}).catch(function(){toast('Copy failed');});
}

loadAll();
